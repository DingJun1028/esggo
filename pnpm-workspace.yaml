packages:
  - 'apps/*'
  - 'apps/*/functions'
  - 'packages/*'
  - '.'

overrides:
  "postcss": ">=8.5.23"
  "uuid": ">=11.1.1"
  "gaxios": ">=7.1.4"
  "glob": ">=10.5.0"
  "minimatch": ">=9.0.7"
  "fast-uri": ">=3.1.5 <4"
  "fast-xml-parser": ">=5.10.1"
  "brace-expansion": ">=5.0.9"
  # 安全修補：必須加 <major 上界，裸 ">=" 會讓 pnpm 跳到跨 major（AGENTS.md #4）
  # undici 同 major patch，jsdom@29 接受 ^7.25.0，不觸及 AGENTS.md #5 的跨 major 禁令
  "undici": ">=7.29.0 <8"
  "dompurify": ">=3.4.12 <4"
  "body-parser": ">=1.20.6 <2"
  "protobufjs": ">=7.6.5 <8"
  # 不修 sharp <0.35.0 (GHSA-f88m-g3jw-g9cj)：next 為 devDep、專案 0 處用 next/image、
  # 且 next@16 只接受 ^0.34.5。AGENTS.md #7。`pnpm audit --prod` 為 0。

allowBuilds:
  '@firebase/util': false
  '@google/genai': false
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  esbuild: true
  prisma: true
  protobufjs: false
  sharp: true
  sqlite3: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.62.1'
  - '@typescript-eslint/project-service@8.62.1'
  - '@typescript-eslint/scope-manager@8.62.1'
  - '@typescript-eslint/tsconfig-utils@8.62.1'
  - '@typescript-eslint/type-utils@8.62.1'
  - '@typescript-eslint/types@8.62.1'
  - '@typescript-eslint/typescript-estree@8.62.1'
  - '@typescript-eslint/utils@8.62.1'
  - '@typescript-eslint/visitor-keys@8.62.1'
  - postcss@8.5.10
  - uuid@11.1.1
  - react-native-screens@4.26.0
  - '@cloudflare/workers-types@5.20260719.1'
