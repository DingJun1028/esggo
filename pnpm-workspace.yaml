packages:
  - 'apps/*'
  - 'apps/*/functions'
  - 'packages/*'
  - '.'

overrides:
  "postcss": ">=8.5.23"
  "uuid": ">=11.1.1"
  "gaxios": ">=7.1.4"
  "glob": ">=10.5.0"
  "minimatch": ">=9.0.7"
  "fast-uri": ">=3.1.5 <4"
  "fast-xml-parser": ">=5.10.1"
  "brace-expansion": ">=5.0.9"
  # 以下為 patch 級安全修補。務必用 <major 上界鎖住：
  # 裸 ">=" 會讓 pnpm 跳到跨 major（實測 body-parser 1→2、protobufjs 7→8、fast-uri 3→4），
  # 屬破壞性升級（見 apps/learning-center/AGENTS.md 第 4 條）。
  # 註：undici 來源是 jsdom(vitest / isomorphic-dompurify)。
  # AGENTS.md 第 5 條禁的是「跨 major 強升破壞 jsdom」；此處 7.28.0→7.29.0 屬同 major
  # patch bump，且 jsdom@29 宣告接受 ^7.25.0，在其允許範圍內，故安全。
  "undici": ">=7.29.0 <8"
  "dompurify": ">=3.4.12 <4"
  "body-parser": ">=1.20.6 <2"
  "protobufjs": ">=7.6.5 <8"
  # 已知並接受的例外：sharp <0.35.0 (GHSA-f88m-g3jw-g9cj, high, libvips 繼承漏洞)
  #   - next 在 devDependencies，sharp 為其 optional dep
  #   - 專案 0 處使用 next/image，libvips 影像處理路徑不會執行
  #   - next@16.2.11 只接受 ^0.34.5，強升至 0.35.0 會違反其宣告範圍
  #   依 AGENTS.md 第 7 條：部署無關的 dev-only 漏洞可接受，不為綠燈強升破壞依賴鏈。
  #   → `pnpm audit --prod` 為 0；此項僅出現在含 dev 的完整 audit。

allowBuilds:
  '@firebase/util': false
  '@google/genai': false
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  esbuild: true
  prisma: true
  protobufjs: false
  sharp: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.62.1'
  - '@typescript-eslint/project-service@8.62.1'
  - '@typescript-eslint/scope-manager@8.62.1'
  - '@typescript-eslint/tsconfig-utils@8.62.1'
  - '@typescript-eslint/type-utils@8.62.1'
  - '@typescript-eslint/types@8.62.1'
  - '@typescript-eslint/typescript-estree@8.62.1'
  - '@typescript-eslint/utils@8.62.1'
  - '@typescript-eslint/visitor-keys@8.62.1'
  - postcss@8.5.10
  - uuid@11.1.1
  - react-native-screens@4.26.0
