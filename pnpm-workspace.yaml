packages:
  - 'apps/*'
  - 'apps/*/functions'
  - 'cli/*'
  - 'packages/*'
  - 'libs/*'
  - '.'
  # oa-swarm 為獨立可部署 App (自有 Dockerfile/ecosystem/lock)，排除出根 workspace
  # 避免根 pnpm-lock.yaml 需同步其 devDeps 導致 --frozen-lockfile 失敗
  # '!apps/oa-swarm' 排除「部署標的殘留的 apps/oa-swarm/」(未版控，僅存在於 VPS 工作樹)
  #   ↑ 缺此行導致 VPS 上 'apps/*' 收進第 22 個 project → ERR_PNPM_OUTDATED_LOCKFILE
  # 注意: 源碼層 oa-swarm/ 已納回根 workspace (上方未排除)，使 @esggo/incremental (libs/*)
  #   的 workspace:* 依賴可被 pnpm 解析並 symlink，消除「紙上依賴、實際未解析」的 drift。
  #   VPS 部署仍走 apps/oa-swarm (自有 lock)，不受根 workspace 影響。
  - '!apps/oa-swarm'

overrides:
  "tar": ">=7.5.21 <8"
  "postcss": ">=8.5.23"
  "uuid": ">=11.1.1"
  "gaxios": ">=7.1.4"
  "glob": ">=10.5.0"
  "minimatch": ">=9.0.7"
  "fast-uri": ">=3.1.6 <4"
  "fast-xml-parser": ">=5.10.1"
  "brace-expansion": ">=5.0.9"
  # 安全修補：必須加 <major 上界，裸 '>=' 會讓 pnpm 跳到跨 major（AGENTS.md #4）
  "nanoid": ">=3.3.18 <4"
  "dompurify": ">=3.4.12 <4"
  "body-parser": ">=1.20.6 <2"
  # ── 2026-09-05 pnpm audit 修補：qs SSRF (express → body-parser → qs) ──
  # 傳入鏈路：express@4.22.2 → body-parser(~1.20.5) → qs(~6.15.1)
  # 修補：升級至 >=6.15.4 (patched version)
  "qs": ">=6.15.4 <7"
  # ── 2026-09-05 pnpm audit 修補：@xmldom/xmldom XML Injection ──
  # 傳入鏈路：officeparser → @everworker/oneringai → @esggo/oa-framework
  # 修補：升級至 >=0.9.12 <1 (patched version)
  "@xmldom/xmldom": ">=0.9.12 <1"
  # ── 2026-09-05 pnpm audit 修補：@google/adk SSRF ──
  # 傳入鏈路：@google/adk@1.6.0 → express → body-parser → qs
  # 修補：升級至 >=1.6.1 (patched version)
  "@google/adk": ">=1.6.1"
  "protobufjs": ">=7.6.5 <8"
  # ── 2026-08-11 dependabot 批次修補 (pnpm audit 13 項) ──
  "esbuild": ">=0.24.3 <1"
  "@tootallnate/once": ">=2.0.1 <3"
  "adm-zip": ">=0.6.0 <1"
  "pdfjs-dist": ">=6.2.108 <7"
  "@opentelemetry/core": ">=2.8.0 <3"
  "@opentelemetry/sdk-node": ">=0.217.0 <1"
  "@opentelemetry/auto-instrumentations-node": ">=0.75.0 <1"
  "@opentelemetry/propagator-jaeger": ">=2.9.0 <3"
  # ── 2026-08-17 Dependabot 24 告警追加 (放寬到修補版所在 major) ──
  # sharp 依 AGENTS.md #7 排除 (next 限制 0.34.5)；chromadb 僅 .venv 不納入 pnpm
  # vitest 最新穩定 4.1.10 (5.x 仍 beta, 不跨)；CVE 上游未修, 先鎖穩定最新
  "vitest": ">=4.1.10"
  # vite 7.x 與 8.x 在 root 並存(解析 7.3.6 + 8.1.3)，兩者均非脆弱範圍(<=6.4.2)；
  #   原 <8 無法約束 vite@8 實例，擴展上界到 <9 同時鎖定 8.x（仍守住 <major 上界）
  "vite": ">=7.0.0 <9"
  # ⛔ 回退 (2026-08-17 09:00 部署前驗證): undici@8 移除了 lib/handler/wrap-handler.js，
  #    jsdom@29.1.1 硬性 require 該路徑 → OmniCore CI / learning-center-ci / VPS 建置三紅。
  #    jsdom@29 只接受 ^7.25.0；跨 major 亦違反 AGENTS.md #5。維持 7.x 修補版。
  "undici": ">=7.29.0 <8"
  "js-yaml": ">=5.0.0 <6"
  "hono": ">=4.0.0 <5"
  # sharp 修補升級（原 AGENTS.md #7 排除，現 0.35.0 已修 CVE-2026-33327/33328/35590/35591）
  "sharp": ">=0.35.0"
  # ── 2026-08-21 Dependabot 修補 (pnpm audit --prod 剩 1 high) ──
  "deepmerge-ts": ">=8.0.0 <9"
  # 2026-08-31 安全修補：mariadb GHSA-cqhc-2h57-wpxf (MitM password leak)
  "mariadb": ">=3.4.6"
  # ── 2026-09-05 pnpm audit 修補：mysql2 GHSA-rgwj-5xj2-c3m3 (zlib inflate DoS) ──
  # 傳入鏈路：@google/adk@2.0.0 → @mikro-orm/mysql@6.6.16 → mysql2@3.20.0
  #          knex@3.2.10 → mysql2@3.20.0
  # 修補：升級至 >=3.23.1 (patched version)
  "mysql2": ">=3.23.1"

allowBuilds:
  '@firebase/util': false
  '@google/genai': false
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  esbuild: true
  prisma: true
  protobufjs: false
  sharp: true
  sqlite3: false
  tesseract.js: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.62.1'
  - '@typescript-eslint/project-service@8.62.1'
  - '@typescript-eslint/scope-manager@8.62.1'
  - '@typescript-eslint/tsconfig-utils@8.62.1'
  - '@typescript-eslint/type-utils@8.62.1'
  - '@typescript-eslint/types@8.62.1'
  - '@typescript-eslint/typescript-estree@8.62.1'
  - '@typescript-eslint/utils@8.62.1'
  - '@typescript-eslint/visitor-keys@8.62.1'
  - postcss@8.5.10
  - uuid@11.1.1
  - react-native-screens@4.26.0
  - '@cloudflare/workers-types@5.20260719.1'
  - tar@7.5.7
  - tar@7.5.3
  - tar@7.5.8
  - tar@7.5.10
  - tar@7.5.11
  - tar@7.5.4
  - '@tootallnate/once@2.0.1'
  - '@opentelemetry/auto-instrumentations-node@0.75.0'
  - '@opentelemetry/sdk-node@0.217.0'
  - tar@7.5.16
  - '@opentelemetry/core@2.8.0'
  - adm-zip@0.6.0
  - tar@7.5.18
  - tar@7.5.19
  - tar@7.5.17
  - '@opentelemetry/propagator-jaeger@2.9.0'
  - sharp@0.35.0
  - tar@7.5.21
  - js-yaml@4.3.1

onlyBuiltDependencies:
  - tesseract.js
  - sqlite3
