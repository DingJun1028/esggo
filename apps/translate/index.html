<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>即時萬能語音翻譯 · translate.esggo.co</title>
  <style>
    :root {
      --gold: #c9a24b;
      --ink: #e6edf3;
      --muted: #8b949e;
      --glass: rgba(13, 17, 23, 0.72);
      --line: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: radial-gradient(120% 120% at 50% 0%, #11161d 0%, #06080b 100%);
      color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      min-height: 100dvh; padding: env(safe-area-inset-top) 16px 24px;
      overflow: hidden;
    }

    /* 一體化漂浮字幕面板 */
    .stage {
      position: relative;
      width: min(92vw, 760px);
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(120%);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      padding: clamp(18px, 4vw, 30px);
      transition: box-shadow .25s ease;
    }
    .stage.pinned {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999; cursor: grab;
      box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(0,0,0,.6);
    }
    .stage.pinned:active { cursor: grabbing; }

    .bar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: clamp(12px, 2.5vw, 18px);
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #30363d; transition: background .2s; }
    .dot.live { background: #2ea043; box-shadow: 0 0 10px #2ea043; }
    .dot.share { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
    .title { font-size: clamp(.85rem, 2.6vw, 1rem); font-weight: 600; letter-spacing: .02em; }
    .title b { color: var(--gold); }
    .spacer { flex: 1; }
    .tag {
      font-size: clamp(.62rem, 1.8vw, .72rem); color: var(--muted);
      border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; white-space: nowrap;
    }

    .subs { display: flex; flex-direction: column; gap: clamp(8px, 2vw, 14px); min-height: 34vh; }
    .line { display: flex; flex-direction: column; gap: 4px; }
    .line .k { font-size: clamp(.6rem, 1.6vw, .68rem); color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
    .line .v {
      font-size: clamp(1.15rem, 4.4vw, 1.8rem); line-height: 1.32; font-weight: 600;
      white-space: pre-wrap; word-break: break-word; min-height: 1.3em;
    }
    .line.src .v { color: #fff; }
    .line.dst .v { color: var(--gold); }
    .idle { color: var(--muted); font-weight: 400; font-size: clamp(.95rem, 3vw, 1.2rem); }

    .ctrl { display: flex; gap: 8px; margin-top: clamp(14px, 3vw, 20px); flex-wrap: wrap; }
    button {
      font: inherit; font-size: clamp(.8rem, 2.4vw, .92rem);
      color: var(--ink); background: rgba(255,255,255,.04);
      border: 1px solid var(--line); border-radius: 11px;
      padding: 9px 14px; cursor: pointer; transition: all .15s ease;
    }
    button:hover { background: rgba(255,255,255,.09); }
    button.primary { background: var(--gold); border-color: var(--gold); color: #1a1206; font-weight: 700; }
    button.on { background: var(--gold); border-color: var(--gold); color: #1a1206; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .status { width: 100%; text-align: center; color: var(--muted); font-size: clamp(.72rem, 2vw, .82rem); margin-top: 10px; min-height: 1em; }
    .warn {
      position: absolute; inset: auto 12px 12px 12px;
      background: #3d2a00; border: 1px solid var(--gold); color: #ffe8a3;
      padding: 9px 12px; border-radius: 10px; font-size: .8rem; display: none;
    }
    .warn.show { display: block; }

    @media (max-width: 420px) { .ctrl button { flex: 1 1 auto; } }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="bar">
      <span class="dot" id="dot"></span>
      <span class="title">即時萬能語音翻譯 · <b>translate.esggo.co</b></span>
      <span class="spacer"></span>
      <span class="tag" id="dirTag">自動偵測 中⇄英</span>
      <span class="tag" id="roomTag">房 #—</span>
    </div>

    <div class="subs">
      <div class="line src">
        <span class="k" id="srcK">原文</span>
        <span class="v" id="srcText"><span class="idle">點「開始」並授權麥克風…</span></span>
      </div>
      <div class="line dst">
        <span class="k" id="dstK">翻譯</span>
        <span class="v" id="dstText"><span class="idle">—</span></span>
      </div>
    </div>

    <div class="ctrl">
      <button id="startBtn" class="primary">▶ 開始</button>
      <button id="stopBtn" disabled>■ 停止</button>
      <button id="speakBtn">🔊 朗讀</button>
      <button id="pinBtn">⤢ 浮貼</button>
      <button id="shareBtn">🔗 分享字幕</button>
    </div>
    <div class="status" id="status">就緒 · 英文 ⇄ 繁中 · 自動雙向</div>

    <div class="warn" id="warn"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
