name: Auto CDN Purge
on:
  workflow_dispatch:
jobs:
  purge-cdn:
    runs-on: ubuntu-latest
    steps:
      # 5T-Trustworthy: zone ID 與 API token 一律走 GitHub Secrets，不得硬編進版控。
      # 審計發現原檔把 token 遮罩成字面值 ***，此 workflow 必定 401，實質上是壞的。
      - name: Purge Cloudflare CDN
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "::error::缺少 secrets.CF_ZONE_ID 或 secrets.CF_API_TOKEN，無法執行 purge"
            exit 1
          fi
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge":"everything"}')
          echo "$response"
          # Cloudflare 成功回 {"success":true,...}；只看 HTTP 200 不代表 purge 成功
          echo "$response" | grep -q '"success":true' \
            || { echo "::error::Cloudflare purge 未回 success:true"; exit 1; }

      # 驗證站點可達。
      # 註 1：原版驗證 /streams 的 "Six Streams System"，但 App.jsx 從無 /streams 路由
      #       （src/pages/streams/index.jsx 為未接線草稿），該檢查恆為失敗。
      # 註 2：此步驟以「公開網域 + CI runner IP」為判準會恆為失敗 —— GitHub Actions
      #       runner 位於 Azure 機房段，被 Cloudflare 回 403（實測 5 次重試 60 秒
      #       狀態碼完全一致）。deploy.yml 已改為以 VPS 來源端 127.0.0.1 為判準。
      #       本 workflow 未佈署 SSH key，故公開網域檢查降為資訊性輸出。
      #       purge 是否成功由上一步的 "success":true 判定，那是真正的判準。
      - name: Verify site reachable (informational)
        run: |
          set -uo pipefail
          for u in https://ftgtours.esggo.co/ https://journey.ftgtours.esggo.co/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$u" 2>/dev/null || echo 000)
            # 以 Content-Type 判別真實資源與 SPA fallback（/images/ 下的 404 與
            # 其他路徑的 fallback 大小不同，位元組門檻不可靠）
            ctype=$(curl -sSI --max-time 30 "$u" 2>/dev/null | grep -i '^content-type:' | tr -d '\r' | cut -d' ' -f2)
            echo "  ${u} -> HTTP ${code}  ${ctype:-未知}"
          done
          echo "  （403 代表 Cloudflare 阻擋 datacenter IP，非站點故障；本站點健康以 deploy.yml 的來源端驗證為準）"
