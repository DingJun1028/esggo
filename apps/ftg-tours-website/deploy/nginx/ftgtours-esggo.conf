# --- ftgtours.esggo.co: FTG Tours (Cloudflare Tunnel → Nginx port 80) ---
server {
    listen 80;
    listen [::]:80;
    server_name ftgtours.esggo.co;
    # No redirect - cloudflared handles TLS termination

    root /var/www/ftgtours;
    index index.html;

    client_max_body_size 20m;

    # Deep penetration: ESG Impact Note images
    location /esg-impact-note/ {
        alias /var/www/ftgtours/images/esg-impact-note/;
        expires 48h;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # FTG Images
    location /images/ {
        alias /var/www/ftgtours/images/;
        expires 48h;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # OmniGallery API (proxied to universal-translator on :8788)
    location /gallery {
        proxy_pass http://127.0.0.1:8788/gallery;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FTG Contact Form API (proxied to journey-server on :8793)
    location /api {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 4h;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}