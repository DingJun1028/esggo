name = "esggo-auto-repair"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npx --yes pnpm install --frozen-lockfile && npx tsc -p tsconfig.json"

[[queues.producers]]
queue = "esggo-repair-queue"
binding = "REPAIR_QUEUE"

[[queues.consumers]]
queue = "esggo-repair-queue"
max_batch_size = 5
max_retries = 3
max_batch_timeout = 1
dead_letter_queue = "esggo-repair-dlq"