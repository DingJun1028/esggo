name = "esggo-auto-repair"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[[queues.producers]]
queue = "esggo-repair-queue"
binding = "REPAIR_QUEUE"

[[queues.consumers]]
queue = "esggo-repair-queue"
max_batch_size = 5
max_retries = 3
max_batch_timeout = 1
dead_letter_queue = "esggo-repair-dlq"
[build]
# source_origin: OA-TWINS cron 巡檢 2026-09-29（追蹤單 #889）
# 修正：`npx --yes npx --yes pnpm install` 會被解析成 `npx install`（npm 的 install），
# pnpm 專屬選項 --no-frozen-lockfile 觸發「install: unknown option -- no-frozen-lockfile」
# → CF Workers Builds 必失敗。
# 對齊 esggo-auto-repair/worker/wrangler.toml（已於 4310f47fc 修正）：單一 npx --yes 包 pnpm。
command = "cd apps/learning-center/esggo-auto-repair/worker && npx --yes pnpm install --no-frozen-lockfile --ignore-scripts && npx tsc -p tsconfig.json"
