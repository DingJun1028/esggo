<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>萬能語種橋樑 · 自動辨識版</title>
  <style>
    :root{--bg:#0b0f17;--panel:#141b29;--panel2:#0e1623;--accent:#36e0c0;--txt:#e8eef7;--muted:#8a97ad;--danger:#ff5d6c;--radius:clamp(8px,2vw,14px)}
    html[data-theme="light"]{--bg:#eef2f7;--panel:#fff;--panel2:#f4f7fb;--txt:#16202e;--muted:#5b687e}
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;
      background:radial-gradient(1200px 600px at 80% -10%,#1c2740 0%,var(--bg) 55%);color:var(--txt);
      min-height:100vh;display:flex;flex-direction:column;gap:12px;padding:12px}
    html[data-theme="light"]body{background:radial-gradient(1200px 600px at 80% -10%,#dbe6f5 0%,var(--bg) 55%)}
    .wrap{max-width:560px;width:100%;background:var(--panel);border:1px solid var(--line);
      border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:12px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    select{flex:1;min-width:100px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);
      border-radius:var(--radius);padding:6px 10px;font-size:1rem}
    .transcript{min-height:140px;overflow:auto;background:var(--panel2);
      border:1px solid var(--line);border-radius:var(--radius);padding:12px;font-size:1rem;line-height:1.5}
    #transcript .me{color:var(--accent)}.status{font-size:0.8rem;color:var(--muted)}
    .badge{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:4px 8px;font-size:0.7rem}
    @media (max-width:480px){.row{flex-direction:column}}
  </style>
</head>
<body>
  <div class="wrap">
    <h2>萬能語種橋樑 · 自動辨識</h2>
    <div class="row">
      <select id="lang"><option value="zh-TW">中文(繁)</option><option value="en">英文</option><option value="ja">日文</option><option value="es">西班牙文</option><option value="fr">法文</option></select>
      <span class="badge" title="語言循環切換">🔄</span>
    </div>
    <div class="status" id="status">開始自動辨識…請授權麥克風</div>
    <div class="transcript" id="transcript" aria-live="polite">（即時轉錄+翻譯顯示於此）</div>
  </div>
  <script>
    const LANGUAGES=['zh-TW','en','ja','es','fr'];
    const $=s=>document.querySelector(s);
    let recog=null,listening=false;
    const API=location.origin+'/translate';
    
    // 語言循環切換
    function swapLang(){
      const curr=$('#lang').val();
      const idx=LANGUAGES.findIndex(l=>l===curr);
      const next=LANGUAGES[(idx+1)%LANGUAGES.length];
      $('#lang').val(next).trigger('change');
    }
    document.querySelector('.badge').onclick=swapLang;
    
    // 自動啟動辨識
    function autoStart(){
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){$('#status').textContent='請用 Chrome/Edge 瀏覽器';return;}
      recog=new SR();
      recog.lang=$('#lang').value;
      recog.continuous=true;
      recog.interimResults=true;
      recog.onresult=e=>{
        for(let i=e.resultIndex;i<e.results.length;i++){
          const t=e.results[i][0].transcript.trim();
          if(e.results[i].isFinal && t){
            const p=document.createElement('div');
            p.className='me';p.textContent='▸ '+t;
            $('#transcript').appendChild(p);
            $('#transcript').scrollTop=$('#transcript').scrollHeight;
            pushTranslate(t);
          }
        }
      };
      recog.onstart=()=>{listening=true;($('#status').textContent='辨識中…'+LANGUAGES.map(l=>l).join('|')};
      recog.onerror=e=>{if(e.error==='not-allowed'){$('#status').textContent='請授權麥克風權限';}};
      recog.onend(()=>{if(listening)setTimeout(()=>recog.start(),100)}); // 自動重啟
      try{recog.start();}catch(e){$('#status').textContent=e.message}
    }
    
    // 推送翻譯
    function pushTranslate(text){
      fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text,from:$('#lang').value,targets:LANGUAGES})})
        .then(r=>r.json())
        .then(d=>{const out=$('#transcript');
          if(d.translations){out.innerHTML+=Object.entries(d.translations).map(([c,t])=>'<span class="me">'+c+':</span>'+t).join('<br>');}
          out.scrollTop=out.scrollHeight;
        }).catch(e=>console.error(e));
    }
    
    // 語言變更時重置辨識
    $('#lang').onchange=()=>{if(recog){recog.lang=$('#lang').value;}};
    
    // 開即自動辨識
    window.onload=autoStart;
  </script>
</body>
</html>
