<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>萬能語音轉字幕</title>
<script src="./qrcode.min.js"></script>
<style>
:root{--bg:#0b0f17;--panel:#141b29;--panel2:#0e1623;--accent:#36e0c0;--txt:#e8eef7;--muted:#8a97ad;--danger:#ff5d6c;
  --line:rgba(255,255,255,.1);--shadow:0 8px 30px rgba(0,0,0,.4);--radius:14px;--gap:clamp(10px,2.5vw,16px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,#1c2740 0%,var(--bg) 55%);color:var(--txt);
  min-height:100vh;display:flex;flex-direction:column;gap:var(--gap);padding:var(--gap)}
.topbar{display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:1.1rem;margin:0}
.spacer{flex:1}
.wrap{max-width:640px;width:100%;margin:0 auto;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:var(--gap);display:flex;flex-direction:column;gap:var(--gap)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{flex:1;min-width:100px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:.95rem}
label{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.btn{font-size:.95rem;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#04130f;border-color:transparent;font-weight:700;font-size:1.15rem;padding:14px 20px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:20px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:#22c55e}.dot.err{background:var(--danger)}
.transcript{flex:1;min-height:200px;max-height:48vh;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:1rem;line-height:1.6}
.utter{margin:0 0 10px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.utter:last-child{border-bottom:0}
.utter .src{color:var(--accent);font-weight:600;font-size:1.05rem}
.utter .trs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:5px}
.utter .trs span{font-size:.82rem;color:var(--muted)}
.utter .trs b{color:var(--txt);font-weight:600;margin-right:4px}
.qrwrap{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.qrbox{background:#fff;padding:8px;border-radius:10px;line-height:0}
.qrinfo{font-size:.8rem;color:var(--muted);max-width:260px}
.qrinfo code{display:block;word-break:break-all;color:var(--accent);margin-top:4px;font-size:.75rem}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--danger);color:#fff;padding:9px 15px;border-radius:10px;font-size:.85rem;opacity:0;transition:.3s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media(max-width:480px){.row{flex-direction:column}.row select{width:100%}.utter .trs{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="topbar">
  <h1>🎙 萬能語音轉字幕</h1>
  <div class="spacer"></div>
  <button id="themeBtn" title="深色/淺色">🌙</button>
</div>
<div class="wrap">
  <div class="row">
    <label>翻譯成<select id="targets" multiple size="1" style="min-width:auto;flex:none">
      <option value="en" selected>英文</option><option value="zh-TW" selected>繁中</option>
      <option value="ja">日文</option><option value="es">西班牙</option><option value="fr">法文</option>
    </select></label>
    <label style="cursor:pointer"><input type="checkbox" id="sysChk"> 🖥 用系統音(電腦/Zoom聲音)</label>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="status">點下方按鈕開始，說話即出雙語字幕</span></div>
  <button id="startBtn" class="btn primary">▶ 開始語音轉字幕</button>
  <div class="qrwrap" id="qrWrap" style="display:none">
    <div class="qrbox" id="qrBox"></div>
    <div class="qrinfo">
      <b>觀眾掃碼</b> → 半透明字幕浮層（可疊 Zoom 上）<br>
      <a id="overlayLink" target="_blank" style="color:var(--accent)">或點此開啟浮層 ↗</a>
      <code id="roomCode"></code>
    </div>
  </div>
  <div class="transcript" id="transcript" aria-live="polite"></div>
  <div class="row">
    <button id="clearBtn" class="btn">🗑 清除字幕</button>
    <button id="openOverlayBtn" class="btn">🎬 預覽浮層</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module">
/// <reference path="./types/generated/esggo-shared.d.ts" />
const LANG_NAME={'zh-TW':'繁中','en':'英','ja':'日','es':'西','fr':'法'};
const $=s=>document.querySelector(s);
const API=location.origin+'/translate';

// 主題
const themeBtn=$('#themeBtn');
function applyTheme(t){document.documentElement.dataset.theme=t;themeBtn.textContent=t==='light'?'☀️':'🌙';localStorage.setItem('ut-theme',t);}
applyTheme(localStorage.getItem('ut-theme')||'dark');
themeBtn.onclick=()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light');

function setStatus(s,dot){$('#status').textContent=s;if(dot)$('#dot').className='dot '+(dot==='on'?'on':dot==='err'?'err':'');}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);}

// 房間: URL 帶 ?room= 則用, 否則隨機並寫回 URL (刷新不變)
const params=new URLSearchParams(location.search);
let room=params.get('room')||'';
if(!room){room=Math.random().toString(36).slice(2,8);const u=new URL(location);u.searchParams.set('room',room);history.replaceState(null,'',u);}
$('#roomCode').textContent='房間: '+room;

// 生成 QR (同源 qrcode.min.js, 不走 CDN)
function showQR(){
  const url=location.origin+'/overlay.html?room='+room;
  $('#overlayLink').href=url;
  $('#qrWrap').style.display='flex';
  $('#qrBox').innerHTML='';
  try{ new QRCode($('#qrBox'),{text:url,width:140,height:140,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ $('#qrBox').innerHTML='<code style="word-break:break-all;color:#000;font-size:.7rem">'+url+'</code>'; }
}
showQR(); // 開頁即顯示 QR, 觀眾可先掃

// 錄音/轉錄狀態
let running=false,stream=null,rec=null,chunks=[],useSys=false;

async function startMic(){
  try{ return await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast('⚠️ 請允許麥克風權限（網址列圖示）→ 再點開始'); return null; }
}
async function startSys(){
  try{ const s=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
    const a=s.getAudioTracks()[0];
    if(!a){ toast('請在分享視窗勾選「分享音訊」'); s.getTracks().forEach(t=>t.stop()); return null; }
    s.getVideoTracks().forEach(t=>t.stop());
    return s;
  }catch(e){
    const m=await startMic(); if(m) toast('系統音失敗，改用麥克風'); return m;
  }
}

function onText(text){
  const box=$('#transcript');
  const el=document.createElement('div');el.className='utter';
  const src=document.createElement('div');src.className='src';src.textContent='▸ '+text;el.appendChild(src);
  const trs=document.createElement('div');trs.className='trs';trs.textContent='翻譯中…';el.appendChild(trs);
  box.appendChild(el);box.scrollTop=box.scrollHeight;
  const sel=Array.from($('#targets').selectedOptions).map(o=>o.value);
  const targets=sel.length?sel:['en','zh-TW'];
  fetch(API.replace('/translate','/speak'),{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text,from:'auto',targets,room,speaker:'studio'})})
    .then(r=>r.ok?r.json():Promise.reject(new Error('HTTP '+r.status)))
    .then(d=>{ if(d.translations) trs.innerHTML=Object.entries(d.translations).map(([c,t])=>`<span><b>${LANG_NAME[c]||c}</b>${t}</span>`).join(''); else trs.textContent='（無翻譯）'; })
    .catch(e=>trs.innerHTML=`<span style="color:var(--danger)">失敗：${e.message}</span>`);
}

async function start(){
  useSys=$('#sysChk').checked;
  stream = useSys ? await startSys() : await startMic();
  if(!stream) return;
  running=true;
  $('#startBtn').textContent='⏹ 停止';$('#startBtn').classList.remove('primary');$('#dot').className='dot on';
  const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'audio/ogg';
  rec=new MediaRecorder(stream,{mimeType:mime});chunks=[];
  rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
  rec.onstop=async()=>{
    if(!chunks.length)return;
    const blob=new Blob(chunks,{type:mime});chunks=[];
    const buf=await blob.arrayBuffer();
    try{
      const r=await fetch(API.replace('/translate','/transcribe')+'?lang=auto',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:buf});
      const d=await r.json();
      if(d.text&&d.text.trim())onText(d.text.trim());
      else if(!r.ok)toast('轉錄失敗：'+(d.error||r.status));
      else toast('未偵測到語音（請大聲說話或檢查音源）');
    }catch(err){toast('轉錄錯誤：'+err.message);}
    if(running)rec.start(4000);
  };
  rec.start(4000);
  setStatus(useSys?'🖥 系統音收音中… 說話即出字幕':'🎙 收音中… 說話即出字幕');
}
function stop(){
  running=false;$('#startBtn').textContent='▶ 開始語音轉字幕';$('#startBtn').classList.add('primary');$('#dot').className='dot';
  if(rec&&rec.state!=='inactive'){try{rec.stop();}catch(_){}}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  setStatus('已停止');
}
$('#startBtn').onclick=()=>running?stop():start();
$('#clearBtn').onclick=()=>{$('#transcript').innerHTML='';};
$('#openOverlayBtn').onclick=()=>window.open(location.origin+'/overlay.html?room='+room,'_blank');
setStatus('點下方按鈕開始，說話即出雙語字幕');
</script>
</body>
</html>
