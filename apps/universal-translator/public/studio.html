<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>萬能語種橋樑 · 講者端</title>
  <style>
    body{font-family:sans-serif;background:#0b0f17;color:#e8eef7;padding:16px}
    .panel{background:#141b29;border:1px solid #3a465c;border-radius:8px;padding:12px;margin:12px 0}
    input,select,button{padding:8px 12px;margin:4px 0;border-radius:6px;border:1px solid #3a465c}
    button{background:#36e0c0;color:#06121a;font-weight:600}
    #transcript{flex:1;min-height:120px;max-height:36vh;overflow:auto;background:#0e1623;
      border:1px solid #3a465c;border-radius:12px;padding:12px;font-size:1rem}
    #transcript .me{color:#36e0c0}.status{color:#8a97ad}.badge{background:#0e1623;border:1px solid #3a465c;border-radius:8px;padding:3px 8px}
    #qrCode{margin-top:8px;padding:10px;background:#141b29;border-radius:8px}
    #qrCode img{width:120px;height:120px;border:1px solid #3a465c;border-radius:6px}
    #qrUrl{font-size:.8rem;color:#8a97ad;word-break:break-word}
  </style>
</head>
<body>
  <div class="panel">
    <h1>萬能語種橋樑 · 講者端</h1>
    <p>語音轉錄 + 多語即時翻譯</p>
  </div>
  <div class="panel">
    <select id="lang">
      <option value="en">英文</option>
      <option value="zh-TW">中文(繁)</option>
      <option value="ja">日文</option>
      <option value="es">西班牙文</option>
      <option value="fr">法文</option>
    </select>
    <button id="start" class="live">🎙 開始收音</button>
    <div class="status" id="status">Chrome/Edge 支援 Web Speech API。</div>
  </div>
  <div class="panel">
    <div class="badge">即時轉錄 → 多語翻譯</div>
    <div id="transcript" aria-live="polite">（轉錄會顯示在這裡）</div>
  </div>
  <div id="qrCode" style="display:none">
    <div>📱 觀眾掃碼加入房間：</div>
    <img id="qrImg" src="" alt="QR Code">
    <div id="qrUrl"></div>
  </div>

  <script>
  const API = location.origin + '/translate';
  let recog=null, listening=false, roomId='';
  const $ = s => document.querySelector(s);

  // 動態生成房間 ID
  function genRoomId() {
    roomId = 'room_' + Math.random().toString(36).substr(2, 9);
    document.getElementById('qrCode').style.display = 'block';
    const url = location.origin + '/stream?room=' + roomId;
    document.getElementById('qrUrl').textContent = url;
    // 掃描 QR (網址) → 觀眾端 SSE 自動連到 /stream?room=xxx
    generateQRCode(url);
  }

  // 簡化版 QR Code (採用 Google Chart API, 免安裝套件)
  function generateQRCode(text) {
    const encoded = encodeURIComponent(text);
    const imgURL = 'https://qrco.de/b?' + encoded.slice(0,120);
    $('#qrImg').src = imgURL;
  }

  function append(t){
    const p=document.createElement('div'); p.className='me'; p.textContent='▸ '+t;
    $('#transcript').appendChild(p); $('#transcript').scrollTop=$('#transcript').scrollHeight;
    pushTranslate(t);
  }
  function start(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ $('#status').textContent='請用 Chrome/Edge'; return; }
    recog=new SR(); recog.lang=$('#lang').value; recog.continuous=true; recog.interimResults=true;
    recog.onresult=(e)=>{ for(let i=e.resultIndex;i<e.results.length;i++) if(e.results[i].isFinal) append(e.results[i][0].transcript.trim()); };
    recog.onstart=()=>{ listening=true; $('#start').textContent='⏹ 停止'; $('#status').textContent='收音中… 點擊「生成房間」分享 QR Code'; };
    recog.onend=()=>{ if(listening) recog.start(); };
    try{ recog.start(); }catch(e){ $('#status').textContent = e.message; }
  }
  function stop(){ listening=false; recog?.stop(); $('#start').textContent='🎙 開始收音'; $('#status').textContent='已停止。'; }
  $('#start').onclick=()=>listening?stop():start();
  document.body.innerHTML += '<button onclick="genRoomId()" style="position:fixed;top:10px;right:10px;background:#ff5d6c;color:#fff;border:none;border-radius:8px;padding:8px 12px">🔗 生成房間</button>';

  function pushTranslate(text){
    fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text,from:$('#lang').value,targets:['zh-TW','ja','es','fr']})})
      .then(r=>r.json()).then(d=>console.log('翻譯:',d.translations||d)).catch(e=>console.error(e));
  }
  </script>
</body>
</html>
