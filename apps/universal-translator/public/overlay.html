<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雙語字幕浮層 · 疊加 Zoom</title>
<style>
:root{
  --cap-bg:rgba(10,14,24,.62);--src:#ffffff;--trs:#7fe9d6;
  --ui:#e8eef7;--accent:#36e0c0;--line:rgba(255,255,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden;
  font-family:"Segoe UI",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
#stage{position:fixed;inset:0;pointer-events:none;z-index:1}
#caption{position:absolute;left:50%;bottom:7vh;transform:translateX(-50%);
  max-width:94vw;width:min(1150px,94vw);
  background:linear-gradient(135deg,rgba(12,18,30,.7),rgba(8,12,20,.55));
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:16px 26px;
  box-shadow:0 16px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
  text-align:center;line-height:1.5;opacity:0;transition:opacity .3s ease;pointer-events:none}
#caption.show{opacity:1;animation:pop .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(14px) scale(.97)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
#caption .src{font-size:clamp(1.15rem,2.7vw,1.7rem);color:var(--src);font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.8);letter-spacing:.3px}
#caption .trs{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:center}
#caption .trs .pair{font-size:clamp(.95rem,2.2vw,1.28rem);color:var(--trs);text-shadow:0 2px 8px rgba(0,0,0,.8)}
#caption .trs .lbl{color:#9fb0c7;font-size:.78em;font-weight:600;margin-right:7px;text-transform:uppercase;letter-spacing:.5px}
#toolbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;gap:10px;flex-wrap:wrap;
  align-items:center;padding:9px 16px;background:rgba(10,14,22,.88);border-bottom:1px solid var(--line);
  color:var(--ui);font-size:.85rem;transform:translateY(-100%);transition:transform .22s ease;pointer-events:auto;backdrop-filter:blur(10px)}
#toolbar.show{transform:translateY(0)}
#toolbar label{display:flex;align-items:center;gap:6px;white-space:nowrap}
#toolbar input[type=range]{width:100px;accent-color:var(--accent)}
#toolbar button{background:#1c2740;color:var(--ui);border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer;font-size:.85rem;transition:.15s}
#toolbar button:hover{border-color:var(--accent)}
#toolbar select{background:#1c2740;color:var(--ui);border:1px solid var(--line);border-radius:9px;padding:6px 9px}
#hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;color:#9fb0c7;font-size:1rem;
  text-align:center;pointer-events:none;opacity:.85;line-height:1.6}
#hint.hide{display:none}
#status{position:fixed;bottom:8px;right:10px;z-index:10;color:#9fb0c7;font-size:.74rem;
  background:rgba(10,14,22,.7);padding:3px 9px;border-radius:7px;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div id="caption">
    <div class="src" id="capSrc"></div>
    <div class="trs" id="capTrs"></div>
  </div>
</div>
<div id="hint">等待字幕中…<br><small>移動滑鼠到視窗頂部或按 H 開工具列 · 字幕會自動疊加在 Zoom 上方</small></div>
<div id="status">連線中…</div>

<div id="toolbar">
  <strong style="color:var(--accent)">🎬 字幕浮層</strong>
  <label>翻譯成<select id="targ" multiple size="1" style="min-width:auto">
    <option value="en" selected>英文</option><option value="zh-TW" selected>繁中</option>
    <option value="ja">日文</option><option value="es">西班牙</option><option value="fr">法文</option><option value="ko">韓文</option>
  </select></label>
  <label>透明度<input id="op" type="range" min="0" max="100" value="62"></label>
  <label>字體<input id="fs" type="range" min="14" max="44" value="27"></label>
  <label>位置<select id="pos"><option value="bottom" selected>底部</option><option value="top">頂部</option></select></label>
  <button id="alwaysBtn">📌 置頂提示</button>
  <button id="hideBtn">隱藏 (H)</button>
</div>

<script type="module">
const $=s=>document.querySelector(s);
const LANG_NAME={'zh-TW':'繁中','en':'EN','ja':'日','es':'西','fr':'法','ko':'韓','de':'德'};
let room=new URLSearchParams(location.search).get('room')||'';
let targets=new Set(['en','zh-TW']), capTimer=null, toolbarTimer=null;

function showCaption(src,translations){
  const cap=$('#caption');
  $('#capSrc').textContent=src||'';
  const pairs=Array.from(targets).map(t=>{
    const txt=translations?translations[t]:'';
    return txt?`<span class="pair"><span class="lbl">${LANG_NAME[t]||t}</span>${txt}</span>`:'';
  }).filter(Boolean).join('');
  $('#capTrs').innerHTML=pairs;
  cap.classList.add('show');
  $('#hint').classList.add('hide');
  clearTimeout(capTimer);
  capTimer=setTimeout(()=>cap.classList.remove('show'),7000);
}

let esOk=false;
function connect(){
  const url=location.origin+'/stream'+(room?('?room='+encodeURIComponent(room)):'');
  const sse=new EventSource(url);
  sse.addEventListener('translation',e=>{
    try{const d=JSON.parse(e.data);esOk=true;const src=d.text||'';
      if(src||d.translations)showCaption(src,d.translations||{});}catch(_){}
  });
  sse.onopen=()=>{$('#status').textContent='已連線 · 房間 '+(room||'全部')+' · 疊加 Zoom 中';};
  sse.onerror=()=>{if(!esOk)$('#status').textContent='連線失敗, 請確認 studio 已開啟推播';sse.close();setTimeout(connect,3000);};
}
connect();

// 控制列
$('#targ').onchange=()=>{const sel=Array.from($('#targ').selectedOptions).map(o=>o.value);if(sel.length)targets=new Set(sel);};
$('#op').oninput=e=>{document.documentElement.style.setProperty('--cap-bg','rgba(10,14,24,'+(e.target.value/100)+')');};
$('#fs').oninput=e=>{$('#caption').style.fontSize=e.target.value+'px';};
$('#pos').onchange=e=>{const c=$('#caption');if(e.target.value==='top'){c.style.bottom='auto';c.style.top='8vh';}else{c.style.top='auto';c.style.bottom='7vh';}};

function revealToolbar(){$('#toolbar').classList.add('show');clearTimeout(toolbarTimer);toolbarTimer=setTimeout(()=>$('#toolbar').classList.remove('show'),3500);}
document.addEventListener('mousemove',e=>{if(e.clientY<60)revealToolbar();});
document.addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H')$('#toolbar').classList.toggle('show');});
$('#hideBtn').onclick=()=>$('#toolbar').classList.remove('show');
$('#alwaysBtn').onclick=()=>{$('#status').textContent='請在瀏覽器右鍵分頁 →「永遠置頂」(Chrome) 或視窗置頂, 即可固定疊在 Zoom 上';revealToolbar();};
document.addEventListener('dblclick',()=>$('#toolbar').classList.toggle('show'));
</script>
</body>
</html>
