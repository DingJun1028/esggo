<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雙語字幕浮層 · 疊加 Zoom</title>
<style>
:root{
  --cap-bg:rgba(10,14,24,.62);--src:#ffffff;--trs:#7fe9d6;--gold:#ffd479;
  --ui:#e8eef7;--accent:#36e0c0;--line:rgba(255,255,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden;
  font-family:"Segoe UI",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
#stage{position:fixed;inset:0;pointer-events:none;z-index:1}
#caption{position:absolute;left:50%;bottom:7vh;transform:translateX(-50%);
  max-width:94vw;width:min(1150px,94vw);
  background:linear-gradient(135deg,rgba(12,18,30,.7),rgba(8,12,20,.55));
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:16px 26px;
  box-shadow:0 16px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
  text-align:center;line-height:1.5;opacity:0;transition:opacity .3s ease;pointer-events:none}
#caption.show{opacity:1;animation:pop .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(14px) scale(.97)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
#caption .src{font-size:clamp(1.15rem,2.7vw,1.7rem);color:var(--src);font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.8);letter-spacing:.3px}
#caption .trs{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:center}
#caption .trs .pair{font-size:clamp(.95rem,2.2vw,1.28rem);color:var(--trs);text-shadow:0 2px 8px rgba(0,0,0,.8)}
#caption .trs .lbl{color:#9fb0c7;font-size:.78em;font-weight:600;margin-right:7px;text-transform:uppercase;letter-spacing:.5px}
/* 金色關鍵詞高亮 (借鏡 Akkadu) */
#caption .src .hl,#caption .trs .hl{color:var(--gold);font-weight:800}
#toolbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;gap:10px;flex-wrap:wrap;
  align-items:center;padding:9px 16px;background:rgba(10,14,22,.88);border-bottom:1px solid var(--line);
  color:var(--ui);font-size:.85rem;transform:translateY(-100%);transition:transform .22s ease;pointer-events:auto;backdrop-filter:blur(10px)}
#toolbar.show{transform:translateY(0)}
#toolbar .ico{background:#1c2740;color:var(--ui);border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer;font-size:.85rem;transition:.15s}
#toolbar .ico:hover{border-color:var(--accent)}
#toolbar .ico.active{background:var(--accent);color:#06121b;border-color:var(--accent);font-weight:700}
#langToggle{display:flex;align-items:center;gap:6px;background:#1c2740;border:1px solid var(--line);border-radius:9px;padding:5px 10px;color:var(--ui);cursor:pointer;font-size:.82rem;white-space:nowrap}
#langToggle:hover{border-color:var(--accent)}
#langToggle .swap{opacity:.7}
#hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;text-align:center;pointer-events:none;opacity:.9;line-height:1.7}
#hint .quote{font-size:clamp(1.4rem,4vw,2.4rem);color:var(--gold);font-family:Georgia,"Songti TC",serif;line-height:1.2;margin-bottom:8px}
#hint .msg{color:#e8eef7;font-size:clamp(1rem,2.5vw,1.35rem);text-shadow:0 2px 10px rgba(0,0,0,.8)}
#hint .msg u{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px;cursor:pointer}
#hint .sub{color:#9fb0c7;font-size:.9rem;margin-top:10px}
#hint.hide{display:none}
#status{position:fixed;bottom:8px;right:10px;z-index:10;color:#9fb0c7;font-size:.74rem;
  background:rgba(10,14,22,.7);padding:3px 9px;border-radius:7px;pointer-events:none}
#status.rec{color:var(--accent)}
#toast{position:fixed;top:54px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:20;
  background:rgba(220,40,60,.92);color:#fff;padding:8px 16px;border-radius:10px;font-size:.85rem;
  opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="stage">
  <div id="caption">
    <div class="src" id="capSrc"></div>
    <div class="trs" id="capTrs"></div>
  </div>
</div>

<div id="hint">
  <div class="quote">“ ”</div>
  <div class="msg">請點選開始 <u id="startCta">▶ 開始收音</u></div>
  <div class="sub">疊在 Zoom 上方 · 移動滑鼠到頂部開工具列 · 說話即出雙語字幕</div>
</div>
<div id="status">連線中…</div>
<div id="toast"></div>

<div id="toolbar">
  <span class="ico" id="setBtn" title="設定">⚙️</span>
  <span class="ico" id="playBtn" title="開始/停止收音">▶</span>
  <span id="langToggle" title="互換語言"><b id="lblA">中文</b><span class="swap">⇄</span><b id="lblB">英文</b></span>
  <span class="ico" id="alwaysBtn" title="置頂提示">📌</span>
  <span class="ico" id="minBtn" title="隱藏工具列">—</span>
  <span class="ico" id="closeBtn" title="關閉">✕</span>
</div>

<script type="module">
const $=s=>document.querySelector(s);
const LANG_NAME={'zh-TW':'繁中','zh':'中文','en':'EN','ja':'日','es':'西','fr':'法','ko':'韓','de':'德'};
let room=new URLSearchParams(location.search).get('room')||'';
let srcLang='zh',dstLang='en';           // 預設 中文→英文 (借鏡 Akkadu 互換)
let targets=new Set(['en','zh-TW']);     // 顯示雙語
let running=false, rec=null, chunks=[], stream=null;
const API=''; // 相對路徑 (避開 Cloudflare Tunnel 對絕對域名 fetch 的偶發攔截)

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);}
// 簡易關鍵詞高亮 (數字/常用強調詞)
function hl(text){ return (text||'').replace(/(重要|會議|重點|決議|立即|緊急|OK|yes|no)/g,'<span class="hl">$1</span>'); }

function showCaption(src,translations){
  const cap=$('#caption');
  $('#capSrc').innerHTML=hl(src)||'';
  const pairs=Array.from(targets).map(t=>{
    const txt=translations?translations[t]:'';
    return txt?`<span class="pair"><span class="lbl">${LANG_NAME[t]||t}</span>${hl(txt)}</span>`:'';
  }).filter(Boolean).join('');
  $('#capTrs').innerHTML=pairs;
  cap.classList.add('show');
  $('#hint').classList.add('hide');
  clearTimeout(capTimer);
  capTimer=setTimeout(()=>cap.classList.remove('show'),8000);
}
let capTimer=null;

// ---------- 重試封裝 (解決偶發 Failed to fetch) ----------
async function transcribeRetry(buf,attempt=0){
  try{
    const r=await fetch(API+'/transcribe?lang=auto',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:buf});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){ if(attempt<2){await new Promise(r=>setTimeout(r,1000));return transcribeRetry(buf,attempt+1);} throw e; }
}
async function translateRetry(text,targets,attempt=0){
  try{
    const r=await fetch(API+'/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,from:'auto',targets})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){ if(attempt<2){await new Promise(r=>setTimeout(r,1000));return translateRetry(text,targets,attempt+1);} throw e; }
}

// ---------- SSE 觀眾端 (接收 studio 推播) ----------
let esOk=false;
function connect(){
  const url=API+'/stream'+(room?('?room='+encodeURIComponent(room)):'');
  const sse=new EventSource(url);
  sse.addEventListener('translation',e=>{
    try{const d=JSON.parse(e.data);esOk=true;if(d.text||d.translations)showCaption(d.text||'',d.translations||{});}catch(_){}
  });
  sse.onopen=()=>{$('#status').textContent='已連線 · 房間 '+(room||'全部')+' · 疊加 Zoom 中';};
  sse.onerror=()=>{if(!esOk)$('#status').textContent='連線中… (若用 studio 推播, 請確認 studio 已開啟)';sse.close();setTimeout(connect,3000);};
}
connect();

// ---------- 一體化收音 (借鏡 Akkadu: 單頁收+顯) ----------
async function startMic(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    running=true;$('#playBtn').textContent='⏸';$('#playBtn').classList.add('active');
    $('#status').textContent='🎙 收音中…';$('#status').classList.add('rec');
    const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'audio/ogg';
    rec=new MediaRecorder(stream,{mimeType:mime});chunks=[];
    rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
    rec.onstop=async()=>{
      if(!chunks.length){if(running)rec.start(4000);return;}
      $('#status').textContent='🧠 轉錄中…';
      const buf=await new Blob(chunks,{type:mime}).arrayBuffer();chunks=[];
      try{
        const d=await transcribeRetry(buf);
        if(d.text&&d.text.trim()){
          const td=await translateRetry(d.text.trim(),Array.from(targets));
          showCaption(d.text.trim(),td.translations||{});
        }else{ toast('未偵測到語音, 請靠近麥克風'); }
        }catch(err){ toast('轉錄錯誤: '+err.message); }
      if(running)rec.start(4000);
    };
    rec.start(4000);
  }catch(e){ toast('麥克風授權失敗: '+e.message); $('#status').textContent='麥克風未授權'; }
}
function stopMic(){
  running=false;if(rec&&rec.state!=='inactive')rec.stop();
  if(stream)stream.getTracks().forEach(t=>t.stop());
  $('#playBtn').textContent='▶';$('#playBtn').classList.remove('active');
  $('#status').classList.remove('rec');$('#status').textContent='已停止';
}

// ---------- 控制列 ----------
function setLang(a,b){ srcLang=a;dstLang=b;
  $('#lblA').textContent=LANG_NAME[a]||a; $('#lblB').textContent=LANG_NAME[b]||b;
}
$('#playBtn').onclick=()=>{ if(running)stopMic(); else startMic(); };
$('#startCta').onclick=()=>startMic();
$('#langToggle').onclick=()=>{ // 互換源/目標 (Akkadu 風格 ⇄)
  const a=srcLang,b=dstLang; setLang(b,a);
  targets=new Set([b,a]); // 顯示互換後雙語
  toast('語言已互換: '+(LANG_NAME[a]||a)+' ⇄ '+(LANG_NAME[b]||b));
};
$('#alwaysBtn').onclick=()=>{ $('#status').textContent='右鍵分頁→「永遠置頂」即可固定疊在 Zoom 上'; revealToolbar(); };
$('#minBtn').onclick=()=>$('#toolbar').classList.remove('show');
$('#closeBtn').onclick=()=>{ stopMic(); if(confirm('關閉浮層?')) window.close(); };

function revealToolbar(){$('#toolbar').classList.add('show');clearTimeout(toolbarTimer);toolbarTimer=setTimeout(()=>$('#toolbar').classList.remove('show'),4000);}
let toolbarTimer=null;
document.addEventListener('mousemove',e=>{if(e.clientY<60)revealToolbar();});
document.addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H')$('#toolbar').classList.toggle('show');if(e.key===' '){e.preventDefault();running?stopMic():startMic();}});
document.addEventListener('dblclick',()=>$('#toolbar').classList.toggle('show'));
</script>
</body>
</html>
