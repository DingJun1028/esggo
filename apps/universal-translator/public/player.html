<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>萬能即時翻 · 雙語字幕撥放器</title>
<style>
:root{
  --bg:#0b1020; --panel:#141b2e; --panel2:#1c2540; --txt:#e8edf7; --sub:#9fb0d0;
  --accent:#5b8cff; --gold:#ffce5b; --ok:#3ddc84; --warn:#ff7676; --line:#26304d;
  --src:#ffffff; --trs:#ffd479;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;}
/* ===== 一做三員一體：載入+撥放+字幕 同一頁 ===== */
.wrap{max-width:1100px;margin:0 auto;padding:12px clamp(8px,3vw,20px) 40px;}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0 12px;}
header h1{font-size:clamp(15px,4vw,20px);margin:0;font-weight:700;letter-spacing:.5px;}
header .tag{font-size:11px;color:var(--sub);border:1px solid var(--line);padding:2px 8px;border-radius:20px;}
.spacer{flex:1;}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;
  padding:8px 14px;font-size:13px;cursor:pointer;transition:.15s;touch-action:manipulation;}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.on{background:var(--ok);border-color:var(--ok);color:#06210f;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0;}
.file-label{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);
  border:1px dashed var(--line);border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;}
.file-label input{display:none;}
input[type=text]{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);
  color:var(--txt);border-radius:10px;padding:9px 12px;font-size:13px;}
select{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 8px;font-size:13px;}
/* ===== 撥放器 + 字幕 一體 ===== */
.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line);}
video,audio{display:block;width:100%;background:#000;}
video{max-height:56vh;}
.stage.audio-only{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#10243f,#1c2540);}
.stage.audio-only .audio-icon{font-size:64px;opacity:.25;}
/* 雙語字幕：疊加在撥放器下方（桌面） / 並排（手機） */
.caption{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 14px;
  background:linear-gradient(transparent,rgba(0,0,0,.82) 38%);pointer-events:none;
  display:flex;flex-direction:column;gap:3px;transition:opacity .3s;}
.caption.hide{opacity:0;}
#capSrc{font-size:clamp(15px,3.4vw,22px);line-height:1.35;color:var(--src);
  text-shadow:0 2px 6px #000;font-weight:600;}
#capTrs{display:flex;flex-wrap:wrap;gap:6px 14px;}
#capTrs .pair{font-size:clamp(12px,2.6vw,17px);line-height:1.3;color:var(--trs);text-shadow:0 2px 5px #000;}
#capTrs .ltr{display:inline-block;font-size:.72em;opacity:.7;margin-right:4px;border:1px solid var(--line);
  border-radius:6px;padding:0 5px;color:var(--sub);}
.hl{color:var(--gold);font-weight:700;}
/* 字幕分離模式（手機直向，疊加太擠時） */
.caption.below{position:static;background:var(--panel);border-top:1px solid var(--line);
  padding:12px 14px;pointer-events:auto;}
/* ===== 狀態列 ===== */
.status{font-size:12px;color:var(--sub);margin:6px 2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block;}
.dot.on{background:var(--ok);}
.langcfg{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--sub);flex-wrap:wrap;}
.langcfg label{display:flex;gap:4px;align-items:center;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;
  font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.hint{font-size:12px;color:var(--sub);text-align:center;padding:14px;}
/* ===== RWD：手機直向 → 字幕分離到下方 ===== */
@media (max-width:640px){
  .caption:not(.below){font-size:14px;}
  .stage.split .caption{position:static;background:var(--panel);border-top:1px solid var(--line);
    padding:12px 14px;pointer-events:auto;}
  video{max-height:42vh;}
}
.opts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--sub);}
.opts label{display:flex;gap:5px;align-items:center;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐝 萬能即時翻 · 雙語字幕撥放器</h1>
    <span class="tag">一做三員一體 · RWD · 免費零 key</span>
    <span class="spacer"></span>
    <span class="status"><span class="dot" id="dConn"></span><span id="connTxt">未連線</span></span>
  </header>

  <div class="row">
    <label class="file-label">📂 選擇影片/音檔
      <input type="file" id="file" accept="video/*,audio/*">
    </label>
    <input type="text" id="url" placeholder="或貼上影片/音訊網址 (https://...)">
    <button class="btn" id="loadUrl">載入</button>
    <button class="btn primary" id="capBtn">🎤 開始轉字幕</button>
    <button class="btn" id="zoomBtn">🎥 Zoom 會議</button>
    <button class="btn" id="stopBtn" disabled>⏹ 停止</button>
  </div>

  <div class="langcfg">
    <span>原文語言：</span>
    <select id="srcLang">
      <option value="auto">自動偵測</option>
      <option value="zh-TW" selected>繁中</option>
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
    </select>
    <span>譯文：</span>
    <label><input type="checkbox" class="tg" value="en" checked> EN</label>
    <label><input type="checkbox" class="tg" value="zh-TW" checked> 繁中</label>
    <label><input type="checkbox" class="tg" value="ja"> 日</label>
    <label><input type="checkbox" class="tg" value="ko"> 韓</label>
    <label><input type="checkbox" class="tg" value="es"> 西</label>
    <label><input type="checkbox" class="tg" value="fr"> 法</label>
    <label><input type="checkbox" class="tg" value="de"> 德</label>
  </div>

  <div class="opts" style="margin:6px 0 10px;">
    <label><input type="checkbox" id="splitCap"> 手機字幕分離（不疊加）</label>
    <label><input type="checkbox" id="autoScroll" checked> 字幕貼底</label>
  </div>

  <div class="stage" id="stage">
    <video id="vid" controls hidden></video>
    <div class="audio-only" id="audioOnly" hidden><div class="audio-icon">🎵</div></div>
    <div class="hint" id="hint">選擇或載入一個影片/音檔，按「開始轉字幕」即時生成雙語字幕；或按「🎥 Zoom 會議」連接 Zoom 視窗會議即時轉雙語字幕</div>
    <div class="caption hide" id="caption">
      <div id="capSrc"></div>
      <div id="capTrs"></div>
    </div>
  </div>

  <div class="status">
    <span class="dot" id="dMeter"></span>
    <span id="meterTxt">待機</span>
    <span id="diagTxt"></span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
/// <reference path="./types/generated/esggo-shared.d.ts" />
const $ = s => document.querySelector(s);
const LANG_NAME={'zh-TW':'繁中','zh':'中文','en':'EN','ja':'日','ko':'韓','es':'西','fr':'法','de':'德'};
const LANG_BCP={'zh-TW':'zh-TW','zh':'zh-TW','en':'en-US','ja':'ja-JP','ko':'ko-KR','es':'es-ES','fr':'fr-FR','de':'de-DE'};
let targets=new Set(['en','zh-TW']);
let srcLang='zh-TW';
let running=false, rec=null, chunks=[], stream=null, mediaEl=null, audioCtx=null, analyser=null, meterRAF=0, capTimer=null;
let zoomMode=false;
const API=''; // 相對路徑

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3800);}
function hl(text){return (text||'').replace(/(重要|會議|重點|決議|立即|緊急|OK|yes|no|fail|failure|成功|success)/gi,'<span class="hl">$1</span>');}

/** 顯示雙語字幕 (三元一體: 字幕層)
 * @param {string} src 原文
 * @param {Partial<Record<import('./types/generated/esggo-shared.d.ts').LanguageCode, string>>} translations 目標語翻譯表 */
function showCaption(src,translations){
  const cap=$('#caption');
  $('#capSrc').innerHTML=hl(src)||'';
  const pairs=Array.from(targets).map(t=>{
    const txt=translations?translations[t]:'';
    return txt?`<span class="pair"><span class="ltr">${LANG_NAME[t]||t}</span>${hl(txt)}</span>`:'';
  }).filter(Boolean).join('');
  $('#capTrs').innerHTML=pairs;
  cap.classList.remove('hide');
  $('#hint').classList.add('hide');
  clearTimeout(capTimer);
  capTimer=setTimeout(()=>cap.classList.add('hide'),9000);
}

// ---------- 語言設定 ----------
function syncTargets(){
  targets=new Set(Array.from(document.querySelectorAll('.tg:checked')).map(c=>c.value));
  if(targets.size===0){targets.add('en');toast('至少選一種譯文');}
}
document.querySelectorAll('.tg').forEach(c=>c.addEventListener('change',syncTargets));
$('#srcLang').addEventListener('change',()=>{ srcLang=$('#srcLang').value; });
syncTargets();

// ---------- 載入媒體 ----------
function loadMediaFromFile(f){
  const url=URL.createObjectURL(f);
  mountMedia(url, f.type.startsWith('audio'));
}
function mountMedia(url, isAudio){
  const vid=$('#vid'), ao=$('#audioOnly');
  if(isAudio){
    vid.hidden=true; ao.hidden=false;
    // 音檔用 audio 元素隱藏播放
    if(!mediaEl||mediaEl.tagName!=='AUDIO'){
      mediaEl=document.createElement('audio'); mediaEl.controls=true; mediaEl.style.width='100%';
      mediaEl.style.marginTop='20px'; ao.appendChild(mediaEl);
    }
    mediaEl.src=url;
  }else{
    ao.hidden=true; vid.hidden=false; mediaEl=vid; vid.src=url;
  }
  $('#hint').classList.add('hide');
  $('#stage').classList.remove('split');
  toast(isAudio?'已載入音檔':'已載入影片');
}
$('#file').addEventListener('change',e=>{if(e.target.files[0])loadMediaFromFile(e.target.files[0]);});
$('#loadUrl').addEventListener('click',()=>{
  const u=$('#url').value.trim(); if(!u)return;
  const isAudio=/\.(mp3|wav|ogg|m4a|aac)$/i.test(u);
  mountMedia(u,isAudio);
});
$('#splitCap').addEventListener('change',()=>{
  $('#stage').classList.toggle('split',$('#splitCap').checked);
  $('#caption').classList.toggle('below',$('#splitCap').checked);
});

// ---------- 音軌擷取 + 轉字幕 ----------
/** 呼叫 /speech-to-subtitle 轉雙語字幕, 含簡易重試
 * @param {ArrayBuffer} buf 音訊位元組
 * @param {number} [attempt=0] 重試計數
 * @returns {Promise<import('./types/generated/esggo-shared.d.ts').ISpeechToSubtitleResult>} */
async function speechToSubRetry(buf,attempt=0){
  try{
    const r=await fetch('/speech-to-subtitle?lang='+encodeURIComponent(srcLang==='auto'?'auto':(LANG_BCP[srcLang]||srcLang)),
      {method:'POST',headers:{'Content-Type':'application/octet-stream'},body:buf});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const txt=await r.text();
    try{return JSON.parse(txt);}catch(_){throw new Error('服務回傳非預期格式（網路/逾時），請重試');}
  }catch(e){ if(attempt<2){await new Promise(r=>setTimeout(r,1000));return speechToSubRetry(buf,attempt+1);} throw e; }
}

function startMeter(s){
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const srcNode=audioCtx.createMediaStreamSource(s);
    analyser=audioCtx.createAnalyser(); analyser.fftSize=256;
    srcNode.connect(analyser);
    const data=new Uint8Array(analyser.frequencyBinCount);
    const tick=()=>{
      analyser.getByteFrequencyData(data);
      const lvl=data.reduce((a,b)=>a+b,0)/data.length;
      const pct=Math.min(100,lvl*2.2);
      $('#dMeter').style.background=pct>5?'var(--ok)':'var(--warn)';
      $('#meterTxt').textContent=pct>5?`收音中 ${pct.toFixed(0)}%`:'⚠ 無音訊訊號';
      meterRAF=requestAnimationFrame(tick);
    };
    tick();
  }catch(_){}
}

async function startCapture(){
  if(!mediaEl){toast('請先載入影片或音檔');return;}
  try{
    // 從媒體元素擷取音軌（MediaElementAudioSourceNode 方式太複雜，改抓 tab/系統音備用）
    // 實務：使用者播媒體時，用 getDisplayMedia 抓系統音（含媒體聲音），或麥克風
    let s;
    try{
      s=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
      // 保留音軌，丟掉視訊軌（避免佔用螢幕）
    }catch(_){
      s=await navigator.mediaDevices.getUserMedia({audio:true});
    }
    stream=s;
    startMeter(s);
    rec=new MediaRecorder(s,{mimeType:'audio/webm;codecs=opus'});
    chunks=[];
    rec.ondataavailable=e=>{ if(e.data.size>0)chunks.push(e.data); };
    rec.onstop=async()=>{
      cancelAnimationFrame(meterRAF);
      const blob=new Blob(chunks,{type:'audio/webm'});
      if(blob.size<200){$('#diagTxt').textContent='⚠ 本輪無音訊資料';return;}
      const buf=await blob.arrayBuffer();
      try{
        const d=await speechToSubRetry(buf);
        if(d.text)showCaption(d.text, d.translations||{});
      }catch(e){ toast(e.message); }
    };
    rec.start(4000); // 每 4s 產一片，串流轉錄
    running=true;
    $('#capBtn').disabled=true; $('#stopBtn').disabled=false;
    $('#dConn').classList.add('on'); $('#connTxt').textContent='轉字幕中';
    mediaEl.play().catch(()=>{});
    toast('開始擷取音訊並轉雙語字幕（系統音優先）');
  }catch(e){ toast('無法取得音訊：'+e.message); }
}

// ---------- Zoom 線上會議模式 (三元一體: 載入 Zoom 視窗 + 撥放 + 字幕) ----------
async function startZoom(){
  if(running){toast('請先停止目前的轉錄');return;}
  try{
    // 擷取 Zoom 會議視窗 (含系統音): 使用者於 picker 選 Zoom 視窗
    const s=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
    stream=s; zoomMode=true;
    // 三元一體: 直接在撥放器顯示 Zoom 會議畫面
    const vid=$('#vid'); $('#audioOnly').hidden=true; vid.hidden=false; mediaEl=vid;
    vid.srcObject=s; vid.play().catch(()=>{});
    $('#hint').classList.add('hide'); $('#stage').classList.remove('split');
    startMeter(s);
    rec=new MediaRecorder(s,{mimeType:'audio/webm;codecs=opus'});
    chunks=[];
    rec.ondataavailable=e=>{ if(e.data.size>0)chunks.push(e.data); };
    rec.onstop=async()=>{
      cancelAnimationFrame(meterRAF);
      const blob=new Blob(chunks,{type:'audio/webm'});
      if(blob.size<200){$('#diagTxt').textContent='⚠ 本輪無音訊資料';return;}
      const buf=await blob.arrayBuffer();
      try{ const d=await speechToSubRetry(buf); if(d.text)showCaption(d.text, d.translations||{}); }
      catch(e){ toast(e.message); }
    };
    rec.start(4000);
    running=true;
    $('#capBtn').disabled=true; $('#zoomBtn').disabled=true; $('#stopBtn').disabled=false;
    $('#dConn').classList.add('on'); $('#connTxt').textContent='Zoom 會議轉字幕中';
    toast('已連接 Zoom 會議視窗 — 選取 Zoom 應用程式視窗後即時轉雙語字幕');
  }catch(e){ toast('Zoom 連接失敗：'+e.message); }
}

function stopCapture(){
  if(rec&&rec.state!=='inactive')rec.stop();
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(zoomMode&&mediaEl&&mediaEl.srcObject){ mediaEl.srcObject=null; }
  running=false; zoomMode=false;
  $('#capBtn').disabled=false; $('#zoomBtn').disabled=false; $('#stopBtn').disabled=true;
  $('#dConn').classList.remove('on'); $('#connTxt').textContent='已停止';
  $('#meterTxt').textContent='待機';
}

$('#capBtn').addEventListener('click',startCapture);
$('#zoomBtn').addEventListener('click',startZoom);
$('#stopBtn').addEventListener('click',stopCapture);

// 頁面隱藏時停止
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&running)stopCapture(); });
</script>
</body>
</html>
