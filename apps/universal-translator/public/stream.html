<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>語種橋樑 · 觀眾端</title>
  <style>
    :root{ --bg:#0b0f17;--panel:#141b29;--panel2:#0e1623;--accent:#36e0c0;--txt:#e8eef7;--muted:#8a97ad;--radius:clamp(8px,2vw,14px);--gap:clamp(8px,2vw,16px);}
    html[data-theme="light"]{--bg:#eef2f7;--panel:#fff;--panel2:#f4f7fb;--txt:#16202e;--muted:#5b687e}
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;
      background:radial-gradient(1200px 600px at 80% -10%,#1c2740 0%,var(--bg) 55%);color:var(--txt);
      min-height:100vh;padding:clamp(12px,3vw,24px);display:flex;flex-direction:column;gap:var(--gap)}
    html[data-theme="light"]body{background:radial-gradient(1200px 600px at 80% -10%,#dbe6f5 0%,var(--bg) 55%)}
    .wrap{max-width:100vw;flex:1;display:flex;flex-direction:column;gap:var(--gap)}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
      padding:clamp(12px,2.5vw,16px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
    .room-info{margin-bottom:var(--gap);padding:clamp(10px,3vw,14px);background:var(--panel2);
      border-radius:var(--radius);font-size:clamp(0.8rem,1.7vw,0.9rem)}
    #transcript{flex:1;min-height:120px;max-height:45vh;overflow:auto;background:var(--panel2);
      border:1px solid var(--line);border-radius:var(--radius);padding:clamp(8px,1.5vw,12px);
      font-size:clamp(0.85rem,1.8vw,1rem);line-height:1.55;white-space:pre-wrap;word-break:break-word}
    #transcript .me{color:var(--accent)}.status{color:var(--muted);font-size:clamp(0.65rem,1.4vw,0.8rem)}
    .badge{display:inline-block;background:var(--panel2);border:1px solid var(--line);
      border-radius:var(--radius);padding:clamp(3px,1vw,6px) clamp(4px,1vw,8px);font-size:clamp(0.5rem,1.2vw,0.7rem);color:var(--accent)}
    @media (max-width:480px){.panel.row{flex-direction:column}}.panel.row{display:flex;gap:var(--gap);align-items:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel row">
      <h1>語種橋樑 · 觀眾端</h1>
      <p>掃描講者 QR Code 即可觀看即時翻譯</p>
      <div class="room-info">房間: <strong id="roomId">-</strong></div>
    </div>
    <div class="panel">
      <div class="badge">即時翻譯</div>
      <div id="transcript" aria-live="polite">（翻譯文字會顯示在這裡）</div>
    </div>
  </div>
  <script>
    const params=new URLSearchParams(location.search);
    const src=params.get('src')||'studio';
    const room=params.get('room')||'default';
    document.getElementById('roomId').textContent=room;
    const es=new EventSource('/stream?src='+src+(room?'&room='+room:''));
    es.onopen=()=>console.log('已連:',src,room);
    es.onerror=()=>console.log('連線斷線…');
    es.addEventListener('translation',e=>{
      const d=JSON.parse(e.data),out=document.getElementById('transcript');
      if(d.translations)for(const[code,txt]of Object.entries(d.translations)){
        const p=document.createElement('p');p.innerHTML='<b>'+code+':</b> '+txt;out.appendChild(p);}
      else if(d.text){const p=document.createElement('p');p.textContent=d.text;out.appendChild(p);}
      out.scrollTop=out.scrollHeight;});
    es.addEventListener('heartbeat',()=>{});
    es.addEventListener('room-status',e=>{const d=JSON.parse(e.data);console.log('房間:',d.broadcast?'開播':'待機');});
  </script>
</body>
</html>
