<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <title>萬能語種橋樑 · 觀眾端</title>
  <style>
    :root{ --bg:#0b0f17; --panel:#141b29; --panel2:#0e1623; --accent:#36e0c0; --accent2:#7c5cff;
      --txt:#e8eef7; --muted:#8a97ad; --line:#1f2a3d; --radius:18px; --shadow:0 8px 30px rgba(0,0,0,.45); }
    html[data-theme="light"]{ --bg:#eef2f7; --panel:#fff; --panel2:#f4f7fb; --txt:#16202e; --muted:#5b687e; --line:#dbe3ee; }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;
      background:radial-gradient(1200px 600px at 80% -10%,#1c2740 0%,var(--bg) 55%);color:var(--txt);
      min-height:100vh;padding:12px;transition:.3s}
    html[data-theme="light"] body{background:radial-gradient(1200px 600px at 80% -10%,#dbe6f5 0%,var(--bg) 55%)}
    .wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
    #transcript{flex:1;min-height:120px;max-height:36vh;overflow:auto;background:var(--panel2);
      border:1px solid var(--line);border-radius:12px;padding:12px;font-size:1.02rem;line-height:1.55}
    #transcript .me{color:var(--accent)}
    .status{font-size:.76rem;color:var(--muted);min-height:1.1em}
    .badge{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:.7rem;color:var(--accent)}
  </style>
</head>
<body>
<div class="wrap">
  <header><h1>萬能語種橋樑 · 觀眾端</h1></header>
  <div class="panel">
    <div class="badge">即時語種橋樑</div>
    <div id="transcript" aria-live="polite">（翻譯文字會顯示在這裡）</div>
  </div>
  <div class="status" id="status"></div>
</div>
<script>
const API = location.origin + '/translate';
const $ = s => document.querySelector(s);
let es = new EventSource('/stream');
es.onopen = () => { $('#status').textContent = '已連線'; };
es.onmessage = (e) => {
  const d = JSON.parse(e.data);
  const txt = d.translations?.['zh-TW'] || d.text;
  const p = document.createElement('p');
  p.textContent = txt;
  $('#transcript').appendChild(p);
};
es.onerror = () => { $('#status').textContent = '連線斷線，正在重連…'; };
</script>
</body>
</html>
