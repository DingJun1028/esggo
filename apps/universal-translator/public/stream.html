<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>萬能即時翻譯 · 觀眾端字幕</title>
<style>
:root{
  --bg:#0b0f17;--panel:#141b29;--panel2:#0e1623;--accent:#36e0c0;--txt:#e8eef7;--muted:#8a97ad;
  --line:rgba(255,255,255,.08);--shadow:0 8px 30px rgba(0,0,0,.35);--radius:clamp(8px,2vw,14px);--gap:clamp(8px,2vw,12px)
}
html[data-theme="light"]{--bg:#eef2f7;--panel:#fff;--panel2:#f4f7fb;--txt:#16202e;--muted:#5b687e;--line:rgba(0,0,0,.1);--shadow:0 8px 30px rgba(0,0,0,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:var(--gap);display:flex;flex-direction:column;gap:var(--gap);min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--gap)}
.topbar h1{font-size:1.05rem;margin:0}
.spacer{flex:1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{flex:1;min-width:120px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font-size:1rem}
button{font-size:.95rem;padding:8px 12px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;transition:.15s}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#04130f;border-color:transparent;font-weight:600}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:#22c55e}.dot.err{background:#ff5d6c}
.modehint{font-size:.75rem;color:var(--muted)}
.preview{flex:1;min-height:160px;background:var(--panel2);border:1px dashed var(--line);border-radius:var(--radius);padding:12px;font-size:.95rem;line-height:1.7;color:var(--muted)}
.preview b{color:var(--txt)}
/* 浮層字幕（影片字幕風格，半透明） */
.caption{position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);max-width:92vw;width:min(900px,92vw);
  background:rgba(8,12,20,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid var(--line);border-radius:14px;padding:10px 16px;box-shadow:0 8px 30px rgba(0,0,0,.4);
  pointer-events:none;z-index:9999;display:none;text-align:center;line-height:1.5}
.caption.show{display:block;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.caption .src{font-size:clamp(1rem,2.4vw,1.4rem);color:#fff;font-weight:600}
.caption .trs{font-size:clamp(.9rem,2vw,1.15rem);color:#7fe9d6;margin-top:2px}
.caption .trs .lbl{color:#9fb0c7;font-size:.8em;margin-right:6px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#ff5d6c;color:#fff;padding:8px 14px;border-radius:var(--radius);font-size:.85rem;opacity:0;transition:.3s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
@media(max-width:480px){.row{flex-direction:column}.row select{width:100%}.caption{bottom:3vh}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>🌐 萬能即時翻譯 · 觀眾端</h1>
    <div class="spacer"></div>
    <button id="themeBtn" title="切換深色 / 淺色">🌙</button>
  </div>
  <div class="row">
    <select id="targ"><option value="zh-TW">繁中</option><option value="en">英文</option><option value="ja">日文</option><option value="es">西班牙文</option><option value="fr">法文</option></select>
    <button id="floatBtn" class="primary">🎬 顯示字幕浮層</button>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="status">連線中…</span></div>
  <div class="modehint" id="modehint">來自收音端（/studio）的即時轉播會經 SSE 推播至此。點「顯示字幕浮層」可像影片字幕般懸浮顯示。</div>
  <div class="preview" id="preview">（等待字幕…）</div>
</div>
<div class="caption" id="caption">
  <div class="src" id="capSrc"></div>
  <div class="trs" id="capTrs"></div>
</div>
<div class="toast" id="toast"></div>
<script type="module">
const $=s=>document.querySelector(s);
const LANG_NAME={'zh-TW':'繁中','en':'英','ja':'日','es':'西','fr':'法'};
let room=new URLSearchParams(location.search).get('room')||'';
let sse=null,target='zh-TW',esOk=false,pollTimer=null;

// 主題記憶
const themeBtn=$('#themeBtn');
function applyTheme(t){document.documentElement.dataset.theme=t;themeBtn.textContent=t==='light'?'☀️':'🌙';localStorage.setItem('ut-theme',t);}
applyTheme(localStorage.getItem('ut-theme')||'dark');
themeBtn.onclick=()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light');

// 目標語
$('#targ').onchange=()=>{target=$('#targ').value;};

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
function setStatus(on,msg){$('#dot').className='dot '+(on?'on':'err');$('#status').textContent=msg;}
function showCaption(src,trs){
  const cap=$('#caption');
  $('#capSrc').textContent=src;
  $('#capTrs').innerHTML='<span class="lbl">'+(LANG_NAME[target]||target)+'</span>'+(trs||'');
  cap.classList.add('show');
  // 自動隱藏（避免字幕堆疊）
  clearTimeout(showCaption._t);
  showCaption._t=setTimeout(()=>cap.classList.remove('show'),6000);
}
function appendPreview(src,trsHtml){
  const p=$('#preview');
  if(p.textContent.startsWith('（等待'))p.textContent='';
  const d=document.createElement('div');d.style.margin='0 0 10px';
  d.innerHTML='<b>'+src+'</b><div style="color:var(--muted);font-size:.9em">'+trsHtml+'</div>';
  p.appendChild(d);p.scrollTop=p.scrollHeight;
}

// 字幕浮層開關
let floatOn=false;
$('#floatBtn').onclick=()=>{floatOn=!floatOn;$('#floatBtn').classList.toggle('primary',!floatOn);$('#floatBtn').textContent=floatOn?'🙈 隱藏字幕浮層':'🎬 顯示字幕浮層';if(!floatOn)$('#caption').classList.remove('show');};

// 接收翻譯推送（SSE event: translation）
function onTranslation(d){
  const src=d.text||'';
  const trs=d.translations? (d.translations[target]||d.translations['zh-TW']||Object.values(d.translations)[0]||'') : (d.text||'');
  const trsHtml=Object.entries(d.translations||{}).map(([c,t])=>'<span style="margin-right:10px">'+(LANG_NAME[c]||c)+': '+t+'</span>').join('');
  appendPreview(src,trsHtml);
  if(floatOn)showCaption(src,trs);
}

// 連線 SSE（優先）；失敗降級為 REST 輪詢 /translate
function connect(){
  try{
    const url=location.origin+'/stream'+(room?('?room='+encodeURIComponent(room)):'');
    sse=new EventSource(url);
    sse.addEventListener('translation',e=>{try{onTranslation(JSON.parse(e.data));esOk=true;}catch(_){}});
    sse.onopen=()=>{setStatus(true,'已連線 (SSE) · 房間 '+(room||'全部'));startPolling(false);};
    sse.onerror=()=>{if(!esOk){setStatus(false,'SSE 連線失敗，切換 REST 輪詢…');startPolling(true);}sse.close();sse=null;};
  }catch(e){setStatus(false,'SSE 錯誤：'+e.message);startPolling(true);}
}
// REST 降級：向 /translate 探詢（僅占位，實際字幕由 studio /speak 推播；此路做 heartBeat 顯示）
let lastProbe=0;
function startPolling(enable){
  clearInterval(pollTimer);
  if(!enable)return;
  pollTimer=setInterval(async()=>{
    try{
      const r=await fetch('/health');if(r.ok)setStatus(true,'已連線 (REST 降級) · 房間 '+(room||'全部'));
    }catch(_){setStatus(false,'服務離線');}
  },5000);
}
connect();
</script>
</body>
</html>
