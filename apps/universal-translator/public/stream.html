<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>語種橋樑 · 觀眾端</title>
  <style>
    body{font-family:sans-serif;background:#0b0f17;color:#e8eef7;padding:16px}
    .panel{background:#141b29;border:1px solid #3a465c;border-radius:8px;padding:12px;margin:12px 0}
    #transcript{flex:1;min-height:120px;overflow:auto;background:#0e1623;border:1px solid #3a465c;border-radius:12px;padding:12px;font-size:1rem}
    #transcript .me{color:#36e0c0}.status{color:#8a97ad}.badge{background:#0e1623;border:1px solid #3a465c;border-radius:8px;padding:3px 8px}
    .room-info{margin-bottom:8px;background:#141b29;padding:8px;border-radius:8px}
  </style>
</head>
<body>
  <div class="panel">
    <h1>語種橋樑 · 觀眾端</h1>
    <p>掃描講者 QR Code 即可觀看即時翻譯</p>
    <div class="room-info" id="roomInfo">房間: <span id="roomId">-</span></div>
  </div>
  <div class="panel">
    <div class="badge">即時即時翻譯</div>
    <div id="transcript" aria-live="polite">（翻譯文字會顯示在這裡）</div>
  </div>
  <script>
  const params = new URLSearchParams(location.search);
  const src = params.get('src') || 'studio';
  const room = params.get('room') || 'default';
  document.getElementById('roomId').textContent = room;

  // SSE 連線
  const es = new EventSource('/stream?src=' + src + (room ? '&room=' + room : ''));
  es.onopen = () => console.log('已連到:', src, room);
  es.onerror = () => console.log('連線斷線，正在重連…');

  // 接收翻譯結果
  es.addEventListener('translation', e => {
    const d = JSON.parse(e.data);
    const out = document.getElementById('transcript');
    // 支援來自 studio 的多語結果
    if (d.translations) {
      for (const [code, txt] of Object.entries(d.translations)) {
        const p = document.createElement('p');
        p.innerHTML = '<b>' + code + ':</b> ' + txt;
        out.appendChild(p);
      }
    } else if (d.text) {
      const p = document.createElement('p');
      p.textContent = d.text;
      out.appendChild(p);
    }
    out.scrollTop = out.scrollHeight;
  });
  es.addEventListener('heartbeat', () => console.log('心跳'));
  es.addEventListener('room-status', e => {
    const d = JSON.parse(e.data);
    console.log('房間狀態:', d.broadcast ? '開播' : '待機');
  });
  </script>
</body>
</html>
