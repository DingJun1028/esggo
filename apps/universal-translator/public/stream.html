<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zoom 會議字幕 · 觀眾端</title>
<style>
:root{
  --bg:#070b12;--panel:rgba(20,27,41,.72);--panel2:rgba(14,22,35,.6);
  --accent:#36e0c0;--accent2:#5b8cff;--txt:#eaf1fb;--muted:#8a97ad;
  --line:rgba(255,255,255,.09);--radius:18px;--gap:clamp(12px,2.6vw,18px);
  --font:"Segoe UI",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html[data-theme="light"]{--bg:#eef2f7;--panel:rgba(255,255,255,.85);--panel2:rgba(244,247,251,.9);--txt:#16202e;--muted:#5b687e;--line:rgba(0,0,0,.1)}
body{margin:0;font-family:var(--font);color:var(--txt);min-height:100vh;padding:var(--gap);
  background:radial-gradient(900px 500px at 85% -5%,rgba(91,140,255,.16),transparent 60%),var(--bg);background-attachment:fixed}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap);min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:1.1rem;margin:0;font-weight:700}
.ico-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font-size:1.05rem;display:grid;place-items:center;transition:.2s}
.ico-btn:hover{border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.swap{display:flex;align-items:center;justify-content:center;gap:10px;background:#1c2740;
  border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer;font-size:.95rem;font-weight:700;color:var(--txt);transition:.15s}
.swap:hover{border-color:var(--accent)}
.swap .ar{color:var(--accent);font-size:1.1rem}
.swap b{color:var(--gold)}
.status{font-size:.83rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.preview{flex:1;min-height:200px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.preview::-webkit-scrollbar{width:6px}.preview::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.utter{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.utter .src{color:var(--accent);font-weight:700;font-size:1.02rem;line-height:1.45}
.utter .trs{margin-top:6px;font-size:.92rem;color:var(--txt)}
.utter .ctx{margin-top:4px;font-size:.8rem;color:var(--muted);opacity:.75;font-style:italic}
.ctx{color:var(--muted);font-size:.82rem;opacity:.78;font-style:italic;margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;opacity:.7}
.caption{position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);max-width:94vw;width:min(1000px,94vw);
  background:linear-gradient(135deg,rgba(12,18,30,.72),rgba(8,12,20,.55));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px 22px;text-align:center;line-height:1.5;
  pointer-events:none;z-index:9999;opacity:0;transition:opacity .3s ease;box-shadow:0 16px 50px rgba(0,0,0,.5)}
.caption.show{opacity:1;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.caption .src{font-size:clamp(1.1rem,2.6vw,1.55rem);color:#fff;font-weight:700;text-shadow:0 2px 6px #000}
.caption .trs{margin-top:5px;font-size:clamp(.92rem,2.1vw,1.2rem);color:var(--accent);text-shadow:0 2px 6px #000}
.btn{font-size:.9rem;padding:9px 15px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04130f;border:0;font-weight:700}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#ff5d6c;color:#fff;padding:9px 15px;border-radius:11px;font-size:.85rem;opacity:0;transition:.3s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
@media(max-width:480px){.topbar h1{font-size:.95rem}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>📺 Zoom 會議字幕</h1>
    <button class="ico-btn" id="themeBtn" title="深色/淺色">🌙</button>
  </div>
  <div class="row">
    <div class="swap" id="swapBtn"><b id="fromLbl">繁中</b><span class="ar">→</span><b id="toLbl">EN</b><span style="font-size:.7rem;color:#9fb0c7;margin-left:6px">點擊互換</span></div>
    <button id="floatBtn" class="btn primary">🎬 顯示字幕浮層</button>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="status">連線中…</span></div>
  <div class="preview" id="preview"><div class="empty">等待字幕… 來自會議收音端的即時繁中 ↔ 英文 雙語字幕會出現在此</div></div>
</div>
<div class="caption" id="caption"><div class="src" id="capSrc"></div><div class="trs" id="capTrs"></div><div class="ctx" id="capCtx"></div></div>
<div class="toast" id="toast"></div>
<script type="module">
/// <reference path="./types/generated/esggo-shared.d.ts" />
// 語言顯示 — 由 shared/lang-matrix.mjs (終始矩陣單一真源) 定義; 本頁只用繁中↔英文互換
const LANG_DISPLAY = { 'zh-TW': '繁中', 'en': 'EN' };
const SWAP_LANGS = ['zh-TW', 'en'];
const $=s=>document.querySelector(s);
const qs=new URLSearchParams(location.search);
let room=qs.get('room')||'';
let toLang=qs.get('to')||'en'; if(!SWAP_LANGS.includes(toLang))toLang='en';
let sse=null,esOk=false,floatOn=false,capTimer=null;

// 主題
const themeBtn=$('#themeBtn');
function applyTheme(t){document.documentElement.dataset.theme=t;themeBtn.textContent=t==='light'?'☀️':'🌙';localStorage.setItem('ut-theme',t);}
applyTheme(localStorage.getItem('ut-theme')||'dark');
themeBtn.onclick=()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light');

function fromLang(){return SWAP_LANGS.find(l=>l!==toLang)||'zh-TW';}
function refreshSwapUI(){$('#fromLbl').textContent=LANG_DISPLAY[fromLang()];$('#toLbl').textContent=LANG_DISPLAY[toLang];}
refreshSwapUI();
$('#swapBtn').onclick=()=>{toLang=fromLang();refreshSwapUI();toast('觀看方向：'+LANG_DISPLAY[fromLang()]+' → '+LANG_DISPLAY[toLang]);};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function setStatus(on,msg){$('#dot').className='dot '+(on?'on':'');$('#status').textContent=msg;}

function showCaption(src,trs,ctx){
  $('#capSrc').textContent=src||'';
  $('#capTrs').textContent=trs||'';
  const ce=$('#capCtx'); if(ce) ce.textContent=(ctx&&ctx.length)?'前文：'+ctx.map(c=>c.src||c.text||'').join(' / '):'';
  const cap=$('#caption');cap.classList.add('show');clearTimeout(capTimer);capTimer=setTimeout(()=>cap.classList.remove('show'),6500);
}
function appendPreview(src,trs,ctx){
  const p=$('#preview');const e=p.querySelector('.empty');if(e)e.remove();
  const d=document.createElement('div');d.className='utter';
  const ctxLine=(ctx&&ctx.length)?`<div class="ctx">前文：${ctx.map(c=>c.src||c.text||'').join(' / ')}</div>`:'';
  d.innerHTML=`<div class="src">▸ ${src}</div>${ctxLine}<div class="trs">${trs||''}</div>`;
  p.appendChild(d);p.scrollTop=p.scrollHeight;
}

$('#floatBtn').onclick=()=>{floatOn=!floatOn;$('#floatBtn').classList.toggle('primary',!floatOn);
  $('#floatBtn').textContent=floatOn?'🙈 隱藏浮層':'🎬 顯示字幕浮層';if(!floatOn)$('#caption').classList.remove('show');};

function onTranslation(d){
  const src=d.text||'';
  const tr=(d.translations&&toLang&&d.translations[toLang])||'';
  const ctx=d.context||[];
  appendPreview(src,tr,ctx);
  if(floatOn)showCaption(src,tr,ctx);
}
function connect(){
  try{
    const url=location.origin+'/stream'+(room?('?room='+encodeURIComponent(room)):'');
    sse=new EventSource(url);
    sse.addEventListener('translation',e=>{try{onTranslation(JSON.parse(e.data));esOk=true;}catch(_){}});
    sse.onopen=()=>setStatus(true,'已連線 (SSE) · 房間 '+(room||'全部'));
    sse.onerror=()=>{if(!esOk)setStatus(false,'SSE 失敗，3 秒後重連…');sse.close();sse=null;setTimeout(connect,3000);};
  }catch(e){setStatus(false,'錯誤：'+e.message);setTimeout(connect,3000);}
}
connect();
</script>
</body>
</html>
