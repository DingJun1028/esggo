<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>聽眾端 · 語種橋樑</title>
  <style>body{font-family:sans-serif;padding:16px}.status{color:#888}.box{border:1px solid #ddd;border-radius:8px;padding:12px;background:#f9fafb}</style>
</head>
<body>
  <h1>聽眾端</h1>
  <div class="status" id="status">未連線</div>
  <div class="box"><div id="out"></div></div>
  <script>
  const API = location.origin + '/translate';
  const WS = location.origin + '/ws';
  // REST fallback
  setTimeout(async () => {
    const r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text:'你好',from:'auto',to:'zh'})});
    const d = await r.json();
    document.getElementById('out').textContent = d.text;
    document.getElementById('status').textContent = 'REST 連線成功: '+JSON.stringify(d).slice(0,60);
  }, 100);
  </script>
</body>
</html>
