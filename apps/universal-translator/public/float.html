<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>萬能即時翻譯 · 一體式懸浮字幕</title>
<style>
:root{
  --bg:#070b12;--panel:rgba(20,27,41,.72);--panel2:rgba(14,22,35,.6);
  --accent:#36e0c0;--accent2:#5b8cff;--txt:#eaf1fb;--muted:#8a97ad;
  --line:rgba(255,255,255,.09);--radius:18px;--gap:clamp(10px,2vw,16px);
  --font:"Segoe UI",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--txt);min-height:100vh;
  background:radial-gradient(900px 500px at 85% -5%,rgba(91,140,255,.16),transparent 60%),var(--bg);background-attachment:fixed}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap);padding:var(--gap)}
.topbar{display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:1.05rem;margin:0;font-weight:700}
.ico-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font-size:1.05rem;display:grid;place-items:center;transition:.2s}
.ico-btn:hover{border-color:var(--accent)}
.status{font-size:.83rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#3ad17a;flex:none}
.float-stage{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}
.float-stage video{width:100%;height:100%;object-fit:cover;opacity:.55}
.subtitle-layer{position:absolute;left:0;right:0;bottom:0;padding:14px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.sub-line{font-size:clamp(1rem,3.4vw,1.6rem);font-weight:700;line-height:1.25;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.sub-line.src{color:#fff}
.sub-line.tgt{color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121a;border:none}
select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.92rem}
.hint{font-size:.8rem;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>🐝 萬能即時翻譯 · 一體式懸浮字幕</h1>
    <button class="ico-btn" id="theme" title="切換主題">🌓</button>
  </div>
  <div class="status"><span class="dot"></span><span id="conn">SSE 連線中…</span></div>

  <div class="float-stage">
    <video id="cam" autoplay muted playsinline></video>
    <div class="subtitle-layer">
      <div class="sub-line src" id="src">等待字幕…</div>
      <div class="sub-line tgt" id="tgt"></div>
    </div>
  </div>

  <div class="row">
    <button class="btn primary" id="camBtn">開啟影像</button>
    <label>來源語
      <select id="from">
        <option value="zh-TW" selected>繁中</option>
        <option value="en">英文</option>
      </select>
    </label>
    <label>對向語
      <select id="to">
        <option value="en" selected>英文</option>
        <option value="zh-TW">繁中</option>
      </select>
    </label>
  </div>
  <div class="hint">一體式懸浮浮窗：左側影像為本機攝影機預覽（僅本地，不上傳），底部雙語字幕由 studio 端經 SSE 推播。適用 Zoom / Meet 螢幕共享疊加場景。</div>
</div>

<script>
const srcEl = document.getElementById('src');
const tgtEl = document.getElementById('tgt');
const connEl = document.getElementById('conn');
const camBtn = document.getElementById('camBtn');
const cam = document.getElementById('cam');
const fromSel = document.getElementById('from');
const toSel = document.getElementById('to');

// 主題切換
document.getElementById('theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
};

// 影像預覽 (本地攝影機, 不上傳)
camBtn.onclick = async () => {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    cam.srcObject = s;
    camBtn.textContent = '影像開啟中';
  } catch (e) { alert('無法開啟影像: ' + e.message); }
};

// SSE 訂閱 (觀眾端雙語字幕浮層)
function connectSSE() {
  const room = new URLSearchParams(location.search).get('room') || '';
  const es = new EventSource('/stream' + (room ? '?room=' + encodeURIComponent(room) : ''));
  es.addEventListener('translation', (ev) => {
    try {
      const d = JSON.parse(ev.data);
      srcEl.textContent = d.text || '';
      tgtEl.textContent = d.translation || '';
    } catch {}
  });
  es.onopen = () => { connEl.textContent = 'SSE 已連線'; };
  es.onerror = () => { connEl.textContent = 'SSE 重連中…'; setTimeout(connectSSE, 3000); };
}
connectSSE();
</script>
</body>
</html>
