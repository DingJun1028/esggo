# Universal-Translator 反向代理 (Cloudflare Tunnel)
# 服務 Port: 8788 (HTTP only) → Tunnel → https://translate.esggo.co
# 終止 TLS 於 Cloudflare 邊緣，VPS 只暴露內部 HTTP
server {
    server_name translate.esggo.co;

    client_max_body_size 10m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    listen 80;
    # 啟用後：cloudflared tunnel <NAME> 會把流量轉到此 port
    # HTTPS：由 Cloudflare Terminate，無需本地證書
}