# SonarQube CLI agentic 分析設定 (universal-translator)
# 自託 SonarQube CE (VPS :19000) — 免費 OSS 靜態分析
# agentic 自動修復為 SonarCloud/Enterprise 付費功能，CE 版不含（依「只用免費算立」不啟用）
#
# 本地/CI 掃描方式：
#   npx sonarqube-scanner -Dsonar.host.url=$SONAR_HOST -Dsonar.token=$SONAR_TOKEN ...
# VPS 自託：docker compose -f /opt/sonarqube/docker-compose.yml up -d

sonar.projectKey=universal-translator
sonar.projectName=OA-Team 萬能即時翻譯
sonar.host.url=http://localhost:19000

# 分析範圍：僅 UT 服務自身程式碼
sonar.sources=server.mjs,translate.mjs,stt_client.mjs,types
sonar.tests=test
sonar.test.inclusions=test/**/*.test.mjs

# 語言與編碼
sonar.sourceEncoding=UTF-8

# JS 分析設定
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# 零幻覺驗算相關：類型安全為高優先
sonar.javascript.rule.configs=()
