# SonarQube CLI agentic 分析設定 (universal-translator)
# 需具備 SonarQube Cloud 組織 (啟用 agentic analysis) 與 SONAR_TOKEN。
# 未配置時 CI 的 sonar-agentic job 整個跳過 (對齊「只用免費算立」)。

sonar.projectKey=universal-translator
sonar.organization=esggo
sonar.projectName=OA-Team 萬能即時翻譯

# 分析範圍：僅 UT 服務自身程式碼
sonar.sources=server.mjs,translate.mjs,stt_client.mjs,types
sonar.tests=test
sonar.test.inclusions=test/**/*.test.mjs

# 語言與編碼
sonar.sourceEncoding=UTF-8

# 零幻覺驗算相關：類型安全為高優先
sonar.javascript.lcov.reportPaths=coverage/lcov.info
