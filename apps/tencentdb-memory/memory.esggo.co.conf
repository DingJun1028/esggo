# TencentDB Agent Memory — 反向代理 (最佳實踐: Cloudflare Tunnel 終止 TLS, origin 走 :80 明文)
# Panel (8125) + Gateway (8420) 經 memory.esggo.co 暴露, 不裸開端口, 不需本地 cert
server {
    server_name memory.esggo.co;

    client_max_body_size 20m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    # Gateway: OA-Team 蜂群共享記憶 API 入口 (8420)
    location /gateway/ {
        proxy_pass http://127.0.0.1:8420/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    # Panel: 記憶中樞管理 UI (8125)
    location / {
        proxy_pass http://127.0.0.1:8125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    listen 80;
}
