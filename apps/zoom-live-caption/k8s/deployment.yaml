# zoom-live-caption/k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoom-live-caption
  namespace: zoom-live-caption
  labels:
    app: zoom-live-caption
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zoom-live-caption
  template:
    metadata:
      labels:
        app: zoom-live-caption
    spec:
      containers:
        - name: zoom-live-caption
          image: zoom-live-caption:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: ws
              containerPort: 8081
              protocol: TCP
          env:
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: zoom-live-caption-secrets
                  key: OLLAMA_API_KEY
                  optional: true
            - name: RUN_MODE
              value: "headless"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config-volume
          configMap:
            name: zoom-live-caption-config
