# zoom-live-caption/k8s/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zoom-live-caption
  namespace: zoom-live-caption
  labels:
    app: zoom-live-caption
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket 支援
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-set-headers: |
      Upgrade $http_upgrade;
      Connection "upgrade";
spec:
  ingressClassName: nginx
  rules:
    - host: zoom-live-caption.local   # 改成你的網域
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zoom-live-caption
                port:
                  number: 80
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: zoom-live-caption
                port:
                  number: 81
