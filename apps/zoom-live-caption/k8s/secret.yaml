# zoom-live-caption/k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: zoom-live-caption-secrets
  namespace: zoom-live-caption
  labels:
    app: zoom-live-caption
type: Opaque
stringData:
  OLLAMA_API_KEY: ""   # 請用 kubectl create secret 從命令列建立
---
# 使用方法:
# kubectl create secret generic zoom-live-caption-secrets \
#   --from-literal=OLLAMA_API_KEY=your-api-key-here \
#   -n zoom-live-caption --dry-run=client -o yaml | kubectl apply -f -
