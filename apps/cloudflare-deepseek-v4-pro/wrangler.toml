name = "esggo-deepseek-v4-pro"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Cloudflare Workers AI 綁定 (runtime 內 env.AI)
# 部署前需有效 Cloudflare 憑證:
#   wrangler login   (OAuth)  或
#   export CLOUDFLARE_API_TOKEN=<有效 token, 含 ai:run>
[ai]
binding = "AI"

# account_id 由部署者填入 (或 wrangler login 後自動帶入)
# account_id = "d9d7ecd92cbad6d858fba3e529b9cb7b"

[vars]
# 預設模型, 可改
MODEL = "deepseek/deepseek-v4-pro"

[build]
command = "npx --yes pnpm install --frozen-lockfile"
