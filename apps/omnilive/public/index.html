<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OmniLive 萬能即時轉譯雙語字幕層</title>
<script src="./qrcode.min.js"></script>
<style>
/* ===== 最新技術: 容器查詢 + dvh + 動態色彩 ===== */
:root{
  --bg:transparent;
  /* ===== OmniUI v1.0 液態玻璃 SSOT =====
     樣貌唯一來源: packages/omni-ui/src/index.ts
     (LiquidGlassRenderer.renderStyle / DEFAULT_GLASS)
     任何玻璃外觀改動都應改這裡的 token, 勿在各元件散寫數值。
     本檔顏色與 OmniUI 品牌色同色系 (深藍/暖金/米白), 僅深藍底取 #142A47
     而非 #10243f —— 屬「顏色稍微不同」, 已刻意保留。 */
  --omni-radius:12px;              /* OmniUI border-radius */
  --omni-blur:20px;                /* OmniUI DEFAULT_GLASS.blur */
  --omni-shadow:0 8px 32px rgba(0,0,0,.2);      /* OmniUI standard */
  --omni-shadow-lift:0 12px 40px rgba(0,0,0,.28); /* 浮起層 (選單/彈窗) */
  --omni-fill:rgba(201,162,75,.08); /* 玻璃上的淡金填色 (取代冷白疊色) */
  --gold:#c9a24b;--gold-soft:#b8941f;--txt:#f3ede1;--muted:#8a8275;
  /* --green: 強調色。
     品牌文件的 #3c6e43 在本深藍玻璃(#142A47)上僅 2.42:1，小字(.74rem)不可讀；
     此處取經對比度驗證的 #5fb37e = 5.67:1 (WCAG AA 通過)。
     勿直接改回品牌值，會讓 csec h3 / term b 變成看不見。 */
  --green:#5fb37e;
  --glass:rgba(20,42,71,.62);--glass-strong:rgba(20,42,71,.82);
  /* OmniUI 標準邊框為淡金 (rgba(201,162,75,.3)), 非冷白 —— 白邊是偏離樣貌的主因之一。 */
  --line:rgba(201,162,75,.3);
  --radius:var(--omni-radius);--gap:clamp(10px,2vw,16px);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;
  --mono:ui-monospace,"Cascadia Code",monospace;
  --sub-pos:bottom; /* top|center|bottom */
  --sub-align:center; /* left|center|right */
  --sub-scale:1;
  /* 深色玻璃介面 → 讓 UA 原生控制項 (select/checkbox/range/捲軸) 也走深色,
     否則下拉選單與捲軸會以淺色渲染, 在深藍玻璃上形成亮色破洞。 */
  color-scheme:dark;
  /* 觸控高亮: 桌機無此效果, 行動裝置點按會閃一塊預設藍灰底。 */
  -webkit-tap-highlight-color:transparent;
}
/* 僅供螢幕閱讀器: 視覺隱藏但保留在無障礙樹中 (不能用 display:none/visibility:hidden)。 */
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;
}
*{-webkit-text-size-adjust:100%;text-size-adjust:100%;box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--txt);
  /* 全屏透明浮層, 直接疊在 Zoom/YouTube 影片上 */
  position:fixed;inset:0;pointer-events:none; /* 字幕層不擋底層操作 */
  background:transparent;overflow:hidden;
  container-type:size; /* 啟用容器查詢 */
}

/* ===== 字幕舞台: 透明漂浮, 無容器邊框 ===== */
#stage{
  position:absolute;left:0;right:0;
  top:0;bottom:0;
  padding:calc(clamp(12px,3vh,32px) + env(safe-area-inset-top)) clamp(12px,3vw,32px)
           calc(clamp(12px,3vh,32px) + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  pointer-events:none;
}
#subtitles{
  width:min(94vw,1100px);
  display:flex;flex-direction:column;gap:clamp(8px,1.4vh,16px);
  align-items:var(--sub-align);
  justify-content:flex-end;
  max-height:62dvh;overflow:hidden;
  /* 拖曳手柄 (九宮格定位) */
  pointer-events:auto;cursor:grab;touch-action:none;
}
#subtitles.dragging{cursor:grabbing}
/* ── 固定視窗滾動字幕 ──────────────────────────────────────────────
   需求: 字幕在同一個視窗中由左向右一直替換, 畫面不會一直往下增長。
   舊版 .sub-group 每句 append 一組 (3 列 × 上限 8 組 = 24 列) → 向下無限增長。
   新版: #subtitles 內固定 slotCount 組 .sub-group, 新句進 A1、舊句位移到 A2,
   超出視窗的直接丟棄 → 高度恆定。max-height + overflow 為保底。 */
#subtitles{
  display:flex;flex-direction:column;gap:4px;
  max-height:56dvh;overflow:hidden;
}
.sub-group{
  display:flex;flex-direction:column;gap:2px;width:100%;
  animation:subIn .2s ease-out;
  text-align:var(--sub-align);
}
.sub-group.finalized{animation:none}
/* 逐字: 未顯現的字先淡出。只動 opacity, 不動版面, 避免整行重排造成字幕抖動。 */
.sub-line .w{opacity:.28;transition:opacity .18s ease-out}
.sub-line .w.on{opacity:1}
.sub-group.active{position:relative}
.sub-group.active::after{
  content:'';position:absolute;left:0;bottom:-6px;height:2px;width:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--gold),transparent);
  animation:typing 1.1s ease-in-out infinite;
}
@keyframes typing{0%{opacity:.2;transform:scaleX(.3)}50%{opacity:1;transform:scaleX(1)}100%{opacity:.2;transform:scaleX(.3)}}
@keyframes subIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.sub-line{
  display:block;width:fit-content;max-width:100%;
  border-radius:12px;padding:4px 14px;line-height:1.28;font-weight:800;
  /* 漂移字幕標準: 僅 text-shadow 保證任何背景可讀, 無不透明底 */
  text-shadow:0 2px 6px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.9);
  color:#fff;
  /* 繁中長句必須換行而非溢出: 中日韓無空白可斷, 預設 line-break 不在字間斷,
     這兩項強制逐字斷行, 避免 #subtitles 的 overflow:hidden 把字幕裁掉。
     overflow-wrap:anywhere 兼顧無空白的英文長字/網址。
     刻意不加 white-space:pre-wrap —— 逐字渲染會在 span 之間留下縮排空白,
     反而讓字幕多出空格; 換行需求已由上面三項滿足。 */
  overflow-wrap:anywhere;
  word-break:break-word;
  line-break:anywhere;
}
.sub-line.src{font-size:clamp(1.05rem,3.4vw,1.7rem)}   /* 原文(英文) 較小 */
.sub-line.tgt{font-size:clamp(1.5rem,5vw,2.6rem)}        /* 翻譯(中文) 大字 */
.sub-line .meta{font-size:.7rem;color:rgba(255,255,255,.55);font-weight:400;margin-top:2px;text-shadow:none;background:none!important;padding:0!important}

/* ===== 一體成形介面 (純 UI 改動, 不動功能邏輯) =====
   設計: 字幕層 + 控制條合成單一連續表面, 共用同一片深藍玻璃底。
   互動: 字幕區唯讀(只接收/顯示), 拖曳把手在下方控制條。
   調色沿用原設計: --glass 深藍玻璃 / --gold 暖金 / --txt 米白。 */
#stage{
  pointer-events:none;
}
/* 字幕區: 唯讀, 不攔截底層影片點擊, 也不作為拖曳起點 */
#subtitles{
  pointer-events:none;cursor:default;
  background:var(--glass);
  backdrop-filter:blur(var(--omni-blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--omni-blur)) saturate(160%);
  border:1px solid var(--line);
  /* 承接下方控制條 → 底部不收圓角, 形成一體 */
  border-bottom:none;
  border-radius:var(--omni-radius) var(--omni-radius) 0 0;
  padding:12px 18px 8px;
  box-shadow:var(--omni-shadow);
}
#subtitles.dragging{cursor:default}
/* 拖曳把手 = 下方控制條容器 */
#grip{
  pointer-events:auto;cursor:grab;touch-action:none;
  width:min(94vw,1100px);
  display:flex;flex-direction:column;align-items:stretch;
}
#grip.dragging{cursor:grabbing}
/* 控制條: 字幕正下方的水平玻璃條, 與字幕同寬同色, 無邊界分隔 → 一體成形 */
#toolbar{
  display:flex;flex-direction:column;align-items:stretch;width:100%;
  pointer-events:auto;
  /* 定位錨點: .sheet 用 bottom:calc(100% + 8px) 往上長出選單,
     必須相對本元素 (底部工具列) 解析, 否則會退回初始包含區塊而整片跑出視窗。 */
  position:relative;
}
/* ===== 設定選單 (sheet) =====
   由介面往上長出的選單面板: 深藍玻璃卡片 + 分節標題 + 分隔線。
   樣式全部在此, markup 不再夾帶 style=""。 */
/* 錨定觸發它的四角鈕 (position:fixed, JS 計算座標), 不再錨在字幕下方的
   #toolbar。原錨點用 bottom:calc(100%+8px) 往上長, 面板會穿出視窗上緣被裁切。
   高度上限改用 100dvh - 上下內距, 保證「完整呈現」而非半截。 */
.sheet{
  position:fixed;
  z-index:30;
  /* --sheet-top / --sheet-left 由 placeSheet() 依觸發鈕的位置設定 */
  top:var(--sheet-top,0px);left:var(--sheet-left,0px);
  width:min(92vw,360px);
  /* 視窗高度扣掉角鈕與安全邊距 → 面板永不溢出, 也不會被上緣裁掉 */
  max-height:calc(100dvh - var(--sheet-vpad,28px) - 20px);
  overflow:auto;overscroll-behavior:contain;
  background:var(--glass-strong);backdrop-filter:blur(var(--omni-blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--omni-blur)) saturate(160%);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;box-shadow:var(--omni-shadow-lift);
  display:none;flex-direction:column;gap:0;
}
.sheet.open{display:flex;animation:subIn .2s ease-out}
/* 選單抬頭: 標題 + 關閉鈕, 捲動時黏在上緣 */
.sheet__head{
  position:sticky;top:-14px;z-index:1;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin:-14px -14px 0;padding:12px 14px;
  background:var(--glass-strong);
  border-bottom:1px solid var(--line);
}
.sheet__head b{font-size:.92rem;font-weight:700;letter-spacing:.02em}
.sheet__close{
  /* 觸控目標 44px: 與 .icon-btn(44) / .corner-btn(48) 對齊。
     原為 32px, 在行動裝置低於建議最小觸控目標, 容易誤觸。 */
  width:44px;height:44px;min-width:44px;min-height:44px;flex:none;
  display:grid;place-items:center;
  border:1px solid transparent;border-radius:10px;
  background:transparent;color:var(--muted);
  font-size:1rem;line-height:1;cursor:pointer;transition:.15s;
}
.sheet__close:hover{background:var(--omni-fill);border-color:var(--line);color:var(--txt)}
.sheet__close:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* 每個選單分節: 標題 + 內文, 節與節之間以細線分隔 */
.menu-sec{padding:13px 0;border-bottom:1px solid var(--line)}
.menu-sec:last-of-type{border-bottom:none}
.menu-sec__head{
  font-size:.78rem;color:var(--muted);font-weight:600;
  letter-spacing:.06em;margin:0 0 8px;
  display:flex;align-items:center;gap:6px;
}
.menu-sec__body{display:flex;flex-direction:column;gap:8px}
/* 建立連結後展開的連結區塊 (與 .hidden 併用, 由 !important 決定顯隱) */
.share-body{display:flex;flex-direction:column;gap:8px;margin-top:10px}
/* 定位九宮格: 置頂/置中/置底 與 靠左/置中/靠右 */
.pos-grid{display:flex;justify-content:center;gap:4px}
.pos-grid+.pos-grid{margin-top:4px}
/* 選單內的字級滑桿佔滿整列 */
.range-row label{flex:1}
/* 選單內換行時額外留白 */
.stack-gap{margin-top:6px}
.icon-btn{
  width:44px;height:44px;min-width:44px;min-height:44px;border-radius:50%;border:1px solid transparent;
  background:transparent;color:var(--txt);cursor:pointer;font-size:1.2rem;
  display:grid;place-items:center;transition:.18s;flex:none;
}
.icon-btn:hover{background:var(--omni-fill);border-color:var(--line)}
/* ===== 四角功能圖示 =====
   圖示固定在介面四角, 不再占用字幕下方的控制列。
   字幕維持唯讀, 唯一的拖曳把手是字幕下方的 #gripHandle。 */
.corner-btn{
  /* 四角鈕錨定「介面本體」而非螢幕。
     問題: 原本 .corner-btn 是 position:fixed + data-pos 的 top/right/bottom/left(14px),
     直接釘在 viewport 邊緣; 而 placeSheet()/sharePlace() 以鈕的 getBoundingClientRect()
     計算彈出位置 -> 位於視窗最上緣的鈕 (top:14px) 會讓面板被算出畫面外看不到。
     修法: 仍用 fixed (需跨過 body/#grip 的包含塊), 但 14px 邊距改由 JS 以
     placeCorners() 依「介面本體」實際內距 (stage padding) 設定 --edge-* 變數,
     讓鈕與面板共用同一套本體座標系, 而不是各自用不同的常數。
     不可改成 absolute: 祖先鏈為 #stage(absolute) > #grip > #toolbar,
     absolute 會把鈕錨到字幕拖曳把手 #grip 而非介面四角。 */
     position:fixed;z-index:20;
     top:var(--edge-top,14px);right:var(--edge-right,14px);
     bottom:var(--edge-bottom,14px);left:var(--edge-left,14px);
     width:48px;height:48px;min-width:48px;min-height:48px;
  border-radius:var(--omni-radius);
  border:1px solid var(--line);
  background:var(--glass);
  backdrop-filter:blur(var(--omni-blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--omni-blur)) saturate(160%);
  color:var(--txt);cursor:pointer;pointer-events:auto;
  box-shadow:var(--omni-shadow);
  transition:background .18s,border-color .18s,transform .18s;
}
.corner-btn:hover{background:var(--glass-strong);border-color:var(--gold)}
.corner-btn:active{transform:scale(.94)}
.corner-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.corner-btn svg{width:24px;height:24px;display:block;fill:none;
  stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.corner-btn.active{color:var(--gold);border-color:var(--gold)}
/* 四角定位: 加上 safe-area, 避免瀏海/圓角螢幕遮住圖示 */
/* data-pos 決定哪一角落, 邊距統一取自 placeCorners() 寫入的 --edge-* 變數,
   不再各自寫死 14px, 才能與面板的彈出座標系一致 (見 .corner-btn 註解)。 */
.corner-btn[data-pos="tl"]{top:var(--edge-top,14px);left:var(--edge-left,14px)}
.corner-btn[data-pos="tr"]{top:var(--edge-top,14px);right:var(--edge-right,14px)}
.corner-btn[data-pos="bl"]{bottom:var(--edge-bottom,14px);left:var(--edge-left,14px)}
.corner-btn[data-pos="br"]{bottom:var(--edge-bottom,14px);right:var(--edge-right,14px)}
/* 窄螢幕略縮, 避免四圖示在小手机上過度佔版面。
   下限維持 44px, 符合最小點擊目標 (WCAG 2.5.5 / iOS HIG), 不可再縮。 */
@media (max-width:420px){
  .corner-btn{width:44px;height:44px;min-width:44px;min-height:44px;border-radius:12px}
  .corner-btn svg{width:21px;height:21px}
}
/* 收音中: 沿用舊 .icon-btn.danger 的紅色狀態語意 */
.corner-btn.danger{color:#ff8a82}
.corner-btn.danger.active{
  background:linear-gradient(135deg,#ff6b6b,#ff8e53);color:#fff;border-color:#ff8a82;
}
#gripHandle{
  pointer-events:auto;cursor:grab;touch-action:none;
  width:min(94vw,1100px);
  height:26px;
  display:flex;align-items:center;justify-content:center;
  background:var(--glass);
  backdrop-filter:blur(var(--omni-blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--omni-blur)) saturate(160%);
  border:1px solid var(--line);border-top:none;
  border-radius:0 0 var(--omni-radius) var(--omni-radius);
  box-shadow:var(--omni-shadow-lift);
}
#gripHandle.dragging{cursor:grabbing}
/* 把手中央的抓握橫條 (純視覺, 由拖曳把手本體承載互動) */
#gripHandle::after{
  content:'';width:46px;height:4px;border-radius:2px;
  background:var(--muted);opacity:.75;
}
.icon-btn.active{background:var(--gold);color:#06121a}
.icon-btn.danger{color:#ff8a82}
.icon-btn.danger.active{background:linear-gradient(135deg,#ff6b6b,#ff8e53);color:#fff}

/* 選單分節底色 (舊 .sheet 視覺區已合併到 .sheet 主規則, 此處只留通用元件) */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{
  border:1px solid var(--line);background:var(--omni-fill);color:var(--txt);
  border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:.85rem;transition:.15s;flex:1;min-width:120px;
}
.btn:hover{border-color:var(--gold)}
/* 鍵盤焦點指示 (WCAG 2.4.7)。原先全站無 focus 樣式，
   鍵盤使用者操作時完全看不到自己在哪 —— 只用 :focus 會在滑鼠點擊時
   也留下外框，故採 :focus-visible。 */
:focus-visible{
  outline:2px solid var(--gold);outline-offset:2px;border-radius:var(--radius);
}
.icon-btn:focus-visible{outline-offset:3px}
@media (prefers-contrast:more){
  :focus-visible{outline-width:3px}
}
.btn.primary{background:var(--gold);color:#06121a;border:none}
select,input[type=text]{
  background:rgba(0,0,0,.3);color:var(--txt);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;font-size:.85rem;flex:1;min-width:120px;
}
label{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px}
.share-link{display:flex;gap:6px;align-items:center}
.share-link input{flex:1;min-width:0;font-size:.72rem}
.qr{background:#fff;border-radius:12px;padding:6px;width:130px;height:130px;display:grid;place-items:center;margin:0 auto}

/* 舊的全螢幕 QR 遮罩 (#qrModal / .qr-card 系列) 已移除:
   分享改為 .sharepop 就近小卡 (見下), 全螢幕遮罩會蓋住整個介面且無法
   「在介面本體中向上輕輕彈出」。 */
.badge{font-size:.7rem;padding:3px 9px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--muted)}
.badge.live{color:var(--gold);border-color:var(--gold)}
.dot{width:8px;height:8px;border-radius:50%;background:#3ad17a;flex:none}
.dot.bad{background:#e2554f}
.status{font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.hint{font-size:.72rem;color:var(--muted);line-height:1.5}
.meter{height:6px;background:var(--line);border-radius:999px;overflow:hidden;flex:1;min-width:80px}
.meter>div{height:100%;width:0%;background:#28c76f;transition:width .08s}
.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.68rem;color:var(--muted);max-height:90px;overflow:auto;white-space:pre-wrap;line-height:1.4}
#errbar{background:rgba(226,85,79,.18);border:1px solid rgba(226,85,79,.5);color:#ffd9d6;border-radius:12px;padding:8px 12px;font-size:.76rem}
.hidden{display:none!important}

/* 課程浮窗 (右上角, 可收合) */
#courseWin{
  position:fixed;top:clamp(12px,2vw,24px);right:clamp(12px,2vw,24px);
  width:min(92vw,380px);max-height:80dvh;overflow:auto;
  background:var(--glass-strong);backdrop-filter:blur(var(--omni-blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--omni-blur)) saturate(160%);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--omni-shadow-lift);
  pointer-events:auto;z-index:20;display:none;flex-direction:column;
}
#courseWin.open{display:flex;animation:subIn .2s ease-out}
#courseWin header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--glass-strong)}
#courseWin header b{font-size:.85rem}
#courseBody{padding:14px;display:flex;flex-direction:column;gap:14px}
.csec{display:flex;flex-direction:column;gap:6px}
/* csec 標題: h2 語意階層 (頁面 h1 → 分節 h2 → 本層), 樣式掛在 class 與 h2 兩者皆可,
   但維持選擇器與標籤一致, 避免日後有人改標籤而樣式默默失效。 */
.csec h2{font-size:.74rem;color:var(--green);font-weight:700;letter-spacing:.03em}
.csec .summary{font-size:.92rem;font-weight:700;line-height:1.4}
.ckp{font-size:.82rem;line-height:1.45;padding-left:14px;position:relative}
.ckp::before{content:'•';position:absolute;left:2px;color:var(--gold)}
.term{background:var(--omni-fill);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.78rem;line-height:1.4}
.term b{color:var(--green)}
.term a{color:var(--gold);text-decoration:none}
.term a:hover{text-decoration:underline}
.case{font-size:.78rem;line-height:1.45;color:var(--muted);padding-left:14px;position:relative}
.case::before{content:'↳';position:absolute;left:0;color:var(--green)}

/* ===== 容器查詢 RWD: 窄屏(手機) 字級自動縮小 ===== */
@container (max-width:600px){
  .sub-line.src{font-size:clamp(.95rem,4.2vw,1.3rem)}
  .sub-line.tgt{font-size:clamp(1.2rem,6vw,1.9rem)}
  #courseWin{width:94vw}
}
@container (max-height:480px){
  #subtitles{max-height:48dvh}
}

/* === reduce-motion 尊重使用者偏好 === */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}

/* === brand OA mark 給浮動字幕視窗用 === */
.brand-mark{
  width:18px;height:18px;
  border:1px solid var(--gold);
  border-radius:4px;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--gold);
  font-family:var(--mono);
  font-size:10px;font-weight:600;letter-spacing:.05em;
  vertical-align:middle;
  flex:none;
}
/* 分享彈出卡: 在介面本體內輕輕浮現的玻璃卡, 由觸發鈕定位。
   原先是全螢幕遮罩 (#qrModal), 會蓋住整個介面; 改為就近小卡,
   向上長出時不出現「彈到最上方看不到」的情況。 */
.sharepop{
  position:fixed;z-index:32;
  top:var(--sheet-top,0px);left:var(--sheet-left,0px);
  width:min(88vw,300px);
  max-height:calc(100dvh - 32px);
  overflow:auto;overscroll-behavior:contain;
  background:var(--glass-strong);backdrop-filter:blur(var(--omni-blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--omni-blur)) saturate(160%);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;box-shadow:var(--omni-shadow-lift);
  display:none;flex-direction:column;gap:10px;
  pointer-events:auto;
}
.sharepop.open{display:flex;animation:subIn .2s ease-out}
.sharepop__head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sharepop__head b{font-size:.92rem;font-weight:700}
.sharepop .share-link input{min-width:0;font-size:.72rem}
.sharepop .qr{background:#fff;border-radius:12px;padding:6px;width:118px;height:118px;display:grid;place-items:center;margin:0 auto}
</style>
</head>
<body>

<!-- 字幕漂浮層 (唯讀) + 一體控制條 (拖曳把手) -->
<!-- #grip 與 #subtitles 同為 #stage 的 flex 子項, 故控制條自然緊接字幕下方, 成一體表面 -->
<div id="stage">
  <h1 class="sr-only">OmniLive 萬能即時轉譯雙語字幕</h1>
  <!-- 這是本產品的核心輸出, 對螢幕閱讀器必須是 live region,
       否則聾/聾盲使用者完全收不到逐句譯文 (與聽障者看字幕的需求對等)。
       polite = 不搶斷目前朗讀; atomic = 整列重讀, 因列內容是整句替換而非逐字追加。
       逐字淡入只切 opacity 不改 textContent, 故不會造成逐字轟炸。 -->
  <div id="subtitles" role="region" aria-label="即時字幕" aria-live="polite" aria-atomic="true"><div class="sub-line tgt placeholder">等待字幕…</div></div>
  <div id="grip">

<!-- 課程即時解說浮窗 -->
<div id="courseWin">
  <header>
    <b>課程 課程即時解說</b>
    <button class="icon-btn" id="courseClose" title="收合">關閉</button>
  </header>
  <div id="courseBody">
    <div class="csec"><h2>章節概要</h2><div class="summary" id="cSummary">—</div></div>
    <div class="csec"><h2>重點項目</h2><div id="cKeypoints"></div></div>
    <div class="csec"><h2>重要名詞</h2><div id="cTerms"></div></div>
    <div class="csec"><h2>類似案例</h2><div id="cCases"></div></div>
    <div class="hint" id="cUpdated"></div>
  </div>
</div>

<!-- 玻璃工具條 (圖示化) — 位於 #grip 內, 字幕區唯讀不可拖 -->
  <div id="toolbar">
  <div class="sheet" id="sheet" role="dialog" aria-label="設定選單">
    <div class="sheet__head">
      <b>設定</b>
      <button class="sheet__close" id="sheetClose" aria-label="關閉設定選單">✕</button>
    </div>

    <!-- 建立分享 -->
    <section class="menu-sec" id="sharePanel">
      <h2 class="menu-sec__head">建立分享會議</h2>
      <div class="menu-sec__body">
        <div class="row">
          <button class="btn primary" id="createRoom">建立連結</button>
          <input type="text" id="roomPwd" placeholder="房間密碼(選填)">
        </div>
        <div id="shareBody" class="share-body hidden">
          <div class="hint hint-green">主播 主持人連結</div>
          <div class="share-link"><input type="text" id="casterLink" readonly><button class="btn" data-copy="casterLink" aria-label="複製主持人連結" title="複製主持人連結">複製</button></div>
          <div class="hint hint-gold">觀眾 觀眾連結</div>
          <div class="share-link"><input type="text" id="viewerLink" readonly><button class="btn" data-copy="viewerLink" aria-label="複製觀眾連結" title="複製觀眾連結">複製</button></div>
          <div class="row">
            <button class="btn" id="openViewer">預覽觀眾</button>
            <button class="btn" id="refreshCount">人數</button>
          </div>
          <div class="qr" id="qrBox"></div>
          <div class="hint" id="viewerCount"></div>
        </div>
      </div>
    </section>

    <!-- 收音控制 -->
    <section class="menu-sec" id="casterPanel">
      <h2 class="menu-sec__head">音訊來源 (Zoom 場景)</h2>
      <div class="menu-sec__body">
        <div class="row">
          <select id="audioSource">
            <option value="system-display" selected>系統音訊 / Zoom 共享聲音</option>
            <option value="mic">本機麥克風</option>
            <option value="device">指定輸入裝置</option>
            <option value="caption">手動字幕輸入</option>
          </select>
        </div>
        <div class="row">
          <button class="btn primary" id="startBtn">開始收音</button>
          <button class="btn" id="stopBtn" disabled>停止</button>
          <button class="btn" id="dlAudioBtn" disabled title="下載前端實際送給 STT 的音訊">⬇ 音訊</button>
        </div>
        <div class="row">
          <span class="hint">音量</span>
          <div class="meter"><div id="meter"></div></div>
        </div>
        <div class="row hidden" id="deviceRow">
          <input type="text" id="deviceId" placeholder="虛擬音訊線 ID (留空=預設)">
        </div>
      </div>
    </section>

    <!-- 手動字幕 -->
    <section class="menu-sec" id="captionPanel">
      <h2 class="menu-sec__head">手動字幕 (caption)</h2>
      <div class="menu-sec__body">
        <div class="row">
          <input type="text" id="captionInput" placeholder="直接貼上發言文字…">
          <button class="btn" id="sendCaption">送出</button>
        </div>
      </div>
    </section>

    <!-- 字幕顯示 -->
    <section class="menu-sec">
      <h2 class="menu-sec__head">字幕顯示</h2>
      <div class="menu-sec__body">
        <div class="row range-row">
          <label>字級 <input type="range" id="fontSize" min="14" max="48" value="28"></label>
        </div>
        <div class="row">
          <label class="chk"><input type="checkbox" id="orderSrcFirst"> 原文在上</label>
          <label class="chk"><input type="checkbox" id="bgToggle" checked> 背景可讀</label>
          <label class="chk"><input type="checkbox" id="wordToggle" checked> 逐字</label>
          <label class="chk"><input type="checkbox" id="showToggle" checked> 顯示</label>
          <label>字幕列 <select id="capSlots" title="同一個視窗內保留幾列字幕 (2=A1/A2, 3=加 A3)"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></label>
        </div>
        <div class="row">
          <label>從 <select id="from"><option value="auto" selected>自動</option><option value="zh-TW">繁中</option><option value="en">英文</option></select></label>
          <label>到 <select id="to"><option value="auto">自動</option><option value="en">英文</option><option value="zh-TW" selected>繁中</option></select></label>
          <button class="btn btn-fixed" id="swapBtn" aria-label="交換原文與翻譯方向" title="交換原文與翻譯方向">⇄</button>
        </div>
      </div>
    </section>

    <!-- 定位 -->
    <section class="menu-sec">
      <h2 class="menu-sec__head">字幕位置 (拖曳或點選)</h2>
      <div class="menu-sec__body">
        <div class="pos-grid">
          <button class="icon-btn" data-pos="top" title="置頂">⬆</button>
          <button class="icon-btn" data-pos="center" title="置中">⬌</button>
          <button class="icon-btn active" data-pos="bottom" title="置底">⬇</button>
        </div>
        <div class="pos-grid">
          <button class="icon-btn" data-align="left" title="靠左">⤙</button>
          <button class="icon-btn" data-align="center" title="置中">⤞</button>
          <button class="icon-btn" data-align="right" title="靠右">⤧</button>
        </div>
      </div>
    </section>

    <!-- 狀態 / 錯誤 / 日誌 -->
    <section class="menu-sec menu-sec--status">
      <div class="status"><span class="dot bad" id="connDot"></span><span id="conn">未連線</span><span class="badge" id="roleBadge">—</span><span class="badge live hidden" id="roomBadge"></span></div>
      <div id="errbar" class="hidden"></div>
      <div class="log" id="log"></div>
    </section>
  </div>

  <!-- 四角功能圖示: 字幕區唯讀, 拖曳由下方 #gripHandle 承載 -->
  <button class="corner-btn danger" data-pos="tl" id="btnMic" title="開始/停止收音" aria-label="開始或停止收音">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/><path d="M8 22h8"/></svg>
  </button>
  <button class="corner-btn" data-pos="tr" id="btnSheet" title="設定面板" aria-label="開啟設定面板">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.31.4.55.72.68H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
  <button class="corner-btn" data-pos="bl" id="btnFloat" title="開啟獨立字幕小窗 (跨頁面蓋在 Zoom/YouTube 上)" aria-label="開啟獨立字幕小窗">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="14" height="12" rx="2"/><path d="M16 20h4a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-4z"/></svg>
  </button>
  <button class="corner-btn" data-pos="br" id="btnLink" title="分享連結 / QR Code" aria-label="分享連結或 QR Code">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
  </button>
  <div id="gripHandle" title="拖曳移動字幕"></div>
  </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const connEl=$('conn'),connDot=$('connDot'),logEl=$('log'),errbar=$('errbar');
const srcSel=$('audioSource'),deviceRow=$('deviceRow');
const fromSel=$('from'),toSel=$('to'),fontSize=$('fontSize');
const orderChk=$('orderSrcFirst'),bgChk=$('bgToggle'),showChk=$('showToggle'),wordChk=$('wordToggle');
const capSlotSel=$('capSlots');
const subsEl=$('subtitles'),captionInput=$('captionInput');

// 主題切換 (按鈕若不存在則略過, 避免 null 崩潰)
const themeBtn=document.getElementById('btnTheme');
if(themeBtn) themeBtn.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';};
srcSel.onchange=()=>{deviceRow.classList.toggle('hidden',srcSel.value!=='device');};

function log(m){const t=new Date().toLocaleTimeString();logEl.textContent=(t+' '+m+'\n')+logEl.textContent;}
function showErr(m){errbar.textContent='注意 '+m;errbar.classList.remove('hidden');}
function hideErr(){errbar.classList.add('hidden');}

// ── 房間 / 角色解析 ──
const ROOM=new URLSearchParams(location.search).get('room')||'';
const ROLE=new URLSearchParams(location.search).get('role')||(ROOM?'viewer':'caster');
const PWD=new URLSearchParams(location.search).get('pwd')||'';
const isCaster = ROLE!=='viewer';
$('roleBadge').textContent = isCaster?'角色: 主持人':'角色: 觀眾';
if(ROOM){$('roomBadge').classList.remove('hidden');$('roomBadge').textContent='房間 '+ROOM;}
if(!isCaster){
  $('sharePanel').classList.add('hidden');
  $('casterPanel').classList.add('hidden');
  $('captionPanel').classList.add('hidden');
  // 觀眾不需要建立面板; 但仍可開課程
  pollViewers();
}

// ── SSE 訂閱 (播放器核心) ──
let es=null;
function connectSSE(){
  if(es){ es.close(); es=null; }
  const room=new URLSearchParams(location.search).get('room')||'';
  const pwd=new URLSearchParams(location.search).get('pwd')||'';
  es=new EventSource('/stream?room='+encodeURIComponent(room)+(pwd?'&pwd='+encodeURIComponent(pwd):''));
  es.addEventListener('hello',e=>{connEl.textContent='SSE 已連線';connDot.className='dot';log('SSE hello: '+(e.data||''));});
  es.addEventListener('subtitle',ev=>{
    try{const p=JSON.parse(ev.data);const d=p.data;if(!d)return;
      renderSub(d.source,d.target,d.from+'→'+d.to+' · '+d.engine+' · #'+d.id,d.speaker,d.id,d.ts,d.words);}catch(e){}
  });
  es.onopen=()=>{connEl.textContent='SSE 已連線';connDot.className='dot';hideErr();};
  es.onerror=()=>{connEl.textContent='SSE 重連中…';connDot.className='dot bad';
    fetch('/stream?room='+encodeURIComponent(room)+(pwd?'&pwd='+encodeURIComponent(pwd):''),{method:'GET'}).then(r=>{
      if(r.status===401 && !isCaster) promptRoomPassword(room);
    }).catch(()=>{});
    showErr('SSE 連線中斷，正在自動重連');setTimeout(connectSSE,3000);};
}
function promptRoomPassword(room){
  const input=prompt('此房間需要密碼：');
  if(!input)return;
  crypto.subtle.digest('SHA-256',new TextEncoder().encode(input)).then(async h=>{
    const hex=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
    history.replaceState(null,'',location.pathname+'?room='+encodeURIComponent(room)+'&pwd='+hex);
    location.reload();
  });
}
// ── 固定視窗滾動字幕 ──────────────────────────────────────────────
// 需求原文: 「字幕在同一個視窗中由左向右的一直替換」+「畫面不會一直往下增長」。
// 舊版問題: 每句 append 一個 .sub-group, 只靠 while(children.length>8) 收尾 →
//            最多 8 組 × 3 列 = 24 列, 畫面一路往下長, 使用者要一直往下捲。
// 新版做法: 字幕列數由 CaptionWindow 固定 (預設 2 = A1/A2), 新句進 A1、舊句位移
//            到 A2, 多餘的直接丟棄 → 高度恆定, 永遠同一個視窗。
//            列數可在執行時調整 (需求: 視文字處理速度看要不要增加 A3)。
// 純邏輯放在 lib/caption-window.mjs, 與 node --test 共用同一份檔案。
let capWin=null;
let capWinBuf=[]; // 模組載入前的字幕先暫存, 載好後依序重播
async function initCaptionWindow(){
  const mod=await import('/lib/caption-window.mjs');
  capWin=new mod.CaptionWindow({slotCount:Number(capSlotSel&&capSlotSel.value)||2});
  renderRows(); // 列數可能大於 1, 預先鋪好槽位
  const pending=capWinBuf; capWinBuf=[];
  for(const p of pending) renderSub(p[0],p[1],p[2],p[3],p[4],p[5],p[6]);
}
let activeGroup=null;
function renderSub(src,tgt,meta,speaker,id,ts,words){
  const now=ts||Date.now();
  const ph=subsEl.querySelector('.placeholder'); if(ph)ph.remove();
  // 逐字模式下 DOM 內是 .w span, textContent 只得已顯現的部分;
  // 合併時必須用 data-full 取完整文字, 否則會截斷。
  const full=(e)=>e.dataset.full!=null?e.dataset.full:e.textContent;
  if(!capWin){ // 模組尚未載入 (極短暫) → 先累積, 載好後重播
    capWinBuf.push([src,tgt,meta,speaker,id,ts,words]); return;
  }
  const res=capWin.push({id,source:src||'',target:tgt||'',meta,speaker,ts:now,words},now);
  const cur=res.rows[0];
  // merge: 文字併入作用中那一列 → 由左向右延伸
  if(res.merged && activeGroup){
    const a=activeGroup.querySelector('.sub-line.src, .sub-line.tgt');
    const b=activeGroup.children[1];
    const curEl = orderChk.checked ? {srcEl:a,tgtEl:b} : {srcEl:b,tgtEl:a};
    curEl.srcEl.textContent=full(curEl.srcEl); curEl.srcEl.dataset.full=full(curEl.srcEl);
    curEl.tgtEl.textContent=full(curEl.tgtEl); curEl.tgtEl.dataset.full=full(curEl.tgtEl);
    // 逐字重播 (僅作用中列)
    if(wordChk && wordChk.checked && Array.isArray(words) && words.length>1)
      playWords(orderChk.checked?curEl.srcEl:curEl.tgtEl, words);
    return;
  }
  renderRows();
  const wrap=subsEl.querySelector('.sub-group');
  if(!wrap) return;
  activeGroup=wrap;
  // 逐字: 原文有逐字時間戳且逐字模式開啟時以單字 span 漸進顯現。
  // 譯文是整段一次翻譯、無對應時間戳, 維持整行 —— 刻意取捨。
  if(wordChk && wordChk.checked && Array.isArray(words) && words.length>1){
    const a=wrap.querySelector('.sub-line.src, .sub-line.tgt');
    const b=wrap.children[1];
    const wEl = orderChk.checked ? a : b;
    playWords(wEl, words);
  }
}
// 依 capWin 目前的列數重畫整個視窗 (固定槽位, 不 append)。
function renderRows(){
  if(!capWin) return;
  const rows=capWin.rows();
  subsEl.textContent='';
  rows.forEach((r,i)=>{
    const wrap=document.createElement('div');
    wrap.className='sub-group'+(i===0?' active':' finalized');
    const a=document.createElement('div');a.className='sub-line '+(orderChk.checked?'src':'tgt');
    const b=document.createElement('div');b.className='sub-line '+(orderChk.checked?'tgt':'src');
    a.dataset.full=orderChk.checked?(r.source||''):(r.target||'');
    b.dataset.full=orderChk.checked?(r.target||''):(r.source||'');
    a.textContent=a.dataset.full; b.textContent=b.dataset.full;
    const m=document.createElement('div');m.className='sub-line meta';
    m.textContent=(r.meta||'')+(r.speaker?(' · 說話者 '+r.speaker):'');
    wrap.appendChild(a);wrap.appendChild(b);wrap.appendChild(m);
    subsEl.appendChild(wrap);
  });
  activeGroup=subsEl.querySelector('.sub-group');
}

/* 逐字顯現: 依 whisper 單字時間戳, 累積相鄰單字的時間差後逐字淡入。 */
function playWords(el, words){
  const full=el.dataset.full||'';
  el.textContent='';
  const spans=words.map((w,i)=>{
    const sp=document.createElement('span');
    sp.className='w'; sp.textContent=w.text;
    el.appendChild(sp);
    if(i<words.length-1) el.appendChild(document.createTextNode(' '));
    return sp;
  });
  let t=0, lastEnd=Number(words[0].start)||0;
  words.forEach((w,i)=>{
    const e=Number(w.end)||lastEnd;
    const gap=i===0?0:(e-lastEnd);
    t+=Math.min(400,Math.max(40,gap*1000));
    lastEnd=e;
    if(t<=0) spans[i].classList.add('on');
    else setTimeout(()=>spans[i].classList.add('on'), t);
  });
  setTimeout(()=>{
    if(el.textContent.replace(/\s/g,'').length < full.replace(/\s/g,'').length) el.textContent=full;
  }, t+600);
}

let sheetOpener=null;
const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
/* 依觸發鈕所在角, 把面板擺進視窗內。
   角鈕是 position:fixed 於四角, 面板原本錨在字幕區 (兩者脫鉤), 往上長就會穿出
   上緣被裁。這裡改成以觸發鈕為錨: 下半視窗 → 往上長, 上半視窗 → 往下長,
   橫向以「靠哪側」對齊並夾在視窗內, 四個角落按鈕都能完整呈現面板。 */
// 四角鈕的邊距: 依「介面本體」實際可用範圍 + safe-area 設定 --edge-* 變數。
// 這讓鈕與 placeSheet()/sharePlace() 共用同一套本體座標系 —— 兩者各自寫死常數時,
// 視窗上緣的鈕 (top:14px) 會讓面板被算出畫面外。safe-area 內縮讓四角鈕不會被
// 瀏海/圓角螢幕遮住, 與原 calc(14px + env(safe-area-inset-*)) 等價但集中管理。
function placeCorners(){
  // safe-area 實測值: 用一個隱藏探針元素讀 env() (getComputedStyle 無法直接讀 env)。
  // 桌面瀏覽器 env() 皆為 0px, 探針因此回 0, pad 為主; 行動裝置則自動內縮。
  const probe=document.getElementById('saProbe')||(()=>{
    const p=document.createElement('div'); p.id='saProbe';
    p.style.cssText='position:fixed;visibility:hidden;pointer-events:none;'+
      'top:env(safe-area-inset-top);right:env(safe-area-inset-right);'+
      'bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);';
    document.body.appendChild(p); return p;
  })();
  const cs=getComputedStyle(probe);
  const inset=k=>parseFloat(cs.getPropertyValue(k))||0;
  const vw=document.documentElement.clientWidth, vh=document.documentElement.clientHeight;
  // 面板彈出需要空間: 讓鈕離邊至少 14px, 並隨本體尺寸微調 (不超過 20px, 免得遮住字幕主體)
  const pad=Math.max(14, Math.min(20, Math.round(Math.min(vw,vh)*0.022)));
  const r=document.documentElement.style;
  r.setProperty('--edge-top',    (pad+inset('top'))+'px');
  r.setProperty('--edge-bottom', (pad+inset('bottom'))+'px');
  r.setProperty('--edge-left',   (pad+inset('left'))+'px');
  r.setProperty('--edge-right',  (pad+inset('right'))+'px');
}

function placeSheet(anchor){
  const GAP=10, EDGE=12;
  const a=anchor.getBoundingClientRect();
  const vw=document.documentElement.clientWidth, vh=document.documentElement.clientHeight;
  const w=Math.min(vw*0.92,360);
  const below=a.bottom+GAP, above=a.top-GAP;
  // 先假設往上長; 若上方放不下而下方有空間, 改為往下長 (面板永遠留在畫面上)。
  let top=above;
  const belowRoom=vh-below, aboveRoom=above;
  if(aboveRoom<Math.min(sheetEl.scrollHeight||320,vh*0.5) && belowRoom>aboveRoom) top=below;
  top=Math.max(EDGE,Math.min(top,vh-EDGE-40));
  let left;
  // 鈕在右半 → 面板右緣對齊鈕右緣; 在左半 → 左緣對齊鈕左緣。夾在視窗內避免左右溢出。
  if(a.left+a.width/2>vw/2) left=a.right-w; else left=a.left;
  left=Math.max(EDGE,Math.min(left,vw-w-EDGE));
  sheetEl.style.setProperty('--sheet-top',top+'px');
  sheetEl.style.setProperty('--sheet-left',left+'px');
  sheetEl.style.setProperty('--sheet-vpad',Math.round(a.height+EDGE)+'px');
}
const setSheet=(open,anchor)=>{
  sheetEl.classList.toggle('open',open);

  sheetBtn.setAttribute('aria-expanded',open?'true':'false');
  sheetBtn.setAttribute('aria-label',open?'關閉設定面板':'開啟設定面板');
  if(open){
    sheetOpener=document.activeElement;
    // 以觸發鈕為錨擺位: 右上鈕 → 面板往下長留在畫面內, 右下鈕 → 往上長。
    // 用 activeElement 兜底 (鍵盤觸發時沒有事件目標)。
    placeSheet(anchor||sheetOpener||sheetBtn);
    // 焦點落在標題, 而非第一個輸入框 —— 使用者多半是要「看」選單而非立刻填值。
    (sheetEl.querySelector('.sheet__head b')||sheetEl).setAttribute('tabindex','-1');
    (sheetEl.querySelector('.sheet__head b')||sheetEl).focus({preventScroll:true});
  }else if(sheetOpener&&sheetOpener.focus){
    sheetOpener.focus({preventScroll:true}); sheetOpener=null;
  }
};

// 拖曳定位 (原生 pointer events)
// 把手在字幕下方的細玻璃條 (#gripHandle): 字幕區唯讀, 只能接收/顯示, 不攔截底層影片點擊。
// 把手與字幕在 #grip 內垂直相接, 故拖把手時字幕跟著走, 兩者維持一體。
(function enableDrag(){
  const el=$('gripHandle'); const cap=subsEl;
  // 四角鈕是 position:fixed 在視窗角落, 字幕+把手卻由 stage 佈局 ——
  // 只搬字幕+把手會讓圖示原地不動。使用者要「整個本體可拖移」, 故把四角鈕
  // 一併納入同一組位移, 否則拖完介面就分裂了。
  const corners=[...document.querySelectorAll('.corner-btn')];
  let dragging=false,sx,sy,ox,oy,cw,capH;
  let base=null; // 四角鈕相對視窗的原始位移量 (鈕是 fixed, 記錄其 left/top 供還原)
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('button,input,select,textarea,a,.sheet'))return; // 控制項自己點擊不觸發拖曳
    dragging=true; el.classList.add('dragging'); sx=e.clientX; sy=e.clientY;
    const r=el.getBoundingClientRect(); ox=r.left; oy=r.top; cw=r.width;
    // 字幕自身高度 (非把手高度) — 否則字幕與把手之間會裂開一道縫
    capH=cap.getBoundingClientRect().height;
    // 記下四角鈕當下的 fixed 偏移, 拖曳時一併套用, 鬆手後還原。
    base=corners.map(b=>{ const br=b.getBoundingClientRect(); return {el:b,x:br.left,y:br.top}; });
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove',e=>{ if(!dragging)return;
    const nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    // 整組 (字幕+控制條) 一起搬: 兩者都脫離舞台, 用同一組座標疊放
    el.style.position='fixed'; el.style.left=nx+'px'; el.style.top=ny+'px'; el.style.width=cw+'px';
    cap.style.position='fixed'; cap.style.left=nx+'px'; cap.style.top=(ny-capH)+'px';
    cap.style.right='auto'; cap.style.bottom='auto'; cap.style.width=cw+'px'; cap.style.margin='0';
    // 四角鈕跟著平移相同位移量 → 整個介面本體維持一體
    if(base){ const dx=e.clientX-sx, dy=e.clientY-sy;
      for(const b of base){ b.el.style.left=(b.x+dx)+'px'; b.el.style.top=(b.y+dy)+'px'; b.el.style.right='auto'; b.el.style.bottom='auto'; }
    }
  });
  el.addEventListener('pointerup',e=>{ if(!dragging)return; dragging=false; el.classList.remove('dragging');
    el.releasePointerCapture(e.pointerId);
    // 鬆手後交還九宮格控制: 兩者恢復由 stage 佈局, 避免殘留 fixed 偏移
    el.style.position=''; el.style.left=''; el.style.top=''; el.style.width='';
    cap.style.position=''; cap.style.left=''; cap.style.top=''; cap.style.right=''; cap.style.bottom=''; cap.style.width=''; cap.style.margin='';
    if(base){ for(const b of base){ b.el.style.left=''; b.el.style.top=''; b.el.style.right=''; b.el.style.bottom=''; } base=null; }
  });
})();

  try{ new QRCode(box,{text:url,width:118,height:118,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ box.textContent=url; }
}

// ── 音訊擷取 (主持人) ──
let mediaStream=null,audioCtx=null,recorder=null,analyser=null,meterRAF=null,silenceTimer=null,peakSinceStart=0,gotAudio=false;
function updateMeter(){
  if(!analyser)return;
  const buf=new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(buf);
  let peak=0; for(const v of buf){const x=Math.abs(v-128)/128; if(x>peak)peak=x;}
  const pct=Math.min(100,Math.round(peak*180));
  const m=$('meter'); if(m){ m.style.width=pct+'%'; m.style.background=pct>4?'#28c76f':'#666'; }
  if(pct>4){ gotAudio=true; peakSinceStart=Math.max(peakSinceStart,pct); if(errbar.classList.contains('hidden')===false && errbar.textContent.includes('沒有偵測到聲音')) hideErr(); }
  meterRAF=requestAnimationFrame(updateMeter);
}
function armSilenceWatchdog(){
  clearTimeout(silenceTimer);
  silenceTimer=setTimeout(()=>{
    if(!gotAudio){
      showErr('注意 開始收音後 4 秒內沒有偵測到聲音：字幕會是空白。請檢查 — (1) Zoom 分享時是否勾選「分享這台電腦的聲音」；(2) 瀏覽器麥克風/標籤權限；(3) 改用「本機麥克風」來源再試。有聲音進來此訊息會自動消失。');
    }
  },4000);
}
$('startBtn').onclick=async()=>{
  hideErr();if(!isCaster)return;
  const src=srcSel.value;
  if(src==='caption'){log('caption 模式：直接於下方貼文字送出');return;}
  try{
    let stream;
    if(src==='system-display'){
      stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
      if(!stream.getAudioTracks().length){showErr('未取得系統音訊：Zoom 請用「分享」→ 勾選「分享這台電腦的聲音」；或改用本機麥克風。');}
    }else if(src==='device'){
      const dev=$('deviceId').value.trim();
      stream=await navigator.mediaDevices.getUserMedia({audio:dev?{deviceId:{exact:dev}}:{}});
    }else{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
    mediaStream=stream;
    audioCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
    const srcNode=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser(); analyser.fftSize=1024; srcNode.connect(analyser);
    const proc=audioCtx.createScriptProcessor(4096,1,1);
    proc.onaudioprocess=e=>{sendChunk(e.inputBuffer.getChannelData(0));};
    srcNode.connect(proc);
    const sink=audioCtx.createGain(); sink.gain.value=0; proc.connect(sink); sink.connect(audioCtx.destination);
    recorder=proc; gotAudio=false; peakSinceStart=0; updateMeter(); armSilenceWatchdog();
    captureBuf=null; sttInflight=false; debugBuf=null;
    flushTimer=setInterval(flushWindow, 6000);
    $('dlAudioBtn').disabled=false;
    $('startBtn').disabled=true;$('stopBtn').disabled=false;
    connEl.textContent='收音中 ('+src+')';connDot.className='dot';log('開始收音: '+src+' — 每 6 秒送出一段 (音量閘門 rms≥'+VAD_RMS_GATE+', 語者分段 '+(wantVad?'開':'關')+')');
  }catch(e){showErr('無法取得音訊: '+e.message);log('收音失敗: '+e.message);}
};
$('stopBtn').onclick=()=>{if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}if(audioCtx){audioCtx.close();audioCtx=null;}if(meterRAF)cancelAnimationFrame(meterRAF);if(flushTimer){clearInterval(flushTimer);flushTimer=null;}analyser=null;recorder=null;captureBuf=null;gotAudio=false;skipCount=0;$('startBtn').disabled=false;$('stopBtn').disabled=true;$('dlAudioBtn').disabled=true;connEl.textContent='已停止';connDot.className='dot bad';log('停止收音');};
// 麥克風圖示快捷開關
$('btnMic').onclick=()=>{ if($('startBtn').disabled){ $('stopBtn').click(); $('btnMic').classList.remove('active'); } else { $('startBtn').click(); $('btnMic').classList.add('active'); } };
$('dlAudioBtn').onclick=()=>{ if(!debugBuf||debugBuf.length<SR*0.5){showErr('還沒有累積到音訊, 請先收音幾秒');return;} const pcm=encodeFloatTo16(debugBuf); const wav=encodeWav(pcm,16000); const blob=new Blob([wav],{type:'audio/wav'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='omnilive-captured-'+Date.now()+'.wav'; a.click(); log('已下載擷取音訊 ('+(debugBuf.length/SR).toFixed(1)+'s)'); };

let captureBuf=null;
let debugBuf=null;
let sttInflight=false;
let flushTimer=null;
let skipCount=0;
// 音量閘門 (RMS)。0.015 對齊 lib/stt.mjs vadSegments 的 threshold 常量。
// 低於此值視為無語音 → 不送 STT。低於 0.005 基本等同數位靜音。
const VAD_RMS_GATE=0.015;
// 語者分段 (vad=1)。預設關: 開啟時能量偵測會覆蓋 whisper 真實 segments。
// 僅在需要 A/B 輪替標記且收音品質穩定時才勾選。
let wantVad=false;
const SR=16000, WINDOW_MS=6000, OVERLAP_MS=2000, MAX_KEEP_MS=WINDOW_MS+OVERLAP_MS;
const WINDOW_SAMPLES=Math.floor(SR*WINDOW_MS/1000);
const KEEP_SAMPLES=Math.floor(SR*MAX_KEEP_MS/1000);
function sendChunk(float32){
  if(!captureBuf){ captureBuf=new Float32Array(0); }
  if(!debugBuf){ debugBuf=new Float32Array(0); }
  const dm=new Float32Array(debugBuf.length+float32.length); dm.set(debugBuf,0); dm.set(float32,debugBuf.length); debugBuf=dm;
  const merged=new Float32Array(captureBuf.length+float32.length);
  merged.set(captureBuf,0); merged.set(float32,captureBuf.length); captureBuf=merged;
  if(captureBuf.length>KEEP_SAMPLES){ captureBuf=captureBuf.subarray(captureBuf.length-KEEP_SAMPLES); }
}
function rmsOf(f32){
  if(!f32 || !f32.length) return 0;
  let sum=0; for(let i=0;i<f32.length;i++){ const s=f32[i]; sum+=s*s; }
  return Math.sqrt(sum/f32.length);
}
function flushWindow(){
  if(sttInflight || !captureBuf || captureBuf.length < SR*1.0) return;
  const samples=captureBuf.subarray(Math.max(0,captureBuf.length-WINDOW_SAMPLES));
  // 音量閘門: 近乎靜音的視窗不送STT。避免 whisper 對無語音回空字串、
  // 浪費每次 30s CPU 推論, 並讓 server.mjs 記錄 "STT returned empty" 噪音。
  const rms=rmsOf(samples);
  if(rms < VAD_RMS_GATE){ skipCount++; log('略過靜音視窗 (rms='+rms.toFixed(4)+' < '+VAD_RMS_GATE+') — 連續 '+skipCount+' 次'); return; }
  if(skipCount){ log('偵測到聲音, 已恢復送字幕 (略過 '+skipCount+' 個靜音視窗)'); skipCount=0; }
  const pcm=encodeFloatTo16(samples);
  const wav=encodeWav(pcm, 16000);
  const room=new URLSearchParams(location.search).get('room')||'';
  const lang=fromSel.value||'';
  // auto 模式不送 lang 給 whisper (避免 auto→500 歷史問題); 讓 whisper 自行偵測
  // vad=1 僅在明確需要語者分段時才送: 它會用能量偵測的啞元組覆蓋 whisper
  // 真實 segments (見 lib/stt.mjs vadSegments fallback), 近靜音時反而抹掉有效結果。
  const url='/api/transcribe?room='+encodeURIComponent(room)+(wantVad?'&vad=1':'')+(lang && lang!=='auto'?'&lang='+encodeURIComponent(lang):'');
  sttInflight=true;
  const release=()=>{ sttInflight=false; };
  const to=setTimeout(release, 45000);
  fetch(url,{method:'POST',headers:{'content-type':'audio/wav'},body:wav})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{ if(d.source)log('辨識: '+d.source.slice(0,40)); })
    .catch(()=>{})
    .finally(()=>{ clearTimeout(to); release(); });
}
function encodeWav(pcm, sampleRate){
  const ab=new ArrayBuffer(44+pcm.length);
  const dv=new DataView(ab);
  const ws=(off,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(off+i,s.charCodeAt(i));};
  ws(0,'RIFF'); dv.setUint32(4,36+pcm.length,true); ws(8,'WAVE');
  ws(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true);
  dv.setUint16(22,1,true); dv.setUint32(24,sampleRate,true); dv.setUint32(28,sampleRate*2,true);
  dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  ws(36,'data'); dv.setUint32(40,pcm.length,true);
  new Uint8Array(ab,44).set(pcm);
  return ab;
}
function encodeFloatTo16(f){const u=new Uint8Array(f.length*2);const dv=new DataView(u.buffer);for(let i=0;i<f.length;i++){dv.setInt16(i*2,Math.max(-1,Math.min(1,f[i]))*0x7fff,true);}return u;}

// ── 手動字幕送出 ──
$('sendCaption').onclick=async()=>{
  const text=captionInput.value.trim();if(!text){showErr('請先輸入文字');return;}
  const room=new URLSearchParams(location.search).get('room')||'';
  try{
    const r=await fetch('/api/speak',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,room,from:fromSel.value,to:toSel.value})});
    const d=await r.json();
    if(d.source)renderSub(d.source,d.target,(fromSel.value)+'→'+(toSel.value)+' · '+d.engine+' · #'+d.id);
    captionInput.value='';log('手動字幕送出: '+text.slice(0,30));
  }catch(e){showErr('送出失敗: '+e.message);}
};

// ── 課程即時解說: 輪詢 /api/course ──
let courseTimer=null, courseAcc='';
// 課程解說累加器: 必須讀「完整逐句紀錄」而不是畫面 DOM。
// 畫面已改為固定視窗 (只留 slotCount 列), 若直接讀 subsEl.textContent
// 會只剩 1~2 句 → 累加器會把舊句截斷。改讀 CaptionWindow.transcript()。
function courseText(){ return capWin ? capWin.transcript() : subsEl.textContent.trim(); }
async function fetchCourse(){
  const room=new URLSearchParams(location.search).get('room')||'';
  try{
    const r=await fetch('/api/course',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({room,text:courseAcc.slice(-6000)})});
    if(!r.ok)return;
    const d=await r.json();
    if(!d.summary && !d.keypoints.length) return;
    $('cSummary').textContent=d.summary||'—';
    $('cKeypoints').innerHTML=(d.keypoints||[]).map(k=>'<div class="ckp">'+escapeHtml(k)+'</div>').join('');
    $('cTerms').innerHTML=(d.terms||[]).map(t=>'<div class="term"><b>'+escapeHtml(t.term||'')+'</b> ('+escapeHtml(t.en||'')+')<br>'+escapeHtml(t.explain||'')+'<br><a href="'+(t.wiki||'#')+'" target="_blank" rel="noopener">分享 維基百科</a></div>').join('');
    $('cCases').innerHTML=(d.similar_cases||[]).map(c=>'<div class="case">'+escapeHtml(c)+'</div>').join('');
    $('cUpdated').textContent='更新: '+new Date().toLocaleTimeString();
  }catch(e){}
}
function startCoursePolling(){ if(courseTimer)return; courseTimer=setInterval(()=>{ courseAcc=courseText()+'\n'+courseAcc; fetchCourse(); }, 45000); fetchCourse(); }
function stopCoursePolling(){ if(courseTimer){clearInterval(courseTimer);courseTimer=null;} }
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// 初始錨定四角: 必須在 layout 就緒後跑一次, 否則 --edge-* 未設定,
// 四角鈕會停在 CSS fallback 14px (與面板座標系又不一致)。
placeCorners();
if(document.readyState==='loading') addEventListener('DOMContentLoaded',placeCorners);
</script>
