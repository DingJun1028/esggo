<script>
const $ = id => document.getElementById(id);
const connEl=$('conn'),connDot=$('connDot'),logEl=$('log'),errbar=$('errbar');
const srcSel=$('audioSource'),deviceRow=$('deviceRow');
const fromSel=$('from'),toSel=$('to'),fontSize=$('fontSize');
const orderChk=$('orderSrcFirst'),bgChk=$('bgToggle'),showChk=$('showToggle'),wordChk=$('wordToggle');
const subsEl=$('subtitles'),captionInput=$('captionInput');

// 主??? (????存在?略?? ?? null 崩潰)
const themeBtn=document.getElementById('btnTheme');
if(themeBtn) themeBtn.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';};
srcSel.onchange=()=>{deviceRow.style.display=srcSel.value==='device'?'flex':'none';};

function log(m){const t=new Date().toLocaleTimeString();logEl.textContent=(t+' '+m+'\n')+logEl.textContent;}
function showErr(m){errbar.textContent='注? '+m;errbar.classList.remove('hidden');}
function hideErr(){errbar.classList.add('hidden');}

// ?? ж / ?? ??
const ROOM=new URLSearchParams(location.search).get('room')||'';
const ROLE=new URLSearchParams(location.search).get('role')||(ROOM?'viewer':'caster');
const PWD=new URLSearchParams(location.search).get('pwd')||'';
const isCaster = ROLE!=='viewer';
$('roleBadge').textContent = isCaster?': 主?H:': 觀??;
if(ROOM){$('roomBadge').classList.remove('hidden');$('roomBadge').textContent='ж '+ROOM;}
if(!isCaster){
  $('sharePanel').classList.add('hidden');
  $('casterPanel').classList.add('hidden');
  $('captionInput').closest('div').classList.add('hidden');
  // 觀???要建立面?? 但???課?
  pollViewers();
}

// ?? SSE 訂閱 (?放?核? ??
let es=null;
function connectSSE(){
  if(es){ es.close(); es=null; }
  const room=new URLSearchParams(location.search).get('room')||'';
  const pwd=new URLSearchParams(location.search).get('pwd')||'';
  es=new EventSource('/stream?room='+encodeURIComponent(room)+(pwd?'&pwd='+encodeURIComponent(pwd):''));
  es.addEventListener('hello',e=>{connEl.textContent='SSE 已??';connDot.className='dot';log('SSE hello: '+(e.data||''));});
  es.addEventListener('subtitle',ev=>{
    try{const p=JSON.parse(ev.data);const d=p.data;if(!d)return;
      renderSub(d.source,d.target,d.from+'??+d.to+' · '+d.engine+' · #'+d.id,d.speaker,d.id,d.ts,d.words);}catch(e){}
  });
  es.onopen=()=>{connEl.textContent='SSE 已??';connDot.className='dot';hideErr();};
  es.onerror=()=>{connEl.textContent='SSE ????;connDot.className='dot bad';
    fetch('/stream?room='+encodeURIComponent(room)+(pwd?'&pwd='+encodeURIComponent(pwd):''),{method:'GET'}).then(r=>{
      if(r.status===401 && !isCaster) promptRoomPassword(room);
    }).catch(()=>{});
    showErr('SSE ???中斷，正?自????);setTimeout(connectSSE,3000);};
}
function promptRoomPassword(room){
  const input=prompt('此房??要?碼?');
  if(!input)return;
  crypto.subtle.digest('SHA-256',new TextEncoder().encode(input)).then(async h=>{
    const hex=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
    history.replaceState(null,'',location.pathname+'?room='+encodeURIComponent(room)+'&pwd='+hex);
    location.reload();
  });
}
let activeGroup=null;
let lastSubTs=0;
function renderSub(src,tgt,meta,speaker,id,ts,words){
  const now=ts||Date.now();
  const merge = activeGroup && (now-lastSubTs) < 2500;
  lastSubTs=now;
  // ??模??DOM ?是 .w span, textContent ??已顯????;
  // ?併???用 data-full ????? ???截??  const full=(e)=>e.dataset.full!=null?e.dataset.full:e.textContent;
  if(merge){
    const a=activeGroup.querySelector('.sub-line.src, .sub-line.tgt');
    const b=activeGroup.children[1];
    const cur = orderChk.checked ? {srcEl:a,tgtEl:b} : {srcEl:b,tgtEl:a};
    const newSrc=(full(cur.srcEl)+' '+(src||'')).trim();
    const newTgt=(full(cur.tgtEl)+' '+(tgt||'')).trim();
    cur.srcEl.textContent=newSrc; cur.srcEl.dataset.full=newSrc;
    cur.tgtEl.textContent=newTgt; cur.tgtEl.dataset.full=newTgt;
    return;
  }
  if(activeGroup) activeGroup.classList.add('finalized');
  const wrap=document.createElement('div');wrap.className='sub-group active';
  const a=document.createElement('div');a.className='sub-line '+(orderChk.checked?'src':'tgt');
  const b=document.createElement('div');b.className='sub-line '+(orderChk.checked?'tgt':'src');
  a.dataset.full=orderChk.checked?(src||''):(tgt||'');

function playWords(el, words){
  const full=el.dataset.full||'';
  el.textContent='';
  const spans=words.map((w,i)=>{
    const sp=document.createElement('span');
    sp.className='w'; sp.textContent=w.text;
    el.appendChild(sp);
    if(i<words.length-1) el.appendChild(document.createTextNode(' '));
    return sp;
  });
  let t=0, lastEnd=Number(words[0].start)||0;
  words.forEach((w,i)=>{
    const e=Number(w.end)||lastEnd;
    const gap=i===0?0:(e-lastEnd);
    t+=Math.min(400,Math.max(40,gap*1000));
    lastEnd=e;
    if(t<=0) spans[i].classList.add('on');
    else setTimeout(()=>spans[i].classList.add('on'), t);
  });
  setTimeout(()=>{
    if(el.textContent.replace(/\s/g,'').length < full.replace(/\s/g,'').length) el.textContent=full;
  }, t+600);
}

let captureBuf=null;
let debugBuf=null;
let sttInflight=false;
let flushTimer=null;
const SR=16000, WINDOW_MS=6000, OVERLAP_MS=2000, MAX_KEEP_MS=WINDOW_MS+OVERLAP_MS;
const WINDOW_SAMPLES=Math.floor(SR*WINDOW_MS/1000);
const KEEP_SAMPLES=Math.floor(SR*MAX_KEEP_MS/1000);
function sendChunk(float32){
  if(!captureBuf){ captureBuf=new Float32Array(0); }
  if(!debugBuf){ debugBuf=new Float32Array(0); }
  const dm=new Float32Array(debugBuf.length+float32.length); dm.set(debugBuf,0); dm.set(float32,debugBuf.length); debugBuf=dm;
  const merged=new Float32Array(captureBuf.length+float32.length);
  merged.set(captureBuf,0); merged.set(float32,captureBuf.length); captureBuf=merged;
  if(captureBuf.length>KEEP_SAMPLES){ captureBuf=captureBuf.subarray(captureBuf.length-KEEP_SAMPLES); }
}
function flushWindow(){
  if(sttInflight || !captureBuf || captureBuf.length < SR*1.0) return;
  const samples=captureBuf.subarray(Math.max(0,captureBuf.length-WINDOW_SAMPLES));
  const pcm=encodeFloatTo16(samples);
  const wav=encodeWav(pcm, 16000);
  const room=new URLSearchParams(location.search).get('room')||'';
  const lang=fromSel.value||'';
  // auto 模?不?lang ?whisper (?? auto??00 歷史??); ?whisper ???測
  const url='/api/transcribe?room='+encodeURIComponent(room)+'&vad=1'+(lang && lang!=='auto'?'&lang='+encodeURIComponent(lang):'');
  sttInflight=true;
  const release=()=>{ sttInflight=false; };
  const to=setTimeout(release, 45000);
  fetch(url,{method:'POST',headers:{'content-type':'audio/wav'},body:wav})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{ if(d.source)log('辨?: '+d.source.slice(0,40)); })
    .catch(()=>{})
    .finally(()=>{ clearTimeout(to); release(); });
}
function encodeWav(pcm, sampleRate){
  const ab=new ArrayBuffer(44+pcm.length);
  const dv=new DataView(ab);
  const ws=(off,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(off+i,s.charCodeAt(i));};
  ws(0,'RIFF'); dv.setUint32(4,36+pcm.length,true); ws(8,'WAVE');
  ws(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true);
  dv.setUint16(22,1,true); dv.setUint32(24,sampleRate,true); dv.setUint32(28,sampleRate*2,true);
  dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  ws(36,'data'); dv.setUint32(40,pcm.length,true);
  new Uint8Array(ab,44).set(pcm);
  return ab;
}
function encodeFloatTo16(f){const u=new Uint8Array(f.length*2);const dv=new DataView(u.buffer);for(let i=0;i<f.length;i++){dv.setInt16(i*2,Math.max(-1,Math.min(1,f[i]))*0x7fff,true);}return u;}
