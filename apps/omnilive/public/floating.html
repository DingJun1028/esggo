<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OmniLive 漂浮字幕窗</title>
<style>
:root{--accent:#7c5cff;--accent2:#36e0c0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:rgba(0,0,0,.5);font-family:"Segoe UI",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;user-select:none}
#bar{height:26px;background:rgba(20,22,34,.85);display:flex;align-items:center;gap:6px;padding:0 8px;cursor:move;flex:none}
#bar .t{font-size:.7rem;color:#cfd6e6;font-weight:600}
#bar .x{margin-left:auto;cursor:pointer;color:#9aa3b8;font-size:.9rem;padding:0 4px}
#bar .x:hover{color:#fff}
#subs{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:10px;overflow:hidden}
.sub{display:flex;flex-direction:column;gap:1px;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.sub .src{font-size:1rem;font-weight:700;color:#fff;text-shadow:0 2px 4px #000;padding:2px 8px;border-radius:8px;background:rgba(0,0,0,.5);width:fit-content;max-width:100%}
.sub .tgt{font-size:1.5rem;font-weight:800;color:#fff;text-shadow:0 2px 6px #000;padding:2px 8px;border-radius:8px;background:rgba(0,0,0,.5);width:fit-content;max-width:100%}
.sub.fin{opacity:.82}
#ph{color:#fff8;font-size:1.1rem;text-align:center;margin:auto}
.hint{position:absolute;bottom:4px;right:8px;font-size:.6rem;color:#ffffff66}
</style>
</head>
<body>
<div id="bar"><span class="t">🐝 OmniLive 漂浮字幕</span><span class="x" id="close">✕</span></div>
<div id="subs"><div id="ph">等待字幕…</div></div>
<div class="hint">可拖曳標題列移動 · 置頂請用視窗管理工具</div>
<script>
const params=new URLSearchParams(location.search);
const room=params.get('room')||''; const pwd=params.get('pwd')||'';
const subs=document.getElementById('subs'); const ph=document.getElementById('ph');
document.getElementById('close').onclick=()=>window.close();
const order = (params.get('order')==='src'); // 預設大中文小英文
function addSub(d){
  if(ph){ph.remove();}
  const wrap=document.createElement('div'); wrap.className='sub';
  const a=document.createElement('div'); a.className='src';
  const b=document.createElement('div'); b.className='tgt';
  // 預設 order: tgt=中文(大) src=英文(小) → 顯示時 tgt 在上(大字)
  a.textContent=order?(d.target||''):(d.source||'');
  b.textContent=order?(d.source||''):(d.target||'');
  wrap.appendChild(a); wrap.appendChild(b);
  subs.appendChild(wrap);
  while(subs.children.length>8) subs.removeChild(subs.firstChild);
}
const es=new EventSource('/stream?room='+encodeURIComponent(room)+(pwd?'&pwd='+encodeURIComponent(pwd):''));
es.addEventListener('subtitle',ev=>{try{const p=JSON.parse(ev.data);const d=p.data;if(!d)return;addSub(d);}catch(e){}});
es.onerror=()=>setTimeout(()=>{ if(es.readyState===EventSource.CLOSED){ const e2=new EventSource('/stream?room='+encodeURIComponent(room)+(pwd?'&pwd='+encodeURIComponent(pwd):'')); } },3000);
// 拖曳
const bar=document.getElementById('bar');
bar.addEventListener('pointerdown',e=>{ if(e.target.id==='close')return;
  const r=window; bar.setPointerCapture(e.pointerId);
  const sx=e.screenX,sy=e.screenY, wx=window.screenX,wy=window.screenY;
  const mv=ev=>window.moveTo(wx+(ev.screenX-sx), wy+(ev.screenY-sy));
  bar.onpointermove=mv; bar.onpointerup=()=>{bar.onpointermove=null;};
});
</script>
</body>
</html>
