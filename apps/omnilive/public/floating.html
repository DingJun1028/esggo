<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OmniLive 漂浮字幕窗</title>
<style>
/* === esggo brand tokens === */
:root{
  --bg:#0a1424;
  --bg-soft:#10243f;
  --panel:#142a47;
  --panel-hover:#1a3358;
  --line:#2a3e5e;
  --line-soft:#1f3352;
  --txt:#f3ede1;
  --txt-soft:#c8c1b3;
  --muted:#8a8275;
  --gold:#c9a24b;
  --gold-soft:#b8941f;
  /* 與 index.html 同一組 token: 品牌文件值 #3c6e43 在本深藍底上僅 2.42:1,
     字幕是主要閱讀內容, 必須可讀。#5fb37e = 5.67:1 (WCAG AA 通過)。 */
  --green:#5fb37e;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono",monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s8:48px;
  --r-sm:4px;--r-md:6px;
  --ease:cubic-bezier(0.4, 0, 0.2, 1);
  /* 深色介面 → 原生控制項 (捲軸/選單) 也走深色, 否則淺色捲軸會在深藍上形成亮色破洞。 */
  color-scheme:dark;
  -webkit-tap-highlight-color:transparent;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  background:transparent;
  font-family:var(--font);
  overflow:hidden;
  letter-spacing:.01em;
}
body{display:flex;flex-direction:column;user-select:none}
/* Title bar — 深藍 + 暖金 brand */
#bar{
  height:26px;
  background:rgba(10,20,36,.92);
  border-bottom:1px solid var(--line-soft);
  display:flex;
  align-items:center;
  gap:var(--s2);
  padding:0 var(--s3);
  cursor:move;
  flex:none;
  backdrop-filter:blur(8px);
}
/* 摺疊後只留一條把手: 字幕佔滿整窗, 使用者要的「縮小 / 隱藏上方介面」。
   標題列縮成一條細把手仍可拖曳, 並保留字級調節的浮出鈕。 */
#bar.min{height:12px;padding:0;justify-content:center}
/* 摺疊時連 .x (含自動 margin-left) 一起隱藏, 否則收合列會左空一塊、右卡一個鈕。
   只留 ::after 的置中提示; 展開鈕用 min::before 畫在左側, 仍可點擊 (見 JS)。 */
#bar.min #barText,#bar.min .brand-mark,#bar.min .close,#bar.min .x,
#bar.min .gear,#bar.min .fz{display:none}
/* 字級調整: 預設隱藏, 點右上齒輪才浮出; 獨立窗原本把 .tgt 寫死 1.55rem 無法調。 */
#bar .fz{display:none;align-items:center;gap:2px}
#bar.fz-open .fz{display:flex}
#bar .fz button{
  width:26px;height:22px;border-radius:4px;border:1px solid var(--line-soft);
  background:rgba(255,255,255,.04);color:var(--txt-soft);cursor:pointer;
  font-family:var(--mono);font-size:.7rem;line-height:1;
}
#bar .fz button:hover{border-color:var(--gold);color:var(--gold)}
#bar .fz button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#bar .gear{
  background:none;border:0;color:var(--muted);cursor:pointer;
  font-size:.78rem;padding:0 var(--s1);min-height:22px;line-height:1;
}
#bar .gear:hover,#bar .gear:focus-visible{color:var(--gold);outline:2px solid var(--gold);outline-offset:2px}
/* 摺疊把手上的提示文字 (繁中, 置中) */
#bar.min::after{
  content:'拖曳移動 · 點此展開';font-size:.58rem;color:var(--muted);
  font-family:var(--mono);letter-spacing:.04em;
}
#bar .brand-mark{
  width:18px;height:18px;
  border:1px solid var(--gold);
  border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);
  font-family:var(--mono);
  font-size:10px;font-weight:600;letter-spacing:.05em;
  flex:none;
}
#bar .t{
  font-size:.68rem;
  color:var(--txt-soft);
  font-weight:500;
  letter-spacing:.02em;
}
#bar .t em{
  font-style:normal;
  color:var(--gold);
}
/* 關閉鈕: 原本是 <span> (靠 cursor:pointer 假裝是按鈕, 鍵盤不可達)。
   改為真正的 <button> 後必須清掉 UA 預設樣式, 否則會出現灰底與瀏覽器框線。 */
#bar .x{
  margin-left:auto;
  cursor:pointer;
  color:var(--muted);
  font-size:.85rem;
  padding:0 var(--s2);
  line-height:1;
  transition:color .15s var(--ease);
  /* 觸控目標: 補齊最小高度, 原 <span> 只有文字高度。 */
  min-height:24px;
  background:none;border:0;font-family:inherit;
}
#bar .x:hover{color:var(--gold)}
#bar .x:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#subs{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:var(--s2);
  padding:var(--s3) var(--s4);
  overflow:hidden;
}
.sub{
  display:flex;
  flex-direction:column;
  gap:2px;
  animation:fade .18s var(--ease) both;
}
@keyframes fade{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}
.sub .src{
  /* --tgt-scale 由字級調整 (A-/A+) 改寫; 預設 1。原文與譯文同步縮放,
     維持「大中文小英文」的視覺階層。 */
  font-size:calc(.95rem * var(--tgt-scale,1));
  font-weight:500;
  color:var(--txt-soft);
  text-shadow:0 1px 3px rgba(0,0,0,.85);
  padding:var(--s1) var(--s3);
  border-radius:var(--r-sm);
  background:rgba(10,20,36,.62);
  border-left:2px solid var(--line);
  width:fit-content;
  max-width:100%;
  letter-spacing:.01em;
  /* 繁中長句換行而非溢出: 中日韓無空白可斷, 需 line-break:anywhere;
     overflow-wrap:anywhere 兼顧英文長字/網址。否則會被 #subs 的 overflow:hidden 裁掉。 */
  overflow-wrap:anywhere;
  word-break:break-word;
  line-break:anywhere;
}
.sub .tgt{
  font-size:calc(1.55rem * var(--tgt-scale,1));
  font-weight:600;
  color:var(--txt);
  text-shadow:0 2px 6px rgba(0,0,0,.9);
  padding:var(--s1) var(--s3);
  border-radius:var(--r-sm);
  background:rgba(10,20,36,.75);
  border-left:2px solid var(--gold);
  width:fit-content;
  max-width:100%;
  letter-spacing:.01em;
  overflow-wrap:anywhere;
  word-break:break-word;
  line-break:anywhere;
}
#ph{
  color:var(--muted);
  font-size:calc(.95rem * var(--tgt-scale,1));
  text-align:center;
  margin:auto;
  letter-spacing:.02em;
}
.hint{
  position:absolute;
  bottom:3px;
  right:var(--s3);
  font-size:.58rem;
  color:var(--muted);
  font-family:var(--mono);
  letter-spacing:.05em;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
<body>
<div id="bar">
  <div class="brand-mark" aria-hidden="true">OA</div>
  <span class="t" id="barText"><em>OmniLive</em> 漂浮字幕</span>
  <div class="fz" role="group" aria-label="字幕字級">
    <button type="button" id="fzDown" aria-label="縮小字級" title="縮小字級">A-</button>
    <button type="button" id="fzUp" aria-label="放大字級" title="放大字級">A+</button>
  </div>
  <button class="gear" id="gear" type="button" aria-label="顯示字級調整" aria-expanded="false" title="字級調整">⚙</button>
  <button class="x" id="close" type="button" aria-label="關閉漂浮字幕窗">關閉</button>
  <button class="x" id="minimize" type="button" aria-label="隱藏上方介面" aria-expanded="false" title="隱藏上方介面">▾</button>
</div>
<!-- 字幕是本窗的唯一輸出 → 必須是 live region, 否則螢幕閱讀器使用者收不到任何內容。 -->
<div id="subs" role="region" aria-label="漂浮字幕" aria-live="polite" aria-atomic="true"><div id="ph">等待字幕…</div></div>
<div class="hint">拖曳標題列移動</div>
<script>
const params=new URLSearchParams(location.search);
const room=params.get('room')||''; const pwd=params.get('pwd')||'';
const subs=document.getElementById('subs'); const ph=document.getElementById('ph');
document.getElementById('close').onclick=()=>window.close();
const bigFirst = params.get('order')!=='src'; // 預設大中文小英文
// 字幕資料模型: 與 index.html 共用 lib/caption-window.mjs (單一 SSOT)。
// 舊版在此 append 並在超過 8 列時砍掉最舊的, 那是「無限增長後再截斷」,
// 高度會隨語速膨脹; 固定視窗以「位移」取代「累加」, 新句進第一列、其餘下移,
// 超出槽位直接丟棄 → 視窗高度恆定。
let capWin=null;
async function initCapWin(){
  try{
    const mod=await import('/lib/caption-window.mjs');
    capWin=new mod.CaptionWindow({slotCount:Number(params.get('slots'))||2});
  }catch(e){ capWin=null; }
  for(const p of capBuf) addSub(p);
  capBuf.length=0;
}
const capBuf=[];
function addSub(d){
  if(ph){ph.remove();}
  const push=(d)=>{
    const res=capWin.push({id:d.id,source:d.source||'',target:d.target||'',meta:d.meta,speaker:d.speaker,ts:Date.now()},Date.now());
    renderRows(res.rows);
  };
  if(!capWin){ if(capBuf.length<40)capBuf.push(d); return; }
  push(d);
}
// 固定槽位重畫 (不 append)
function renderRows(rows){
  subs.textContent='';
  rows.forEach(r=>{
    const wrap=document.createElement('div'); wrap.className='sub';
    const a=document.createElement('div'); a.className='src';
    const b=document.createElement('div'); b.className='tgt';
    if(bigFirst){ a.textContent=r.source||''; b.textContent=r.target||''; }
    else { a.textContent=r.target||''; b.textContent=r.source||''; }
    wrap.appendChild(a); wrap.appendChild(b);
    subs.appendChild(wrap);
  });
}
initCapWin();
const es=new EventSource('/stream?room='+encodeURIComponent(room)+(pwd?'&pwd='+encodeURIComponent(pwd):''));
es.addEventListener('subtitle',ev=>{try{const p=JSON.parse(ev.data);const d=p.data;if(!d)return;addSub(d);}catch(e){}});
es.onerror=()=>{ if(es.readyState===EventSource.CLOSED){ const e2=new EventSource('/stream?room='+encodeURIComponent(room)+(pwd?'&pwd='+encodeURIComponent(pwd):'')); } };
const bar=document.getElementById('bar');
bar.addEventListener('pointerdown',e=>{ if(e.target.id==='close')return;
  bar.setPointerCapture(e.pointerId);
  const sx=e.screenX,sy=e.screenY, wx=window.screenX,wy=window.screenY;
  const mv=ev=>window.moveTo(wx+(ev.screenX-sx), wy+(ev.screenY-sy));
  bar.onpointermove=mv; bar.onpointerup=()=>{bar.onpointermove=null;};
});
// ── 隱藏上方介面 (使用者: 左下開啟獨立頁面「請讓他可以在縮小 隱藏上方介面那塊」) ──
// 收合成一條可拖曳的細把手, 字幕佔滿整窗; 點把手任何處即可展開。
const minBtn=document.getElementById('minimize');
function setMin(on){
  bar.classList.toggle('min',on);
  bar.setAttribute('aria-label',on?'展開上方介面':'隱藏上方介面');
  minBtn.setAttribute('aria-expanded',on?'false':'true');
  minBtn.setAttribute('aria-label',on?'展開上方介面':'隱藏上方介面');
  minBtn.textContent=on?'▴':'▾';
}
minBtn.onclick=e=>{ e.stopPropagation(); setMin(!bar.classList.contains('min')); };
// 收合後點條 (避開子元素) 直接展開
bar.addEventListener('click',e=>{ if(bar.classList.contains('min')) setMin(false); });

// ── 字級調整 (使用者: 「字體改成都可以調整」; 獨立窗原本寫死 1.55rem 無法調) ──
const gear=document.getElementById('gear');
gear.onclick=e=>{ e.stopPropagation();
  const open=bar.classList.toggle('fz-open');
  gear.setAttribute('aria-expanded',open?'true':'false');
  gear.setAttribute('aria-label',open?'隱藏字級調整':'顯示字級調整');
};
// 以 0.1 為步進, 範圍 0.6–2.4 (≈ 12.6px–62px 的大譯文字級)
let scale=Number(localStorage.getItem('ol.scale'))||1;
function applyScale(v){
  scale=Math.max(.6,Math.min(2.4,Math.round(v*10)/10));
  document.documentElement.style.setProperty('--tgt-scale',scale);
  localStorage.setItem('ol.scale',scale);
}
applyScale(scale);
document.getElementById('fzUp').onclick=e=>{ e.stopPropagation(); applyScale(scale+.1); };
document.getElementById('fzDown').onclick=e=>{ e.stopPropagation(); applyScale(scale-.1); };
// 方向鍵微調 (±0.1), 免得使用者只能靠點擊
document.addEventListener('keydown',e=>{
  if(!e.ctrlKey&&!e.metaKey)return;
  if(e.key==='='||e.key==='+'){ e.preventDefault(); applyScale(scale+.1); }
  else if(e.key==='-'){ e.preventDefault(); applyScale(scale-.1); }
});
</script>
</body>
</html>
