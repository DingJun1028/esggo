# Ollama Reverse Proxy (方式 A) — 自行部署, 非 NemoClaw 管理
# 部署: 放進 VPS nginx sites-enabled/ 或 http{} 區塊內, 然後 `nginx -t && systemctl reload nginx`
# 前置: Ollama 已監聽 127.0.0.1:11434 (OLLAMA_HOST=127.0.0.1:11434)

# 可選: 限制來源 IP (Cloudflare Tunnel 或你固定 IP)
# allow 203.0.113.0/24; deny all;

server {
    listen 80;
    server_name ollama.esggo.co;   # 改為你的子域, 或移除 server_name 用 location 掛在主 server

    # 方式 A-1: 簡單反向代理 (無驗證, 靠 Cloudflare Access / 網段限制保護)
    location /ollama/ {
        proxy_pass http://127.0.0.1:11434/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 支援 Ollama 流式 (SSE)
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 方式 A-2: 帶 Basic Auth (簡易 API key 保護, 不需寫程式)
    # 產生 htpasswd: `openssl passwd -apr1 "你的key"` 或 `htpasswd -c /etc/nginx/ollama.htpasswd ollama`
    location /ollama-secure/ {
        auth_basic "Ollama Proxy";
        auth_basic_user_file /etc/nginx/ollama.htpasswd;
        proxy_pass http://127.0.0.1:11434/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
