# ==============================================================================
# FTG Tours — ESG Outdoor Wellbeing Travel
# Domain: ftgtours.esggo.co
# SSL: Let's Encrypt
# ==============================================================================

# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ftgtours.esggo.co www.ftgtours.esggo.co;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Serve FTG Tours Website
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ftgtours.esggo.co www.ftgtours.esggo.co;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/ftgtours.esggo.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ftgtours.esggo.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root directory
    root /var/www/ftgtours;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml font/woff font/woff2;
    gzip_min_length 256;

    # Static file caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA routing - try files, fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ACME challenge (for renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
