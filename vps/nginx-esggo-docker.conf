# ==============================================================================
# ESGGO Nginx Configuration (Docker Mode)
# Path mounted into nginx container: /etc/nginx/conf.d/default.conf
# Service names resolve via Docker internal DNS (esggo-net bridge)
# ==============================================================================

# HTTP — ACME challenge + proxy to Next.js
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Proxy to Next.js (service name: esggo, port 3000)
    location / {
        proxy_pass http://esggo:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Disable buffering for SSE
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OmniAgent Gateway (service name: omniagent-gateway, port 8642)
    location /omniagent-gateway/ {
        proxy_pass http://omniagent-gateway:8642/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Nginx status
    location /nginx-status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
