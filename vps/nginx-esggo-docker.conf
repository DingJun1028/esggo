# ==============================================================================
# ESGGO Nginx Configuration (Docker Mode)
# Path mounted into nginx container: /etc/nginx/conf.d/default.conf
# ==============================================================================
# Hardened by wing-ops (esggo-swarm) security review:
#  - Restored $http_upgrade / $host / $remote_addr proxy_set_header args
#    (empty values were a syntax error: "invalid number of arguments")
#  - Added security headers, server_tokens off, gzip, rate limiting
#  - Tightened CSP, added TLS hardening, client_max_body_size, timeout caps

server_tokens off;

limit_req_zone $binary_remote_addr zone=api_perip:10m rate=10r/s;

# Cache zone for the main app proxy
proxy_cache_path /var/cache/nginx/esggo levels=1:2 keys_zone=esggo_api:100m inactive=60m max_size=512m use_temp_path=off;

# SSL/TLS hardening
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_session_tickets off;

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/esggo.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esggo.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://omniagent.esggo.co https://esggo.co; frame-ancestors 'none'; form-action 'self';" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # General proxy settings
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;

    # Timeout caps (prevent slowloris/DoS)
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;

    # Body size limit
    client_max_body_size 10m;

    location / {
        limit_req zone=api_perip burst=20 nodelay;
        proxy_pass http://esggo:3000;
        proxy_cache_bypass $http_upgrade;
        proxy_cache esggo_api;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_buffering on;
    }

    location /omniagent-gateway/ {
        proxy_pass http://omniagent-gateway:8642/;
        proxy_buffering off;
        proxy_cache off;
        limit_req zone=api_perip burst=5 nodelay;
    }
}
