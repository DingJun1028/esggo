# ==============================================================================
# ESGGO Production Nginx Configuration (Ubuntu 24.04 / Oracle Cloud ARM64)
# Path: /etc/nginx/sites-available/esggo
# Includes: HTTP redirect to HTTPS, Let's Encrypt integration
# ==============================================================================

# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 161.118.248.180;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Redirect all other HTTP to HTTPS (uncomment when SSL is ready)
    # return 301 https://$host$request_uri;
}

