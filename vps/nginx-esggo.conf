# ==============================================================================
# ESGGO Production Nginx Configuration (Ubuntu 24.04 / Oracle Cloud ARM64)
# Path: /etc/nginx/sites-available/esggo
# ==============================================================================

# HTTP - Redirect to HTTPS if SSL is configured (Certbot will manage this automatically)
server {
    listen 80;
    listen [::]:80;
    server_name 161.118.248.180; # Replace with your domain when configured (e.g., esggo.com)

    # Max body size for ESG evidence / report uploads (15MB)
    client_max_body_size 15M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Next.js App Router Frontend (localhost:3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 2. OmniAgent Gateway Server (localhost:8642)
    # Forward all gateway endpoints with SSE stream and WebSocket support
    location /omniagent-gateway/ {
        proxy_pass http://127.0.0.1:8642/;
        proxy_http_version 1.1;
        
        # Enable WebSockets & Server-Sent Events (SSE) streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for SSE streaming (POST /stream)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        
        # CORS & client settings
        client_max_body_size 15M;
    }

    # Alternate gateway proxy path compatibility
    location /status {
        proxy_pass http://127.0.0.1:8642/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

