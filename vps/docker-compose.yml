# vps/docker-compose.yml — Unified Multi-Service Orchestration
# Uses @esggo/shared/config for consistent configuration
# Usage: docker-compose up -d

services:
  # ── Redis (Async Task State + Cache) ──
  redis:
    image: redis:7-alpine
    container_name: esggo-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - esggo-redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - esggo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── AI Station (OmniAuto) ──
  aistation:
    image: dingjunhong1028/aistation:latest
    container_name: aistation-core
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - aistation-storage:/app/storage
    environment:
      - NODE_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - esggo-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Next.js Main Application ──
  esggo:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: esggo-core
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # ── App ──
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      # ── Database ──
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL:-}
      - OMNI_DATABASE_URL=${OMNI_DATABASE_URL:-}
      # ── Redis ──
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_URL=redis://redis:6379
      # ── Firebase ──
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      # ── Supabase ──
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      # ── AI Providers ──
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - FREE_TIER_ONLY=${FREE_TIER_ONLY:-true}
      # ── Gateway ──
      - GATEWAY_URL=http://omniagent-gateway:8642
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-}
      # ── NCB ──
      - NCB_APP_ID=${NCB_APP_ID:-}
      - NCB_APP_KEY=${NCB_APP_KEY:-}
      # ── Security ──
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    volumes:
      - esggo-data:/app/public/uploads
    depends_on:
      redis:
        condition: service_healthy
      omniagent-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - esggo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    # Security hardening
    security_opt:
      - no-new-privileges:true
      - "seccomp=unconfined"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /app/.next/cache:size=256m
      - /app/.cache:size=128m
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    stop_grace_period: 60s

  # ── OmniAgent Gateway ──
  omniagent-gateway:
    build:
      context: ..
      dockerfile: vps/Dockerfile.gateway
    container_name: omniagent-gateway
    ports:
      - "127.0.0.1:8642:8642"
    environment:
      - NODE_ENV=production
      - PORT=8642
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - esggo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://127.0.0.1:8642/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── Certbot (Auto-renewal) ──
  certbot:
    image: certbot/certbot
    container_name: esggo-certbot
    profiles:
      - certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet --post-hook \"nginx -s reload\"; sleep 12h & wait $${!}; done;'"
    networks:
      - esggo-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  esggo-data:
  aistation-storage:
  nginx-cache:
  esggo-redis-data:

networks:
  esggo-net:
    driver: bridge
    name: esggo-net
