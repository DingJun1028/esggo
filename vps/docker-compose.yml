# vps/docker-compose.yml — 多服務編排
# 使用方式：docker-compose up -d
# Security hardening: resource limits, cap_drop, read_only, no-new-privileges

services:
  # Redis for async task state
  redis:
    image: redis:7-alpine
    container_name: esggo-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - esggo-redis-data:/data
    restart: unless-stopped
    networks:
      - esggo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5


  # AI Station (OmniAuto) - 影音生產線控制中樞
  aistation:
    image: dingjunhong1028/aistation:latest
    container_name: aistation-core
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - aistation-storage:/app/storage
    restart: unless-stopped
    networks:
      - esggo-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Next.js 主應用
  esggo:
    build:
      context: /opt/esggo
      dockerfile: Dockerfile
    container_name: esggo-core
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - GATEWAY_URL=http://omniagent-gateway:8642
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    volumes:
      - esggo-data:/app/public/uploads
    depends_on:
      redis:
        condition: service_healthy
      omniagent-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - esggo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    # Security hardening
    security_opt:
      - no-new-privileges:true
      - "seccomp=unconfined"  # Allow dynamic resource usage
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /app/.next/cache:size=256m
      - /app/.cache:size=128m
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    stop_grace_period: 60s

  # OmniAgent Gateway
  omniagent-gateway:
    build:
      context: /opt/esggo
      dockerfile: vps/Dockerfile.gateway
    container_name: omniagent-gateway
    ports:
      - "127.0.0.1:8642:8642"
    environment:
      - NODE_ENV=production
      - PORT=8642
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GATEWAY_API_KEY=${GATEWAY_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - esggo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://127.0.0.1:8642/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # Certbot 自動續約（僅背景續期，首次取得需手動初始化）
  certbot:
    image: certbot/certbot
    container_name: esggo-certbot
    profiles:
      - certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet --post-hook \"nginx -s reload\"; sleep 12h & wait $${!}; done;'"
    networks:
      - esggo-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  esggo-data:
  aistation-storage:
  nginx-cache:
  esggo-redis-data:

networks:
  esggo-net:
    driver: bridge