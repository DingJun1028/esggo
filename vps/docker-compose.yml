# vps/docker-compose.yml — 多服務編排
# 使用方式：docker-compose up -d

version: '3.8'

services:
  # Redis for async task state
  redis:
    image: redis:6.2-alpine
    container_name: esggo-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - esggo-redis-data:/data
    restart: unless-stopped
    networks:
      - esggo-net

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: esggo-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-esggo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - esggo
    restart: unless-stopped
    networks:
      - esggo-net

  # Next.js 主應用
  esggo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esggo-core
    environment:
      - NODE_ENV=production
      - PORT=3000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - esggo-data:/app/public/uploads
    depends_on:
      - omniagent-gateway
    restart: unless-stopped
    networks:
      - esggo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # OmniAgent Gateway
  omniagent-gateway:
    build:
      context: .
      dockerfile: vps/Dockerfile.gateway
    container_name: omniagent-gateway
    environment:
      - NODE_ENV=production
      - PORT=3003
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: unless-stopped
    networks:
      - esggo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot 自動續約
  certbot:
    image: certbot/certbot
    container_name: esggo-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - esggo-net

volumes:
  esggo-data:
  nginx-cache:
  esggo-redis-data:

networks:
  esggo-net:
    driver: bridge