# nginx server block for Hermes WebUI (mobile "Hermex") on VPS
# Save to /etc/nginx/sites-available/hermex.conf, symlink to sites-enabled/, nginx -t, reload.
server {
    listen 8795;
    server_name hermex.esggo.co localhost;
    root /opt/hermes-venv/lib/python3.12/site-packages/hermes_cli/web_dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /api/ws {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}
