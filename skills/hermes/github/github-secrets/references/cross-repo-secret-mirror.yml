# One-shot GitHub Actions workflow to mirror secrets from THIS repo (SOURCE) into TARGET.
# Plaintext never leaves GitHub's servers. Usage: set a temp secret MIRROR_PAT in SOURCE
# (a PAT with secrets:write on TARGET), commit this file, run it once, then DELETE it + the secret.
#
# Edit:
#   - env.TARGET    -> "OWNER/TARGET_REPO"
#   - the env: block -> map each source secret (secrets.X) to the target name you want
#   - the run: block -> gh secret set lines to match the env map above

name: Mirror secrets to target repo
on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.MIRROR_PAT }}
      TARGET: OWNER/TARGET_REPO
    steps:
      - name: Mirror secrets
        env:
          # ---- source secrets (plaintext inside the run) ----
          SRC_FB_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          SRC_FB_AUTH: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          SRC_FB_PROJ: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          SRC_FB_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          SRC_FB_SENDER: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          SRC_FB_APP: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          SRC_FB_MEAS: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          SRC_SB_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SRC_SB_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          gh secret set VITE_FB_API_KEY             --repo "$TARGET" --body "$SRC_FB_API_KEY"
          gh secret set VITE_FB_AUTH_DOMAIN         --repo "$TARGET" --body "$SRC_FB_AUTH"
          gh secret set VITE_FB_PROJECT_ID          --repo "$TARGET" --body "$SRC_FB_PROJ"
          gh secret set VITE_FB_STORAGE_BUCKET      --repo "$TARGET" --body "$SRC_FB_BUCKET"
          gh secret set VITE_FB_MESSAGING_SENDER_ID --repo "$TARGET" --body "$SRC_FB_SENDER"
          gh secret set VITE_FB_APP_ID              --repo "$TARGET" --body "$SRC_FB_APP"
          gh secret set VITE_FB_MEASUREMENT_ID      --repo "$TARGET" --body "$SRC_FB_MEAS"
          gh secret set VITE_SUPABASE_URL           --repo "$TARGET" --body "$SRC_SB_URL"
          gh secret set VITE_SUPABASE_ANON_KEY      --repo "$TARGET" --body "$SRC_SB_ANON"
          echo "mirror done"
