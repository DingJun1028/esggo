# nginx reverse proxy for an SSE (Server-Sent Events) upstream.
# Drop-in `location /` block — the critical lines are proxy_buffering off + long read timeout.
# Without these, nginx buffers the stream and the client never sees events live.

location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # --- SSE critical directives ---
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Verify after reload:
#   curl -s -N --max-time 6 "http://127.0.0.1:8787/stream?src=x" | grep -E '^event:'
# You should see `event: heartbeat` / `event: snapshot` lines streaming, not one buffered dump.
