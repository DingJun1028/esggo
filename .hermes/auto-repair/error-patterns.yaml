# Auto-Repair Error Pattern Definitions
# Each pattern matches an error message and maps to a fix action
#
# Tag contract: every pattern MUST carry the 6-dimension MECE tags.
# Missing tags = contract violation = invalid product.
# Mandatory per-pattern tags: [agent:auto-repair][lifecycle:repair][p1]

patterns:
  # ═══════════════════════════════════════════════════════════
  # Dimension 1: Security Level  (security:critical|high|medium|low)
  # Dimension 2: Agent Ownership (agent:auto-repair|agent:manual)
  # Dimension 3: Lifecycle Stage (lifecycle:repair|detect|validate)
  # Dimension 4: Quality Grade  (p1|p2|p3 — priority 1=highest)
  # Dimension 5: Platform       (platform:github|vps|local)
  # Dimension 6: Barrier Inherit (barrier:none|ssh|secret|network)
  # ═══════════════════════════════════════════════════════════

  # ── Dependabot Alerts ──
  - id: DAB-001
    name: "Dependabot vulnerability alert"
    tags:
      security: high
      agent: auto-repair
      lifecycle: repair
      quality: p1
      platform: github
      barrier: secret
    match:
      type: "ghsa"
      regex: "GHSA-[a-zA-Z0-9]+-[a-zA-Z0-9]+-[a-zA-Z0-9]+"
    severity_map:
      high: "critical"
      critical: "critical"
      medium: "warning"
      low: "info"
    fix_strategy: "override"
    priority: 1

  - id: DAB-002
    name: "Dependabot alert - direct dep"
    tags:
      security: high
      agent: auto-repair
      lifecycle: repair
      quality: p1
      platform: github
      barrier: secret
    match:
      type: "direct_dep"
      regex: "package.json.*direct.*vulnerable"
    fix_strategy: "pr"
    priority: 1

  # ── pnpm audit ──
  - id: PNA-001
    name: "pnpm audit vulnerability"
    tags:
      security: high
      agent: auto-repair
      lifecycle: repair
      quality: p1
      platform: local
      barrier: none
    match:
      type: "pnpm_audit"
      regex: "(CVE-|GHSA-|vulnerable|high|critical)"
    fix_strategy: "override"
    priority: 1

  # ── SSH Connection ──
  - id: SSH-001
    name: "SSH Permission denied (publickey)"
    tags:
      security: critical
      agent: auto-repair
      lifecycle: repair
      quality: p2
      platform: vps
      barrier: ssh
    match:
      type: "ssh_error"
      regex: "Permission denied \\(publickey\\)"
    fix_actions:
      - "chmod 600 ~/.ssh/esggo_vps_fix"
      - "chmod 600 ~/.ssh/esggo_original"
      - "ssh-add ~/.ssh/esggo_vps_fix"
    fix_strategy: "key_permission_fix"
    priority: 2

  - id: SSH-002
    name: "SSH Connection timed out"
    tags:
      security: medium
      agent: auto-repair
      lifecycle: detect
      quality: p2
      platform: vps
      barrier: network
    match:
      type: "ssh_error"
      regex: "Connection timed out"
    fix_strategy: "check_vps_status"
    priority: 2

  # ── Build Failures ──
  - id: BLD-001
    name: "Prisma module build failure"
    tags:
      security: low
      agent: auto-repair
      lifecycle: repair
      quality: p3
      platform: local
      barrier: none
    match:
      type: "build_error"
      regex: "Prisma|@prisma|node_modules\\.prisma"
    fix_actions:
      - "npx prisma generate"
      - "pnpm rebuild @prisma/client"
    fix_strategy: "prisma_regenerate"
    priority: 3

  - id: BLD-002
    name: "Module not found"
    tags:
      security: low
      agent: auto-repair
      lifecycle: repair
      quality: p3
      platform: local
      barrier: none
    match:
      type: "build_error"
      regex: "Cannot find module|Module not found"
    fix_strategy: "pnpm_install"
    priority: 3

  # ── Lockfile Conflicts ──
  - id: LCK-001
    name: "pnpm-lock.yaml merge conflict"
    tags:
      security: medium
      agent: auto-repair
      lifecycle: repair
      quality: p2
      platform: github
      barrier: none
    match:
      type: "lockfile_conflict"
      regex: "<<<<<<<|=======|>>>>>>>"
    fix_actions:
      - "git checkout --theirs pnpm-lock.yaml"
      - "pnpm install"
    fix_strategy: "lockfile_merge"
    priority: 2

  # ── .env.example Conflicts ──
  - id: ENV-001
    name: ".env.example merge conflict"
    tags:
      security: critical
      agent: auto-repair
      lifecycle: repair
      quality: p2
      platform: github
      barrier: secret
    match:
      type: "env_conflict"
      regex: "<<<<<<<.*\\.env\\.example"
    fix_strategy: "deduplicate_env"
    priority: 2

  # ── Python Script Truncation ──
  - id: PYT-001
    name: "Python script truncated by terminal"
    tags:
      security: low
      agent: auto-repair
      lifecycle: repair
      quality: p3
      platform: local
      barrier: none
    match:
      type: "truncation"
      regex: "SyntaxError|unexpected EOF|truncated"
    fix_strategy: "write_to_file_then_run"
    priority: 3

  # ── Test Failures ──
  - id: TST-001
    name: "Test failure"
    tags:
      security: low
      agent: auto-repair
      lifecycle: validate
      quality: p3
      platform: local
      barrier: none
    match:
      type: "test_error"
      regex: "FAIL|failed|AssertionError|Error:"
    fix_strategy: "investigate_and_fix"
    priority: 3

  # ── VPS PM2 ──
  - id: VPS-001
    name: "PM2 reload needed"
    tags:
      security: medium
      agent: auto-repair
      lifecycle: repair
      quality: p2
      platform: vps
      barrier: ssh
    match:
      type: "vps_command"
      regex: "pm2 reload|pm2 restart"
    fix_strategy: "ssh_then_pm2"
    priority: 2

  # ── Tag Contract Violation ──
  - id: TAG-001
    name: "Missing mandatory product tags"
    tags:
      security: critical
      agent: auto-repair
      lifecycle: validate
      quality: p1
      platform: local
      barrier: none
    match:
      type: "tag_contract"
      regex: "TAG-CONTRACT"
    fix_strategy: "escalate_to_user"
    priority: 0

# ── Default Actions ──
defaults:
  max_retries: 3
  retry_delay_seconds: 5
  notify_on_failure: true
  escalate_to_user_after_retries: true
  clone_tracking: true
