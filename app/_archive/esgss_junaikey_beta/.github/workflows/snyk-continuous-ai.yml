name: Snyk Continuous AI Security

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'server/**'
      - 'package.json'

jobs:
  security-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Changed Files
        id: changed-files
        run: |
          echo "📝 Identifying changed files..."
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | tr '\n' ' ')
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CLIs
        run: |
          npm install -g snyk @continuedev/cli
          echo "✅ Snyk and Continue CLIs installed"

      - name: Snyk Authenticate
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth "$SNYK_TOKEN"

      - name: Run Snyk Scans
        id: scans
        continue-on-error: true
        run: |
          SCAN_FAILED=0

          echo "🔍 Running Snyk Code (SAST)..."
          snyk code test --severity-threshold=high --json > snyk-code.json || SCAN_FAILED=1

          echo "📦 Running Snyk Open Source (SCA)..."
          snyk test --severity-threshold=high --json > snyk-oss.json || SCAN_FAILED=1

          if [ $SCAN_FAILED -eq 1 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
          else
            echo "status=passed" >> $GITHUB_OUTPUT
          fi

      - name: Generate AI Remediation
        if: steps.scans.outputs.status == 'failed'
        env:
          CONTINUE_API_KEY: ${{ secrets.CONTINUE_API_KEY }}
        run: |
          echo "🤖 Orchestrating AI remediation via Continue CLI..."

          # Extract top issues for AI context
          SUMMARY=$(jq -r '
            if .runs then .runs[0].results[] | "Code: \(.message.text) in \(.locations[0].physicalLocation.artifactLocation.uri)"
            else empty end
          ' snyk-code.json | head -10)

          OSS_SUMMARY=$(jq -r '
            if .vulnerabilities then .vulnerabilities[] | "Dep: \(.title) in \(.packageName)"
            else empty end
          ' snyk-oss.json | head -10)

          PROMPT="Analyze these findings for the esgss_junaikey_beta project:
          $SUMMARY
          $OSS_SUMMARY

          Provide specific fix recommendations using our internal Best Practices. 
          Respond in Markdown for a PR comment."

          cn -p "$PROMPT" --auto > ai-remediation.md

      - name: Post PR Comment
        if: steps.scans.outputs.status == 'failed' && hashFiles('ai-remediation.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > comment.md <<EOF
          ## 🛡️ Continuous AI Security Insights

          Snyk identified high-severity issues. Here are AI-generated remediation steps:

          EOF
          cat ai-remediation.md >> comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
