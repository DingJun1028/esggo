name: TypeScript Type Check & ESLint

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  TypeCheck_Artifacts: 'type-check-results'

jobs:
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: esgss_junaikey_beta/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./esgss_junaikey_beta
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile

      - name: Get changed TypeScript files
        id: changed-ts-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.ts
            **/*.tsx
            tsconfig.json
          files_ignore: |
            node_modules/**
            dist/**
            build/**

      - name: Run TypeScript type check (strict mode)
        id: type-check
        working-directory: ./esgss_junaikey_beta
        continue-on-error: true
        run: |
          mkdir -p ${{ env.TypeCheck_Artifacts }}
          
          # Run type check and capture output
          if ! pnpm run type-check:strict 2>&1 | tee "${{ env.TypeCheck_Artifacts }}/type-check-output.txt"; then
            echo "type_check_failed=true" >> $GITHUB_ENV
          else
            echo "type_check_failed=false" >> $GITHUB_ENV
          fi
          
          # Count errors
          error_count=$(grep -c "error TS" "${{ env.TypeCheck_Artifacts }}/type-check-output.txt" || echo "0")
          echo "error_count=$error_count" >> $GITHUB_ENV
          echo "Total TypeScript errors: $error_count"

      - name: Generate type check summary
        if: always()
        working-directory: ./esgss_junaikey_beta
        run: |
          echo "## TypeScript Type Check Summary" > ${{ env.TypeCheck_Artifacts }}/summary.md
          echo "" >> ${{ env.TypeCheck_Artifacts }}/summary.md
          echo "**Status:** ${{ env.type_check_failed == 'true' && '❌ Failed' || '✅ Passed' }}" >> ${{ env.TypeCheck_Artifacts }}/summary.md
          echo "" >> ${{ env.TypeCheck_Artifacts }}/summary.md
          echo "**Errors Found:** ${{ env.error_count }}" >> ${{ env.TypeCheck_Artifacts }}/summary.md
          echo "" >> ${{ env.TypeCheck_Artifacts }}/summary.md
          echo "### Error Breakdown" >> ${{ env.TypeCheck_Artifacts }}/summary.md
          
          # Count by error code
          for code in TS2307 TS2345 TS7006 TS18048 TS18046 TS7030 TS2339 TS2322 TS2724; do
            count=$(grep -c "error $code" "${{ env.TypeCheck_Artifacts }}/type-check-output.txt" || echo "0")
            if [ "$count" -gt "0" ]; then
              echo "- **$code**: $count errors" >> ${{ env.TypeCheck_Artifacts }}/summary.md
            fi
          done

      - name: Upload type check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TypeCheck_Artifacts }}
          path: ${{ env.TypeCheck_Artifacts }}/
          retention-days: 7

      - name: Add type check summary to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('${{ env.TypeCheck_Artifacts }}/summary.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## TypeScript Type Check Results\n\n${summary}\n\n**View detailed output:** [Type Check Artifacts]()`
            });

  eslint-check:
    name: ESLint Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: esgss_junaikey_beta/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./esgss_junaikey_beta
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile

      - name: Run ESLint
        id: eslint
        working-directory: ./esgss_junaikey_beta
        continue-on-error: true
        run: |
          mkdir -p eslint-results
          
          # Run ESLint with JSON output
          pnpm run lint --format json > eslint-results/eslint-results.json || true
          
          # Count warnings and errors
          const eslintResults = require('./eslint-results/eslint-results.json');
          const totalErrors = eslintResults.reduce((acc, file) => acc + file.errorCount, 0);
          const totalWarnings = eslintResults.reduce((acc, file) => acc + file.warningCount, 0);
          
          console.log(`Total ESLint errors: ${totalErrors}`);
          console.log(`Total ESLint warnings: ${totalWarnings}`);

      - name: Upload ESLint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-results
          path: eslint-results/
          retention-days: 7

  security-type-check:
    name: Security & Type Check Combined
    runs-on: ubuntu-latest
    needs: [type-check, eslint-check]
    if: always()
    steps:
      - name: Check combined status
        run: |
          type_check_status="${{ needs.type-check.result }}"
          eslint_status="${{ needs.eslint-check.result }}"
          
          echo "Type Check: $type_check_status"
          echo "ESLint: $eslint_status"
          
          if [ "$type_check_status" == "success" ] && [ "$eslint_status" == "success" ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed. Please review the artifacts."
            exit 1
          fi

  blocking-errors-report:
    name: Blocking Errors Report
    runs-on: ubuntu-latest
    needs: type-check
    if: needs.type-check.result == 'failure'
    steps:
      - name: Download type check artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TypeCheck_Artifacts }}
          path: type-check-results

      - name: Generate blocking errors report
        working-directory: ./esgss_junaikey_beta
        run: |
          echo "## Blocking TypeScript Errors" > blocking-errors.md
          echo "" >> blocking-errors.md
          
          # Categorize errors by severity
          echo "### Critical (Compilation Blocking)" >> blocking-errors.md
          grep -E "error TS(2307|2724)" type-check-results/type-check-output.txt || echo "None" >> blocking-errors.md
          
          echo "" >> blocking-errors.md
          echo "### High (Runtime Issues)" >> blocking-errors.md
          grep -E "error TS(2339|2345|2532)" type-check-results/type-check-output.txt || echo "None" >> blocking-errors.md
          
          echo "" >> blocking-errors.md
          echo "### Medium (Type Safety)" >> blocking-errors.md
          grep -E "error TS(18048|18046)" type-check-results/type-check-output.txt || echo "None" >> blocking-errors.md

      - name: Upload blocking errors report
        uses: actions/upload-artifact@v4
        with:
          name: blocking-errors-report
          path: blocking-errors.md
          retention-days: 7
