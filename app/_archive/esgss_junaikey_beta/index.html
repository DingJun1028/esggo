  <script>
    window.global = window;
    window.process = { env: {} };

    // Polyfill crypto.randomUUID for non-secure HTTP contexts (LAN IP access)
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID !== 'function') {
      crypto.randomUUID = function() {
        var buf = new Uint8Array(16);
        if (crypto.getRandomValues) crypto.getRandomValues(buf);
        else for (var i = 0; i < 16; i++) buf[i] = Math.floor(Math.random() * 256);
        buf[6] = (buf[6] & 0x0f) | 0x40;
        buf[8] = (buf[8] & 0x3f) | 0x80;
        var hex = Array.from(buf).map(function(b) { return b.toString(16).padStart(2,'0'); }).join('');
        return hex.slice(0,8)+'-'+hex.slice(8,12)+'-'+hex.slice(12,16)+'-'+hex.slice(16,20)+'-'+hex.slice(20);
      };
      console.log('[Polyfill] crypto.randomUUID injected');
    }
  </script>
