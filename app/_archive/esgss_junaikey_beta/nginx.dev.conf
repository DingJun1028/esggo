# This Nginx configuration is specifically for LOCAL DEVELOPMENT using Docker Compose.
# It serves the frontend static files and proxies API requests to the backend container.

server {
    listen 8080;

    # Serve the frontend static files.
    # The root is the default Nginx html directory inside the container.
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # This is crucial for single-page applications (SPAs) like React.
        # It ensures that refreshing a page on a client-side route (e.g., /dashboard)
        # still serves the index.html file, allowing React Router to take over.
        try_files $uri $uri/ /index.html;
    }

    # API Proxy:
    # All requests starting with /api/ will be forwarded to the backend service.
    # 'backend' is the service name defined in docker-compose.yml.
    # '3001' is the port exposed by the backend container.
    location /api/ {
        # The trailing slash is important here to correctly map the path.
        proxy_pass http://backend:3001/;
        
        # Standard proxy headers to pass along client information.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
