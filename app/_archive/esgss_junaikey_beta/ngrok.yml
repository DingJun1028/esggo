version: '3'

agent:
  authtoken: 380qXorFR5ad0iMvkrHfbOtqV6A_21BNkaVHTWQ1pZtX9s1JL

# 定義隧道端點
tunnels:
  # Frontend 隧道 (Vite Dev Server)
  avos-frontend:
    proto: http
    addr: 5173
    schemes:
      - https
    inspect: true
    metadata: 'AVOS v6.0 Frontend'
    labels:
      - env=development
      - app=avos-frontend

  # Backend API 隧道
  avos-backend:
    proto: http
    addr: 3001
    schemes:
      - https
    inspect: true
    metadata: 'AVOS v6.0 Backend API'
    labels:
      - env=development
      - app=avos-backend

# 可選：自定義域名（需要付費方案）
# web_addr: localhost:4040
# console_ui: true
# log_level: info
# log_format: json
# log: /var/log/ngrok.log

# 使用方式：
# 1. 啟動所有隧道：ngrok start --all
# 2. 只啟動 frontend：ngrok start avos-frontend
# 3. 只啟動 backend：ngrok start avos-backend
