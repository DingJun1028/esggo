# ============================================================
# COMPONENTS (SCHEMAS)
# ============================================================

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    # Health Schemas
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - healthy
            - unhealthy
            - degraded
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          additionalProperties:
            type: string
        uptime_seconds:
          type: integer
          format: int64
        version:
          type: string

    # Omni Gateway Schemas
    OmniServiceRegistration:
      type: object
      required:
        - name
        - version
        - endpoints
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        endpoints:
          type: array
          items:
            type: string
        metadata:
          type: object

    OmniServiceInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        status:
          type: string
          enum:
            - active
            - inactive
            - maintenance
        registered_at:
          type: string
          format: date-time

    OmniRouteRequest:
      type: object
      required:
        - service
        - payload
      properties:
        service:
          type: string
        payload:
          type: object
        options:
          type: object

    OmniRouteResponse:
      type: object
      properties:
        result:
          type: object
        metadata:
          type: object

    OmniAgentRequest:
      type: object
      required:
        - task
      properties:
        task:
          type: string
        context:
          type: object
        options:
          type: object

    OmniAgentResponse:
      type: object
      properties:
        success:
          type: boolean
        result:
          type: object
        intent:
          type: string
        confidence:
          type: number

    OmniCacheRequest:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
        value:
          type: object
        ttl:
          type: integer
        strategy:
          type: string
          enum:
            - LRU
            - LFU
            - FIFO

    OmniCacheGetRequest:
      type: object
      required:
        - key
      properties:
        key:
          type: string

    OmniCacheResponse:
      type: object
      properties:
        success:
          type: boolean
        value:
          type: object
        hit:
          type: boolean

    OmniQueueRequest:
      type: object
      required:
        - task
        - priority
      properties:
        task:
          type: object
        priority:
          type: integer
          minimum: 0
          maximum: 100
        delay:
          type: integer

    OmniQueueResponse:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
        enqueued_at:
          type: string
          format: date-time

    OmniHealthResponse:
      type: object
      properties:
        status:
          type: string
        services:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
              latency_ms:
                type: integer
        timestamp:
          type: string
          format: date-time
