# JunAiKey Server API - v10.0-Omni
# Celestial Server API - v10.0-universe

openapi: 3.0.0
info:
  title: JunAiKey Server API
  description: |
    API for the ESGss JunAiKey Beta (JunAiKey Server). Provides endpoints for managing 
    ESG metrics, AI agents, knowledge base, swarm intelligence, and more, in compliance 
    with the Omni Agent Protocol (4+1).
  version: 10.0.0-omni
  x-version-code: universe
  x-release-date: "2025-02-08"
  x-api-version: "10.0.0-universe"
  
  contact:
    name: ESGss JunAiKey Team
    email: support@esgss.com
    url: https://esgss.com
    
  license:
    name: Proprietary
    url: https://esgss.com/license

servers:
  - url: https://esg-dashboard-c3ytffo5qq-de.a.run.app
    description: Production Server
    variables:
      environment:
        enum:
          - production
          - staging
          - development
        default: production
        description: Deployment environment

tags:
  - name: System
    description: System health and status endpoints
  - name: Core API
    description: Core AI agent and manifest endpoints
  - name: Advanced API
    description: Advanced swarm intelligence and anchoring
  - name: Universal Agent Protocol
    description: Universal Agent Protocol v1 endpoints
  - name: Webhooks
    description: Inbound webhook endpoints
  - name: ESG Data
    description: ESG metrics and intelligence endpoints
  - name: Omni Gateway
    description: Omni Gateway services - unified service orchestration, intelligent routing, and service management

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  # ============================================================
  # SYSTEM ENDPOINTS
  # ============================================================
  
  /api/health:
    get:
      tags:
        - System
      summary: System Health
      description: Returns the health status of the server and all services
      operationId: getHealth
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
                timestamp: "2025-02-08T05:00:00Z"
                services:
                  database: healthy
                  cache: healthy
                  ai_engine: healthy
                  knowledge_base: healthy
                uptime_seconds: 86400
                version: "10.0.0-omni"
        '503':
          description: Server is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: unhealthy
                timestamp: "2025-02-08T05:00:00Z"
                error: "Database connection failed"

  # ============================================================
  # CORE API ENDPOINTS
  # ============================================================
  
  /api/manifest:
    post:
      tags:
        - Core API
      summary: Manifest AI Agent
      description: Creates or updates an AI agent manifest in the system
      operationId: manifestAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentManifest'
            example:
              id: "agent-sustainability-expert-001"
              name: "永�?專家"
              description: "專業??ESG 永�??��?顧�? AI �??"
              type: "consultant"
              capabilities:
                - "esg_analysis"
                - "report_generation"
                - "carbon_accounting"
                - "compliance_guidance"
              model_config:
                provider: "gemini"
                model: "gemini-2.0-flash"
                temperature: 0.7
                max_tokens: 8192
              system_prompt: |
                你是一位�?業�? ESG 永�??��?顧�?，�??�於�?                - 溫室�???�查?�碳足跡計�?
                - ESG ?��??�撰寫�?審閱
                - ?��?永�?標�?�??（TCFD?�SASB?�GRI�?                - 碳�?交�??��?碳路徑�???                請用專業且�??��??��??��?使用?��??��???              permissions:
                - "read:metrics"
                - "write:reports"
                - "read:knowledge"
              metadata:
                version: "1.0.0"
                author: "ESGss Team"
                created_at: "2025-02-08T00:00:00Z"
      responses:
        '200':
          description: Agent manifest created/updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
              example:
                id: "agent-sustainability-expert-001"
                name: "永�?專家"
                status: "active"
                version: "1.0.0"
                created_at: "2025-02-08T05:00:00Z"
        '400':
          description: Invalid manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Agent with same ID already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/agents:
    get:
      tags:
        - Core API
      summary: List Available Agents
      description: Returns a list of all available AI agents in the system
      operationId: listAgents
      parameters:
        - name: type
          in: query
          description: Filter agents by type
          schema:
            type: string
            enum:
              - consultant
              - analyst
              - writer
              - auditor
              - researcher
        - name: status
          in: query
          description: Filter agents by status
          schema:
            type: string
            enum:
              - active
              - inactive
              - maintenance
        - name: capabilities
          in: query
          description: Filter by capabilities (comma-separated)
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: List of agents retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
              example:
                agents:
                  - id: "agent-sustainability-expert-001"
                    name: "永�?專家"
                    type: "consultant"
                    status: "active"
                    capabilities:
                      - "esg_analysis"
                      - "report_generation"
                    version: "1.0.0"
                  - id: "agent-carbon-accountant-001"
                    name: "碳盤?��?�?
                    type: "auditor"
                    status: "active"
                    capabilities:
                      - "carbon_accounting"
                      - "emission_audit"
                    version: "1.0.0"
                pagination:
                  page: 1
                  pageSize: 20
                  total: 25
                  totalPages: 2

  /api/agents/{id}:
    get:
      tags:
        - Core API
      summary: Get Agent Details
      description: Returns detailed information about a specific AI agent
      operationId: getAgentDetails
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Agent unique identifier
      responses:
        '200':
          description: Agent details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetails'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/interact:
    get:
      tags:
        - Core API
      summary: Interact with an Agent
      description: Send a message to an AI agent and receive a response
      operationId: interactWithAgent
      parameters:
        - name: agentId
          in: query
          required: true
          schema:
            type: string
          description: Target agent ID
        - name: message
          in: query
          required: true
          schema:
            type: string
          description: User message
        - name: context
          in: query
          schema:
            type: string
          description: Optional context JSON string
        - name: sessionId
          in: query
          schema:
            type: string
          description: Conversation session ID for continuity
      responses:
        '200':
          description: Agent response received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInteractionResponse'
              example:
                agent_id: "agent-sustainability-expert-001"
                message: "?��??��??�述，貴?�司?�碳?�放主�?來自?��??��?（�?購電?��??�建議可以�?以�?幾個方?��??��?碳�?1. ?��?節?�設??.."
                session_id: "sess-abc123"
                timestamp: "2025-02-08T05:00:00Z"
                tokens_used: 1250
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/learn:
    post:
      tags:
        - Core API
      summary: Ingest New Knowledge
      description: Ingests new documents or data into the knowledge base
      operationId: ingestKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeIngestRequest'
            example:
              documents:
                - type: "pdf"
                  url: "https://example.com/report.pdf"
                  metadata:
                    title: "2024 ESG Report"
                    category: "esg_report"
                    tags:
                      - "sustainability"
                      - "annual_report"
                    language: "zh-TW"
                - type: "text"
                  content: |
                    碳中?��?Carbon Neutrality）是?�通�?減�?碳�??�並?��??��??�放�?                    使�?織�??��??�碳足跡淨值為?��?                  metadata:
                    title: "Carbon Neutrality Definition"
                    category: "glossary"
                    tags:
                      - "carbon"
                      - "neutrality"
                    language: "zh-TW"
              source: "user-upload"
              process_options:
                ocr_enabled: true
                language_detection: true
                chunk_size: 1000
                chunk_overlap: 200
      responses:
        '200':
          description: Knowledge ingested successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeIngestResponse'
              example:
                status: "success"
                documents_processed: 2
                chunks_created: 45
                embeddings_generated: true
                processing_time_seconds: 12.5
                metadata:
                  ingest_id: "ing-abc123"
                  source: "user-upload"
                  timestamp: "2025-02-08T05:00:00Z"

  /api/knowledge/search:
    get:
      tags:
        - Core API
      summary: Search Knowledge Base
      description: Searches the knowledge base for relevant documents
      operationId: searchKnowledge
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: filters
          in: query
          schema:
            type: string
          description: JSON-encoded filter criteria
        - name: topK
          in: query
          schema:
            type: integer
            default: 5
            maximum: 20
          description: Number of results to return
        - name: threshold
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 1
            default: 0.7
          description: Minimum relevance score threshold
      responses:
        '200':
          description: Search results retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSearchResponse'
              example:
                query: "如�??��?碳盤??
                results:
                  - id: "doc-001"
                    title: "ISO 14064-1 碳盤?��???
                    content: "碳盤?��?第�?步是?��?組�??��?..."
                    score: 0.92
                    source: "knowledge_base"
                    category: "guideline"
                    metadata:
                      language: "zh-TW"
                      published_date: "2024-12-01"
                  - id: "doc-002"
                    title: "溫室�???�查實�??��?"
                    content: "?��?溫室�???�查?��??�要�?識別?�?��??��?..."
                    score: 0.87
                    source: "knowledge_base"
                    category: "handbook"
                    metadata:
                      language: "zh-TW"
                      published_date: "2024-11-15"
                processing_time_ms: 156

  # ============================================================
  # ADVANCED API ENDPOINTS
  # ============================================================
  
  /api/swarm:
    post:
      tags:
        - Advanced API
      summary: Launch Swarm Intelligence
      description: Launches a swarm of AI agents to solve complex problems
      operationId: launchSwarm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwarmRequest'
            example:
              objective: "?��?並優?�公?��? ESG 永�?策略"
              agents:
                - role: "coordinator"
                  agent_id: "agent-sustainability-expert-001"
                  config:
                    enable_reasoning: true
                - role: "analyst"
                  agent_id: "agent-carbon-accountant-001"
                  config:
                    focus_areas:
                      - "scope_1_emissions"
                      - "scope_2_emissions"
                - role: "researcher"
                  agent_id: "agent-researcher-001"
                  config:
                    max_sources: 10
              coordination_mode: "hierarchical"
              max_iterations: 5
              timeout_seconds: 300
              output_format: "detailed_report"
      responses:
        '200':
          description: Swarm launched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwarmResponse'
              example:
                swarm_id: "swarm-abc123"
                status: "running"
                started_at: "2025-02-08T05:00:00Z"
                agents:
                  - role: "coordinator"
                    agent_id: "agent-sustainability-expert-001"
                    status: "active"
                  - role: "analyst"
                    agent_id: "agent-carbon-accountant-001"
                    status: "active"
                progress: 0
                estimated_completion: "2025-02-08T05:05:00Z"

  /api/anchor:
    post:
      tags:
        - Advanced API
      summary: Anchor Data Hash
      description: Anchors data hash to blockchain for immutability proof
      operationId: anchorDataHash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnchorRequest'
            example:
              data_hash: "sha256:a1b2c3d4e5f6..."
              data_type: "esg_report"
              metadata:
                report_id: "rpt-2024-q4-001"
                company_id: "co-001"
                period: "2024-Q4"
                checksum: "md5:..."
      responses:
        '200':
          description: Data hash anchored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchorResponse'
              example:
                anchor_id: "anch-abc123"
                tx_hash: "0x1a2b3c4d5e6f..."
                block_number: 18500000
                timestamp: "2025-02-08T05:00:00Z"
                network: "polygon"
                status: "confirmed"
                verification_url: "https://polygonscan.com/tx/0x1a2b..."

  /api/zkp/verify:
    post:
      tags:
        - Advanced API
      summary: Verify Zero-Knowledge Proof
      description: Verifies a zero-knowledge proof for data integrity
      operationId: verifyZKP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZKPVerifyRequest'
            example:
              proof: "zk_snark_proof_data..."
              public_inputs:
                - "data_hash"
                - "timestamp"
              proof_type: "groth16"
              circuit_id: "esg_data_integrity_v1"
      responses:
        '200':
          description: Proof verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZKPVerifyResponse'
              example:
                valid: true
                proof_type: "groth16"
                verification_time_ms: 45
                details:
                  constraint_system_satisfied: true
                  public_inputs_verified: true

  /api/report/generate:
    post:
      tags:
        - Advanced API
      summary: Generate System Report
      description: Generates comprehensive ESG or system reports
      operationId: generateReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportGenerateRequest'
            example:
              report_type: "esg_annual"
              parameters:
                company_id: "co-001"
                report_period:
                  start: "2024-01-01"
                  end: "2024-12-31"
                sections:
                  - "executive_summary"
                  - "environmental"
                  - "social"
                  - "governance"
                  - "financial"
                template_id: "tpl-esg-gri-2024"
                language: "zh-TW"
                output_format: "pdf"
                include_charts: true
                include_raw_data: false
      responses:
        '200':
          description: Report generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportGenerateResponse'
              example:
                report_id: "rpt-abc123"
                status: "completed"
                generated_at: "2025-02-08T05:00:00Z"
                download_url: "https://storage.example.com/reports/rpt-abc123.pdf"
                pages: 85
                file_size_bytes: 2457600
                checksum: "sha256:..."

  # ============================================================
  # UNIVERSAL AGENT PROTOCOL ENDPOINTS
  # ============================================================
  
  /api/v1/log-step:
    post:
      tags:
        - Universal Agent Protocol
      summary: Log Agent Step
      description: Logs a step in an agent's execution for tracking
      operationId: logAgentStep
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogStepRequest'
            example:
              task_id: "task-abc123"
              agent_id: "agent-sustainability-expert-001"
              step_number: 3
              step_type: "reasoning"
              description: "?��?碳�??�數?�並計�?減碳潛�?"
              input_data:
                emissions_data: {...}
              output_data:
                analysis_result: {...}
              metadata:
                duration_ms: 2500
                tokens_used: 850
                model: "gemini-2.0-flash"
      responses:
        '200':
          description: Step logged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogStepResponse'
              example:
                log_id: "log-abc123"
                status: "recorded"
                timestamp: "2025-02-08T05:00:00Z"

  /api/v1/task-finish:
    post:
      tags:
        - Universal Agent Protocol
      summary: Finish Agent Task
      description: Marks a task as completed with final results
      operationId: finishAgentTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskFinishRequest'
            example:
              task_id: "task-abc123"
              agent_id: "agent-sustainability-expert-001"
              status: "completed"
              final_output:
                summary: "完�? ESG 策略?��??��?"
                recommendations:
                  - "?��??��?使用?��?"
                  - "建�?碳管?�系�?
                  - "?��?供�??��?�?
                metrics:
                  emissions_reduction_potential: "25%"
                  estimated_cost_savings: "NT$500??�?
              total_steps: 8
              total_tokens_used: 12500
              total_duration_ms: 45000
      responses:
        '200':
          description: Task finished successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskFinishResponse'
              example:
                task_id: "task-abc123"
                status: "completed"
                completed_at: "2025-02-08T05:00:00Z"
                task_hash: "sha256:task_hash..."

  /api/v1/project-lock:
    post:
      tags:
        - Universal Agent Protocol
      summary: Lock Project
      description: Locks a project for exclusive agent access
      operationId: lockProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectLockRequest'
            example:
              project_id: "proj-abc123"
              agent_id: "agent-sustainability-expert-001"
              lock_type: "exclusive"
              reason: "Generating comprehensive ESG report"
              ttl_seconds: 3600
      responses:
        '200':
          description: Project locked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectLockResponse'
              example:
                lock_id: "lock-abc123"
                project_id: "proj-abc123"
                agent_id: "agent-sustainability-expert-001"
                locked_at: "2025-02-08T05:00:00Z"
                expires_at: "2025-02-08T06:00:00Z"
                status: "locked"

  # ============================================================
  # WEBHOOK ENDPOINTS
  # ============================================================
  
  /api/amice/webhook:
    post:
      tags:
        - Webhooks
      summary: Amice Webhook
      description: Receives webhook events from Amice system
      operationId: amiceWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmiceWebhookRequest'
            example:
              event_type: "agent.completed"
              timestamp: "2025-02-08T05:00:00Z"
              data:
                agent_id: "agent-sustainability-expert-001"
                task_id: "task-abc123"
                result: "success"
              signature: "sha256=..."

  # ============================================================
  # ESG DATA ENDPOINTS
  # ============================================================
  
  /api/esg/metrics:
    get:
      tags:
        - ESG Data
      summary: Get Real-time ESG Metrics
      description: Returns real-time ESG metrics for the organization
      operationId: getESGMetrics
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum:
              - today
              - week
              - month
              - quarter
              - year
            default: "month"
          description: Time period for metrics
        - name: category
          in: query
          schema:
            type: string
            enum:
              - environmental
              - social
              - governance
              - all
            default: "all"
          description: ESG category filter
        - name: granularity
          in: query
          schema:
            type: string
            enum:
              - hourly
              - daily
              - weekly
              - monthly
            default: "daily"
          description: Data granularity
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ESGMetricsResponse'
              example:
                period:
                  start: "2025-01-01"
                  end: "2025-01-31"
                metrics:
                  environmental:
                    carbon_emissions:
                      total: 12500
                      unit: "tCO2e"
                      change_from_last_month: -8.5
                    energy_consumption:
                      total: 250000
                      unit: "kWh"
                      renewable_percentage: 35
                    waste_generation:
                      total: 150
                      unit: "tonnes"
                      recycling_rate: 78
                  social:
                    employee_count: 250
                    diversity_ratio: 0.45
                    training_hours: 12500
                    incident_rate: 0.02
                  governance:
                    board_meetings: 12
                    compliance_audits: 4
                    risk_assessments: 2
                    policy_updates: 8
                overall_score: 78.5
                trend: "improving"

  /api/news:
    get:
      tags:
        - ESG Data
      summary: Get Global News Intelligence
      description: Returns ESG-related global news and intelligence
      operationId: getGlobalNews
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum:
              - esg
              - sustainability
              - climate
              - regulation
              - all
            default: "all"
        - name: sources
          in: query
          schema:
            type: string
          description: Comma-separated news sources
        - name: language
          in: query
          schema:
            type: string
            default: "zh-TW"
          description: News language preference
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: News retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsResponse'
              example:
                total: 150
                page: 1
                pageSize: 20
                articles:
                  - id: "news-001"
                    title: "碳交?��???��?上路"
                    summary: "?�灣碳�?交�??�今日�???��?，為企業?��?碳�?交�??�管??.."
                    source: "?��???
                    url: "https://udn.com/..."
                    published_at: "2025-02-08T08:00:00Z"
                    category: "regulation"
                    sentiment: "positive"
                    tags:
                      - "碳�?交�?"
                      - "綠色?��?"
                  - id: "news-002"
                    title: "CBAM 碳�?稅�??�台??��?�業"
