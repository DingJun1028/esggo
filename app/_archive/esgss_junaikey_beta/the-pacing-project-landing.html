<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pacing Project - 跑步播客</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }
        .bebas {
            font-family: 'Bebas Neue', sans-serif;
        }
        .hard-edge {
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
        }
        .hard-edge-reverse {
            clip-path: polygon(20px 0, 100% 0, 100% 100%, 0 100%, 0 20px);
        }
        .diagonal-line {
            background: linear-gradient(45deg, transparent 48%, #fff 48%, #fff 52%, transparent 52%);
        }
        .hero-pattern {
            background-image: 
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .btn-hard {
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
            transition: all 0.2s ease;
        }
        .btn-hard:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0 #fff;
        }
        .glow-text {
            text-shadow: 0 0 40px rgba(255,255,255,0.3);
        }
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        function App() {
            const [scrolled, setScrolled] = useState(false);
            
            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);
            
            const platforms = [
                { name: 'Spotify', icon: '🎧', color: '#1DB954' },
                { name: 'Apple Podcasts', icon: '🎙️', color: '#fff' },
                { name: 'Google Podcasts', icon: '🔊', color: '#4285F4' },
                { name: 'YouTube', icon: '📺', color: '#FF0000' }
            ];
            
            const features = [
                { title: '賽事故事', desc: '頂尖跑者的真實賽事經驗' },
                { title: '配速策略', desc: '如何掌握完美配速' },
                { title: '訓練心法', desc: '科學化訓練方法公開' },
                { title: '恢復秘密', desc: '賽後恢復的關鍵知識' }
            ];
            
            return (
                <div className="min-h-screen bg-black">
                    {/* Navigation */}
                    <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${scrolled ? 'bg-black/95 backdrop-blur-sm py-3' : 'bg-transparent py-6'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-white flex items-center justify-center hard-edge">
                                    <span className="bebas text-black text-xl">PP</span>
                                </div>
                                <span className="bebas text-2xl tracking-wider">THE PACING PROJECT</span>
                            </div>
                            <div className="hidden md:flex items-center gap-8">
                                <a href="#about" className="text-sm uppercase tracking-widest hover:text-gray-300 transition-colors">關於</a>
                                <a href="#episodes" className="text-sm uppercase tracking-widest hover:text-gray-300 transition-colors">集數</a>
                                <a href="#subscribe" className="text-sm uppercase tracking-widest hover:text-gray-300 transition-colors">訂閱</a>
                            </div>
                        </div>
                    </nav>
                    
                    {/* Hero Section */}
                    <section className="relative min-h-screen flex items-center hero-pattern">
                        {/* Diagonal accent lines */}
                        <div className="absolute top-0 left-0 w-full h-full diagonal-line opacity-20"></div>
                        <div className="absolute top-20 -left-20 w-96 h-96 bg-white/5 hard-edge"></div>
                        <div className="absolute bottom-20 -right-20 w-64 h-64 bg-white/5 hard-edge-reverse"></div>
                        
                        <div className="max-w-7xl mx-auto px-6 py-32 relative z-10">
                            <div className="grid lg:grid-cols-2 gap-12 items-center">
                                <div>
                                    <div className="inline-block border border-white/30 px-4 py-2 mb-6 animate-fade-in stagger-1">
                                        <span className="text-xs uppercase tracking-[0.3em] text-gray-400">跑步播客</span>
                                    </div>
                                    <h1 className="bebas text-6xl md:text-8xl lg:text-9xl leading-none mb-6 glow-text animate-fade-in stagger-2">
                                        跑步的<br/>
                                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">藝術</span>
                                    </h1>
                                    <p className="text-xl md:text-2xl text-gray-400 max-w-xl mb-10 leading-relaxed animate-fade-in stagger-3">
                                        關於賽事與正確配速的<span className="text-white font-semibold">故事與 lessons</span>
                                    </p>
                                    <div className="flex flex-wrap gap-4 animate-fade-in stagger-4">
                                        {platforms.map((platform, index) => (
                                            <a 
                                                key={index}
                                                href="#"
                                                className="btn-hard bg-white text-black px-6 py-3 flex items-center gap-3 hover:bg-gray-200"
                                            >
                                                <span>{platform.icon}</span>
                                                <span className="text-sm font-semibold uppercase tracking-wide">{platform.name}</span>
                                            </a>
                                        ))}
                                    </div>
                                </div>
                                <div className="relative hidden lg:block">
                                    <div className="relative">
                                        {/* Abstract running figure */}
                                        <svg viewBox="0 0 400 500" className="w-full h-auto">
                                            <defs>
                                                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                                    <stop offset="0%" style={{stopColor:'white',stopOpacity:0.1}} />
                                                    <stop offset="100%" style={{stopColor:'white',stopOpacity:0.05}} />
                                                </linearGradient>
                                            </defs>
                                            {/* Hard angle shapes */}
                                            <polygon points="0,0 400,0 400,100" fill="white" opacity="0.1"/>
                                            <polygon points="0,500 400,500 0,400" fill="white" opacity="0.1"/>
                                            <polygon points="200,150 350,150 350,350 200,350" fill="url(#grad1)" stroke="white" strokeWidth="2"/>
                                            <polygon points="50,200 150,200 150,400 50,400" fill="none" stroke="white" strokeWidth="1" opacity="0.3"/>
                                            <polygon points="250,250 380,250 380,450 250,450" fill="none" stroke="white" strokeWidth="1" opacity="0.3"/>
                                            {/* Running person abstract */}
                                            <circle cx="200" cy="180" r="30" fill="white"/>
                                            <line x1="200" y1="210" x2="200" y2="300" stroke="white" strokeWidth="4"/>
                                            <line x1="200" y1="240" x2="160" y2="200" stroke="white" strokeWidth="3"/>
                                            <line x1="200" y1="240" x2="240" y2="190" stroke="white" strokeWidth="3"/>
                                            <line x1="200" y1="300" x2="170" y2="380" stroke="white" strokeWidth="3"/>
                                            <line x1="200" y1="300" x2="230" y2="380" stroke="white" strokeWidth="3"/>
                                        </svg>
                                        {/* Floating stats */}
                                        <div className="absolute top-10 right-0 bg-white text-black p-4 hard-edge">
                                            <div className="bebas text-4xl">50+</div>
                                            <div className="text-xs uppercase tracking-wider">集數</div>
                                        </div>
                                        <div className="absolute bottom-20 left-0 bg-white/10 border border-white/30 p-4 hard-edge-reverse">
                                            <div className="bebas text-4xl">10K+</div>
                                            <div className="text-xs uppercase tracking-wider">跑者訂閱</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        {/* Scroll indicator */}
                        <div className="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2">
                            <span className="text-xs uppercase tracking-widest text-gray-500">Scroll</span>
                            <div className="w-6 h-10 border-2 border-white/30 flex justify-center pt-2">
                                <div className="w-1 h-3 bg-white animate-bounce"></div>
                            </div>
                        </div>
                    </section>
                    
                    {/* Features Section */}
                    <section id="about" className="py-24 relative">
                        <div className="max-w-7xl mx-auto px-6">
                            <div className="mb-16">
                                <span className="text-xs uppercase tracking-[0.3em] text-gray-500">What You'll Find</span>
                                <h2 className="bebas text-5xl md:text-7xl mt-4">節目內容</h2>
                            </div>
                            <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                                {features.map((feature, index) => (
                                    <div 
                                        key={index}
                                        className="group border border-white/20 p-8 hover:bg-white hover:text-black transition-all duration-300 hard-edge"
                                    >
                                        <div className="bebas text-4xl mb-4 text-white group-hover:text-black">0{index + 1}</div>
                                        <h3 className="bebas text-2xl mb-2">{feature.title}</h3>
                                        <p className="text-gray-400 group-hover:text-gray-600 text-sm">{feature.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>
                    
                    {/* CTA Section */}
                    <section id="subscribe" className="py-24 relative overflow-hidden">
                        <div className="absolute inset-0 bg-white hard-edge-reverse"></div>
                        <div className="max-w-4xl mx-auto px-6 relative z-10 text-center">
                            <h2 className="bebas text-5xl md:text-7xl text-black mb-6">開始聆聽</h2>
                            <p className="text-xl text-gray-700 mb-10 max-w-2xl mx-auto">
                                訂閱 The Pacing Project，成為更聰明的跑者
                            </p>
                            <div className="flex flex-wrap justify-center gap-4">
                                {platforms.map((platform, index) => (
                                    <button 
                                        key={index}
                                        className="btn-hard bg-black text-white px-8 py-4 flex items-center gap-3 hover:bg-gray-800"
                                    >
                                        <span>{platform.icon}</span>
                                        <span className="font-semibold uppercase tracking-wide">{platform.name}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </section>
                    
                    {/* Footer */}
                    <footer className="py-12 border-t border-white/20">
                        <div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-6">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-white flex items-center justify-center">
                                    <span className="bebas text-black text-sm">PP</span>
                                </div>
                                <span className="bebas text-lg tracking-wider">THE PACING PROJECT</span>
                            </div>
                            <p className="text-gray-500 text-sm">© 2026 The Pacing Project. All rights reserved.</p>
                        </div>
                    </footer>
                </div>
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
