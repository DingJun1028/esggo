global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 2048

    # SSL 設定
    ssl-default-bind-ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000
    timeout client 50000
    timeout server 50000
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# 統計頁面
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST

# 前端 - HTTP
frontend http_front
    bind *:80
    option forwardfor except 127.0.0.1
    default_backend http_back

# 前端 - HTTPS
frontend https_front
    bind *:443 ssl crt /etc/ssl/certs/esg-dashboard.pem
    option forwardfor except 127.0.0.1
    default_backend https_back

# HTTP 後端 (重定向到 HTTPS)
backend http_back
    redirect scheme https if !{ ssl_fc }

# HTTPS 後端
backend https_back
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    # ESG 儀表板服務器
    server esg-dashboard-01 esg-dashboard-01:80 check
    server esg-dashboard-02 esg-dashboard-02:80 check
    server esg-dashboard-03 esg-dashboard-03:80 check

# API 後端
backend api_back
    balance leastconn
    option httpchk GET /health
    http-check expect status 200

    # ESG API 服務器
    server esg-api-01 esg-api-01:3001 check
    server esg-api-02 esg-api-02:3001 check
    server esg-api-03 esg-api-03:3001 check

# 靜態資源後端 (更快)
backend static_back
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    # 專用靜態資源服務器
    server esg-static-01 esg-static-01:80 check
    server esg-static-02 esg-static-02:80 check

# ACL 規則 - 路由到不同後端
frontend https_front
    # 靜態資源
    acl is_static path_end .js .css .png .jpg .jpeg .gif .ico .svg .woff .woff2 .ttf .eot
    use_backend static_back if is_static

    # API 請求
    acl is_api path_beg /api/
    use_backend api_back if is_api

    # 主要應用
    default_backend https_back