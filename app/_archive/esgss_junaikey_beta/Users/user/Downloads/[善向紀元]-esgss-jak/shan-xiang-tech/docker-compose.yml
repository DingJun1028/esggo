version: '3.8'

services:
  # 善向技術學習平台前端
  shan-xiang-web:
    image: nginx:alpine
    container_name: shan-xiang-web
    ports:
      - "8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - shan-xiang-network
    restart: unless-stopped

  # 善向技術 API 服務
  shan-xiang-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: shan-xiang-api
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
    volumes:
      - ./db.json:/app/db.json
    networks:
      - shan-xiang-network
    restart: unless-stopped
    depends_on:
      - shan-xiang-web

  # 善向技術代理執行環境 (可選)
  shan-xiang-runner:
    image: node:20-alpine
    container_name: shan-xiang-runner
    working_dir: /app
    command: sh -c "npm install && node examples/crewai-multiagent-example.js"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - shan-xiang-network
    profiles:
      - runner
    restart: "no"

volumes:
  shan-xiang-logs:
    driver: local

networks:
  shan-xiang-network:
    driver: bridge