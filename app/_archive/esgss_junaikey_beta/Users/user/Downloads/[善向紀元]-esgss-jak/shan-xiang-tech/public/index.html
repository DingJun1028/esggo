<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>善向技術 - AI 代理學習平台 [內部識別代號]</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }

        .logo {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .tagline {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 3rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1.1rem;
            color: #666;
        }

        .courses-section {
            margin-bottom: 50px;
        }

        .section-title {
            color: white;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .course-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .course-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .course-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }

        .course-platform {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .course-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .course-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .course-body {
            padding: 20px;
        }

        .course-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .course-highlights {
            margin-bottom: 15px;
        }

        .highlight-item {
            background: #f8f9fa;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin: 2px;
            display: inline-block;
        }

        .course-footer {
            padding: 15px 20px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
        }

        .course-link {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .course-link:hover {
            background: #5a6fd8;
        }

        .learning-paths {
            margin-bottom: 50px;
        }

        .paths-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .path-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .path-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .path-description {
            color: #666;
            margin-bottom: 20px;
        }

        .path-duration {
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .path-courses {
            list-style: none;
        }

        .path-courses li {
            padding: 5px 0;
            border-left: 3px solid #667eea;
            padding-left: 15px;
            margin: 5px 0;
            font-size: 0.9rem;
        }

        .footer {
            text-align: center;
            color: white;
            padding: 40px 0;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .footer-section h3 {
            margin-bottom: 15px;
            color: white;
        }

        .footer-section p, .footer-section a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            line-height: 1.6;
        }

        .footer-section a:hover {
            color: white;
        }

        .copyright {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .courses-grid {
                grid-template-columns: 1fr;
            }

            .paths-grid {
                grid-template-columns: 1fr;
            }

            .section-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 頁首 -->
        <header class="header">
            <h1 class="logo">🌟 善向技術</h1>
            <p class="tagline">AI 代理學習平台 [內部識別代號] - 2026 年人工智慧代理建構指南</p>

        <!-- 統計數據 -->
        <section class="stats">
            <div class="stat-card">

        <section class="courses-section">

        <!-- 學習路徑 -->
        <section class="learning-paths">

    </div>

    <!-- 頁尾 -->
    <footer class="footer">

                </div>
                <div class="footer-section">

                    <p><a href="#courses">課程列表</a></p>
                    <p><a href="#paths">學習路徑</a></p>
                    <p><a href="#examples">實作範例</a></p>
                </div>
                <div class="footer-section">
                    <h3>聯絡我們</h3>

                    <p><a href="https://github.com/shan-xiang-tech">GitHub</a></p>
                    <p><a href="https://community.shan-xiang.com">社群論壇</a></p>
                </div>
            </div>
            <div class="copyright">

                <p>讓我們一起探索 AI 代理的無限可能！🚀</p>
            </div>
        </div>
    </footer>

                level: '中級',
                category: '工作流程編排',
                description: '深入學習 LangGraph，這是一個基於圖的編排框架，用於建立複雜的代理工作流程。',
                highlights: ['圖基編排概念', '複雜工作流程設計', '實踐練習'],

            {

                instructor: 'Dawn Song',
                duration: '4 小時 4 分鐘',
                level: '進階',
                category: '代理架構',
                description: '結構化介紹代理架構、決策循環和多代理協作，適合學術學習者和研究人員。',

                highlights: ['短期記憶實現', '長期記憶策略', '向量儲存'],

            {
                id: 'llamaindex-rag',
                title: '使用 LlamaIndex 建構智慧型 RAG',

                highlights: ['RAG 技術原理', 'LlamaIndex 整合', '知識庫代理'],
                url: 'https://learn.deeplearning.ai/courses/building-llm-applications-with-llamaindex',
                tags: ['LlamaIndex', 'RAG', '檢索增強']
            }
        ];

        // 學習路徑數據
        const learningPaths = [
            {
                id: 'beginner',
                title: '初學者路徑',
                description: '適合 AI 代理初學者',
                duration: '4-6 周',
                courses: [
                    'prompt-engineering-aws',
                    'langgraph-intro'
                ]
            },
            {
                id: 'intermediate',
                title: '中級路徑',
                description: '掌握多代理系統和進階框架',
                duration: '6-8 周',
                courses: [
                    'crewai-multiagent',
                    'autogen-patterns'
                ]
            },
            {
                id: 'advanced',
                title: '高級路徑',
                description: '企業級應用和多模態代理',
                duration: '8-12 周',
                courses: [
                    'multimodal-agents',
                    'llamaindex-rag'
                ]
            }
        ];

        // 渲染課程卡片
        function renderCourses() {
            const grid = document.getElementById('courses-grid');

            courses.forEach(course => {
                const card = document.createElement('div');
                card.className = 'course-card';

                card.innerHTML = `
                    <div class="course-header">
                        <div class="course-platform">${course.platform}</div>
                        <div class="course-title">${course.title}</div>
                        <div class="course-meta">
                            <span>${course.level}</span>
                            <span>${course.duration}</span>
                        </div>
                    </div>
                    <div class="course-body">
                        <div class="course-description">${course.description}</div>
                        <div class="course-highlights">
                            ${course.highlights.map(highlight =>
                                `<span class="highlight-item">${highlight}</span>`
                            ).join('')}
                        </div>
                    </div>
                    <div class="course-footer">
                        <a href="${course.url}" class="course-link" target="_blank">開始學習</a>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // 渲染學習路徑
        function renderLearningPaths() {
            const grid = document.getElementById('paths-grid');

            learningPaths.forEach(path => {
                const card = document.createElement('div');
                card.className = 'path-card';

                const courseItems = path.courses.map(courseId => {
                    const course = courses.find(c => c.id === courseId);
                    return course ? `<li>${course.title}</li>` : '';
                }).join('');

                card.innerHTML = `
                    <div class="path-title">${path.title}</div>
                    <div class="path-description">${path.description}</div>
                    <div class="path-duration">建議時長：${path.duration}</div>
                    <ul class="path-courses">
                        ${courseItems}
                    </ul>
                `;

                grid.appendChild(card);
            });
        }

        // 初始化頁面
        document.addEventListener('DOMContentLoaded', () => {
            renderCourses();
            renderLearningPaths();
        });
    </script>
</body>
</html>
