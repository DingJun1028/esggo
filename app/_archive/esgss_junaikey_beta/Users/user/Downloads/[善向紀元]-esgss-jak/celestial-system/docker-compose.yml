version: '3.8'
services:
db:
image: pgvector/pgvector:pg16
container_name: junaikeydb-db
restart: always
environment:
POSTGRES_USER: junaikeydb_admin
POSTGRES_PASSWORD: ${DB_PASSWORD:-junaikeydb_secret}
POSTGRES_DB: junaikeydb_db
volumes:
- postgres_data:/var/lib/postgresql/data
- ./init.sql:/docker-entrypoint-initdb.d/init.sql
networks:
- junaikeydb-net

redis:
image: redis:alpine
container_name: junaikeydb-redis
restart: always
networks:
- junaikeydb-net

backend:
build: ./junaikeydb-server
container_name: junaikeydb-backend
restart: always
depends_on:
- db
- redis
environment:
PORT: 3000
DATABASE_URL: postgres://junaikeydb_admin:${DB_PASSWORD:-junaikeydb_secret}@db:5432/junaikeydb_db
GEMINI_API_KEY: ${GEMINI_API_KEY}
ADMIN_SECRET: ${ADMIN_SECRET}
OPENAI_API_KEY: ${OPENAI_API_KEY}
volumes:
- ./backups:/backups
networks:
- junaikeydb-net

worker:
build: ./junaikeydb-server
container_name: junaikeydb-worker
command: node worker.js
restart: always
depends_on:
- backend
- redis
environment:
DATABASE_URL: postgres://junaikeydb_admin:${DB_PASSWORD:-junaikeydb_secret}@db:5432/junaikeydb_db
GEMINI_API_KEY: ${GEMINI_API_KEY}
networks:
- junaikeydb-net

volumes:
postgres_data:

networks:
junaikeydb-net:
driver: bridge