version: '3.8'

services:
  # Next.js 應用
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: infoone-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ETERNAL_MODE=true
    networks:
      - infoone-network
    restart: unless-stopped

  # Supabase PostgreSQL (Local Development / Private Cloud)
  supabase-db:
    image: supabase/postgres:15.1.0.147
    container_name: infoone-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infoone_secure_pw}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    networks:
      - infoone-network
    restart: unless-stopped

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: infoone-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - infoone-network
    depends_on:
      - app
    restart: unless-stopped

networks:
  infoone-network:
    driver: bridge

volumes:
  postgres-data:
