<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧞 奧秘精靈 - 快速跳轉</title>
    <meta http-equiv="refresh" content="0; url=http://localhost:3000/report-hub">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 16px;
        }

        p {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .manual-link {
            margin-top: 30px;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            display: inline-block;
            font-weight: 700;
            transition: all 0.3s;
        }

        .manual-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">🧞</div>
        <h1>正在開啟奧秘精靈...</h1>
        <p>自動跳轉至 Report Hub</p>
        <div class="loader"></div>

        <div style="margin-top: 40px;">
            <a href="http://localhost:3000/test-report-hub" class="manual-link">
                點此手動跳轉
            </a>
        </div>

        <div style="margin-top: 30px; font-size: 14px; opacity: 0.7;">
            <p>如果未自動跳轉，請點擊上方按鈕</p>
            <p style="margin-top: 10px;">或訪問：<code
                    style="background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 4px;">localhost:3000/test-report-hub</code>
            </p>
        </div>
    </div>
</body>

</html>
