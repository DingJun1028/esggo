
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    client_max_body_size 50M; # Support large ESG data/images

    # Upstream definition for Load Balancing (Global Cluster)
    upstream esg_backend_cluster {
        least_conn; # More efficient for variable length AI tasks
        server esg-backend:3001; 
        # server esg-backend-02:3001 backup; # Scalability placeholder
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check for the Gateway itself
        location /health {
            access_log off;
            return 200 '{"status":"Gateway Online","v":"6.0.0"}';
            add_header Content-Type application/json;
        }

        # Unified Frontend API Proxy
        location /api/ {
            proxy_pass http://esg_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Resilience: Retry on failure
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        # Shan Xiang AI Proxy
        location /shanxiang/ {
            proxy_pass http://shan-xiang-backend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # JunAiKey AI Proxy (Mapped to Shan Xiang)
        location /junaikey/ {
            proxy_pass http://shan-xiang-backend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Neural Core Frontend (SPA)
        location / {
            proxy_pass http://esg-frontend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
