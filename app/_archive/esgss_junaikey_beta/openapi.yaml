openapi: 3.0.3
info:
  title: Omni Celestial Server API - v10.0-omni
  description: |-
    API for the ESGss JunAiKey Beta (Omni Server). 
    Provides endpoints for managing ESG metrics, AI agents, knowledge base, swarm intelligence, and more, in compliance with the Omni Agent Protocol (5T).
  version: 10.0.0-omni
servers:
  - url: https://esg-dashboard-c3ytffo5qq-de.a.run.app
    description: Production Server
  - url: http://localhost:3001
    description: Development Server

# 1. Define Security Scheme
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT # or Opaque, depending on the token type
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: 'online'
        service:
          type: string
          example: 'Celestial Neural Core'
        version:
          type: string
          example: '10.0.0-universe'
        timestamp:
          type: string
          format: date-time
        protocol:
          type: string
          example: '5T compliant'
        database:
          type: object
          properties:
            status:
              type: string
              example: 'connected'
            version:
              type: string
              example: 'PostgreSQL 14.5'
        redis:
          type: object
          properties:
            status:
              type: string
              example: 'connected'
            version:
              type: string
              example: '7.2.3'
        workers:
          type: string
          example: 'active'
    Agent:
      type: object
      properties:
        id:
          type: string
          example: 'agent_id_1'
        name:
          type: string
          example: 'ESG Analyst'
        base_model:
          type: string
          example: 'gemini-2.0-flash-exp'
        system_prompt:
          type: string
          example: 'You are an expert ESG analyst...'
        skills:
          type: array
          items:
            type: string
          example: ['web_search', 'financial_analysis']
    KnowledgeIngestResponse:
      type: object
      properties:
        status:
          type: string
          example: 'success'
        message:
          type: string
          example: 'Knowledge ingested successfully'
        chunkId:
          type: string
          example: 'vector_db_chunk_id'
        source:
          type: string
          example: 'https://example.com/report.pdf'
    KnowledgeSearchResult:
      type: object
      properties:
        id:
          type: string
          example: 'vector_db_chunk_id'
        content:
          type: string
          example: 'The new carbon emission standard is...'
        similarity:
          type: number
          format: float
          example: 0.95
        metadata:
          type: object
          properties:
            year:
              type: integer
              example: 2025
        source:
          type: string
          example: 'https://example.com/report.pdf'
    SwarmResponse:
      type: object
      properties:
        status:
          type: string
          example: 'success'
        finalOutput:
          type: string
          example: 'The final summary report...'
        plan:
          type: string
          example: 'Step 1: Research regulations. Step 2: ...'
        history:
          type: array
          items:
            type: object
    AnchorResponse:
      type: object
      properties:
        transactionHash:
          type: string
          example: '0x...'
        blockNumber:
          type: integer
          example: 123456
        message:
          type: string
          example: 'Hash anchored successfully.'

# 2. Apply Security Globally
security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      summary: System Health
      description: Checks the running status of core services.
      tags:
        - System
      security: [] # This endpoint is exempt from auth
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/manifest:
    post:
      summary: Manifest AI Agent
      description: Creates a new Agent session and "awakens" an AI model instance for it.
      tags:
        - Core API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source_agent:
                  oneOf:
                    - type: string
                    - type: object
                      properties:
                        name:
                          type: string
                        system_prompt:
                          type: string
                overrides:
                  type: object
                  properties:
                    mask:
                      type: object
                      properties:
                        tone:
                          type: string
                        language:
                          type: string
      responses:
        '200':
          description: Agent session created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                  status:
                    type: string
                  agentName:
                    type: string
                  agentId:
                    type: string

  /api/agents:
    get:
      summary: List Available Agents
      description: Lists all available agents in the database.
      tags:
        - Core API
      responses:
        '200':
          description: A list of agents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Agent'

  /api/agents/{id}:
    get:
      summary: Get Agent Details
      description: Gets detailed information for a specific agent.
      tags:
        - Core API
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'

  /api/interact:
    get:
      summary: Interact with an Agent
      description: Engages in a real-time interaction with an awakened Agent session using Server-Sent Events (SSE).
      tags:
        - Core API
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
        - name: message
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: An SSE stream of interaction events.
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"type": "thought", "content": "Thinking..."}
                  data: {"type": "text", "content": "Response part 1"}

  /api/learn:
    post:
      summary: Ingest New Knowledge
      description: Injects new knowledge into a specified Knowledge Base.
      tags:
        - Core API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kbId:
                  type: string
                text:
                  type: string
                source:
                  type: string
                metadata:
                  type: object
      responses:
        '200':
          description: Knowledge ingested successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeIngestResponse'

  /api/knowledge/search:
    get:
      summary: Search Knowledge Base
      description: Searches for relevant information within a specified knowledge base.
      tags:
        - Core API
      parameters:
        - name: kbId
          in: query
          schema:
            type: string
            default: 'default'
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: topK
          in: query
          schema:
            type: integer
            default: 3
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  query:
                    type: string
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/KnowledgeSearchResult'

  /api/swarm:
    post:
      summary: Launch Swarm Intelligence
      description: Initiates a LangGraph-based agent swarm to solve a complex goal.
      tags:
        - Advanced API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                goal:
                  type: string
      responses:
        '200':
          description: Swarm task completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwarmResponse'

  /api/anchor:
    post:
      summary: Anchor Data Hash
      description: Anchors a data hash onto the blockchain to create an immutable timestamp.
      tags:
        - Advanced API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hash:
                  type: string
                metadata:
                  type: object
      responses:
        '200':
          description: Hash anchored successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchorResponse'

  /api/zkp/verify:
    post:
      summary: Verify Zero-Knowledge Proof
      description: Verifies a Zero-Knowledge Proof.
      tags:
        - Advanced API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                proof:
                  type: object
                signals:
                  type: array
                  items: {}
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean

  /api/report/generate:
    post:
      summary: Generate System Report
      description: Generates a generic report based on the system's current state.
      tags:
        - Advanced API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum: [json, markdown]
      responses:
        '200':
          description: Generated report.
          content:
            application/json: # The response content-type will vary based on format
              schema:
                type: object
                properties:
                  status:
                    type: string
                  format:
                    type: string
                  report:
                    type: object

  /api/v1/log-step:
    post:
      summary: Log Agent Step
      description: Logs a step performed by an external agent (5T Protocol).
      tags:
        - Omni Agent Protocol
      responses:
        '200':
          description: Step logged.

  /api/v1/task-finish:
    post:
      summary: Finish Agent Task
      description: Marks a task as finished and provides the final result (5T Protocol).
      tags:
        - Omni Agent Protocol
      responses:
        '200':
          description: Task finished.

  /api/v1/project-lock:
    post:
      summary: Lock Project
      description: Marks a project as completed by an agent (5T Protocol).
      tags:
        - Omni Agent Protocol
      responses:
        '200':
          description: Project locked.

  /api/amice/webhook:
    post:
      summary: Amice Webhook
      description: Receives events from the Amice service.
      tags:
        - Webhooks
      parameters:
        - name: x-amice-signature
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook received.

  /api/esg/metrics:
    get:
      summary: Get Real-time ESG Metrics
      description: Retrieves current simulated real-time ESG scores.
      tags:
        - Other API
      responses:
        '200':
          description: Current ESG scores.

  /api/news:
    get:
      summary: Get Global News Intelligence
      description: Fetches global news intelligence.
      tags:
        - Other API
      responses:
        '200':
          description: News articles.
