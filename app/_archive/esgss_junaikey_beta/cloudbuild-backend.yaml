steps:
  # Step 1: Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/junaikey-genesis/esg-api-server:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '.'
    id: 'build-backend'

  # Step 2: Push Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/junaikey-genesis/esg-api-server:latest'
    id: 'push-backend'
    waitFor: ['build-backend']

  # Step 3: Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'esg-api-server'
      - '--image=gcr.io/junaikey-genesis/esg-api-server:latest'
      - '--region=asia-east1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=esg-dashboard-runner@junaikey-genesis.iam.gserviceaccount.com'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0' # Save cost for dev
      - '--max-instances=5'
      - '--port=3001' # Important: Match server.js port
    id: 'deploy-backend'
    waitFor: ['push-backend']

images:
  - 'gcr.io/junaikey-genesis/esg-api-server:latest'

timeout: '1200s'
