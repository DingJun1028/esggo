<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global ESG Market Intelligence Center | JunAiKey Beta</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter & Noto Sans TC -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;400;700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --aqua-cyan: #63a6b0;
            --eternal-gold: #ffd700;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --aqua-glow: rgba(99, 166, 176, 0.3);
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background: radial-gradient(circle at top left, #0f172a, #1e293b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .aqua-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .aqua-text {
            color: var(--aqua-cyan);
        }

        .aqua-bg {
            background-color: var(--aqua-cyan);
        }

        .aqua-border {
            border-color: var(--aqua-cyan);
        }

        .gold-text {
            color: var(--eternal-gold);
        }

        .gold-glow {
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .sidebar-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-item:hover {
            background: rgba(99, 166, 176, 0.15);
            transform: translateX(4px);
        }

        .sidebar-item.active {
            background: rgba(99, 166, 176, 0.2);
            border-left: 4px solid var(--aqua-cyan);
        }

        .article-card {
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .article-card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: var(--aqua-cyan);
            box-shadow: 0 12px 40px var(--aqua-glow);
        }

        .article-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: 0.5s;
        }

        .article-card:hover::after {
            left: 100%;
        }

        @keyframes pulse-aqua {
            0% {
                box-shadow: 0 0 0 0 rgba(99, 166, 176, 0.4);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(99, 166, 176, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(99, 166, 176, 0);
            }
        }

        .animate-pulse-aqua {
            animation: pulse-aqua 2s infinite;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--aqua-cyan);
            border-radius: 10px;
        }

        /* Hexagon Pattern Overlay */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l25.98 15v30L30 60 4.02 45V15z' fill-opacity='0.02' fill='%2363a6b0' fill-rule='evenodd'/%3E%3C/svg%3E");
            z-index: -1;
            pointer-events: none;
        }

        .impact-badge {
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }
    </style>
</head>

<body class="custom-scrollbar">
    <div class="bg-pattern"></div>

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 aqua-glass border-r border-white/10 flex flex-col z-20">
            <div class="p-6 border-b border-white/10">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 aqua-bg rounded-lg flex items-center justify-center animate-pulse-aqua">
                        <i data-lucide="shield-check" class="text-white w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-black tracking-tight leading-none">MIC</h1>
                        <span class="text-[10px] uppercase tracking-widest aqua-text font-bold">ESG Intelligence</span>
                    </div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-2 custom-scrollbar" id="sourceFilters">
                <div class="text-[10px] uppercase tracking-[0.2em] text-white/40 font-black mb-4 px-2">主要情報源 (Primary
                    Sources)</div>
                <div class="sidebar-item active cursor-pointer p-3 rounded-xl flex items-center gap-3"
                    onclick="filterBySource('all')">
                    <i data-lucide="layers" class="w-4 h-4 text-white/60"></i>
                    <span class="text-xs font-bold">全部來源 (All)</span>
                </div>
                <!-- Dynamic Sources Here -->
            </div>

            <div class="p-6 border-t border-white/10 bg-white/5">
                <div class="text-[10px] font-black aqua-text uppercase tracking-widest mb-3">5T Protocol Verify</div>
                <div class="flex gap-2">
                    <div class="w-6 h-1 rounded-full aqua-bg"></div>
                    <div class="w-6 h-1 rounded-full aqua-bg opacity-50"></div>
                    <div class="w-6 h-1 rounded-full aqua-bg opacity-30"></div>
                </div>
                <div class="mt-4 flex items-center gap-2 text-[10px] font-bold text-white/40 italic">
                    <i data-lucide="cpu" class="w-3 h-3"></i>
                    Omni-Mind Sub-Agent active
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="h-20 aqua-glass border-b border-white/10 px-8 flex items-center justify-between">
                <div class="flex items-center gap-6">
                    <div class="relative group">
                        <i data-lucide="search"
                            class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-white/40 group-focus-within:aqua-text transition-colors"></i>
                        <input type="text" id="searchInput" placeholder="搜尋關鍵字或研究機構..."
                            class="bg-black/20 border border-white/10 rounded-full py-2 pl-10 pr-6 text-xs font-bold focus:outline-none focus:border-aqua-cyan/50 focus:ring-4 focus:ring-aqua-cyan/10 transition-all w-80">
                    </div>

                    <div class="h-8 w-px bg-white/10"></div>

                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span class="text-[10px] font-black uppercase tracking-wider text-white/60">Live Stream
                                active</span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <button
                        class="p-2 rounded-lg bg-white/5 border border-white/10 hover:aqua-bg hover:text-white transition-all">
                        <i data-lucide="bell" class="w-4 h-4"></i>
                    </button>
                    <button
                        class="flex items-center gap-2 px-4 py-2 aqua-bg text-white rounded-full text-xs font-black shadow-lg shadow-aqua-cyan/20 hover:scale-105 active:scale-95 transition-all"
                        onclick="openAddSourceModal()">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        新增監測項目 (Add Source)
                    </button>
                </div>
            </header>

            <!-- Grid Content -->
            <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">
                <div class="mb-8 flex items-end justify-between">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span
                                class="text-xs font-black gold-text gold-glow uppercase tracking-[0.3em]">Omni-Vision</span>
                            <div class="h-px w-12 aqua-bg"></div>
                        </div>
                        <h2 class="text-3xl font-black tracking-tighter">全球永續商情動態 <span
                                class="aqua-text font-light">(Market Intelligence)</span></h2>
                    </div>
                    <div class="flex flex-col items-end gap-1">
                        <span class="text-[10px] font-black opacity-40 uppercase">Last updated: <span
                                id="lastUpdate">Just now</span></span>
                        <div class="text-[10px] font-black aqua-text">5T Protocol: <span class="text-white">SENTIENT &
                                TRUSTED</span></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="newsGrid">
                    <!-- Skeleton Loading -->
                    <div class="article-card aqua-glass rounded-3xl p-6 border border-white/5 animate-pulse">
                        <div class="h-4 w-1/3 bg-white/10 rounded mb-4"></div>
                        <div class="h-8 w-full bg-white/10 rounded mb-4"></div>
                        <div class="h-20 w-full bg-white/10 rounded"></div>
                    </div>
                    <div class="article-card aqua-glass rounded-3xl p-6 border border-white/5 animate-pulse">
                        <div class="h-4 w-1/3 bg-white/10 rounded mb-4"></div>
                        <div class="h-8 w-full bg-white/10 rounded mb-4"></div>
                        <div class="h-20 w-full bg-white/10 rounded"></div>
                    </div>
                    <div class="article-card aqua-glass rounded-3xl p-6 border border-white/5 animate-pulse">
                        <div class="h-4 w-1/3 bg-white/10 rounded mb-4"></div>
                        <div class="h-8 w-full bg-white/10 rounded mb-4"></div>
                        <div class="h-20 w-full bg-white/10 rounded"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for Adding Source -->
    <div id="addSourceModal"
        class="fixed inset-0 bg-black/80 backdrop-blur-xl z-50 hidden flex items-center justify-center p-4">
        <div class="aqua-glass w-full max-w-lg rounded-[2rem] border border-aqua-cyan/20 overflow-hidden">
            <div class="p-8 border-b border-white/10 flex justify-between items-center">
                <div>
                    <h3 class="text-xl font-black tracking-tight">新增情報探針</h3>
                    <p class="text-[10px] aqua-text font-bold uppercase tracking-widest mt-1">Deploy New Intelligence
                        Probe</p>
                </div>
                <button onclick="closeAddSourceModal()" class="text-white/40 hover:text-white"><i
                        data-lucide="x"></i></button>
            </div>
            <div class="p-8 space-y-6">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-white/60 mb-2">探針名稱 (Probe
                        Name)</label>
                    <input type="text" id="newSourceName" placeholder="例如: IEA Roadmap"
                        class="w-full bg-black/40 border border-white/10 rounded-xl py-3 px-4 text-xs font-bold focus:outline-none focus:aqua-border">
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-white/60 mb-2">目標網址
                        (Target URL)</label>
                    <input type="url" id="newSourceUrl" placeholder="https://..."
                        class="w-full bg-black/40 border border-white/10 rounded-xl py-3 px-4 text-xs font-bold focus:outline-none focus:aqua-border">
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-white/60 mb-2">監測頻率
                        (Cycle)</label>
                    <select id="newSourceFreq"
                        class="w-full bg-black/40 border border-white/10 rounded-xl py-3 px-4 text-xs font-bold focus:outline-none focus:aqua-border">
                        <option value="hourly">每小時 (Hourly)</option>
                        <option value="daily" selected>每日 (Daily)</option>
                        <option value="weekly">每週 (Weekly)</option>
                    </select>
                </div>
                <button
                    class="w-full py-4 aqua-bg text-white rounded-2xl font-black text-sm shadow-xl shadow-aqua-cyan/20 hover:scale-[1.02] transition-all"
                    onclick="submitNewSource()">
                    確認署名並啟動任務 (Deploy Probe)
                </button>
            </div>
        </div>
    </div>

    <script>
        // -- Supabase Configuration --
        const SUPABASE_URL = 'https://mruetmtibkbzfaawfjbm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ydWV0bXRpYmtiemZhYXdmamJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMwNDU0MjIsImV4cCI6MjA3ODYyMTQyMn0.PIBhYztcwZhmsFWd_8anuuj5sb8xoST-rHgAVH9kou8';

        // Use global supabase object from CDN
        let supabaseClient;

        let articles = [];
        let sources = [];
        let currentSourceFilter = 'all';

        // -- Lifecycle --
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // Wait for script to load
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                initData();
            } else {
                console.error('Supabase library not loaded');
            }

            // Search listener
            document.getElementById('searchInput').addEventListener('input', (e) => {
                renderArticles(e.target.value);
            });
        });

        async function initData() {
            await fetchSources();
            await fetchArticles();
            updateLastUpdateTime();

            // Poll for updates every 30 seconds
            setInterval(fetchArticles, 30000);
        }

        async function fetchSources() {
            const { data, error } = await supabaseClient
                .from('market_intelligence_sources')
                .select('*')
                .eq('is_active', true);

            if (data) {
                sources = data;
                renderSourceFilters();
            }
        }

        async function fetchArticles() {
            const { data, error } = await supabaseClient
                .from('market_intelligence_items')
                .select('*')
                .order('crawled_at', { ascending: false })
                .limit(100);

            if (data) {
                articles = data;
                renderArticles();
                updateLastUpdateTime();
            }
        }

        function renderSourceFilters() {
            const container = document.getElementById('sourceFilters');
            // Keep the title and "All" item
            const items = container.querySelectorAll('.sidebar-item');

            // Simple refresh: clear and rebuild
            container.innerHTML = `
                <div class="text-[10px] uppercase tracking-[0.2em] text-white/40 font-black mb-4 px-2">主要情報源 (Primary Sources)</div>
                <div class="sidebar-item ${currentSourceFilter === 'all' ? 'active' : ''} cursor-pointer p-3 rounded-xl flex items-center gap-3" onclick="filterBySource('all')">
                    <i data-lucide="layers" class="w-4 h-4 text-white/60"></i>
                    <span class="text-xs font-bold">全部來源 (All)</span>
                </div>
            `;

            sources.forEach(src => {
                const item = document.createElement('div');
                item.className = `sidebar-item cursor-pointer p-3 rounded-xl flex items-center gap-3 ${currentSourceFilter === src.name ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="w-2 h-2 rounded-full aqua-bg"></div>
                    <span class="text-xs font-bold truncate">${src.name}</span>
                `;
                item.onclick = () => filterBySource(src.name);
                container.appendChild(item);
            });
            lucide.createIcons();
        }

        function filterBySource(sourceName) {
            currentSourceFilter = sourceName;
            renderSourceFilters();
            renderArticles();
        }

        function renderArticles(searchQuery = '') {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = '';

            let filtered = articles;

            if (currentSourceFilter !== 'all') {
                filtered = filtered.filter(a => a.source_name === currentSourceFilter);
            }

            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(a =>
                    (a.title && a.title.toLowerCase().includes(q)) ||
                    (a.summary && a.summary.toLowerCase().includes(q))
                );
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-white/20 font-black uppercase tracking-widest">無相關商情數據 (No data match)</div>`;
                return;
            }

            filtered.forEach(art => {
                const card = document.createElement('div');
                card.className = "article-card aqua-glass rounded-[2rem] p-6 flex flex-col group";

                const relativeTime = getRelativeTime(art.published_at || art.crawled_at);

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex flex-col">
                            <span class="text-[9px] font-black aqua-text uppercase tracking-widest">${art.source_name || 'Global News'}</span>
                            <span class="text-[8px] font-bold text-white/40">${relativeTime}</span>
                        </div>
                        <div class="impact-badge bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                            Verified
                        </div>
                    </div>
                    <h3 class="text-sm font-black mb-3 leading-snug group-hover:aqua-text transition-colors">
                        ${art.title || 'Untitled Article'}
                    </h3>
                    <p class="text-[11px] text-white/60 leading-relaxed line-clamp-3 mb-6 font-medium">
                        ${art.summary || '內容正在由 AI 代理進行深度分析中...'}
                    </p>
                    <div class="mt-auto pt-4 border-t border-white/5 flex items-center justify-between">
                        <a href="${art.url}" target="_blank" class="text-[10px] font-black uppercase tracking-widest flex items-center gap-2 text-white/40 hover:text-white transition-colors">
                            查看原文 (Link) <i data-lucide="external-link" class="w-3 h-3"></i>
                        </a>
                        <div class="flex -space-x-2">
                            <div class="w-5 h-5 rounded-full border border-black aqua-bg flex items-center justify-center text-[6px] font-bold">5T</div>
                            <div class="w-5 h-5 rounded-full border border-black bg-slate-700 flex items-center justify-center text-[6px] font-bold">AI</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        // -- Utilities --
        function openAddSourceModal() {
            document.getElementById('addSourceModal').classList.remove('hidden');
        }
        function closeAddSourceModal() {
            document.getElementById('addSourceModal').classList.add('hidden');
        }

        async function submitNewSource() {
            const name = document.getElementById('newSourceName').value;
            const url = document.getElementById('newSourceUrl').value;
            const freq = document.getElementById('newSourceFreq').value;

            if (!name || !url) return alert('請填寫完整資訊');

            const { data, error } = await supabaseClient
                .from('market_intelligence_sources')
                .insert([{ name, url, category: 'Manual', update_frequency: freq, is_active: true }]);

            if (error) {
                console.error(error);
                alert('上傳失敗: ' + error.message);
            } else {
                alert('採集探針已部署！AI 代理將開始下一個循環。');
                closeAddSourceModal();
                fetchSources();
            }
        }

        function getRelativeTime(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diff = (now - date) / 1000;
            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            return Math.floor(diff / 86400) + 'd ago';
        }

        function updateLastUpdateTime() {
            document.getElementById('lastUpdate').innerText = new Date().toLocaleTimeString();
        }
    </script>
</body>

</html>
