<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8f9fa" rx="8"/>
  
  <!-- 標題 -->
  <text x="200" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">
    整體ESG表現
  </text>
  
  <!-- 半圓背景 -->
  <path d="M 100 170 A 100 100 0 0 1 300 170" 
        fill="none" stroke="#e2e8f0" stroke-width="20" stroke-linecap="round"/>
  
  <!-- 分數弧 -->
  <path d="M 100 170 A 100 100 0 0 1 229.44996421477424 244.38211887106013" 
        fill="none" stroke="#10b981" stroke-width="20" stroke-linecap="round"/>
  
  <!-- 中心圓 -->
  <circle cx="200" cy="170" r="10" fill="#1e293b"/>
  
  <!-- 指針 -->
  <line x1="200" y1="170" x2="229.44996421477424" y2="244.38211887106013" 
        stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 分數顯示 -->
  <text x="200" y="220" text-anchor="middle" font-size="36" font-weight="bold" fill="#10b981">
    88
  </text>
  <text x="200" y="245" text-anchor="middle" font-size="14" fill="#64748b">
    / 100
  </text>
  
  <!-- 刻度標籤 -->
  <text x="80" y="175" font-size="12" fill="#64748b">0</text>
  <text x="200" y="60" text-anchor="middle" font-size="12" fill="#64748b">50</text>
  <text x="320" y="175" text-anchor="end" font-size="12" fill="#64748b">100</text>
</svg>