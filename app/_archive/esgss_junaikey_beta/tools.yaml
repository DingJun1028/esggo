# MCP Toolbox for Databases - Custom Tool Configuration
# enabling AI-powered interactions with the ESG and Learning Platform database.

sources:
  esg_db:
    kind: postgres
    host: aws-1-ap-southeast-1.pooler.supabase.com
    port: 6543
    database: postgres
    user: postgres.mruetmtibkbzfaawfjbm
    password: ${DB_PASSWORD}

tools:
  get_student_resonance_report:
    kind: postgres-sql
    source: esg_db
    description: "Retrieves ethical resonance and alignment data for a student, including transparency and integrity scores."
    statement: |
      SELECT 
        up.id, 
        up.role,
        ou.name as organization,
        (SELECT COUNT(*) FROM public.esg_readings WHERE org_unit_id = up.org_unit_id) as knowledge_entries,
        (SELECT AVG(value) FROM public.esg_readings WHERE org_unit_id = up.org_unit_id AND status = 'approved') as avg_resonance
      FROM public.user_profiles up
      LEFT JOIN public.org_units ou ON up.org_unit_id = ou.id
      WHERE up.id = $1
    parameters:
      - name: student_id
        type: string
        description: "The UUID of the student to analyze."

  audit_academic_integrity:
    kind: postgres-sql
    source: esg_db
    description: "Queries the system events for security, audit, and ethical breach logs."
    statement: |
      SELECT 
        created_at,
        event_type,
        severity,
        message,
        metadata
      FROM public.system_events
      WHERE (user_id = $1 OR $1 IS NULL)
        AND (event_type LIKE '%audit%' OR event_type LIKE '%ethic%' OR event_type LIKE '%integrity%' OR severity = 'critical')
      ORDER BY created_at DESC
      LIMIT 25
    parameters:
      - name: user_id
        type: string
        description: "Optional: Filter by student UUID."

  list_learning_assets:
    kind: postgres-sql
    source: esg_db
    description: "Retrieves a listing of knowledge assets (Carbon Credits, UCC Tokens) that have been successfully minted."
    statement: |
      SELECT 
        company_name as asset_origin,
        category,
        reporting_period,
        verification_status,
        data_quality_score
      FROM public.esg_data
      WHERE verification_status = 'verified' OR verification_status = 'completed' OR verification_status = 'approved'
      ORDER BY reporting_period DESC
    parameters: []

  get_metric_catalog:
    kind: postgres-sql
    source: esg_db
    description: "Lists all available ESG/Learning metrics that can be tracked."
    statement: |
      SELECT code, name, category, unit, standard_ref
      FROM public.metric_definitions
      WHERE is_active = true
      ORDER BY category, name
    parameters: []

  list_system_events:
    kind: postgres-sql
    source: esg_db
    description: "Lists the most recent system events for real-time monitoring of platform activity."
    statement: |
      SELECT created_at, event_type, severity, message
      FROM public.system_events
      ORDER BY created_at DESC
      LIMIT 50
    parameters: []
