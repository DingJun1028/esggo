<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESG Performance Report</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        margin: 0;
        padding: 40px;
        color: #333;
        background-color: #fff;
      }
      .report-header {
        text-align: center;
        margin-bottom: 40px;
        border-bottom: 2px solid #eee;
        padding-bottom: 20px;
      }
      .report-header h1 {
        font-size: 28px;
        color: #1a202c;
        margin: 0;
      }
      .report-header p {
        font-size: 16px;
        color: #718096;
        margin-top: 5px;
      }
      .section-title {
        font-size: 22px;
        color: #2d3748;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 8px;
        margin-top: 30px;
        margin-bottom: 20px;
      }
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 30px;
      }
      .kpi-card {
        background-color: #f7fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 20px;
        text-align: center;
      }
      .kpi-card .value {
        font-size: 24px;
        font-weight: bold;
        color: #2c5282;
      }
      .kpi-card .label {
        font-size: 14px;
        color: #718096;
        margin-top: 5px;
        text-transform: capitalize;
      }
      .chart-container {
        text-align: center;
        margin-top: 20px;
      }
      .chart-container img {
        max-width: 100%;
        height: auto;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      .data-table th,
      .data-table td {
        border: 1px solid #e2e8f0;
        padding: 12px;
        text-align: left;
        font-size: 14px;
      }
      .data-table th {
        background-color: #f7fafc;
        font-weight: bold;
        color: #4a5568;
      }
      .report-footer {
        text-align: center;
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid #eee;
        font-size: 12px;
        color: #a0aec0;
      }
    </style>
  </head>
  <body>
    <header class="report-header">
      <h1>ESG Performance Report</h1>
      <p>For the period: {{date_range}}</p>
    </header>

    <main>
      <h2 class="section-title">Key Performance Indicators</h2>
      <div class="kpi-grid">
        <!-- This block will be dynamically populated -->
        {{kpi_cards}}
      </div>

      <h2 class="section-title">Monthly Electricity Usage (kWh)</h2>
      <div class="chart-container">
        <!-- A base64 encoded image of the chart will be inserted here -->
        <img src="{{time_series_chart_image}}" alt="Time Series Chart" />
      </div>

      <h2 class="section-title">Detailed Approved Evidence</h2>
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Date Approved</th>
            <th>Data Type</th>
            <th>Metric</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody>
          <!-- This block will be dynamically populated with table rows -->
          {{detailed_data_rows}}
        </tbody>
      </table>
    </main>

    <footer class="report-footer">
      Generated on {{generation_date}} by the ESG Sustainable Reporting System.
    </footer>
  </body>
</html>
