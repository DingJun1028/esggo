# Firebase App Hosting Configuration
# https://firebase.google.com/docs/app-hosting/configure

kind: "AppHostingConfig"
schemaVersion: "v1"

# The runtime environment for the backend
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 50
  cpu: 1
  memoryMiB: 2048

# Environment variables for the server-side environment
env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "esg-sunshine"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "esg-sunshine.firebaseapp.com"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "esg-sunshine.firebasestorage.app"
  - variable: NEXT_PUBLIC_ENV
    value: "production"
  - variable: NODE_OPTIONS
    value: "--max-old-space-size=4096"
  # Sensitive keys — store via: npx firebase-tools@latest apphosting:secrets:set [SECRET_NAME]
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
