name: Unit Tests CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    # 移除 branches 限制，現在任何發起的 PR（包含後續的 commit 更新）都會觸發自動檢查

concurrency:
  # 針對同一個 PR 或 branch，自動取消舊的 CI 執行，確保永遠只跑最新的 commit
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # 建議與您本地開發的 Node 版本一致
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci # 使用 ci 可以確保依 package-lock.json 精準安裝套件

    - name: 🔍 Run ESLint
      run: npm run lint

    - name: 🧪 Run Tests with Coverage
      # 加上 --coverage 參數來自動產生測試涵蓋率報表
      run: npx vitest run --coverage

    - name: 🏗️ Run Next.js Build Check
      # 測試過關後，最後檢查專案是否能成功 Build (確保沒有 TypeScript 報錯或動態路由問題)
      run: npm run build

    - name: ✅ Notify Discord on Success
      if: success() # 只有當上面的所有步驟 (Lint, Test, Build) 都成功時，才會觸發這一步
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        curl -H "Content-Type: application/json" \
             -X POST \
             -d "{\"content\": \"✅ **CI Pipeline 全數通過 (Lint / Test / Build)** ✅\\n**專案:** ${{ github.repository }}\\n**觸發者:** ${{ github.actor }}\\n**查看詳情:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
             $DISCORD_WEBHOOK

    - name: 🚨 Notify Discord on Failure
      if: failure() # 只有當上面的步驟失敗時，才會觸發這一步
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        curl -H "Content-Type: application/json" \
             -X POST \
             -d "{\"content\": \"🚨 **CI Pipeline 執行失敗** 🚨\\n**專案:** ${{ github.repository }}\\n**觸發者:** ${{ github.actor }}\\n**查看錯誤日誌:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
             $DISCORD_WEBHOOK