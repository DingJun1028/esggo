# Queries for ESG Evidence
query ListUserEvidence @auth(level: USER) {
  evidences(where: { userId: { eq_expr: "auth.uid" } }) {
    id
    title
    content
    source
    timestamp
    confidenceScore
    verified
  }
}

query ListDashboardMetrics @auth(level: USER) {
  dashboardMetrics(where: { userId: { eq_expr: "auth.uid" } }, orderBy: { timestamp: DESC }) {
    id
    title
    value
    unit
    trend
    percentageChange
    timestamp
  }
}

query ListOcrReviewItems @auth(level: USER) {
  ocrReviewItems(where: { userId: { eq_expr: "auth.uid" } }, orderBy: { timestamp: DESC }) {
    id
    fieldLabel
    extractedValue
    unit
    confidenceScore
    status
  }
}
query GetCurrentUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    displayName
    email
    createdAt
  }
}
