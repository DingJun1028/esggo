# Create a new evidence record
mutation CreateEvidence($title: String!, $content: String!, $source: String!, $confidenceScore: Float!) @auth(level: USER) {
  evidence_insert(data: {
    userId_expr: "auth.uid"
    title: $title
    content: $content
    source: $source
    confidenceScore: $confidenceScore
  })
}

mutation CreateDashboardMetric($title: String!, $value: Float!, $unit: String!, $trend: String!, $percentageChange: Float!) @auth(level: USER) {
  dashboardMetric_insert(data: {
    userId_expr: "auth.uid"
    title: $title
    value: $value
    unit: $unit
    trend: $trend
    percentageChange: $percentageChange
  })
}

mutation UpdateOcrReviewItem($id: UUID!, $status: String, $extractedValue: String) @auth(level: USER) {
  ocrReviewItem_updateMany(
    where: { id: { eq: $id }, userId: { eq_expr: "auth.uid" } },
    data: {
      status: $status
      extractedValue: $extractedValue
    }
  )
}
mutation UpsertUser($displayName: String, $email: String) @auth(level: USER) {
  user_upsert(data: {
    id_expr: "auth.uid"
    displayName: $displayName
    email: $email
  })
}
