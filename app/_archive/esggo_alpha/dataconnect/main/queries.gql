query ListAllTasks @auth(level: USER, insecureReason: "This operation is safe to expose to all logged in users.") {
  tasks {
    id
    title
    description
    completed
    createdAt
  }
}

query GetTaskById($id: UUID!) @auth(level: USER, insecureReason: "This operation is safe to expose to all logged in users.") {
  task(key: {id: $id}) {
    id
    title
    description
    completed
    createdAt
  }
}

mutation CreateTask($title: String!, $description: String, $createdAt: Timestamp!) @auth(level: USER, insecureReason: "This operation is safe to expose to all logged in users.") {
  task: task_insert(data: {
    title: $title,
    description: $description,
    completed: false,
    createdAt: $createdAt
  })
}

mutation DeleteTask($id: UUID!) @auth(level: USER, insecureReason: "This operation is safe to expose to all logged in users.") {
  task: task_delete(key: {id: $id})
}

mutation UpdateTaskStatus($id: UUID!, $completed: Boolean!) @auth(level: USER, insecureReason: "This operation is safe to expose to all logged in users.") {
  task: task_update(key: {id: $id}, data: {
    completed: $completed
  })
}

query ListAuditRecords @auth(level: USER, insecureReason: "Safe for logged in users.") {
  auditRecords {
    id
    title
    dataType
    source
    category
    standard
    description
    contentHash
    zkpStatus
    createdAt
    metadata
    proofSignature
    verifierKey
    algorithm
    salt
    proofJson
  }
}

mutation CreateAuditRecord($title: String!, $dataType: String!, $source: String!, $category: String, $standard: String, $description: String, $contentHash: String!, $zkpStatus: String!, $createdAt: Timestamp!, $metadata: String, $proofSignature: String, $verifierKey: String, $algorithm: String, $salt: String, $proofJson: String) @auth(level: USER, insecureReason: "Safe for logged in users.") {
  auditRecord: auditRecord_insert(data: {
    title: $title,
    dataType: $dataType,
    source: $source,
    category: $category,
    standard: $standard,
    description: $description,
    contentHash: $contentHash,
    zkpStatus: $zkpStatus,
    createdAt: $createdAt,
    metadata: $metadata,
    proofSignature: $proofSignature,
    verifierKey: $verifierKey,
    algorithm: $algorithm,
    salt: $salt,
    proofJson: $proofJson
  })
}

mutation UpdateAuditRecord($id: UUID!, $title: String, $dataType: String, $source: String, $category: String, $standard: String, $description: String, $contentHash: String, $zkpStatus: String, $metadata: String, $proofSignature: String, $verifierKey: String, $algorithm: String, $salt: String, $proofJson: String) @auth(level: USER, insecureReason: "Safe for logged in users.") {
  auditRecord: auditRecord_update(key: {id: $id}, data: {
    title: $title,
    dataType: $dataType,
    source: $source,
    category: $category,
    standard: $standard,
    description: $description,
    contentHash: $contentHash,
    zkpStatus: $zkpStatus,
    metadata: $metadata,
    proofSignature: $proofSignature,
    verifierKey: $verifierKey,
    algorithm: $algorithm,
    salt: $salt,
    proofJson: $proofJson
  })
}

mutation DeleteAuditRecord($id: UUID!) @auth(level: USER, insecureReason: "Safe for logged in users.") {
  auditRecord: auditRecord_delete(key: {id: $id})
}

