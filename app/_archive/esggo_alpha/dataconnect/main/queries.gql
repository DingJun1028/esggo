query ListReports @auth(level: USER, insecureReason: "Safe for logged in users.") {
  reports {
    id
    templateId
    title
    language
    progress
    status
    createdAt
    lastSavedAt
    company {
      id
      name
    }
  }
}

query GetReportById($id: UUID!) @auth(level: USER, insecureReason: "Safe for logged in users.") {
  report(key: {id: $id}) {
    id
    templateId
    title
    language
    progress
    status
    createdAt
    lastSavedAt
    company {
      id
      name
    }
  }
}

mutation UpsertReport($id: UUID, $companyId: UUID!, $templateId: String!, $title: String!, $language: String!, $progress: Int!, $status: String!, $createdAt: Timestamp!, $lastSavedAt: Timestamp) @auth(level: USER, insecureReason: "Safe for logged in users.") {
  report: report_upsert(data: {
    id: $id,
    companyId: $companyId,
    templateId: $templateId,
    title: $title,
    language: $language,
    progress: $progress,
    status: $status,
    createdAt: $createdAt,
    lastSavedAt: $lastSavedAt
  })
}

mutation UpsertReportSection($id: UUID, $reportId: UUID!, $sectionId: String!, $title: String!, $content: String, $isDone: Boolean!, $lastUpdated: Timestamp!) @auth(level: USER, insecureReason: "Safe for logged in users.") {
  reportSection: reportSection_upsert(data: {
    id: $id,
    reportId: $reportId,
    sectionId: $sectionId,
    title: $title,
    content: $content,
    isDone: $isDone,
    lastUpdated: $lastUpdated
  })
}

query GetReportSections($reportId: UUID!) @auth(level: USER, insecureReason: "Safe for logged in users.") {
  reportSections(where: {reportId: {eq: $reportId}}) {
    id
    sectionId
    title
    content
    isDone
    lastUpdated
  }
}

query ListCompanyMetric($companyId: UUID!) @auth(level: USER, insecureReason: "Safe for logged in users.") {
  companyMetrics(where: {companyId: {eq: $companyId}}, orderBy: [{updatedAt: DESC}], limit: 1) {
    id
    readinessScore
    complianceRate
    riskLevel
    efficiencyRate
    trustScore
    updatedAt
  }
}

mutation UpsertCompanyMetric($id: UUID, $companyId: UUID!, $readinessScore: Float!, $complianceRate: Float!, $riskLevel: Float!, $efficiencyRate: Float!, $trustScore: Float!, $updatedAt: Timestamp!) @auth(level: USER, insecureReason: "Safe for logged in users.") {
  companyMetric_upsert(data: {
    id: $id,
    companyId: $companyId,
    readinessScore: $readinessScore,
    complianceRate: $complianceRate,
    riskLevel: $riskLevel,
    efficiencyRate: $efficiencyRate,
    trustScore: $trustScore,
    updatedAt: $updatedAt
  })
}

query ListIntelligenceSignals @auth(level: USER, insecureReason: "Safe for logged in users.") {
  intelligenceSignals(orderBy: [{timestamp: DESC}]) {
