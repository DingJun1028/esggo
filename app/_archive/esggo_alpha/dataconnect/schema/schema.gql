type User @table {
  username: String!
  email: String!
  passwordHash: String!
  createdAt: Timestamp!
  displayName: String
  bio: String
  profilePictureUrl: String
  publicProfile: Boolean
}

type Action @table {
  title: String!
  category: Category!
  loggedAt: Timestamp!
  isPublic: Boolean!
  description: String
  impactMetric: String
  location: String
  imageUrl: String
  user: User
}

type Category @table {
  name: String!
  description: String
  iconUrl: String
}

type Challenge @table {
  name: String!
  description: String!
  startDate: Date!
  endDate: Date!
  isPublic: Boolean!
  targetMetric: String
  rules: String
  creator: User
}

type ChallengeParticipation @table(key: ["user", "challenge"]) {
  user: User!
  challenge: Challenge!
  joinedAt: Timestamp!
  progressMetric: String
}

type SocialConnection @table(key: ["follower", "followed"]) {
  follower: User!
  followed: User!
  connectedAt: Timestamp!
}

type Task @table {
  id: UUID! @default(expr: "uuidV4()")
  title: String!
  description: String
  completed: Boolean!
  createdAt: Timestamp!
}

type Comment @table {
  user: User!
  content: String!
}

type AuditRecord @table {
  id: UUID! @default(expr: "uuidV4()")
  title: String!
  dataType: String!
  source: String!
  category: String # E, S, G
  standard: String
  description: String
  contentHash: String!
  zkpStatus: String!
  createdAt: Timestamp!
  metadata: String
  proofSignature: String
  verifierKey: String
  algorithm: String
  salt: String
  proofJson: String
}

type IntelligenceModule @table {
  id: String!
  titleZh: String!
  titleEn: String!
  descriptionZh: String!
  descriptionEn: String!
  iconName: String!
  color: String!
  details: String # JSON array
}

type IntelligenceSource @table {
  id: UUID! @default(expr: "uuidV4()")
  category: String!
  name: String!
  type: String!
  status: String!
}

type IntelligenceSignal @table {
  id: UUID! @default(expr: "uuidV4()")
  title: String!
  content: String!
  severity: String! # Serious, Moderate, Low
  timestamp: Timestamp!
  sourceId: String
}

type CompanyProfile @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  industry: String
  headquarters: String
  createdAt: Timestamp!
  user: User
}

type Report @table {
  id: UUID! @default(expr: "uuidV4()")
  company: CompanyProfile!
  templateId: String!
  title: String!
  language: String!
  progress: Int!
  status: String!
  createdAt: Timestamp!
  lastSavedAt: Timestamp
}

type ReportSection @table {
  id: UUID! @default(expr: "uuidV4()")
  report: Report!
  sectionId: String!
  title: String!
  content: String
  isDone: Boolean!
  lastUpdated: Timestamp!
}

type CompanyMetric @table {
  id: UUID! @default(expr: "uuidV4()")
  company: CompanyProfile!
  readinessScore: Float!
  complianceRate: Float!
  riskLevel: Float!
  efficiencyRate: Float!
  trustScore: Float!
  updatedAt: Timestamp!
}