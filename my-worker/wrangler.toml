name = "smart-ai-router"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
SMART_ROUTER_VERSION = "2.0.0-beta.1"

# 靜態資源
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# KV 存儲免費模型列表
[[kv_namespaces]]
binding = "FREE_MODELS_KV"
id = "your-kv-namespace-id"
preview_id = "your-preview-kv-namespace-id"

# 觀測/日誌
[observability]
enabled = true

[build]
command = "npm --prefix my-worker install && npm --prefix my-worker run build"
