# ==========================================
# 完全代主自行 - Prometheus 監控配置
# ==========================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 應用程式監控
  - job_name: 'delegation-api'
    static_configs:
      - targets: ['delegation-api:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 10s

  # Node.js 監控
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # PostgreSQL 監控
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis 監控
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

# ==========================================
# 警報規則
# ==========================================
rule_files:
  - 'alert_rules.yml'

# ==========================================
# 警報管理器
# ==========================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093
