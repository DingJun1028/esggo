# Smart AI Router - 本地開發環境
# 執行: docker-compose up -d

version: '3.9'

services:
  # Smart AI Router 服務
  smart-ai-router:
    build:
      context: .
      dockerfile: .agents/skills/smart-ai-router/Dockerfile
    container_name: smart-ai-router-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=esggo_events
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
    volumes:
      - ./src:/app/src
      - ./node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthz').on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL 事件存儲
  postgres:
    image: postgres:16-alpine
    container_name: smart-ai-router-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=esggo_events
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d esggo_events"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 可選：EventStoreDB (事件溯源高性能)
  eventstoredb:
    image: eventstore/eventstore:latest
    container_name: smart-ai-router-esdb
    ports:
      - "2113:2113"
    environment:
      - EVENTSTORE_CLUSTER_SIZE=1
      - EVENTSTORE_INSECURE_ALLOW_UNKNOWN_USERS=true
      - EVENTSTORE_MEM_DB=false
    volumes:
      - eventstore_data:/var/data/eventstoredb-cluster
    profiles: ["eventstore"]  # 使用 docker-compose --profile eventstore 啟動

  # 可選：Redis 快取
  redis:
    image: redis:7-alpine
    container_name: smart-ai-router-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    profiles: ["cache"]

volumes:
  postgres_data:
  eventstore_data:
  redis_data:

# 開發指令
# docker-compose up -d                    # 啟動基本服務
# docker-compose --profile eventstore up -d # 啟動 + EventStoreDB
# docker-compose --profile cache up -d      # 啟動 + Redis 快取