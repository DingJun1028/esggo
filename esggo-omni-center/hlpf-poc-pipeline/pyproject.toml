[project]
name = "hlpf-poc-pipeline"
version = "0.1.0"
description = "HLPF inclusive innovation POC preview pipeline"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
  "python-multipart>=0.0.9",
  "edge-tts>=6.1.9",
  "Pillow>=10.0.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
