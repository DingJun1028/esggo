name: Write .env to VPS
on:
  workflow_dispatch:

jobs:
  write-env:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -T 10 ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Write .env line by line
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}' | sudo tee /opt/esggo/vps/.env > /dev/null"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}' | sudo tee -a /opt/esggo/vps/.env > /dev/null"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}' | sudo tee -a /opt/esggo/vps/.env > /dev/null"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}' | sudo tee -a /opt/esggo/vps/.env > /dev/null"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}' | sudo tee -a /opt/esggo/vps/.env > /dev/null"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}' | sudo tee -a /opt/esggo/vps/.env > /dev/null"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'DATABASE_URL=${{ secrets.SUPABASE_DB_URL }}' | sudo tee -a /opt/esggo/vps/.env > /dev/null"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'AGNES_API=${{ secrets.GEMINI_API_KEY }}' | sudo tee -a /opt/esggo/vps/.env > /dev/null"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'GATEWAY_API_KEY=${{ secrets.OMNIKEY }}' | sudo tee -a /opt/esggo/vps/.env > /dev/null"
      - name: Verify
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "wc -l /opt/esggo/vps/.env && echo '---' && grep -c '=' /opt/esggo/vps/.env && echo 'DONE'"
