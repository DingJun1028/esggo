# =============================================================================
# Dependabot configuration — auto-PR for dependency updates
# =============================================================================
version: 2
updates:
  - package-ecosystem: "pnpm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "pnpm"
    commit-message:
      prefix: "deps"
    reviewers:
      - "wing-ops"

  - package-ecosystem: "docker"
    directory: "/vps"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    reviewers:
      - "wing-ops"
