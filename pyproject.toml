[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "esggo-python"
version = "5.1.0"
description = "ESG GO platform - Python data processing scripts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ESG GO Team"},
]

dependencies = [
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["esggo*", "scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_esg_data.py" = ["E501"]
"scripts/generate_v5_report.py" = ["E501"]
"tests/*.py" = ["E402"]
"generate_answer_db.py" = ["E402"]
"parse-esg.py" = ["E402"]
"scripts/build_full_db.py" = ["E402"]
"scripts/gen.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
