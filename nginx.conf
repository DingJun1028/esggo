# FTG Journey Web - Nginx Docker Config

server {
    listen 80;
    server_name journey.ftgtours.esggo.co;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name journey.ftgtours.esggo.co;

    ssl_certificate /etc/letsencrypt/live/journey-api.ftgtours.esggo.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/journey-api.ftgtours.esggo.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # API 代理到後端
    location /api/ {
        proxy_pass http://ftg-journey-server:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 上傳檔服務
    location /uploads/ {
        alias /var/www/ftg-journey-web/uploads/;
    }

    # SPA 路由
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
