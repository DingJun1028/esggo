name = "esggo"
main = "my-worker/src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "my-worker/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[build]
command = "pnpm install && pnpm run build"

[vars]
ENVIRONMENT = "production"
SMART_ROUTER_VERSION = "2.0.0-beta.1"

# KV 存儲免費模型列表
# id 改由環境變數注入（避免佔位符硬錯）；部署前須 export FREE_MODELS_KV_ID / FREE_MODELS_KV_PREVIEW_ID
[[kv_namespaces]]
binding = "FREE_MODELS_KV"
id = "${FREE_MODELS_KV_ID}"
preview_id = "${FREE_MODELS_KV_PREVIEW_ID}"

# Secret 金鑰（需在 Cloudflare Dashboard 或 wrangler secret put 設定）
# [secrets]
# OPENROUTER_API_KEY = ""
# GROQ_API_KEY = ""
# HF_TOKEN = ""
# CLOUDFLARE_API_TOKEN = ""

[observability]
enabled = true
