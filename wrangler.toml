name = "smart-ai-router"
main = "worker/src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 獨立 worker 目錄，避免污染 Next.js 的 src/
# 執行：wrangler deploy --config wrangler.toml

[vars]
ENVIRONMENT = "production"
SMART_ROUTER_VERSION = "2.0.0-beta.1"

# Secret 金鑰（需在 Cloudflare Dashboard 或 wrangler secret put 設定）
# [secrets]
# OPENROUTER_API_KEY = ""
# GROQ_API_KEY = ""
# HF_TOKEN = ""
# CLOUDFLARE_API_TOKEN = ""

# KV 存儲免費模型列表（暫緩：worker 當前未讀取 FREE_MODELS_KV，
# 且真實 KV namespace id 尚未提供。待需要時以 wrangler secret/kv 綁定補回，
# 避免雲端 Workers Builds 因缺少 FREE_MODELS_KV_ID 環境變數而失敗。）

# 觀測/日誌 (logpush 為帳號級設定，需在 Cloudflare Dashboard 啟用)
[observability]
enabled = true
