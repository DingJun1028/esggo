name = "esggo"
main = "my-worker/src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "my-worker/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[build]
command = "npx --yes pnpm install --frozen-lockfile && pnpm run build"

[vars]
ENVIRONMENT = "production"
SMART_ROUTER_VERSION = "2.0.0-beta.1"

# Secret 金鑰（需在 Cloudflare Dashboard 或 wrangler secret put 設定）
# [secrets]
# OPENROUTER_API_KEY = ""
# GROQ_API_KEY = ""
# HF_TOKEN = ""
# CLOUDFLARE_API_TOKEN = ""

[observability]
enabled = true
