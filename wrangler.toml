name = "smart-ai-router"
main = "worker/src/index.ts"
# 使用較近期 compatibility_date 以獲得 nodejs_compat 等修復與新特性
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 獨立 worker 目錄，避免污染 Next.js 的 src/
# 本地開發：wrangler dev --config wrangler.toml
# 部署：     wrangler deploy --config wrangler.toml

[vars]
ENVIRONMENT = "production"
SMART_ROUTER_VERSION = "2.0.0-beta.1"

# ── Secret 金鑰（切勿在此 TOML 以明文寫入，會被 CI secret-scan 擋下）──
# 正確設定方式（Cloudflare 加密儲存，不入 git）：
#   wrangler secret put GROQ_API_KEY
#   wrangler secret put OPENROUTER_API_KEY
#   wrangler secret put TOGETHER_API_KEY
#   wrangler secret put MISTRAL_API_KEY
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put CLOUDFLARE_ACCOUNT_ID
#   wrangler secret put CLOUDFLARE_API_TOKEN
#   wrangler secret put VPS_OLLAMA_URL        # 選用：自託管 Ollama 端點
#   wrangler secret put VPS_OLLAMA_USER       # 選用：Nginx Basic Auth
#   wrangler secret put VPS_OLLAMA_PASS       # 選用：Nginx Basic Auth
# worker entry 會在每次請求把這些 binding 接線進 process.env（見 worker/src/index.ts hydrateEnv）。

# KV 存儲免費模型列表（暫緩：worker 當前未讀取 FREE_MODELS_KV，
# 且真實 KV namespace id 尚未提供。待需要時以 wrangler kv namespace create +
# 綁定補回，避免雲端 Workers Builds 因缺少 FREE_MODELS_KV_ID 環境變數而失敗。）

# 觀測/日誌 (logpush 為帳號級設定，需在 Cloudflare Dashboard 啟用)
[observability]
enabled = true
