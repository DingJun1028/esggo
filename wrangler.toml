name = "esggo"
main = "my-worker/src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "my-worker/dist"

[build]
command = "npm --prefix my-worker install && npm --prefix my-worker run build"

[vars]
ENVIRONMENT = "production"
SMART_ROUTER_VERSION = "2.0.0-beta.1"

[observability]
enabled = true
