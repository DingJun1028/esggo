global:
  scrape_interval: 15s
  evaluation_interval: 15s

quickstart:
  scrape_interval: 15s
  evaluation_interval: 15s
  default_file = '/etc/prometheus/quickstart.yml'

scrape_configs:
  - job: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  # 自定義指標擴充
  - job: 'smart_ai_router_metrics'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:3000']  # 我們的 Smart AI Router 應用
        labels:
          group: smart_ai_router