services:
  - type: web
    name: esggo-platform
    runtime: node
    plan: standard
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        fromSecret: supabase-url
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        fromSecret: supabase-anon-key
      - key: NEXT_PUBLIC_APP_VERSION
        value: 1.5.0
      - key: PORT
        value: 3000
    healthCheckPath: /api/system/health
    autoDeploy: true
    scaling:
      minInstances: 1
      maxInstances: 5

  - type: postgresql
    name: esggo-db
    plan: starter
    databaseName: esggo_production

envVarGroups:
  - name: esggo-secrets
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false