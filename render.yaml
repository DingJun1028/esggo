services:
  - type: web
    name: esggo-platform
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        fromSecret: supabase-url
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        fromSecret: supabase-anon-key
    healthCheckPath: /api/system/health
    autoDeploy: true

  - type: postgresql
    name: esggo-db
    plan: starter
    databaseName: esggo_production

envVarGroups:
  - name: esggo-secrets
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false