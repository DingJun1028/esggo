server {
    listen 8795;
    server_name hermex.esggo.co localhost;

    # Web dist static root
    root /opt/hermes-venv/lib/python3.12/site-packages/hermes_cli/web_dist;
    index index.html;

    # 5T Traceable: CDN 健康檢查端點
    location = /_uptime {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 5T Tangible: PWA assets with optimal caching
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'";
        try_files $uri =404;
    }

    # 5T Trustworthy: Manifest with strict headers
    location = /manifest.webmanifest {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header Content-Type "application/manifest+json";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # 5T Transparent: Service worker with no-cache for updates
    location = /sw.js {
        expires 1h;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'";
        try_files $uri =404;
    }

    # 5T Incremental: Delta sync endpoint for PWA updates
    location /api/pwa/delta {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
    }

    # SPA: serve static index.html and inject session token via sub_filter
    location = / {
        try_files /index.html =404;
        sub_filter '</head>' '<script>window.__HERMES_SESSION_TOKEN__="Ry6UGmBFt1H2LBhwrfgNEvKBJMvoZ5jBmy459F9b7Qw";</script></head>';
        sub_filter_types text/html;
        sub_filter_once on;
    }

    location = /index.html {
        try_files /index.html =404;
        sub_filter '</head>' '<script>window.__HERMES_SESSION_TOKEN__="Ry6UGmBFt1H2LBhwrfgNEvKBJMvoZ5jBmy459F9b7Qw";</script></head>';
        sub_filter_types text/html;
        sub_filter_once on;
    }

    location /auth/password-login {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
    }

    location /api/ws {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
    }

    # Default: serve static files, fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}