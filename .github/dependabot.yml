# =============================================================================
# Dependabot configuration — auto-PR for dependency updates
# NOTE: Dependabot has no "pnpm" ecosystem; pnpm lockfiles are handled by "npm".
# =============================================================================
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    # prisma 6→7 為破壞性升級（P1012：schema datasource url 改移入 prisma.config.ts、
    # PrismaClient 需改傳 adapter/accelerateUrl、@prisma/client 需同步升 7.x）。
    # 未完成遷移前不自動開 major PR，避免 CI 每週固定紅燈。
    # source_origin: Cloudflare Workers Builds prisma 7 失敗 build（postinstall P1012）
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/vps"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
