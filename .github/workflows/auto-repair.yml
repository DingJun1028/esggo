# =============================================================================
# OA-TWINS Auto-Repair - WanNeng Auto-Repair Mechanism
# =============================================================================
# Trigger: After OmniCore CI failure
# Function: Error analysis -> Auto-fix -> Create PR -> Tracker notify
# =============================================================================

name: OA-TWINS Auto-Repair

on:
  workflow_run:
    workflows: ["OmniCore CI"]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.5.2"
  REPAIR_BRANCH_PREFIX: "auto-repair/"
  TRACKER_ID: "OA-TWINS-AUTO-REPAIR"

jobs:
  # -- Error analysis
  analyze:
    name: Analyze CI Failure
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      error_type: ${{ steps.parse.outputs.error_type }}
      repairable: ${{ steps.parse.outputs.repairable }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse error details
        id: parse
        run: |
          ERROR_TYPE="unknown"
          REPAIRABLE="false"

          LAST_MSG=$(git log -1 --format="%s %b" 2>/dev/null || echo "")
          if echo "$LAST_MSG" | grep -qi "type\|ts("; then
            ERROR_TYPE="typescript"
            REPAIRABLE="true"
          elif echo "$LAST_MSG" | grep -qi "lint\|eslint"; then
            ERROR_TYPE="eslint"
            REPAIRABLE="true"
          elif echo "$LAST_MSG" | grep -qi "dep\|lock\|install"; then
            ERROR_TYPE="dependency"
            REPAIRABLE="true"
          fi

          echo "error_type=$ERROR_TYPE" >> $GITHUB_OUTPUT
          echo "repairable=$REPAIRABLE" >> $GITHUB_OUTPUT
          echo "Error Type: $ERROR_TYPE, Repairable: $REPAIRABLE"

  # -- Auto-fix: TypeScript
  repair-typescript:
    name: Repair TypeScript Errors
    needs: analyze
    if: needs.analyze.outputs.repairable == 'true' && needs.analyze.outputs.error_type == 'typescript'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_AUTO_REPAIR || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Auto-fix TypeScript errors
        id: fix
        run: |
          echo "Attempting TypeScript auto-repair..."
          pnpm lint --fix 2>/dev/null || true

          if pnpm typecheck 2>/dev/null; then
            echo "repair_success=true" >> $GITHUB_OUTPUT
          else
            echo "repair_success=false" >> $GITHUB_OUTPUT
          fi

      - name: Create repair PR
        if: steps.fix.outputs.repair_success == 'true'
        run: |
          BRANCH="${{ env.REPAIR_BRANCH_PREFIX }}ts-$(date +%Y%m%d-%H%M%S)"
          git config user.name "OA-TWINS Auto-Repair"
          git config user.email "auto-repair@esggo.co"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix: auto-repair TypeScript errors [${{ env.TRACKER_ID }}]"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Auto-Repair: TypeScript errors [${{ env.TRACKER_ID }}]" \
            --body "OA-TWINS Auto-Repair Report -- Tracker: ${{ env.TRACKER_ID }} -- Error: TypeScript -- Status: Fixed"

  # -- Auto-fix: ESLint
  repair-eslint:
    name: Repair ESLint Errors
    needs: analyze
    if: needs.analyze.outputs.repairable == 'true' && needs.analyze.outputs.error_type == 'eslint'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_AUTO_REPAIR || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Auto-fix ESLint errors
        run: |
          echo "Attempting ESLint auto-repair..."
          pnpm lint --fix
          if pnpm lint 2>/dev/null; then
            BRANCH="${{ env.REPAIR_BRANCH_PREFIX }}eslint-$(date +%Y%m%d-%H%M%S)"
            git config user.name "OA-TWINS Auto-Repair"
            git config user.email "auto-repair@esggo.co"
            git checkout -b "$BRANCH"
            git add -A
            git commit -m "fix: auto-repair ESLint errors [${{ env.TRACKER_ID }}]"
            git push origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" --title "Auto-Repair: ESLint errors [${{ env.TRACKER_ID }}]" --body "OA-TWINS Auto-Repair -- Tracker: ${{ env.TRACKER_ID }} -- ESLint Fixed"
          fi

  # -- Auto-fix: Dependencies
  repair-dependency:
    name: Repair Dependency Errors
    needs: analyze
    if: needs.analyze.outputs.repairable == 'true' && needs.analyze.outputs.error_type == 'dependency'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_AUTO_REPAIR || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Auto-fix dependency errors
        run: |
          pnpm store prune
          rm -rf node_modules
          pnpm install
          BRANCH="${{ env.REPAIR_BRANCH_PREFIX }}deps-$(date +%Y%m%d-%H%M%S)"
          git config user.name "OA-TWINS Auto-Repair"
          git config user.email "auto-repair@esggo.co"
          git checkout -b "$BRANCH"
          git add pnpm-lock.yaml
          git commit -m "fix: auto-repair dependency lockfile [${{ env.TRACKER_ID }}]"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Auto-Repair: Deps [${{ env.TRACKER_ID }}]" --body "OA-TWINS Auto-Repair -- Tracker: ${{ env.TRACKER_ID }} -- Deps Fixed"

  # -- Tracker Notification
  tracker-notify:
    name: OA-TWINS Tracker Notification
    needs: [analyze, repair-typescript, repair-eslint, repair-dependency]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send tracker notification
        uses: actions/github-script@v7
        with:
          script: |
            const trackerId = '${{ env.TRACKER_ID }}';
            const runId = ${{ github.event.workflow_run.id }};
            const conclusion = '${{ github.event.workflow_run.conclusion }}';
            const ts = '${{ needs.repair-typescript.result }}';
            const eslint = '${{ needs.repair-eslint.result }}';
            const deps = '${{ needs.repair-dependency.result }}';
            const fixed = ts === 'success' || eslint === 'success' || deps === 'success';

            const body = [
              '## OA-TWINS Auto-Repair Tracker',
              '',
              '- Tracker: ' + trackerId,
              '- CI Run: #' + runId,
              '- Result: ' + conclusion,
              '- Repaired: ' + (fixed ? 'Yes' : 'No'),
              '- TypeScript: ' + ts,
              '- ESLint: ' + eslint,
              '- Dependencies: ' + deps,
              '',
              '*Tracker v1.0*'
            ].join('\n');

            if (conclusion === 'failure') {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '[' + trackerId + '] Auto-Repair Report - CI #' + runId,
                body: body,
                labels: ['auto-repair', 'tracker']
              });
            }
