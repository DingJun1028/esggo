name: Write .env to VPS
on:
  workflow_dispatch:

jobs:
  write-env:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -T 10 ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Write .env via SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "sudo tee /opt/esggo/vps/.env > /dev/null" << 'VPSENV'
GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
DATABASE_URL=${{ secrets.SUPABASE_DB_URL }}
GATEWAY_API_KEY=${{ secrets.OMNIKEY }}
AGNES_API=${{ secrets.GEMINI_API_KEY }}
NEXT_PUBLIC_AGNES_API_KEY=${{ secrets.GEMINI_API_KEY }}
VPSENV
          echo "DONE"
