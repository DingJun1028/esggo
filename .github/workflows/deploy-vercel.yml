# .github/workflows/deploy-vercel.yml — Vercel production deploy (replaces missing GitHub→Vercel webhook)
# Triggered on every main push that touches app code. Runs independently of VPS deploy pipeline.
name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "packages/**"
      - "apps/**"
      - "public/**"
      - "prisma/**"
      - "next.config.*"
      - "package.json"
      - "vercel.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: vercel-prod-deploy
  cancel-in-progress: false

jobs:
  deploy-vercel:
    name: Deploy esggo to Vercel (production)
    runs-on: ubuntu-latest
    environment: production
    # Bounded runtime — a hung job must not occupy the vercel-prod-deploy
    # concurrency group indefinitely (previous runs stalled for 3h+).
    # 有界執行時間：卡住的 job 不得長期佔用 vercel-prod-deploy 排程鎖。
    # Measured: install 51s + CLI 23s + upload 7s, then remote build — give the
    # remote build a realistic window while staying bounded.
    # 實測：install 51s + CLI 23s + upload 7s，其後為遠端建置，故給予合理但仍有界的窗口。
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.5.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        timeout-minutes: 8
        run: |
          echo "[diag] node=$(node -v) pnpm=$(pnpm -v) start=$(date -u +%FT%TZ)"
          pnpm install --frozen-lockfile
          echo "[diag] install ok end=$(date -u +%FT%TZ)"

      - name: Deploy to Vercel (production)
        timeout-minutes: 25
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not configured in this repo/environment; skipping Vercel deploy"
            exit 0
          fi
          echo "[diag] cli install start=$(date -u +%FT%TZ)"
          npm i -g vercel@latest
          vercel --version
          echo "[diag] deploy start=$(date -u +%FT%TZ)"
          vercel deploy --prod --yes --archive=tgz --token "$VERCEL_TOKEN" < /dev/null
          echo "[diag] deploy done end=$(date -u +%FT%TZ)"

      - name: Verify production endpoint
        if: success()
        timeout-minutes: 3
        env:
          DEPLOY_HEALTH_URL: https://esggo.vercel.app
        run: |
          # 果因消除：部署宣告成功後必須實測端點，避免「綠燈但站掛」的靜默失敗。
          for i in $(seq 1 6); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$DEPLOY_HEALTH_URL" || echo 000)
            echo "[diag] health attempt $i: $code at $(date -u +%FT%TZ)"
            case "$code" in
              2*|3*) echo "✅ production reachable ($code)"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::production endpoint not reachable: $DEPLOY_HEALTH_URL"
          exit 1

      - name: Notify
        if: success()
        run: echo "✅ Vercel production deployment successful"
