name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Stage 1: Lint & Typecheck ──────────────────────────────────────
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Git Safety Config
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        id: lint
        run: pnpm run lint
        continue-on-error: true

      - name: Run typecheck
        id: typecheck
        run: pnpm run typecheck
        continue-on-error: true

      - name: Build
        id: build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SKIP_ENV_VALIDATION: 1
        continue-on-error: true

      - name: Report status
        run: |
          echo "Lint: ${{ steps.lint.outcome }}"
          echo "Typecheck: ${{ steps.typecheck.outcome }}"
          echo "Build: ${{ steps.build.outcome }}"

  # ─── Stage 2: Self-Heal (on failure) ───────────────────────────────
  self-heal:
    needs: quality-check
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/omni-self-heal.yml
    with:
      failed_step: "CI Quality Check"
      error_log: "CI failed — see run logs for details"
      commit_sha: ${{ github.sha }}
      branch_name: ${{ github.ref_name }}
    secrets: inherit

  # ─── Stage 3: Deploy to VPS (on success) ────────────────────────────
  deploy-vps:
    needs: quality-check
    if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "==== 📥 Pulling latest code ===="
            cd /var/www/esggo
            git checkout main
            git pull origin main
            echo "==== 📦 Installing dependencies ===="
            pnpm install --frozen-lockfile
            echo "==== 🏗️ Building Next.js production ===="
            NODE_OPTIONS=--max_old_space_size=4096 pnpm run build
            echo "==== 🚀 Reloading PM2 services ===="
            pm2 reload esggo omniagent-gateway --update-env
            pm2 save
            echo "==== 🩺 Health check ===="
            curl -fsS http://127.0.0.1:3000/ -I || echo "⚠️ Web server not responding"
            curl -fsS http://127.0.0.1:8642/status || echo "⚠️ Gateway not responding"
            echo "==== ✅ Deployment complete ===="
