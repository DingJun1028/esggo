name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Git Safety Config
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: ppnpm install --no-frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run lint
        run: pnpm run lint || exit 1

      - name: Run typecheck
        run: pnpm run typecheck || exit 1

      - name: Run tests with coverage
        run: |
          pnpm add -D @vitest/coverage-v8
          pnpm exec vitest run --coverage --reporter=verbose
        continue-on-error: true

      - name: Build
        run: ppnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SKIP_ENV_VALIDATION: 1

      - name: Deploy to Oracle VPS
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 161.118.248.180
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "==== 📥 1. Pulling latest code from GitHub ===="
            cd /var/www/esggo
            git checkout main
            git pull origin main
            
            echo "==== 📦 2. Installing dependencies ===="
            if [ -f package-lock.json ]; then
              ppnpm install --frozen-lockfile
            else
              pnpm install
            fi
            
            echo "==== 🏗️ 3. Building Next.js production standalone ===="
            NODE_OPTIONS=--max_old_space_size=4096 pnpm run build
            
            echo "==== 🚀 4. Hot Reload PM2 Servers ===="
            pm2 reload esggo omniagent-gateway --update-env
            pm2 save
            
            echo "==== 🩺 5. Running Health Check ===="
            curl -fsS http://127.0.0.1:3000/ -I
            curl -fsS http://127.0.0.1:8642/status