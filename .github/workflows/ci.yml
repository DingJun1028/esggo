# =============================================================================
# OmniCore V5.1 — CI Pipeline (Quality Gate)
# =============================================================================
# 觸發條件: push/PR to main & develop
# 檢查項目: TypeScript、ESLint、Vitest 單元測試、覆蓋率門檻
# =============================================================================

name: OmniCore CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # 允許 CI 在 PR 留下覆蓋率評論

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.5.2"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ─── TypeScript 型別檢查 ──────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tsc --noEmit
        run: pnpm typecheck

  # ─── Cloudflare Worker (Smart AI Router) 型別 + 單元測試 ─────
  worker:
    name: Worker Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Worker typecheck
        run: pnpm exec tsc -p worker/tsconfig.json
      - name: Worker unit tests
        run: pnpm exec vitest run worker/ --reporter=verbose
        env:
          NODE_ENV: test

  # ─── ESLint 程式碼品質 ────────────────────────────────────────
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ESLint
        run: pnpm exec eslint src/ app/ --max-warnings 250

  # ─── Secret Scan 防止秘密洩漏 ────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          set -e
          echo "Scanning for committed secrets..."
          # HARD FAIL on real credential shapes
          if grep -rInE \
            "(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN .*PRIVATE KEY-----|sk_live_[A-Za-z0-9]+|cfat_[A-Za-z0-9_-]{20,})" \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" \
            --exclude-dir=node_modules --exclude-dir=.next \
            . ; then
            echo "::error::Possible secret detected in source code — aborting."
            exit 1
          fi
          echo "✅ No secrets detected"

  # ─── Vitest 單元測試 + 覆蓋率 ────────────────────────────────
  test:
    name: Vitest Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Vitest
        run: pnpm vitest run --reporter=verbose
        env:
          NODE_ENV: test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            test-results/
            coverage/
          retention-days: 7

  # ─── 萬能即時翻譯 (UT) 生產級測試 ─────────────────────────────
  ut-tests:
    name: UT API Tests (node --test) + 終始矩陣型別守門
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: 終始矩陣型別守門 (tsc 0-error)
        working-directory: apps/universal-translator
        run: npx tsc -p tsconfig.ut.json --noEmit
      - name: Run UT test suite
        working-directory: apps/universal-translator
        run: node --test test/ut.test.mjs
        env:
          NODE_ENV: test
      - name: Run FTG-Tools test suite (node --test)
        working-directory: apps/ftg-tools
        run: node --test ftg-mcp/server.test.mjs fal-images.test.mjs ftg-gen.test.mjs
        env:
          NODE_ENV: test

  # ─── SonarQube CLI agentic loop (選用增強) ─────────────────────
  # 需 SONAR_TOKEN + SonarQube Cloud 組織（啟用 agentic analysis）才啟用。
  # 未配置時整 job 跳過，不影響既有零依賴驗證鏈（對齊「只用免費算立」）。
  sonar-agentic:
    name: SonarQube Agentic Analysis (UT)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NOTE: job-level `if:` 只支援 github / needs / vars / inputs 這四個 context。
    # 先前寫成 `env.SONAR_TOKEN` 會讓整份 workflow 編譯失敗 (startup_failure, 0 jobs)。
    # 改用 repo variable 當開關；未設定時整個 job 直接 skip，不佔用 runner。
    # 啟用方式: gh variable set SONAR_ENABLED --body true  +  gh secret set SONAR_TOKEN
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install SonarQube CLI
        run: npm i -g sonarqube-cli
      - name: Analyze staged changes (agentic)
        working-directory: apps/universal-translator
        run: sonar analyze agentic --staged
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: universal-translator

  # SonarQube 整合工件本地煙測（免費算立版，不需 token）
  sonar-smoke:
    name: SonarQube Integration Smoke (no token)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify SonarQube integration artifacts
        working-directory: apps/universal-translator
        run: node scripts/sonar-smoke.mjs

  #  
  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck, eslint, test, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # 提供最低限度的假環境變數讓 build 通過
          GEMINI_API_KEY: "build-placeholder"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "build-placeholder"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-${{ github.sha }}
          path: .next/
          retention-days: 3

  # ─── Docker 映像構建測試 ──────────────────────────────────────
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_VERSION="${{ github.sha }}" \
            -t omnicore:ci-test \
            --target runner \
            .
          echo "✅ Docker image built successfully"
      - name: Test Docker HEALTHCHECK
        run: |
          docker run -d --name omnicore-test \
            -e NODE_ENV=test \
            -p 3000:3000 \
            omnicore:ci-test || true
          sleep 5
          docker stop omnicore-test 2>/dev/null || true
          docker rm omnicore-test 2>/dev/null || true
          echo "✅ Container lifecycle test complete"

  # ─── Lighthouse 效能預算 ────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build (production)
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          GEMINI_API_KEY: "build-placeholder"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "build-placeholder"
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          NEXT_TELEMETRY_DISABLED: "1"
          GEMINI_API_KEY: "build-placeholder"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "build-placeholder"

  # ─── agents.yaml 框架驗證 ─────────────────────────────────────
  agents-yaml:
    name: agents.yaml Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: Run OA-Team 30-Swarm verification
        run: python3 scripts/verify-agents-yaml.py

  # ─── Playwright E2E 回歸守門 (免費算立) ────────────────────────
  # 零幻覺警告橫幅視覺確認 (EdgeResearch exp-k1 KEEP 證據固化)
  # opt-in: 預設 skip (CI runner 連不到 VPS 域名 esggo.co)
  # 啟用: gh variable set E2E_ENABLED --body true (需在可連 VPS 的環境跑)
  # 本地開發者回歸: cd e2e-k1 && npx playwright test (已實證 1 passed)
  e2e-k1:
    name: E2E Zero-Hallucination (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.E2E_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Playwright (standalone, no pnpm)
        working-directory: e2e-k1
        run: npm i @playwright/test playwright && npx playwright install chromium
      - name: Run K1 zero-hallucination E2E
        working-directory: e2e-k1
        run: npx playwright test --reporter=line
        env:
          E2E_BASE: ${{ vars.E2E_BASE || 'https://esggo.co' }}

  # ─── VPS 腳本語法檢查 ─────────────────────────────────────────
  validate-vps:
    name: Validate VPS Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          set -e
          shopt -s globstar nullglob
          fail=0
          for f in $(find vps -name '*.sh'); do
            case "$f" in */console-*|*/recovery/*|*-bundle*|*oneshot*) echo "SKIP $f"; continue ;; esac
            if bash -n "$f"; then echo "OK  $f"; else echo "FAIL $f"; fail=1; fi
          done
          exit $fail
      - name: Docker syntax check
        run: |
          set -e
          # Only validate docker-compose files as compose configs
          for f in $(find vps -name 'docker-compose*.yml' -o -name 'compose*.yml'); do
            if [ -f "$f" ]; then
              echo "Checking $(basename "$f")..."
              docker compose -f "$f" config --quiet || {
                echo "::error::$(basename "$f") docker configuration invalid"
                exit 1
              }
            fi
          done
          # Validate Dockerfiles with docker build --check (needs buildx for multi-platform)
          for f in $(find vps -maxdepth 1 -name 'Dockerfile*'); do
            if [ -f "$f" ] && [ "$(basename "$f")" != "Dockerfile.arm64" ]; then
              echo "Checking $(basename "$f")..."
              if docker build --check -f "$f" . 2>/dev/null; then
                echo "OK $(basename "$f")"
              else
                echo "::warning::$(basename "$f") build --check skipped (context-dependent)"
              fi
            fi
          done
          echo "✅ All docker configurations valid"
      - name: Node syntax check
        run: |
          set -e
          find vps -name '*.mjs' -o -name '*.cjs' | while read -r f; do
            if node --check "$f"; then echo "OK  $f"; else echo "FAIL $f"; exit 1; fi
          done
      - name: Secret scan
        run: |
          set -e
          echo "Scanning for committed secrets..."
          if grep -rInE "(ocid1\.[a-z0-9]+\.|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN .*PRIVATE KEY-----)" vps/ ; then
            echo "::error::Possible secret found in vps/"; exit 1
          fi
          echo "✅ No secrets detected"
