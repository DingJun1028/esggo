name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Stage 1: Quality Gate ──────────────────────────────────────────────
  quality-check:
    name: 🔍 OmniValidate (TypeCheck / Lint / Build)
    runs-on: ubuntu-latest
    outputs:
      ci_failed:   ${{ steps.collect.outputs.ci_failed }}
      failed_step: ${{ steps.collect.outputs.failed_step }}
      error_log:   ${{ steps.collect.outputs.error_log }}

    steps:
      - uses: actions/checkout@v5
      - name: Git Safety Config
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # T2 Traceable ── TypeCheck ─────────────────────────────────────────
      - name: TypeCheck
        id: typecheck
        run: |
          set +e
          pnpm run typecheck > /tmp/typecheck.log 2>&1
          echo "code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      # T4 Transparent ── Lint ────────────────────────────────────────────
      - name: Lint
        id: lint
        run: |
          set +e
          pnpm run lint > /tmp/lint.log 2>&1
          echo "code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      # T1 Tangible ── Build ──────────────────────────────────────────────
      - name: Build
        id: build
        run: |
          set +e
          pnpm run build > /tmp/build.log 2>&1
          echo "code=$?" >> $GITHUB_OUTPUT
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SKIP_ENV_VALIDATION: 1
        continue-on-error: true

      # ── Collect failure context ─────────────────────────────────────────
      - name: Collect failure context
        id: collect
        shell: bash
        run: |
          FAILED=""
          LOG=""
          FAILED_FLAG="false"

          if [ "${{ steps.typecheck.outputs.code }}" != "0" ]; then
            FAILED="TypeCheck"
            LOG=$(tail -60 /tmp/typecheck.log 2>/dev/null || true)
            FAILED_FLAG="true"
          fi

          if [ "${{ steps.lint.outputs.code }}" != "0" ]; then
            [ -n "$FAILED" ] && FAILED="$FAILED,Lint" || FAILED="Lint"
            LOG="$LOG $(tail -40 /tmp/lint.log 2>/dev/null || true)"
            FAILED_FLAG="true"
          fi

          if [ "${{ steps.build.outputs.code }}" != "0" ]; then
            [ -n "$FAILED" ] && FAILED="$FAILED,Build" || FAILED="Build"
            LOG="$LOG $(tail -80 /tmp/build.log 2>/dev/null || true)"
            FAILED_FLAG="true"
          fi

          echo "ci_failed=$FAILED_FLAG"   >> $GITHUB_OUTPUT
          echo "failed_step=${FAILED:-none}" >> $GITHUB_OUTPUT
          {
            echo 'error_log<<__OMNI_EOF__'
            printf '%s' "$LOG"
            echo '__OMNI_EOF__'
          } >> $GITHUB_OUTPUT

      # ── Summary ────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          TC="${{ steps.typecheck.outputs.code }}"
          LN="${{ steps.lint.outputs.code }}"
          BD="${{ steps.build.outputs.code }}"
          echo "### 🔍 OmniValidate Result" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          [ "$TC" = "0" ] && echo "| TypeCheck | ✅ Passed |" >> $GITHUB_STEP_SUMMARY || echo "| TypeCheck | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          [ "$LN" = "0" ] && echo "| Lint      | ✅ Passed |" >> $GITHUB_STEP_SUMMARY || echo "| Lint      | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          [ "$BD" = "0" ] && echo "| Build     | ✅ Passed |" >> $GITHUB_STEP_SUMMARY || echo "| Build     | ❌ Failed |" >> $GITHUB_STEP_SUMMARY

      - name: Fail CI if errors detected
        if: steps.collect.outputs.ci_failed == 'true'
        run: |
          echo "Failed steps: ${{ steps.collect.outputs.failed_step }}"
          exit 1

  # ── Stage 2: Self-Heal (on failure) ────────────────────────────────────
  self-heal:
    name: 🤖 OmniAgent Self-Heal (Jules)
    needs: quality-check
    if: failure() && needs.quality-check.outputs.ci_failed == 'true'
    uses: ./.github/workflows/omni-self-heal.yml
    with:
      failed_step: ${{ needs.quality-check.outputs.failed_step }}
      error_log:   ${{ needs.quality-check.outputs.error_log }}
      commit_sha:  ${{ github.sha }}
      branch_name: ${{ github.ref_name }}
    secrets: inherit

  # ── Stage 3: Deploy to VPS (on success, main only) ─────────────────────
  deploy-vps:
    name: 🚀 Deploy to VPS
    needs: quality-check
    if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     22
          script: |
            set -e
            echo "==== Pulling latest code ===="
            cd /var/www/esggo
            git checkout main && git pull origin main
            echo "==== Installing dependencies ===="
            pnpm install --frozen-lockfile
            echo "==== Building Next.js production ===="
            NODE_OPTIONS=--max_old_space_size=4096 pnpm run build
            echo "==== Reloading PM2 services ===="
            pm2 reload esggo omniagent-gateway --update-env && pm2 save
            echo "==== Health check ===="
            curl -fsS http://127.0.0.1:3000/ -I || echo "Web server not responding"
            curl -fsS http://127.0.0.1:8642/status || echo "Gateway not responding"
            echo "==== Deployment complete ===="
