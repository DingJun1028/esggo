name: CI — OmniValidate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: 🔍 OmniValidate (Typecheck / Lint / Build)
    runs-on: ubuntu-latest
    outputs:
      failed_step: ${{ steps.set_failure.outputs.failed_step }}
      error_log:   ${{ steps.set_failure.outputs.error_log }}
      ci_failed:   ${{ steps.set_failure.outputs.ci_failed }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Git Safety Config
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── T2 Traceable: TypeCheck ─────────────────────────────────────────
      - name: Run TypeCheck
        id: typecheck
        run: |
          pnpm run typecheck 2>&1 | tee /tmp/typecheck.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ── T4 Transparent: Lint ────────────────────────────────────────────
      - name: Run Lint
        id: lint
        run: |
          pnpm run lint 2>&1 | tee /tmp/lint.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ── T1 Tangible: Build ──────────────────────────────────────────────
      - name: Run Build
        id: build
        run: |
          pnpm run build 2>&1 | tee /tmp/build.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SKIP_ENV_VALIDATION: 1
        continue-on-error: true

      # ── 彙整錯誤輸出 ────────────────────────────────────────────────────
      - name: Collect failure context
        id: set_failure
        run: |
          FAILED_STEP=""
          ERROR_LOG=""
          CI_FAILED="false"

          if [ "${{ steps.typecheck.outputs.exit_code }}" != "0" ]; then
            FAILED_STEP="TypeCheck"
            ERROR_LOG=$(cat /tmp/typecheck.log | tail -60)
            CI_FAILED="true"
          fi

          if [ "${{ steps.lint.outputs.exit_code }}" != "0" ]; then
            [ -z "$FAILED_STEP" ] && FAILED_STEP="Lint" || FAILED_STEP="$FAILED_STEP,Lint"
            ERROR_LOG="${ERROR_LOG}$(cat /tmp/lint.log | tail -40)"
            CI_FAILED="true"
          fi

          if [ "${{ steps.build.outputs.exit_code }}" != "0" ]; then
            [ -z "$FAILED_STEP" ] && FAILED_STEP="Build" || FAILED_STEP="$FAILED_STEP,Build"
            ERROR_LOG="${ERROR_LOG}$(cat /tmp/build.log | tail -80)"
            CI_FAILED="true"
          fi

          # GitHub output 多行必須使用 heredoc 格式
          echo "failed_step=$FAILED_STEP" >> $GITHUB_OUTPUT
          echo "ci_failed=$CI_FAILED" >> $GITHUB_OUTPUT
          {
            echo 'error_log<<EOF_ERROR_LOG'
            echo "$ERROR_LOG"
            echo 'EOF_ERROR_LOG'
          } >> $GITHUB_OUTPUT

      # ── 全部通過標記 ────────────────────────────────────────────────────
      - name: ✅ All checks passed
        if: steps.set_failure.outputs.ci_failed == 'false'
        run: echo "🟢 OmniValidate PASSED — TypeCheck ✓ Lint ✓ Build ✓"

      # ── 有錯誤則標記 CI 失敗 ────────────────────────────────────────────
      - name: ❌ CI Failed — trigger self-heal
        if: steps.set_failure.outputs.ci_failed == 'true'
        run: |
          echo "🔴 Failed steps: ${{ steps.set_failure.outputs.failed_step }}"
          echo "Triggering omni-self-heal..."
          exit 1

  # ── 多代理自我修復觸發 ──────────────────────────────────────────────────
  omni-self-heal:
    name: 🤖 OmniAgent Self-Heal (Jules)
    needs: validate
    if: failure() && needs.validate.outputs.ci_failed == 'true'
    uses: ./.github/workflows/omni-self-heal.yml
    with:
      failed_step: ${{ needs.validate.outputs.failed_step }}
      error_log:   ${{ needs.validate.outputs.error_log }}
      commit_sha:  ${{ github.sha }}
      branch_name: ${{ github.ref_name }}
    secrets: inherit
