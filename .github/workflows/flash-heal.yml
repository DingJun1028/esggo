name: Flash-Heal Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flash-heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint (flash-heal)
        run: pnpm run lint
        continue-on-error: true

      - name: Run typecheck
        run: pnpm run typecheck
        continue-on-error: true
