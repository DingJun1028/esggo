name: fix-db
on:
  workflow_dispatch:

jobs:
  fix-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      secrets: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate new password and construct URL
        id: gen
        run: |
          NEW_PW=$(openssl rand -base64 24 | tr '+/' '-_')
          echo "password=$NEW_PW" >> $GITHUB_OUTPUT
          echo "url=postgresql://postgres:${NEW_PW}@db.yhwfmavnhaivvgzeuklx.supabase.co:5432/postgres" >> $GITHUB_OUTPUT

      - name: Reset Supabase database password
        run: |
          curl -X POST "https://api.supabase.com/v1/projects/yhwfmavnhaivvgzeuklx/database-password" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"password\":\"${{ steps.gen.outputs.password }}\"}"

      - name: Update GitHub secret SUPABASE_DB_URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ steps.gen.outputs.url }}" | gh secret set SUPABASE_DB_URL -R ${{ github.repository }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -T 10 ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Update .env on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "sudo sed -i 's|^DATABASE_URL=.*|DATABASE_URL=${{ steps.gen.outputs.url }}|' /opt/esggo/vps/.env"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'GATEWAY_API_KEY=${{ secrets.OPENROUTER_API_KEY }}' | sudo tee -a /opt/esggo/vps/.env > /dev/null"

      - name: Verify
        run: |
          echo "New URL: ${{ steps.gen.outputs.url }}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "grep '^DATABASE_URL=' /opt/esggo/vps/.env && echo '---' && grep '^GATEWAY_API_KEY=' /opt/esggo/vps/.env"