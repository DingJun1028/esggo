name: Deploy OmniGateway Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy OmniGateway Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Install Worker deps
        working-directory: worker
        run: npm init -y && npm install --save-dev typescript @types/node

      - name: Typecheck Worker
        working-directory: worker
        run: npx tsc --noEmit -p tsconfig.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # 從 repo 根執行，與根 wrangler.toml 的根相對路徑（main = "worker/src/index.ts"）基準一致。
          # 原 workingDirectory: worker 會讓 wrangler 在 worker/ 找不到 wrangler.toml 而上溯到根，
          # 再以 cwd=worker/ 解析 [build].command 中的 my-worker/tsconfig.json → TS5058。
          command: deploy --config wrangler.toml
          # source_origin: run 33159512244 —「Unable to locate executable file: pnpm」。
          # wrangler-action 未指定 packageManager 時，會依 lockfile 推斷；改由 repo 根執行後
          # 命中根 pnpm-lock.yaml / packageManager: pnpm@11.5.2，但本 workflow 從未 setup pnpm，
          # 故安裝 wrangler 階段即失敗。此處顯式指定 npm，與上方 `npm install -g wrangler@latest` 一致。
          packageManager: npm

