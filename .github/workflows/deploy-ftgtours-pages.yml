name: Deploy ftgtours.esggo.co to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/ftg-tours-website/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    defaults:
      run:
        working-directory: apps/ftg-tours-website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
      - name: Copy 404.html
        run: cp dist/index.html dist/404.html
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/ftg-tours-website/dist
          destination_dir: ''
