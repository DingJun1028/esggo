name: Design Token Validation
on:
  pull_request:
    paths:
      - 'designs/**/*.json'
      - 'src/**/*.tsx'
      - 'scripts/*.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run design:check
      - run: npm run type:check
      - run: npm run naming:validate
      - run: npm run sql:validate