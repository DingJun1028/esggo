# =============================================================================
# ESG GO — Oracle VPS Deploy Pipeline
# =============================================================================
# 觸發條件: push to main (paths: vps/**, app/**, src/**, packages/**)
# 部署目標: Oracle Cloud Always Free ARM Ampere A1
# 部署方式: SSH + Docker Compose (VPS 上直接構建)
# =============================================================================

name: Deploy to Oracle VPS

on:
  push:
    branches: [main]
    paths:
      - "vps/**"
      - "app/**"
      - "src/**"
      - "packages/**"
      - "public/**"
      - "prisma/**"
      - "next.config.js"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests before deploy"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: deploy-oracle-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  APP_DIR: /opt/esggo
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # ─── 前置檢查 ─────────────────────────────────────────────────
  pre-check:
    name: Pre-deploy Check
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Check VPS secrets
        id: check
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::warning::VPS_HOST not set, skipping deploy"
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          elif [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::warning::VPS_SSH_KEY not set, skipping deploy"
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          fi

  # ─── CI 驗證（快速） ──────────────────────────────────────────
  ci-fast:
    name: Fast CI Gate
    runs-on: ubuntu-latest
    if: needs.pre-check.outputs.should_deploy == 'true' && inputs.skip_tests != 'true'
    needs: [pre-check]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm typecheck
      - name: Run tests
        run: pnpm vitest run --reporter=verbose

  # ─── 部署到 Oracle VPS ───────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [pre-check, ci-fast]
    if: always() && needs.pre-check.outputs.should_deploy == 'true' && (needs.ci-fast.result == 'success' || needs.ci-fast.result == 'skipped')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          set -e
          mkdir -p ~/.ssh

          # Validate secrets are non-empty
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::VPS_SSH_KEY secret is empty — add it in repo Settings → Secrets"
            exit 1
          fi
          if [ -z "${{ env.VPS_HOST }}" ]; then
            echo "::error::VPS_HOST env is empty — check repo-level env or secret"
            exit 1
          fi

          # Write private key
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Verify key is non-empty and valid
          KEY_SIZE=$(wc -c < ~/.ssh/deploy_key | tr -d ' ')
          if [ "$KEY_SIZE" -lt 100 ]; then
            echo "::error::VPS_SSH_KEY appears too short (${KEY_SIZE} bytes) — verify the full private key is stored"
            exit 1
          fi
          echo "[OK] SSH key written (${KEY_SIZE} bytes)"

          # Add host key to known_hosts (non-fatal — StrictHostKeyChecking=no is used later)
          echo "Scanning host key for ${{ env.VPS_HOST }}..."
          if ssh-keyscan -H -T 10 ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "[OK] Host key added to known_hosts"
          else
            echo "::warning::ssh-keyscan failed — proceeding with StrictHostKeyChecking=no"
          fi

      - name: Sync code to VPS
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='*.db' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.production' \
            --exclude='packages/*/node_modules' \
            --exclude='apps/*/node_modules' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.APP_DIR }}/

      - name: Deploy secrets to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            printf '%s\n' \
              "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" \
              "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" \
              "OPENROUTER_MODEL=${{ secrets.OPENROUTER_MODEL || 'meta-llama/llama-3.3-70b-instruct:free' }}" \
              "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
              "AGNES_API=${{ secrets.AGNES_API }}" \
              "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
              "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              "FIREBASE_SERVICE_ACCOUNT_JSON=${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" \
              "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
              "GATEWAY_API_KEY=${{ secrets.GATEWAY_API_KEY }}" \
              > ${{ env.APP_DIR }}/vps/.env
            echo "[OK] .env written to ${{ env.APP_DIR }}/vps/.env"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.APP_DIR }}/vps

            echo "=== [1/5] Pull latest code ==="
            cd ${{ env.APP_DIR }}
            git pull origin main --quiet || true

            echo "=== [2/5] Build Docker images on VPS ==="
            cd ${{ env.APP_DIR }}/vps
            docker compose -f docker-compose.prod.yml build --no-cache

            echo "=== [3/5] Stop old containers ==="
            docker compose -f docker-compose.prod.yml down

            echo "=== [4/5] Start services ==="
            docker compose -f docker-compose.prod.yml up -d

            echo "=== [5/5] Health check ==="
            sleep 15
            for i in $(seq 1 10); do
              STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "[OK] Health check passed (attempt $i)"
                exit 0
              fi
              echo "[WAIT] Waiting... (attempt $i, status=$STATUS)"
              sleep 5
            done
            echo "[FAIL] Health check failed"
            docker compose -f docker-compose.prod.yml logs --tail=50 esggo
            exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ─── 通知 ─────────────────────────────────────────────────────
  notify:
    name: Deploy Notification
    needs: [pre-check, deploy]
    runs-on: ubuntu-latest
    if: always() && needs.pre-check.outputs.should_deploy == 'true'
    steps:
      - name: Notify on success
        if: needs.deploy.result == 'success'
        run: |
          echo "[OK] ESG GO deployed successfully to Oracle VPS"
          echo "[URL] ${{ vars.VPS_URL || format('https://{0}', secrets.VPS_HOST) }}"

      - name: Notify on failure
        if: needs.deploy.result == 'failure'
        run: |
          echo "[FAIL] ESG GO deployment failed"
          echo "Please check the logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
