# =============================================================================
# ESG GO — Oracle VPS Deploy Pipeline (REALITY-ALIGNED, 2026-07-11)
# =============================================================================
# 觸發: push to main (paths below) 或手動 workflow_dispatch
# 部署目標: Oracle Cloud Always Free ARM Ampere A1 (Ubuntu 24.04)
# 真實部署方式: nginx + PM2 (fork mode)，非 Docker Compose
# 網路: 公網 22/8042 關，僅 80/443 開；部署走 OCI Bastion 跳板 (推薦) 或直連 (需開 NSG)
#
# 三種模式 (pre-check 依據 repo Secrets 自動選擇):
#   bastion : 設好 OCI_* secrets → 在 Actions 內用 oci Python SDK 重建 bastion session 跳板部署 (安全, 不需開公網端口)
#   direct  : 設好 VPS_SSH_KEY + VPS_HOST，且 OCI NSG 已放行 GitHub Actions IP → 直連部署
#   skip    : 兩者皆未設 → 跳過部署 (不再讓 push 變紅)
#
# 需在 GitHub 控制台 (Settings → Secrets and variables → Actions) 設定:
#   選項 3 (bastion, 推薦):
#     OCI_USER_OCID, OCI_TENANCY_OCID, OCI_REGION (e.g. ap-singapore-1),
#     OCI_API_FINGERPRINT, OCI_API_KEY (PEM 私鑰全文),
#     OCI_BASTION_ID (ocid1.bastion...), OCI_TARGET_RESOURCE_ID (VPS compute instance OCID)
#   選項 2 (direct, 需開 NSG):
#     VPS_HOST (161.118.248.180), VPS_USER (root), VPS_SSH_KEY (私鑰)
#   兩者皆需 (應用程式 API key, 選填 — 若設則寫入 vps/.env):
#     GROQ_API_KEY, OPENROUTER_API_KEY, GEMINI_API_KEY, SUPABASE_*, GATEWAY_API_KEY, ...
# =============================================================================

name: Deploy to Oracle VPS

on:
  push:
    branches: [main]
    paths:
      - "vps/**"
      - "src/**"
      - "packages/**"
      - "apps/**"
      - "public/**"
      - "prisma/**"
      - "next.config.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "ecosystem.config.cjs"
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "bastion (OCI jump, recommended) or direct (SSH, needs NSG open)"
        required: false
        default: "bastion"
        type: choice
        options:
          - bastion
          - direct

concurrency:
  group: deploy-oracle-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_USER: ${{ secrets.VPS_USER || 'root' }}
  APP_DIR: /var/www/esggo
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # ─── 前置檢查：決定部署模式 ───────────────────────────────────
  pre-check:
    name: Pre-deploy Check
    runs-on: ubuntu-latest
    env:
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
      OCI_BASTION_ID: ${{ secrets.OCI_BASTION_ID }}
      OCI_TARGET_RESOURCE_ID: ${{ secrets.OCI_TARGET_RESOURCE_ID }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
    outputs:
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - id: check
        run: |
          REQ="OCI_USER_OCID OCI_TENANCY_OCID OCI_API_KEY OCI_BASTION_ID OCI_TARGET_RESOURCE_ID"
          all_set=1
          for s in $REQ; do
            [ -n "${!s}" ] || all_set=0
          done
          if [ "$all_set" = "1" ] && { [ "${{ inputs.deploy_mode || 'bastion' }}" = "bastion" ] || [ -z "$VPS_SSH_KEY" ]; }; then
            echo "mode=bastion" >> $GITHUB_OUTPUT
            echo "::notice::Bastion deploy mode (OCI secrets present)"
          elif [ -n "$VPS_SSH_KEY" ] && [ -n "$VPS_HOST" ]; then
            echo "mode=direct" >> $GITHUB_OUTPUT
            echo "::notice::Direct SSH deploy mode (needs NSG open to VPS_HOST:22)"
          else
            echo "mode=skip" >> $GITHUB_OUTPUT
            echo "::warning::No deploy secrets configured. Skipping auto-deploy (this is OK — manual bastion deploy still works). Set OCI_* or VPS_SSH_KEY in repo Secrets to enable."
          fi

  # ─── 部署 ───────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [pre-check]
    if: needs.pre-check.outputs.mode != 'skip'
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # ---- 選項 3: bastion 跳板 (oci Python SDK) ----
      - name: Configure OCI + create bastion session
        if: needs.pre-check.outputs.mode == 'bastion'
        id: bastion
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_API_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
          OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
          OCI_BASTION_ID: ${{ secrets.OCI_BASTION_ID }}
          OCI_TARGET_RESOURCE_ID: ${{ secrets.OCI_TARGET_RESOURCE_ID }}
        run: |
          set -e
          pip install --quiet oci
          mkdir -p ~/.oci ~/.ssh
          python3 << 'PY'
          import os, re, pathlib, time, subprocess
          raw = os.environ["OCI_API_KEY"]
          m = re.search(r'-----BEGIN [^-]+-----.*?-----END [^-]+-----', raw, re.S)
          clean = (m.group(0) if m else raw).replace("\r", "").strip() + "\n"
          kp = pathlib.Path("~/.oci/key.pem").expanduser()
          kp.write_text(clean)
          os.chmod(kp, 0o600)
          bk = os.path.expanduser("~/.ssh/bastion_key")
          subprocess.run(["ssh-keygen", "-t", "ed25519", "-N", "", "-f", bk], check=True)
          pub = pathlib.Path(bk + ".pub").read_text().strip()
          import oci
          cfg = {
            "user": os.environ["OCI_USER_OCID"],
            "tenancy": os.environ["OCI_TENANCY_OCID"],
            "region": os.environ["OCI_REGION"],
            "fingerprint": os.environ["OCI_API_FINGERPRINT"],
            "key_file": str(kp),
          import oci
          client = oci.bastion.BastionClient(cfg)
          details = oci.bastion.models.CreateSessionDetails(
            bastion_id=os.environ["OCI_BASTION_ID"],
            display_name="gha-deploy-" + time.strftime("%Y%m%d-%H%M%S"),
            session_ttl_in_seconds=3600,
            target_resource_details=oci.bastion.models.CreateSessionTargetResourceDetails(
              session_type="MANAGED_SSH",
              target_resource_id=os.environ["OCI_TARGET_RESOURCE_ID"],
              target_resource_operating_system_user_name="root",
            ),
            key_details=oci.bastion.models.PublicKeyDetails(public_key_content=pub),
          )
          try:
            resp = client.create_session(create_session_details=details, wait_for_states=["ACTIVE"])
            sid = resp.data.id
            with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("session=" + sid + "\n")
              f.write("proxy=ssh -W %h:%p -p 22 " + sid + "@host.bastion." + os.environ["OCI_REGION"] + ".oci.oraclecloud.com\n")
            print("[OK] bastion session " + sid)
          except Exception as e:
            print("OCI_SDK_ERROR:")
            print(str(e)[:1500])
            raise SystemExit(1)
          PY

      - name: Deploy via bastion
        if: needs.pre-check.outputs.mode == 'bastion'
        env:
          PROXY: ${{ steps.bastion.outputs.proxy }}
          SESSION: ${{ steps.bastion.outputs.session }}
        run: |
          set -e
          ssh -o ProxyCommand="$PROXY" -o StrictHostKeyChecking=no -i ~/.ssh/bastion_key root@10.0.0.119 bash -s <<'VPS'
            set -e
            cd /var/www/esggo
            pnpm install --frozen-lockfile
            pnpm run build
            pm2 restart esggo-core omniagent-gateway
            pm2 save
            echo "[OK] deployed via bastion"
          VPS

      # ---- 選項 2: 直連 ----
      - name: Setup direct SSH key
        if: needs.pre-check.outputs.mode == 'direct'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -T 10 ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy direct
        if: needs.pre-check.outputs.mode == 'direct'
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s <<'VPS'
            set -e
            cd /var/www/esggo
            pnpm install --frozen-lockfile
            pnpm run build
            pm2 restart esggo-core omniagent-gateway
            pm2 save
            echo "[OK] deployed direct"
          VPS

      - name: Cleanup
        if: always() && needs.pre-check.outputs.mode == 'bastion'
        run: rm -f ~/.ssh/bastion_key ~/.ssh/bastion_key.pub ~/.oci/key.pem || true

  # ─── 通知 ───────────────────────────────────────────────────
  notify:
    name: Deploy Notification
    needs: [pre-check, deploy]
    runs-on: ubuntu-latest
    if: always() && needs.pre-check.outputs.mode != 'skip'
    steps:
      - name: Result
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "[OK] ESG GO deployed to Oracle VPS (${{ needs.pre-check.outputs.mode }} mode)"
          else
            echo "[FAIL] Deploy failed (${{ needs.pre-check.outputs.mode }} mode) — run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
