# =============================================================================
# ESG GO — Oracle VPS Deploy Pipeline (REALITY-ALIGNED, 2026-07-11)
# =============================================================================
# 觸發: push to main (paths below) 或手動 workflow_dispatch
# 部署目標: Oracle Cloud Always Free ARM Ampere A1 (Ubuntu 24.04)
# 真實部署方式: nginx + PM2 (fork mode)，非 Docker Compose
# 網路: 公網 22/8042 關，僅 80/443 開；部署走 OCI Bastion 跳板 (推薦) 或直連 (需開 NSG)
#
# 三種模式 (pre-check 依據 repo Secrets 自動選擇):
#   bastion : 設好 OCI_* secrets → 在 Actions 內重建 bastion session 跳板部署 (安全, 不需開公網端口)
#   direct  : 設好 VPS_SSH_KEY + VPS_HOST，且 OCI NSG 已放行 GitHub Actions IP → 直連部署
#   skip    : 兩者皆未設 → 跳過部署 (不再讓 push 變紅)
#
# 需在 GitHub 控制台 (Settings → Secrets and variables → Actions) 設定:
#   選項 3 (bastion, 推薦):
#     OCI_USER_OCID, OCI_TENANCY_OCID, OCI_REGION (e.g. ap-singapore-1),
#     OCI_API_FINGERPRINT, OCI_API_KEY (PEM 私鑰全文),
#     OCI_BASTION_ID (ocid1.bastion...), OCI_TARGET_RESOURCE_ID (VPS compute instance OCID)
#   選項 2 (direct, 需開 NSG):
#     VPS_HOST (161.118.248.180), VPS_USER (root), VPS_SSH_KEY (私鑰)
#   兩者皆需 (應用程式 API key, 選填 — 若設則寫入 vps/.env):
#     GROQ_API_KEY, OPENROUTER_API_KEY, GEMINI_API_KEY, SUPABASE_*, GATEWAY_API_KEY, ...
# =============================================================================

name: Deploy to Oracle VPS

on:
  push:
    branches: [main]
    paths:
      - "vps/**"
      - "src/**"
      - "packages/**"
      - "apps/**"
      - "public/**"
      - "prisma/**"
      - "next.config.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "ecosystem.config.cjs"
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "bastion (OCI jump, recommended) or direct (SSH, needs NSG open)"
        required: false
        default: "bastion"
        type: choice
        options:
          - bastion
          - direct

concurrency:
  group: deploy-oracle-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_USER: ${{ secrets.VPS_USER || 'root' }}
  APP_DIR: /var/www/esggo
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # ─── 前置檢查：決定部署模式 ───────────────────────────────────
  pre-check:
    name: Pre-deploy Check
    runs-on: ubuntu-latest
    env:
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
      OCI_BASTION_ID: ${{ secrets.OCI_BASTION_ID }}
      OCI_TARGET_RESOURCE_ID: ${{ secrets.OCI_TARGET_RESOURCE_ID }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
    outputs:
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - id: check
        run: |
          REQ="OCI_USER_OCID OCI_TENANCY_OCID OCI_API_KEY OCI_BASTION_ID OCI_TARGET_RESOURCE_ID"
          all_set=1
          for s in $REQ; do
            [ -n "${!s}" ] || all_set=0
          done
          if [ "$all_set" = "1" ] && { [ "${{ inputs.deploy_mode || 'bastion' }}" = "bastion" ] || [ -z "$VPS_SSH_KEY" ]; }; then
            echo "mode=bastion" >> $GITHUB_OUTPUT
            echo "::notice::Bastion deploy mode (OCI secrets present)"
          elif [ -n "$VPS_SSH_KEY" ] && [ -n "$VPS_HOST" ]; then
            echo "mode=direct" >> $GITHUB_OUTPUT
            echo "::notice::Direct SSH deploy mode (needs NSG open to VPS_HOST:22)"
          else
            echo "mode=skip" >> $GITHUB_OUTPUT
            echo "::warning::No deploy secrets configured. Skipping auto-deploy (this is OK — manual bastion deploy still works). Set OCI_* or VPS_SSH_KEY in repo Secrets to enable."
          fi

  # ─── 部署 ───────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [pre-check]
    if: needs.pre-check.outputs.mode != 'skip'
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # ---- 選項 3: bastion 跳板 ----
      - name: Install OCI CLI (bastion mode)
        if: needs.pre-check.outputs.mode == 'bastion'
        run: pip install --quiet oci-cli

      - name: Configure OCI + create bastion session
        if: needs.pre-check.outputs.mode == 'bastion'
        id: bastion
        run: |
          set -e
          mkdir -p ~/.oci ~/.ssh
          cat > ~/.oci/config <<'EOF'
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          fingerprint=${{ secrets.OCI_API_FINGERPRINT }}
          key_file=~/.oci/key.pem
          EOF
          printf '%s' "${{ secrets.OCI_API_KEY }}" > ~/.oci/key_raw.pem
          python3 -c "import re,pathlib; raw=pathlib.Path('~/.oci/key_raw.pem').expanduser().read_text(errors='replace'); m=re.search(r'-----BEGIN [^-]+-----.*?-----END [^-]+-----', raw, re.S); clean=(m.group(0) if m else raw).replace(chr(13),'').strip()+chr(10); pathlib.Path('~/.oci/key.pem').expanduser().write_text(clean); print('key.pem bytes:', len(clean.encode()))"
          chmod 600 ~/.oci/key.pem
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/bastion_key
          SESSION=$(oci bastion session create-managed-ssh \
            --bastion-id ${{ secrets.OCI_BASTION_ID }} \
            --region ${{ secrets.OCI_REGION }} \
            --target-resource-id ${{ secrets.OCI_TARGET_RESOURCE_ID }} \
            --target-os-username root \
            --ssh-public-key-file ~/.ssh/bastion_key.pub \
            --session-ttl 3600 \
            --wait-for-state ACTIVE \
            --raw-output --query 'data.id' 2>/tmp/oci_err) || {
            echo "OCI_ERR_B64_START"
            base64 /tmp/oci_err
            echo "OCI_ERR_B64_END"
            exit 1
          }
          echo "session=$SESSION" >> $GITHUB_OUTPUT
          echo "proxy=ssh -W %h:%p -p 22 $SESSION@host.bastion.${{ secrets.OCI_REGION }}.oci.oraclecloud.com" >> $GITHUB_OUTPUT
          echo "[OK] bastion session $SESSION"

      # ---- 選項 2: 直連 ----
      - name: Setup direct SSH key
        if: needs.pre-check.outputs.mode == 'direct'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -T 10 ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # ---- 共用：同步程式碼 + 建置 + PM2 重啟 ----
      - name: Deploy via bastion
        if: needs.pre-check.outputs.mode == 'bastion'
        env:
          PROXY: ${{ steps.bastion.outputs.proxy }}
        run: |
          set -e
          SSH="ssh -o ProxyCommand=\"$PROXY\" -o StrictHostKeyChecking=no -i ~/.ssh/bastion_key"
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.next' \
            --exclude='*.db' --exclude='.env' --exclude='.env.*' \
            --exclude='packages/*/node_modules' --exclude='apps/*/node_modules' \
            -e "ssh -o ProxyCommand=\"$PROXY\" -o StrictHostKeyChecking=no -i ~/.ssh/bastion_key" \
            ./ root@10.0.0.119:${{ env.APP_DIR }}/
          ssh -o ProxyCommand="$PROXY" -o StrictHostKeyChecking=no -i ~/.ssh/bastion_key root@10.0.0.119 bash -s <<'VPS'
            set -e
            cd /var/www/esggo
            pnpm install --frozen-lockfile
            pnpm run build
            pm2 restart esggo-core omniagent-gateway
            pm2 save
            echo "[OK] deployed via bastion"
          VPS

      - name: Deploy direct
        if: needs.pre-check.outputs.mode == 'direct'
        run: |
          set -e
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.next' \
            --exclude='*.db' --exclude='.env' --exclude='.env.*' \
            --exclude='packages/*/node_modules' --exclude='apps/*/node_modules' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ env.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.APP_DIR }}/
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s <<'VPS'
            set -e
            cd /var/www/esggo
            pnpm install --frozen-lockfile
            pnpm run build
            pm2 restart esggo-core omniagent-gateway
            pm2 save
            echo "[OK] deployed direct"
          VPS

      - name: Cleanup
        if: always() && needs.pre-check.outputs.mode == 'bastion'
        run: rm -f ~/.ssh/bastion_key ~/.ssh/bastion_key.pub ~/.oci/key.pem || true

  # ─── 通知 ───────────────────────────────────────────────────
  notify:
    name: Deploy Notification
    needs: [pre-check, deploy]
    runs-on: ubuntu-latest
    if: always() && needs.pre-check.outputs.mode != 'skip'
    steps:
      - name: Result
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "[OK] ESG GO deployed to Oracle VPS (${{ needs.pre-check.outputs.mode }} mode)"
          else
            echo "[FAIL] Deploy failed (${{ needs.pre-check.outputs.mode }} mode) — run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
