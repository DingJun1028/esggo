name: OA-Team 30 Swarm — CrewAI Run

on:
  push:
    paths:
      - 'oa-team-crewai/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crewai-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oa-team-crewai
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run OA-Team 30 Swarm (via uv run)
        env:
          # LLM：優先使用 Groq（litellm 的 groq/ 前綴會讀取 GROQ_API_KEY）。
          # 沒有 GROQ_API_KEY 時，才回落到 CREWAI_API_KEY 或 OPENAI_API_KEY（OpenAI）。
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FALLBACK_OPENAI_API_KEY: ${{ secrets.CREWAI_API_KEY || secrets.OPENAI_API_KEY }}
          GROQ_MODEL_NAME: groq/qwen/qwen3.8-27b
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if [ -n "$GROQ_API_KEY" ]; then
            echo "LLM 提供者：Groq（${GROQ_MODEL_NAME}）"
            export OPENAI_MODEL_NAME="$GROQ_MODEL_NAME"
            # CrewAI 預設仍會檢查 OPENAI_API_KEY 是否存在，給佔位值，實際呼叫走 Groq
            export OPENAI_API_KEY="${FALLBACK_OPENAI_API_KEY:-unused-groq-routed}"
          elif [ -n "$FALLBACK_OPENAI_API_KEY" ]; then
            echo "LLM 提供者：OpenAI（回落）"
            export OPENAI_API_KEY="$FALLBACK_OPENAI_API_KEY"
            export OPENAI_MODEL_NAME="gpt-4o-mini"
          else
            echo "::error::LLM 憑證缺失：GROQ_API_KEY、CREWAI_API_KEY、OPENAI_API_KEY 皆為空，無法載入 agents/*.jsonc"
            exit 1
          fi
          # 固定 mcp<2：未固定時 litellm 會因 mcp.types 缺少 CacheableResult 而匯入失敗
          uv run --python 3.13 --with 'crewai[litellm]' --with 'mcp<2' python main.py "為 ESG-GO 產出一個 5T 合規的元件骨架"
