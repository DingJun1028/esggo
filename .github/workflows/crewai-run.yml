name: OA-Team 30 Swarm — CrewAI Run

on:
  push:
    paths:
      - 'oa-team-crewai/**'
  workflow_dispatch:

jobs:
  crewai-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oa-team-crewai
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run OA-Team 30 Swarm (via uv run)
        env:
          # CREWAI_API_KEY 由 GitHub Secrets 注入 (user stored via gh secret set)
          OPENAI_API_KEY: ${{ secrets.CREWAI_API_KEY }}
          OPENAI_MODEL_NAME: gpt-4o-mini
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run --python 3.13 --with 'crewai[litellm]' python main.py "為 ESG-GO 產出一個 5T 合規的元件骨架"
