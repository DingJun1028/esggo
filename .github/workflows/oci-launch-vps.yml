name: OCI Launch New VPS
on:
  workflow_dispatch:
jobs:
  launch:
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.launch.outputs.ip }}
      instance_id: ${{ steps.launch.outputs.instance }}
    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          sudo apt-get update -qq
          curl -L -o /tmp/oci-cli.zip https://download.oracle.com/otn_scripts/linux/instantclient/oci-cli/oci-cli-3.45.0.zip
          unzip -q /tmp/oci-cli.zip -d /tmp/oci
          sudo /tmp/oci/oci-cli/install.sh -b /usr/local/bin
          oci --version

      - name: Configure OCI from secrets
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_API_KEY }}
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config <<EOFCONF
          [DEFAULT]
          user=$OCI_USER
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=/tmp/oci_key.pem
          fingerprint=$OCI_FINGERPRINT
          EOFCONF
          printf '%s' "$OCI_KEY" > /tmp/oci_key.pem
          chmod 600 /tmp/oci_key.pem
          oci iam compartment list --query 'data[].{id:id,name:name}' --output table

      - name: Find Ubuntu 24.04 image
        id: image
        run: |
          SAN() { sed -e 's/\[//g' -e 's/\]//g' -e 's/"//g' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/,$//'; }
          IMAGE=$(oci --raw-output compute image list \
            --compartment-id ${{ secrets.OCI_TENANCY_OCID }} \
            --query "data[?\"display-name\" != null && contains(\"display-name\", \"Ubuntu\") && contains(\"display-name\", \"24.04\")].id | [0]" \
            | SAN)
          echo "image_id=$IMAGE" >> $GITHUB_OUTPUT

      - name: Launch instance
        id: launch
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_API_KEY }}
        run: |
          SSH_PUB=$(printf '%s' "$OCI_SSH_KEY" > /tmp/oci_key.pem && ssh-keygen -y -f /tmp/oci_key.pem 2>/dev/null)
          INSTANCE=$(oci compute instance launch \
            --compartment-id ${{ secrets.OCI_TENANCY_OCID }} \
            --availability-domain "AVtxs:US-Ashburn-1" \
            --shape "VM.Standard.E4.Flex" \
            --shape-config '{"ocpus":1,"memoryInGBs":4}' \
            --source-details imageId=${{ steps.image.outputs.image_id }} \
            --ssh-authorized-keys "$SSH_PUB" \
            --wait-for-state RUNNING \
            --max-wait-seconds 600 \
            --query 'data.{ip:"public-ip",id:"id"}' \
            --output json)
          echo "ip=$(echo $INSTANCE | jq -r '.ip')" >> $GITHUB_OUTPUT
          echo "instance=$(echo $INSTANCE | jq -r '.id')" >> $GITHUB_OUTPUT

      - name: Open firewall ports
        run: |
          SAN() { sed -e 's/\[//g' -e 's/\]//g' -e 's/"//g' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/,$//'; }
          VNIC_ID=$(oci --raw-output compute instance list-vnics \
            --compartment-id ${{ secrets.OCI_TENANCY_OCID }} \
            --instance-id ${{ steps.launch.outputs.instance }} \
            --query 'data[0].id' | SAN)
          SUBNET_ID=$(oci --raw-output network vnic get --vnic-id "$VNIC_ID" --query 'data.subnet-id' | SAN)
          NSG_ID=$(oci --raw-output network subnet get --subnet-id "$SUBNET_ID" --query 'data.network-security-group-ids[0]' | SAN)
           oci network security-group add-security-rules --nsg-id $NSG_ID \
             --security-rules '[
               {
                 "direction": "INGRESS",
                 "protocol": "tcp",
                 "source": "10.0.0.0/8",
                 "is-stateless": false,
                 "tcp-options": {"destination-port-range": {"min": 22, "max": 22}},
                 "description": "SSH (VPN/bastion only)"
               },
               {
                 "direction": "INGRESS",
                 "protocol": "tcp",
                 "source": "10.0.0.0/8",
                 "is-stateless": false,
                 "tcp-options": {"destination-port-range": {"min": 8642, "max": 8642}},
                 "description": "App 8642 (VPN/bastion only)"
               },
               {
                 "direction": "INGRESS",
                 "protocol": "tcp",
                 "source": "0.0.0.0/0",
                 "is-stateless": false,
                 "tcp-options": {"destination-port-range": {"min": 80, "max": 80}},
                 "description": "HTTP (public)"
               },
               {
                 "direction": "INGRESS",
                 "protocol": "tcp",
                 "source": "0.0.0.0/0",
                 "is-stateless": false,
                 "tcp-options": {"destination-port-range": {"min": 443, "max": 443}},
                 "description": "HTTPS (public)"
               }
             ]' 2>/dev/null || echo "Rules may already exist"

      - name: Output connection info
        run: |
          echo "NEW_VPS_IP=${{ steps.launch.outputs.ip }}" >> $GITHUB_OUTPUT
          echo "NEW_VPS_ID=${{ steps.launch.outputs.instance }}" >> $GITHUB_OUTPUT
          echo "Instance public IP: ${{ steps.launch.outputs.ip }}"
          echo "Instance OCID: ${{ steps.launch.outputs.instance }}"
