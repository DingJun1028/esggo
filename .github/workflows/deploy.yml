# Smart AI Router - GitHub Actions CI/CD Workflow
# Location: .github/workflows/deploy.yml

name: Deploy Smart AI Router

on:
  push:
    branches: [ main, production ]
    paths:
      - '.agents/skills/smart-ai-router/**'
      - 'docker-compose.prod.yml'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'tests/**'
      - 'vps/**'
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/smart-ai-router
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # 0. Path filter: detect non-vps file changes
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - '.agents/skills/smart-ai-router/**'
              - 'docker-compose.prod.yml'
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'tests/**'

  # 1. Code quality checks
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: Install dependencies
        id: install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "Using pnpm"
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            echo "Using yarn"
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            echo "Using npm"
            npm ci
          else
            echo "No lockfile found, installing dependencies"
            npm install
          fi
      
      - name: Run ESLint (if configured)
        if: ${{ always() }}
        run: |
          echo "Checking for ESLint configuration..."
          if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || [ -f "eslint.config.js" ] || [ -f ".eslintrc" ] || { [ -f "package.json" ] && grep -q "eslint" package.json; }; then
            echo "ESLint configuration found, running lint..."
            pnpm exec eslint . --ext .ts,.tsx --quiet
          else
            echo "ESLint not configured, skipping..."
          fi
      
      - name: Run Type Check (if configured)
        if: ${{ always() }}
        run: |
          echo "Checking for TypeScript configuration..."
          if [ -f "tsconfig.json" ] || [ -f "tsconfig.build.json" ]; then
            echo "TypeScript configuration found, running type check..."
            pnpm exec tsc --noEmit
          else
            echo "TypeScript not configured, skipping..."
          fi

  # 2. Python unit tests
  python-tests:
    name: Python Unit Tests
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
      
      - name: Install dependencies
        id: install-deps
        run: |
          if [ -f setup.py ] || [ -f pyproject.toml ]; then
            echo "Installing package in editable mode..."
            pip install -e .
          fi
          
          if [ -f requirements.txt ]; then
            echo "Installing requirements..."
            pip install -r requirements.txt
          fi
          
          echo "Installing test dependencies..."
          pip install pytest pytest-cov ruff mypy
      
      - name: Run tests
        run: |
          echo "Running code quality checks..."
          ruff check .
          
          echo "Running tests..."
          if [ -d "tests" ]; then
            python -m pytest tests/ -v
          else
            echo "No tests directory found, skipping tests..."
          fi
        env:
          NODE_ENV: test

  # 3. Build and push Docker image
  build-and-push:
    name: Build & Push Docker Image
    needs: [lint, python-tests, changes]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && needs.changes.outputs.app == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Check if Dockerfile exists
        id: dockerfile_check
        run: |
          if [ -f ".agents/skills/smart-ai-router/Dockerfile" ]; then
            echo "Found Dockerfile at .agents/skills/smart-ai-router/Dockerfile"
            echo "dockerfile_path=.agents/skills/smart-ai-router/Dockerfile" >> $GITHUB_OUTPUT
          elif [ -f "Dockerfile" ]; then
            echo "Found Dockerfile at Dockerfile"
            echo "dockerfile_path=Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "No Dockerfile found in expected locations"
            echo "dockerfile_path=" >> $GITHUB_OUTPUT
          fi
      
      - name: Login to Container Registry
        if: ${{ steps.dockerfile_check.outputs.dockerfile_path != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: ${{ steps.dockerfile_check.outputs.dockerfile_path != '' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=production,enable=${{ github.ref == 'refs/heads/production' }}
            type=sha,format=short

      - name: Build and push
        if: ${{ steps.dockerfile_check.outputs.dockerfile_path != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.dockerfile_check.outputs.dockerfile_path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4. Trigger VPS deployment (only for main branch)
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.esggo.com
    steps:
      - name: Trigger VPS Webhook
        run: |
          echo "Deploying latest Docker image to production"
          # This requires configuring a webhook receiver on your VPS
          # curl -X POST -H "Authorization: Bearer ${{ secrets.VPS_DEPLOY_TOKEN }}"           # https://deploy.esggo.com/webhook/smart-ai-router

  # 5. Execute Python integration scripts (if configured)
  post-deploy:
    name: Post Deploy Tasks
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Run Python initialization script
        if: hashFiles('scripts/init.py') != ''
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python3 scripts/init.py

  # =========================================================================
  # 6. VPS Script Syntax Checking (Independent Flow)
  # =========================================================================
  vps-lint:
    name: VPS Lint & Validate
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint vps shell / node / python scripts
        run: |
          echo "== bash syntax =="
          shopt -s globstar nullglob
          fail=0
          for f in vps/**/*.sh vps/*.sh; do
            # Skip console-/recovery-/bundle heredoc wrappers
            case "$f" in
              */console-*|*/recovery/*|*-bundle*|*oneshot*) echo "SKIP $f (console/recovery heredoc wrapper)"; continue ;;
            esac
            if bash -n "$f"; then echo "OK  $f"; else echo "FAIL $f"; fail=1; fi
          done

          echo "== nodejs syntax =="
          for f in vps/**/*.js vps/*.js vps/**/*.mjs vps/*.mjs; do
             if node --check "$f"; then echo "OK  $f"; else echo "FAIL $f"; fail=1; fi
          done

          echo "== python syntax =="
          for f in vps/**/*.py vps/*.py; do
             if python3 -m py_compile "$f"; then echo "OK  $f"; else echo "FAIL $f"; fail=1; fi
          done

          if [ $fail -ne 0 ]; then
             echo "VPS lint failed"
          fi

      - name: VPS Check Potential Secrets
        run: |
          echo "Scanning vps/ for obvious raw keys..."
          if grep -rInE "(ocid1\.[a-z0-9]+\.|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN .*PRIVATE KEY-----)" vps/ ; then
             echo "::error::Possible raw secret found in VPS scripts. Use environment variables / Vault instead!"
          fi
          echo "No obvious secrets detected."
