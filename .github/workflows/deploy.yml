# Smart AI Router - GitHub Actions CI/CD Workflow
# Location: .github/workflows/deploy.yml

name: Deploy Smart AI Router

on:
  push:
    branches: [ main, production ]
    paths:
      - '.agents/skills/smart-ai-router/**'
      - 'docker-compose.prod.yml'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'tests/**'
      - 'vps/**'
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/smart-ai-router
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # 0. Path filter: detect non-vps file changes
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - '.agents/skills/smart-ai-router/**'
              - 'docker-compose.prod.yml'
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'tests/**'

  # 1. Code quality checks
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: Install dependencies
        id: install
        run: |
          set -e
          echo "Using pnpm"
          pnpm install --frozen-lockfile
      
      - name: Run ESLint (if configured)
        if: ${{ always() }}
        run: |
          set -e
          echo "Checking for ESLint configuration..."
          if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || [ -f "eslint.config.js" ] || [ -f ".eslintrc" ] || { [ -f "package.json" ] && grep -q "eslint" package.json; }; then
            echo "ESLint configuration found, running project lint (pnpm lint)..."
            pnpm lint
          else
            echo "ESLint not configured, skipping..."
          fi
      
      - name: Run Type Check (if configured)
        if: ${{ always() }}
        run: |
          set -e
          echo "Checking for TypeScript configuration..."
          if [ -f "tsconfig.json" ] || [ -f "tsconfig.build.json" ] || [ -f "tsconfig.core.json" ]; then
            echo "TypeScript configuration found, running project type check (pnpm typecheck)..."
            pnpm typecheck
          else
            echo "TypeScript not configured, skipping..."
          fi

  # 2. Python unit tests
  test:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install build tools
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install setuptools wheel
      
      - name: Install dependencies
        id: install-deps
        run: |
          set -e
          if [ -f setup.py ] || [ -f pyproject.toml ]; then
            echo "Installing package in editable mode..."
            pip install -e .
          fi
          
          if [ -f requirements.txt ]; then
            echo "Installing requirements..."
            pip install -r requirements.txt
          fi
          
          echo "Installing test dependencies..."
          pip install pytest pytest-cov ruff mypy
      
      - name: Run tests
        run: |
          set -e
          # Smart AI Router is a TypeScript service (.agents/skills/smart-ai-router/).
          # Scope Python checks to that dir so we don't ruff/pytest the whole monorepo.
          SVC_DIR=".agents/skills/smart-ai-router"
          echo "Running code quality checks (scoped to $SVC_DIR)..."
          if [ -d "$SVC_DIR" ] && find "$SVC_DIR" -name '*.py' | grep -q .; then
            ruff check "$SVC_DIR"
          else
            echo "No Python sources in $SVC_DIR, skipping ruff."
          fi

          echo "Running tests..."
          if [ -d "$SVC_DIR/tests" ]; then
            python -m pytest "$SVC_DIR/tests" -v
          else
            echo "No tests directory in $SVC_DIR, skipping tests..."
          fi
        env:
          NODE_ENV: test

  # 3. Build and push Docker image
  build-and-push:
    name: Build & Push Docker Image
    needs: [test, changes]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && needs.changes.outputs.app == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Check if Dockerfile exists
        id: dockerfile_check
        run: |
          set -e
          if [ -f ".agents/skills/smart-ai-router/Dockerfile" ]; then
            echo "Found Dockerfile at .agents/skills/smart-ai-router/Dockerfile"
            echo "dockerfile_path=.agents/skills/smart-ai-router/Dockerfile" >> $GITHUB_OUTPUT
          elif [ -f "Dockerfile" ]; then
            echo "Found Dockerfile at Dockerfile"
            echo "dockerfile_path=Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "No Dockerfile found in expected locations"
            echo "dockerfile_path=" >> $GITHUB_OUTPUT
          fi
      
      - name: Login to Container Registry
        if: ${{ steps.dockerfile_check.outputs.dockerfile_path != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        if: ${{ steps.dockerfile_check.outputs.dockerfile_path != '' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      
      - name: Build and push Docker image
        if: ${{ steps.dockerfile_check.outputs.dockerfile_path != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.dockerfile_check.outputs.dockerfile_path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4. Deploy to production
  deploy:
    name: Deploy to Production
    needs: [build-and-push, changes]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production' && needs.changes.outputs.app == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to VPS
        if: ${{ always() }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            
            # Try common deployment directories
            DEPLOY_DIRS=("/opt/smart-ai-router" "$HOME/smart-ai-router" "$HOME/app" "/app" "$(pwd)")
            DEPLOYED=false
            
            for dir in "${DEPLOY_DIRS[@]}"; do
              if [ -d "$dir" ]; then
                echo "Found deployment directory: $dir"
                cd "$dir" || continue
                DEPLOYED=true
                break
              fi
            done
            
            if [ "$DEPLOYED" = false ]; then
              echo "No deployment directory found, skipping deployment"
              exit 0
            fi
            
            # Pull image using SHA-based tag (not latest)
            IMAGE_TAG="${GITHUB_SHA:-latest}"
            echo "Pulling Docker image with tag: $IMAGE_TAG"
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} || \
              docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # Use docker-compose if available
            if [ -f "docker-compose.yml" ] || [ -f "docker-compose.prod.yml" ]; then
              echo "Found docker-compose file, attempting to deploy..."
              docker-compose pull
              docker-compose up -d
              echo "Deployment attempt completed"
            else
              echo "No docker-compose file found, skipping docker-compose commands"
            fi

  # 5. Notifications
  notify:
    name: Send Notifications
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true
    steps:
      - name: Check Slack webhook
        id: slack-check
        if: ${{ always() }}
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "has_webhook=true" >> $GITHUB_OUTPUT
          else
            echo "has_webhook=false" >> $GITHUB_OUTPUT
            echo "[SKIP] SLACK_WEBHOOK_URL not configured — skipping Slack notification"
          fi

      - name: Notify Slack (if webhook configured)
        if: ${{ always() && steps.slack-check.outputs.has_webhook == 'true' }}
        continue-on-error: true
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Smart AI Router deploy ${{ github.ref_name }} - status: ${{ job.status }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # 6. Validate VPS deployment scripts (ESGGO Node/PM2 stack)
  validate-vps-scripts:
    name: Validate VPS Scripts
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint vps shell / node / python scripts
        run: |
          set -e
          echo "== bash syntax =="
          shopt -s globstar nullglob
          fail=0
          for f in vps/**/*.sh vps/*.sh; do
            # Skip console-/recovery-/bundle heredoc wrappers
            case "$f" in
              */console-*|*/recovery/*|*-bundle*|*oneshot*) echo "SKIP $f (console/recovery heredoc wrapper)"; continue ;;
            esac
            if bash -n "$f"; then echo "OK  $f"; else echo "FAIL $f"; fail=1; fi
          done
          echo "== node syntax =="
          for f in vps/**/*.mjs vps/**/*.cjs vps/*.mjs vps/*.cjs; do
            if node --check "$f"; then echo "OK  $f"; else echo "FAIL $f"; fail=1; fi
          done
          echo "== python syntax =="
          for f in vps/**/*.py vps/*.py; do
            if python3 -m py_compile "$f"; then echo "OK  $f"; else echo "FAIL $f"; fail=1; fi
          done
          echo "== yaml syntax =="
          for f in vps/**/*.yml vps/**/*.yaml vps/*.yml vps/*.yaml; do
            if python3 -c "import yaml; yaml.safe_load(open('$f'))"; then echo "OK  $f"; else echo "FAIL $f"; fail=1; fi
          done
          exit $fail

      - name: Secret scan on vps scripts
        run: |
          set -e
          echo "Scanning vps/** for accidentally committed secrets or bad patterns..."
          # 1) Real credential shapes (HARD FAIL)
          if grep -rInE "(ocid1\.[a-z0-9]+\.|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN .*PRIVATE KEY-----|npm_[A-Za-z0-9]{36}|SG\.[A-Za-z0-9_-]{22,}\.[A-Za-z0-9_-]{43,}|sk_live_[A-Za-z0-9]+|rk_live_[A-Za-z0-9]+|AC[a-f0-9]{32}|cfat_[A-Za-z0-9_-]{20,})" vps/ ; then
            echo "::error::Possible secret found in vps/ — aborting."; exit 1
          fi
          # 2) Hardcoded default secrets in long-running SERVER code (.mjs only).
          if grep -rInE '\$\{[A-Za-z_]+:-[A-Za-z0-9_'"'"'-]{8,}\}' vps/*.mjs vps/**/*.mjs 2>/dev/null | grep -iE "token|secret|key|pass|auth" ; then
            echo "::error::Hardcoded default secret in server .mjs (use env + fail-fast) — aborting."; exit 1
          fi
          if grep -rInE '(AUTH_TOKEN|TOKEN|API_KEY|API_SERVER_KEY)="?[A-Za-z0-9_'"'"'-]{8,}"?' vps/ | grep -vE '\$\{|\$\(|process\.env|os\.environ|getenv' | grep -iE "token|secret|key|pass|auth" ; then
            echo "::warning::Hardcoded token fallback found in a console/bootstrap script — ensure .env.secrets provides the real value."
          fi
          # 3) Server binding to all interfaces (should be 127.0.0.1 behind nginx) (HARD FAIL)
          if grep -rInE "listen\([^,)]*['\"]0\.0\.0\.0|HOST\s*=\s*['\"]0\.0\.0\.0['\"]" vps/*.mjs vps/**/*.mjs vps/*.py vps/**/*.py 2>/dev/null ; then
            echo "::error::Server binds 0.0.0.0 (exposes directly) — bind 127.0.0.1 instead — aborting."; exit 1
          fi
          # 4) Connection strings with embedded passwords (HARD FAIL).
          # Exclude placeholder/redacted DSNs (contain *** or ${...} or <...>) — those are not real secrets.
          if grep -rInE "(mysql|postgres|mongodb)://[^:]+:[^@]+@" vps/ 2>/dev/null | grep -vE '\*\*\*|\$\{|<' ; then
            echo "::error::Connection string with embedded password found — use env vars instead — aborting."; exit 1
          fi
          echo "No secrets or unsafe patterns detected."
