name: ESGGO CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Stage 1: Lint & Typecheck ──────────────────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint
        continue-on-error: true

      - name: Run typecheck
        run: pnpm run typecheck
        continue-on-error: true

      - name: Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SKIP_ENV_VALIDATION: 1

  # ─── Stage 2: Deploy to Vercel ──────────────────────────────────────
  deploy-vercel:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SKIP_ENV_VALIDATION: 1

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

  # ─── Stage 3: Deploy to VPS ──────────────────────────────────────────
  deploy-vps:
    needs: deploy-vercel
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Oracle VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "==== 📥 Pulling latest code ===="
            cd /var/www/esggo
            git checkout main
            git pull origin main

            echo "==== 📦 Installing dependencies ===="
            pnpm install --frozen-lockfile

            echo "==== 🏗️ Building Next.js production ===="
            NODE_OPTIONS=--max_old_space_size=4096 pnpm run build

            echo "==== 🚀 Reloading PM2 services ===="
            pm2 reload esggo omniagent-gateway --update-env
            pm2 save

            echo "==== 🩺 Health check ===="
            curl -fsS http://127.0.0.1:3000/ -I || echo "⚠️ Web server not responding"
            curl -fsS http://127.0.0.1:8642/status || echo "⚠️ Gateway not responding"
            echo "==== ✅ Deployment complete ===="
