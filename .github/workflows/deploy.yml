name: ESGGO CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test

  deploy-supabase:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
      - run: |
          supabase db push --db-url ${{ secrets.SUPABASE_DB_URL }}
          supabase functions deploy ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  build-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t esggo:${{ github.sha }} .
          docker tag esggo:${{ github.sha }} esggo:latest
      - name: Push to registry (optional)
        if: github.ref == 'refs/heads/main'
        run: echo "Configure your container registry here"