name: 萬能子代 — GitHub 倉庫自動修復管家

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  guardian:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        continue-on-error: true

      - name: Run lint check
        id: lint
        run: pnpm run lint 2>&1 | head -100
        continue-on-error: true

      - name: Run typecheck
        id: typecheck
        run: pnpm run typecheck 2>&1 | head -100
        continue-on-error: true

      - name: Run build check
        id: build
        run: NODE_OPTIONS=--max_old_space_size=4096 pnpm run build 2>&1 | tail -50
        continue-on-error: true

      - name: Auto-fix lint issues
        if: steps.lint.outcome == 'failure'
        run: pnpm run lint --fix 2>&1 | tail -20
        continue-on-error: true

      - name: Report status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const lint = '${{ steps.lint.outcome }}';
            const typecheck = '${{ steps.typecheck.outcome }}';
            const build = '${{ steps.build.outcome }}';
            const allOk = lint === 'success' && typecheck === 'success' && build === 'success';
            const report = allOk
              ? '## ✅ 萬能子代 — 倉庫健康檢查通過\n\n| 檢查 | 狀態 |\n|------|------|\n| Lint | ✅ |\n| TypeCheck | ✅ |\n| Build | ✅ |\n\n*倉庫零錯誤*'
              : '## ⚠️ 萬能子代 — 倉庫需要修復\n\n| 檢查 | 狀態 |\n|------|------|\n| Lint | ' + (lint === 'success' ? '✅' : '❌') + ' |\n| TypeCheck | ' + (typecheck === 'success' ? '✅' : '❌') + ' |\n| Build | ' + (build === 'success' ? '✅' : '❌') + ' |\n\n*已嘗試自動修復*';
            if (!allOk) {
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '⚠️ 倉庫錯誤 — ' + new Date().toISOString().split('T')[0],
                  body: report,
                  labels: ['萬能子代', 'auto-fix']
                });
              } catch (e) {}
            }
            core.info(report);
