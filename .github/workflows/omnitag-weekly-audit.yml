# =============================================================================
# OmniCore V5.1 — OmniTag 合約率週期抽驗工作流 (§20.5 規則5 / §6.2)
# =============================================================================
# 排程: 每週一凌晨 3:00 UTC (錯開 Security Audit 的 02:00)
# 手動觸發: workflow_dispatch
# 檢查: pnpm oa:audit 合約率 (目標 100%)
# 違規處置: 合約率 <100% 時自動開/更新 issue 告警 (不 red CI, 不降通知標準)
# =============================================================================

name: OmniTag Weekly Audit

on:
  schedule:
    - cron: "0 3 * * 1"  # 每週一 03:00 UTC
  workflow_dispatch:       # 允許手動觸發
  pull_request:            # §20.8 P3：永恆刻印完整性必須在「合併前」就擋
    paths:
      - '.oa/omnitag-registry.jsonl'
      - 'cli/oa-cli/src/omnitag.ts'
      - 'scripts/verify-eternal-seals.ts'

permissions:
  contents: read
  issues: write           # 允許開/更新告警 issue

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.5.2"

jobs:
  # ─── OmniTag 合約率抽驗 ────────────────────────────────────────
  omnitag-audit:
    name: OmniTag Contract Rate Audit (§20.5/§6.2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run OmniTag contract audit (§20.5)
        id: audit
        continue-on-error: true
        run: |
          pnpm oa:audit --json 2>/dev/null | grep '^{' > audit-result.json
          cat audit-result.json
          # 合約率 <100% 則標記失敗 (--json 模式 audit 不主動 exit 1)
          node -e "const r=require('./audit-result.json'); if(r.rate<1){console.log('AUDIT_FAILED=true'); require('fs').appendFileSync(process.env.GITHUB_ENV,'AUDIT_FAILED=true\n')}"
      - name: Open/Update alert issue on contract violation
        if: env.AUDIT_FAILED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let rate = 'unknown';
            try {
              const r = JSON.parse(fs.readFileSync('audit-result.json', 'utf8'));
              rate = (r.rate * 100).toFixed(1) + '%';
            } catch (e) {}
            const title = `🚨 OmniTag 合約率告警: ${rate} (目標 100%)`;
            const body = `## §20.5 規則5 週期抽驗失敗\n\n合約率: **${rate}**（目標 100%）\n\n請執行以下修復：\n\`\`\`bash\nnpx tsx cli/oa-cli/src/index.ts tag --init --write --dir "src/lib,cli/oa-cli/src"\n\`\`\`\n\n或詳查違規檔案：\n\`\`\`bash\npnpm oa:audit\n\`\`\`\n\n_由 OmniTag Weekly Audit 自動產生（${new Date().toISOString()}）_`;
            // 找已存在的開放告警 issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['omnitag-audit-alert'],
            });
            const existing = issues.find(i => i.title.startsWith('🚨 OmniTag 合約率告警'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: `更新: 合約率 **${rate}** @ ${new Date().toISOString()}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['omnitag-audit-alert', 'ci-quality'],
              });
            }

  # ─── 永恆刻印完整性 gate（§20.8 P3，2026-10-01）────────────────
  # 與上方抽驗的差別：上方量「合約率」（新寫入的 tag 有沒有標全），
  # 本 job 量「已落盤的刻印有沒有被竄改」。兩者互補，都不可省。
  eternal-seal-integrity:
    name: Eternal Seal Integrity Gate (§20.8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 唯讀驗證：重算 Hash Lock，不寫入。
      # 刻意不跑 seal-eternal-identity.ts —— 那支會嘗試寫入，不可變契約應擋下，
      # 在 CI 裡觸發只會產生雜訊，不會提供額外保證。
      - name: Verify eternal seal Hash Locks
        run: npx tsx scripts/verify-eternal-seals.ts
      # 預設 warn-only：歷史紀錄的 sourceOrigin=unknown 尚未補正（P1），
      # 若在此設成阻斷條件，這個 job 會長期紅 —— 長期紅的等於沒有。
      # 待 P1 閉環後改為 OMNITAG_BLOCK_UNKNOWN_ORIGIN=1 即可升級為硬 gate。
      - name: Summary
        if: always()
        run: echo "完整性 gate 完成；竄改=阻斷，sourceOrigin unknown=warn（P1 未結）"
