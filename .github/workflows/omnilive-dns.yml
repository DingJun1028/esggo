name: OmniLive DNS

# 為 omnilivetranslation.esggo.co 建立 Cloudflare Tunnel 的 CNAME 記錄。
#
# 為什麼需要這個 workflow：CF_API_TOKEN 已綁定 GitHub Actions runner 的
# IP 來源，從一般機器呼叫會被 Cloudflare 以 9109 "Invalid access token"
# 拒絕，因此這支 token 只有在 Actions 環境內可用。
#
# 冪等：重跑會先刪除同名記錄再建立，不會產生重複。

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: '要設定的 FQDN'
        required: false
        default: 'omnilivetranslation.esggo.co'
      tunnel_target:
        description: 'Cloudflare Tunnel 目標 (<uuid>.cfargotunnel.com)'
        required: false
        default: 'd821f09e-91ec-4c38-85da-89451a5a8983.cfargotunnel.com'
      proxied:
        description: '是否走 Cloudflare 代理 (true/false)'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  upsert-cname:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # token 放在 job 層 env；run: 內只引用 shell 變數 $CF_API_TOKEN。
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      HOSTNAME: ${{ inputs.hostname }}
      TARGET: ${{ inputs.tunnel_target }}
      PROXIED: ${{ inputs.proxied }}
    steps:
      - name: 檢查 token 並解析 zone
        id: zone
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}")

          resp=$(curl -sS --max-time 30 "${auth[@]}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          status=$(jq -r '.result.status // "unknown"' <<<"${resp}")
          echo "token status: ${status}"
          if [ "${status}" != "active" ]; then
            echo "::error::token 狀態為 ${status}（預期 active）"
            exit 1
          fi

          zid="${CF_ZONE_ID:-}"
          if [ -z "${zid}" ]; then
            zresp=$(curl -sS --max-time 30 "${auth[@]}" \
              "https://api.cloudflare.com/client/v4/zones?name=esggo.co")
            zid=$(jq -r '.result[0].id // empty' <<<"${zresp}")
          fi
          if [ -z "${zid}" ]; then
            echo "::error::無法取得 zone id"
            exit 1
          fi
          echo "id=${zid}" >> "$GITHUB_OUTPUT"

          {
            echo "### 環境"
            echo "- token status: ${status}"
            echo "- zone id: \`${zid}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 刪除既有同名記錄
        env:
          ZONE_ID: ${{ steps.zone.outputs.id }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}")

          existing=$(curl -sS --max-time 30 "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=CNAME&name=${HOSTNAME}" \
            | jq -r '.result[]?.id')
          if [ -z "${existing}" ]; then
            echo "無既有記錄"
          fi
          for rid in $existing; do
            echo "刪除既有記錄 ${rid} (${HOSTNAME})"
            curl -sS --max-time 30 -X DELETE "${auth[@]}" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${rid}" \
              | jq -r '"  刪除結果 success=\(.success)"'
          done

      - name: 建立 CNAME
        env:
          ZONE_ID: ${{ steps.zone.outputs.id }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")

          body=$(jq -nc --arg n "${HOSTNAME}" --arg t "${TARGET}" --argjson p "${PROXIED}" \
            '{type:"CNAME",name:$n,content:$t,proxied:$p,ttl:1}')
          resp=$(curl -sS --max-time 30 -X POST "${auth[@]}" -d "${body}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records")
          if [ "$(jq -r '.success' <<<"${resp}")" != "true" ]; then
            echo "::error::建立失敗: $(jq -c '.errors' <<<"${resp}")"
            exit 1
          fi
          jq -r '"已建立 \(.result.name) → \(.result.content) (proxied=\(.result.proxied))"' <<<"${resp}"

          {
            echo ""
            echo "### 結果"
            echo "| 主機 | 目標 | 代理 |"
            echo "|---|---|---|"
            echo "| \`${HOSTNAME}\` | \`${TARGET}\` | ${PROXIED} |"
          } >> "$GITHUB_STEP_SUMMARY"
