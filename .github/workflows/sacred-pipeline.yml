name: 🌌 ESG GO Sacred Pipeline (CI/CD)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 階段一：原罪煉金 (自動化測試與防禦)
  entropy-reduction-test:
    name: 🛡️ 原罪煉金 (Entropy Reduction)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 召喚源碼 (Checkout code)
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⚙️ 構築結界 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📦 注入依賴 (Install dependencies)
        run: pnpm install --frozen-lockfile

      - name: 🔍 零幻覺靜態掃描 (Linting)
        run: pnpm run lint

      - name: 🧪 神聖契約驗證 (Unit Tests)
        # 這裡會執行 IComponentCore 的 Object.freeze 與 Hash Lock 測試
        run: pnpm run test --if-present

  # 階段二：神跡顯現 (Docker 映像檔鑄造)
  docker-image-casting:
    name: 🐳 神跡顯現 (Image Casting)
    needs: entropy-reduction-test
    runs-on: ubuntu-latest
    # 只有在 main 分支的 push 才會觸發實體化鑄造
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: 🔑 登入容器聖所 (Log in to Registry)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 💠 鑄造前端液態結界 (Build Frontend HUD)
        run: |
          echo "Building Frontend Docker Image..."
          # docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest .

      - name: ⚡ 鑄造符文中樞 (Build Rune API)
        run: |
          echo "Building Rune API Docker Image..."
          # docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/rune-api:latest ./backend-api

      - name: 🕊️ 鑄造神使陣列 (Build Agent Swarm)
        run: |
          echo "Building Agent Swarm Docker Image..."
          # docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/agent-swarm:latest ./agents

      - name: 🔒 封印並上傳 (Push Images)
        run: |
          echo "Pushing images to registry..."
          # docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
          # docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/rune-api:latest
          # docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/agent-swarm:latest

  # 階段三：永恆刻印 (自動化部署)
  sacred-deployment:
    name: 🚀 永恆刻印 (Sacred Deployment)
    needs: docker-image-casting
    runs-on: ubuntu-latest
    steps:
      - name: 🌐 部署至雲端結界 (Deploy to Cloud Run / ECS)
        run: |
          echo "執行部署腳本... 將最新的神使陣列與符文 API 替換至生產環境"
          echo "確保 Zero Downtime (零停機) 流量切換"
          # 實際指令例如: 
          # gcloud run deploy esg-frontend --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest --region asia-east1
          # gcloud run deploy esg-rune-api --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/rune-api:latest --region asia-east1
