name: Mirror Firebase/Supabase secrets to learning-center
on:
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.MIRROR_PAT }}
      TARGET: DingJun1028/esggo-learning-center
    steps:
      - name: Mirror Firebase web config
        env:
          FB_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          FB_AUTH: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          FB_PROJ: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          FB_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          FB_SENDER: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          FB_APP: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          FB_MEAS: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          SB_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SB_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          gh secret set VITE_FB_API_KEY --repo "$TARGET" --body "$FB_API_KEY"
          gh secret set VITE_FB_AUTH_DOMAIN --repo "$TARGET" --body "$FB_AUTH"
          gh secret set VITE_FB_PROJECT_ID --repo "$TARGET" --body "$FB_PROJ"
          gh secret set VITE_FB_STORAGE_BUCKET --repo "$TARGET" --body "$FB_BUCKET"
          gh secret set VITE_FB_MESSAGING_SENDER_ID --repo "$TARGET" --body "$FB_SENDER"
          gh secret set VITE_FB_APP_ID --repo "$TARGET" --body "$FB_APP"
          gh secret set VITE_FB_MEASUREMENT_ID --repo "$TARGET" --body "$FB_MEAS"
          gh secret set VITE_SUPABASE_URL --repo "$TARGET" --body "$SB_URL"
          gh secret set VITE_SUPABASE_ANON_KEY --repo "$TARGET" --body "$SB_ANON"
          echo "mirror done"
