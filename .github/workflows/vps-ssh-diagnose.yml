name: vps-ssh-diagnose
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose | repair | deploy'
        required: true
        default: 'diagnose'
        type: choice
        options:
          - diagnose
          - repair
          - deploy

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OCI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_API_KEY }}
      OCI_TARGET: ${{ secrets.OCI_TARGET_RESOURCE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect SSH keys
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          for var in SSH_PRIVATE_KEY VPS_SSH_KEY; do
            val="${!var}"
            [ -n "$val" ] || { echo "$var=<EMPTY>"; continue; }
            f=~/.ssh/$var
            printf '%s' "$val" > "$f"
            chmod 600 "$f"
            echo "=== $var ==="
            head -2 "$f" || true
            if grep -q 'BEGIN OPENSSH PRIVATE KEY' "$f"; then fmt=OpenSSH;
            elif grep -q 'BEGIN RSA PRIVATE KEY' "$f"; then fmt=PEM-RSA;
            elif grep -q 'BEGIN EC PRIVATE KEY' "$f"; then fmt=PEM-EC;
            elif grep -q 'BEGIN PRIVATE KEY' "$f"; then fmt=PEM-PKCS8;
            else fmt=UNKNOWN; fi
            echo "FORMAT=$fmt"
            out=$(ssh-keygen -l -f "$f" 2>&1) || true
            echo "SSH_KEYGEN=$out"
          done

      - name: Resolve VPS_HOST and probe connectivity
        run: |
          set -euo pipefail
          echo "VPS_HOST_HEX=$(printf '%s' "$VPS_HOST" | od -An -tx1 | tr -d ' \n')"
          echo "VPS_USER_HEX=$(printf '%s' "$VPS_USER" | od -An -tx1 | tr -d ' \n')"
          getent ahosts "$VPS_HOST" | head -2 || true
          echo '--- TCP + banner test port 22 ---'
          timeout 15 bash -c "exec 3<>/dev/tcp/$VPS_HOST/22 && head -c 40 <&3" || echo 'NO BANNER (hang/drop)'
          echo '--- TCP test port 80/443 ---'
          for p in 80 443 2026; do
            if timeout 8 bash -c "exec 3<>/dev/tcp/$VPS_HOST/$p" 2>/dev/null; then echo "port $p: TCP OK (no data test)"; else echo "port $p: FAIL"; fi
          done

      - name: SSH attempts (both keys)
        run: |
          set -euo pipefail
          for var in SSH_PRIVATE_KEY VPS_SSH_KEY; do
            f=~/.ssh/$var
            [ -f "$f" ] || continue
            echo "=== ssh with $var ==="
            timeout 25 ssh -i "$f" -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o BatchMode=yes \
              -p "$SSH_PORT" "${VPS_USER}@${VPS_HOST}" 'echo SSH_OK_$(hostname)' 2>&1 || echo "FAILED ($var)"
          done

      - name: OCI full inventory (instances, vnics, bastions, all compartments)
        run: |
          set +e
          pip3 install --user --quiet oci-cli
          export PATH="$HOME/.local/bin:$PATH"
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          export SUPPRESS_LABEL_WARNING=True
          mkdir -p ~/.oci
          cat > ~/.oci/config <<EOFCONF
          [DEFAULT]
          user=$OCI_USER
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=/tmp/oci_key.pem
          fingerprint=$OCI_FINGERPRINT
          EOFCONF
          printf '%s' "$OCI_KEY" > /tmp/oci_key.pem
          chmod 600 /tmp/oci_key.pem
          PARSER='(if type == "array" then . else (.data // []) end)'

          echo "TARGET_OCID_HEX=$(printf '%s' "$OCI_TARGET" | od -An -tx1 | tr -d ' \n')"
          echo "OCI_REGION_HEX=$(printf '%s' "$OCI_REGION" | od -An -tx1 | tr -d ' \n')"
          TARGET_REGION=$(printf '%s' "$OCI_TARGET" | tr '.' ' ' | awk '{print $4}')
          echo "TARGET_REGION=$TARGET_REGION"

          echo '=== regions (global view) ==='
          oci iam region list --output json 2>/dev/null \
            | jq -r "$PARSER" | jq -r '.[] | [.name, ."is-ad-region", ."is-home-region"] | @tsv' 2>/dev/null \
            | sed 's/^/REGION /' | head -40

          for REG in "$TARGET_REGION" "$OCI_REGION"; do
            [ -n "$REG" ] || continue
            echo "########## REGION=$REG ##########"
            echo '--- try: instance get on TARGET ---'
            oci compute instance get --instance-id "$OCI_TARGET" --region "$REG" \
              --query 'data."lifecycle-state"' --raw-output 2>&1 | sed 's/^/TARGET_INSTANCE_GET('"$REG"')=/'
            echo '--- try: bastion get on TARGET ---'
            oci bastion bastion get --bastion-id "$OCI_TARGET" --region "$REG" \
              --query 'data."lifecycle-state"' --raw-output 2>&1 | sed 's/^/TARGET_BASTION_GET('"$REG"')=/'

            echo '=== compartments ==='
            {
              echo "$OCI_TENANCY"
              oci iam compartment list -c "$OCI_TENANCY" --all --region "$REG" --output json 2>/dev/null \
                | jq -r "$PARSER" | jq -r '.[] | [.id, .name] | @tsv' 2>/dev/null
            } | tee /tmp/comps.tsv | sed 's/^/COMPARTMENT /'

            echo '=== all instances (per compartment) ==='
            while IFS=$'\t' read -r cid cname; do
              echo "--- compartment: ${cname:-root} ---"
              oci compute instance list -c "$cid" --region "$REG" --output json 2>/tmp/inst.err \
                | jq -r "$PARSER" | jq -r '.[] | [(.["display-name"] // "?"), (.["lifecycle-state"] // "?"), (.shape // "?"), (.id // "?")] | @tsv' 2>>/tmp/inst.err
              while IFS=$'\t' read -r iname istate ishape iid; do
                echo "INSTANCE name=$iname state=$istate shape=$ishape id=$iid"
                oci compute instance list-vnics --instance-id "$iid" --region "$REG" --output json 2>/dev/null \
                  | jq -r "$PARSER" | jq -r '.[] | "VNCIP " + ((."public-ip") // "NULL") + " vnic=" + ((.["display-name"]) // "?")' 2>/dev/null
              done
              [ -s /tmp/inst.err ] && sed 's/^/INST_ERR=/I' /tmp/inst.err | head -3
              rm -f /tmp/inst.err
            done < /tmp/comps.tsv

            echo '=== bastions ==='
            oci bastion bastion list -c "$OCI_TENANCY" --all --region "$REG" --output json 2>/dev/null \
              | jq -r "$PARSER" | jq -r '.[] | [.name, .id, ."lifecycle-state", ((.["client-cidr-block-allow-list"] // []) | join(","))] | @tsv' 2>/dev/null \
              | sed 's/^/BASTION /'
            echo '=== bastion sessions ==='
            oci bastion session list -c "$OCI_TENANCY" --all --region "$REG" --output json 2>/dev/null \
              | jq -r "$PARSER" | jq -r '.[] | [(.["display-name"] // "?"), (."lifecycle-state" // "?"), (."bastion-id" // "?"), (.id // "?")] | @tsv' 2>/dev/null \
              | sed 's/^/SESSION /'
          done
          echo '=== inventory step done ==='

      - name: Identify target instance (public IP == VPS_HOST) and repair if stopped
        if: inputs.mode == 'repair' || inputs.mode == 'deploy'
        run: |
          set +e
          export PATH="$HOME/.local/bin:$PATH"
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          export SUPPRESS_LABEL_WARNING=True
          PARSER='(if type == "array" then . else (.data // []) end)'
          TARGET_REGION=$(printf '%s' "$OCI_TARGET" | tr '.' ' ' | awk '{print $4}')
          echo "TARGET_IP=$VPS_HOST"
          echo "TARGET_REGION=$TARGET_REGION"
          {
            echo "$OCI_TENANCY"
            oci iam compartment list -c "$OCI_TENANCY" --all --region "$TARGET_REGION" --output json 2>/dev/null \
              | jq -r "$PARSER" | jq -r '.[].id' 2>/dev/null
          } | while read -r cid; do
            oci compute instance list -c "$cid" --region "$TARGET_REGION" --output json 2>/dev/null \
              | jq -r "$PARSER" | jq -r '.[].id' 2>/dev/null \
              | while read -r iid; do
                ip=$(oci compute instance list-vnics --instance-id "$iid" --region "$TARGET_REGION" --output json 2>/dev/null \
                  | jq -r "$PARSER" | jq -r '.[]."public-ip" // empty' 2>/dev/null | head -1)
                if [ -n "$ip" ] && [ "$ip" = "$VPS_HOST" ]; then echo "FOUND_OCID=$iid"; fi
              done
          done | tee /tmp/found.txt
          TID=$(grep '^FOUND_OCID=' /tmp/found.txt | head -1 | cut -d= -f2-)
          if [ -z "$TID" ]; then
            echo 'TARGET_NOT_FOUND_IN_OCI: no instance with public IP matching VPS_HOST'
            exit 0
          fi
          echo "TARGET_INSTANCE=$TID"
          state=$(oci compute instance get --instance-id "$TID" --region "$TARGET_REGION" --query 'data."lifecycle-state"' --raw-output 2>/dev/null)
          echo "CURRENT_STATE=$state"
          if [ "$state" = STOPPING ] || [ "$state" = STARTING ]; then
            echo '--- waiting for state to settle ---'
            for i in $(seq 1 30); do
              state=$(oci compute instance get --instance-id "$TID" --region "$TARGET_REGION" --query 'data."lifecycle-state"' --raw-output 2>/dev/null)
              echo "state=$state ($i/30)"
              [ "$state" = RUNNING ] || [ "$state" = STOPPED ] && break
              sleep 20
            done
          fi
          if [ "$state" = STOPPED ]; then
            echo '--- starting instance ---'
            oci compute instance action --instance-id "$TID" --region "$TARGET_REGION" --action START \
              --wait-for-state RUNNING --wait-interval-seconds 20 --max-wait-seconds 600 \
              --query 'data."lifecycle-state"' --raw-output 2>&1 | sed 's/^/START_RESULT=/'
          fi
          echo "FINAL_STATE=$(oci compute instance get --instance-id "$TID" --region "$TARGET_REGION" --query 'data."lifecycle-state"' --raw-output 2>/dev/null)"

      - name: Re-probe connectivity after repair
        if: inputs.mode == 'repair' || inputs.mode == 'deploy'
        run: |
          set -euo pipefail
          echo '--- waiting for SSH (up to 5 min) ---'
          ok=0
          for i in $(seq 1 30); do
            if timeout 15 ssh -i ~/.ssh/VPS_SSH_KEY -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              -o BatchMode=yes -p "$SSH_PORT" "${VPS_USER}@${VPS_HOST}" 'echo SSH_OK_$(hostname)' 2>/dev/null; then
              ok=1; break
            fi
            echo "ssh attempt $i/30 failed, sleeping 10s"
            sleep 10
          done
          [ "$ok" = 1 ] || { echo 'SSH STILL DOWN AFTER REPAIR'; exit 1; }

      - name: Upload deployment package
        if: inputs.mode == 'deploy'
        run: |
          set -euo pipefail
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${VPS_HOST}
            User ${VPS_USER}
            Port ${SSH_PORT}
            IdentityFile ~/.ssh/VPS_SSH_KEY
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          ssh vps 'sudo mkdir -p /opt/deer-flow-patches && sudo chown $(whoami) /opt/deer-flow-patches'
          scp -r vps-deploy/* vps:/opt/deer-flow-patches/
          ssh vps 'chmod +x /opt/deer-flow-patches/*.sh && ls -la /opt/deer-flow-patches'

      - name: Run deploy-deerflow.sh (docker + compose + ufw)
        if: inputs.mode == 'deploy'
        run: |
          ssh vps "sudo OPENROUTER_API_KEY='$OPENROUTER_API_KEY' bash /opt/deer-flow-patches/deploy-deerflow.sh"

      - name: Run setup-ssl.sh (certbot + renewal cron)
        if: inputs.mode == 'deploy'
        run: |
          ssh vps 'sudo bash /opt/deer-flow-patches/setup-ssl.sh'

      - name: Verify deployment
        if: inputs.mode == 'deploy'
        run: |
          set -euo pipefail
          echo '--- docker ps on VPS ---'
          ssh vps 'docker ps --format "{{.Names}}: {{.Status}} {{.Ports}}"'
          echo '--- https check ---'
          sleep 5
          curl -sI --max-time 20 https://deerflow.esggo.co | head -1 || echo 'https not yet reachable'
          curl -sI --max-time 20 http://161.118.248.180:2026 | head -1 || true
