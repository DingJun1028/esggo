name: vps-ssh-diagnose
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose | repair | reboot | deploy'
        required: true
        default: 'diagnose'
        type: choice
        options:
          - diagnose
          - repair
          - reboot
          - deploy

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OCI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_API_KEY }}
      OCI_TARGET: ${{ secrets.OCI_TARGET_RESOURCE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect SSH keys
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          for var in SSH_PRIVATE_KEY VPS_SSH_KEY; do
            val="${!var}"
            [ -n "$val" ] || { echo "$var=<EMPTY>"; continue; }
            f=~/.ssh/$var
            printf '%s' "$val" > "$f"
            chmod 600 "$f"
            echo "=== $var ==="
            head -2 "$f" || true
            if grep -q 'BEGIN OPENSSH PRIVATE KEY' "$f"; then fmt=OpenSSH;
            elif grep -q 'BEGIN RSA PRIVATE KEY' "$f"; then fmt=PEM-RSA;
            elif grep -q 'BEGIN EC PRIVATE KEY' "$f"; then fmt=PEM-EC;
            elif grep -q 'BEGIN PRIVATE KEY' "$f"; then fmt=PEM-PKCS8;
            else fmt=UNKNOWN; fi
            echo "FORMAT=$fmt"
            out=$(ssh-keygen -l -f "$f" 2>&1) || true
            echo "SSH_KEYGEN=$out"
          done

      - name: Resolve VPS_HOST and probe connectivity
        run: |
          set -euo pipefail
          echo "VPS_HOST_HEX=$(printf '%s' "$VPS_HOST" | od -An -tx1 | tr -d ' \n')"
          echo "VPS_USER_HEX=$(printf '%s' "$VPS_USER" | od -An -tx1 | tr -d ' \n')"
          getent ahosts "$VPS_HOST" | head -2 || true
          echo '--- TCP + banner test port 22 ---'
          timeout 15 bash -c "exec 3<>/dev/tcp/$VPS_HOST/22 && head -c 40 <&3" || echo 'NO BANNER (hang/drop)'
          echo '--- TCP test port 80/443 ---'
          for p in 80 443 2026; do
            if timeout 8 bash -c "exec 3<>/dev/tcp/$VPS_HOST/$p" 2>/dev/null; then echo "port $p: TCP OK (no data test)"; else echo "port $p: FAIL"; fi
          done

      - name: SSH attempts (both keys)
        run: |
          set -euo pipefail
          for var in SSH_PRIVATE_KEY VPS_SSH_KEY; do
            f=~/.ssh/$var
            [ -f "$f" ] || continue
            echo "=== ssh with $var ==="
            timeout 25 ssh -i "$f" -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o BatchMode=yes \
              -p "$SSH_PORT" "${VPS_USER}@${VPS_HOST}" 'echo SSH_OK_$(hostname)' 2>&1 || echo "FAILED ($var)"
          done

      - name: OCI full inventory (instances, vnics, bastions, all compartments)
        run: |
          set +e
          pip3 install --user --quiet oci-cli
          export PATH="$HOME/.local/bin:$PATH"
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          export SUPPRESS_LABEL_WARNING=True
          mkdir -p ~/.oci
          cat > ~/.oci/config <<EOFCONF
          [DEFAULT]
          user=$OCI_USER
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=/tmp/oci_key.pem
          fingerprint=$OCI_FINGERPRINT
          EOFCONF
          printf '%s' "$OCI_KEY" > /tmp/oci_key.pem
          chmod 600 /tmp/oci_key.pem
          PARSER='(if type == "array" then . else (.data // []) end)'
          # Strip JSON quoting/brackets from oci output regardless of --raw-output support
          SAN() { sed -e 's/\[//g' -e 's/\]//g' -e 's/"//g' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/,$//'; }

          echo "TARGET_OCID_HEX=$(printf '%s' "$OCI_TARGET" | od -An -tx1 | tr -d ' \n')"
          echo "OCI_REGION_HEX=$(printf '%s' "$OCI_REGION" | od -An -tx1 | tr -d ' \n')"
          TARGET_REGION=$(printf '%s' "$OCI_TARGET" | tr '.' ' ' | awk '{print $4}')
          echo "TARGET_REGION=$TARGET_REGION"

          REGS=$(mktemp)
          oci iam region list --output json 2>/dev/null \
            | jq -r "$PARSER" | jq -r '.[] | (.name // "?")' 2>/dev/null > "$REGS"
          oci iam region-subscription list --tenancy-id "$OCI_TENANCY" --output json 2>/dev/null \
            | jq -r "$PARSER" | jq -r '.[] | (.region-name // "?")' 2>/dev/null >> "$REGS"
          echo "$TARGET_REGION" >> "$REGS"
          echo "$OCI_REGION" >> "$REGS"
          for fallback in ap-singapore-1 us-ashburn-1 us-phoenix-1 eu-frankfurt-1 uk-london-1 ap-mumbai-1 ap-seoul-1 ap-tokyo-1 ca-toronto-1 me-jeddah-1 sa-saopaulo-1; do
            echo "$fallback" >> "$REGS"
          done
          sort -u "$REGS" | grep -v '?' | while read -r REG; do
            echo "########## REGION=$REG ##########"
            echo '--- try: instance get on TARGET ---'
            oci --raw-output compute instance get --instance-id "$OCI_TARGET" --region "$REG" \
              --query 'data."lifecycle-state"' 2>&1 | SAN | sed 's/^/TARGET_INSTANCE_GET('"$REG"')=/'
            echo '--- try: bastion get on TARGET ---'
            oci --raw-output bastion bastion get --bastion-id "$OCI_TARGET" --region "$REG" \
              --query 'data."lifecycle-state"' 2>&1 | SAN | sed 's/^/TARGET_BASTION_GET('"$REG"')=/'

            echo '=== compartments ==='
            {
              echo "$OCI_TENANCY"
              oci --raw-output iam compartment list -c "$OCI_TENANCY" --all --region "$REG" \
                --query 'data[].id' 2>/dev/null | SAN
            } | tee /tmp/comps.tsv | sed 's/^/COMPARTMENT /'

            echo '=== all instances (per compartment) ==='
            while IFS=$'\t' read -r cid cname; do
              echo "--- compartment: ${cname:-root} ---"
              oci --raw-output compute instance list -c "$cid" --region "$REG" \
                --query 'data[]."display-name"' 2>/dev/null | SAN | sed 's/^/INAME /'
              oci --raw-output compute instance list -c "$cid" --region "$REG" \
                --query 'data[]."lifecycle-state"' 2>/dev/null | SAN | sed 's/^/ISTATE /'
              oci --raw-output compute instance list -c "$cid" --region "$REG" \
                --query 'data[].id' 2>/dev/null | SAN | sed 's/^/IID /'
              if [ "$REG" = "$TARGET_REGION" ]; then
                echo '--- raw od dump: instance list --output json (target region) ---'
                oci compute instance list -c "$cid" --region "$REG" --output json 2>&1 | head -c 200 | od -c | head -10
              fi
              while read -r iid; do
                [ -n "$iid" ] || continue
                echo "INSTANCE id=$iid"
                oci --raw-output compute instance list-vnics --instance-id "$iid" --region "$REG" \
                  --query 'data[]."public-ip"' 2>/dev/null | SAN | sed 's/^/VNCIP /'
              done < <(oci --raw-output compute instance list -c "$cid" --region "$REG" --query 'data[].id' 2>/dev/null | SAN)
            done < /tmp/comps.tsv

            echo '=== bastions ==='
            oci bastion bastion list -c "$OCI_TENANCY" --all --region "$REG" \
              --query 'data[].[name,id,"lifecycle-state"]' --output json 2>/dev/null \
              | sed 's/^/BASTION /'
            echo '=== bastion sessions ==='
            oci bastion session list -c "$OCI_TENANCY" --all --region "$REG" \
              --query 'data[].["display-name","lifecycle-state",id]' --output json 2>/dev/null \
              | sed 's/^/SESSION /'
          done
          echo '=== IAM policies (root compartment) ==='
          oci iam policy list -c "$OCI_TENANCY" --region "$OCI_REGION" --output json 2>/dev/null \
            | jq -r "$PARSER" | jq -r '.[] | [.name, (.statements | join(" | "))] | @tsv' 2>/dev/null \
            | sed 's/^/POLICY /' | head -30
          echo '=== inventory step done ==='

      - name: Identify target instance (public IP == VPS_HOST) and repair if stopped
        if: inputs.mode == 'repair' || inputs.mode == 'reboot' || inputs.mode == 'deploy'
        run: |
          set +e
          INPUT_MODE="${{ inputs.mode }}"
          export PATH="$HOME/.local/bin:$PATH"
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          export SUPPRESS_LABEL_WARNING=True
          TARGET_REGION=$(printf '%s' "$OCI_TARGET" | tr '.' ' ' | awk '{print $4}')
          echo "TARGET_IP=$VPS_HOST"
          echo "TARGET_REGION=$TARGET_REGION"
          SAN() { sed -e 's/\[//g' -e 's/\]//g' -e 's/"//g' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/,$//'; }
          {
            echo "$OCI_TENANCY"
            oci --raw-output iam compartment list -c "$OCI_TENANCY" --all --region "$TARGET_REGION" \
              --query 'data[].id' 2>/dev/null | SAN
          } | while read -r cid; do
            oci --raw-output compute instance list -c "$cid" --region "$TARGET_REGION" \
              --query 'data[].id' 2>/dev/null | SAN \
              | while read -r iid; do
                ip=$(oci --raw-output compute instance list-vnics --instance-id "$iid" --region "$TARGET_REGION" \
                  --query 'data[]."public-ip"' 2>/dev/null | SAN | head -1)
                if [ -n "$ip" ] && [ "$ip" = "$VPS_HOST" ]; then echo "FOUND_OCID=$iid"; fi
              done
          done | tee /tmp/found.txt
          TID=$(grep '^FOUND_OCID=' /tmp/found.txt | head -1 | cut -d= -f2-)
          if [ -z "$TID" ]; then
            echo 'TARGET_NOT_FOUND_IN_OCI: no instance with public IP matching VPS_HOST'
            exit 0
          fi
          echo "TARGET_INSTANCE=$TID"
          state=$(oci --raw-output compute instance get --instance-id "$TID" --region "$TARGET_REGION" --query 'data."lifecycle-state"' 2>/dev/null | SAN)
          echo "CURRENT_STATE=$state"
          if [ "$state" = STOPPING ] || [ "$state" = STARTING ]; then
            echo '--- waiting for state to settle ---'
            for i in $(seq 1 30); do
              state=$(oci --raw-output compute instance get --instance-id "$TID" --region "$TARGET_REGION" --query 'data."lifecycle-state"' 2>/dev/null | SAN)
              echo "state=$state ($i/30)"
              [ "$state" = RUNNING ] || [ "$state" = STOPPED ] && break
              sleep 20
            done
          fi
          if [ "$state" = STOPPED ]; then
            echo '--- starting instance ---'
            oci --raw-output compute instance action --instance-id "$TID" --region "$TARGET_REGION" --action START \
              --wait-for-state RUNNING --wait-interval-seconds 20 --max-wait-seconds 600 \
              --query 'data."lifecycle-state"' 2>&1 | SAN | sed 's/^/START_RESULT=/'
          fi
          if [ "$state" = RUNNING ] && [ "$INPUT_MODE" = reboot ]; then
            echo '--- hard reset (RESET) to recover OOM/swap thrash ---'
            oci --raw-output compute instance action --instance-id "$TID" --region "$TARGET_REGION" --action RESET \
              --wait-for-state RUNNING --wait-interval-seconds 20 --max-wait-seconds 900 \
              --query 'data."lifecycle-state"' 2>&1 | SAN | sed 's/^/RESET_RESULT=/'
          fi
          echo "FINAL_STATE=$(oci --raw-output compute instance get --instance-id "$TID" --region "$TARGET_REGION" --query 'data."lifecycle-state"' 2>/dev/null | SAN)"

      - name: Re-probe connectivity after repair
        if: inputs.mode == 'repair' || inputs.mode == 'deploy'
        run: |
          set -euo pipefail
          echo '--- waiting for SSH (up to 5 min) ---'
          ok=0
          for i in $(seq 1 30); do
            if timeout 15 ssh -i ~/.ssh/VPS_SSH_KEY -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              -o BatchMode=yes -p "$SSH_PORT" "${VPS_USER}@${VPS_HOST}" 'echo SSH_OK_$(hostname)' 2>/dev/null; then
              ok=1; break
            fi
            echo "ssh attempt $i/30 failed, sleeping 10s"
            sleep 10
          done
          [ "$ok" = 1 ] || { echo 'SSH STILL DOWN AFTER REPAIR'; exit 1; }

      - name: Upload deployment package
        if: inputs.mode == 'deploy'
        run: |
          set -euo pipefail
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${VPS_HOST}
            User ${VPS_USER}
            Port ${SSH_PORT}
            IdentityFile ~/.ssh/VPS_SSH_KEY
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          ssh vps 'sudo mkdir -p /opt/deer-flow-patches && sudo chown $(whoami) /opt/deer-flow-patches'
          scp -r vps-deploy/* vps:/opt/deer-flow-patches/
          ssh vps 'chmod +x /opt/deer-flow-patches/*.sh && ls -la /opt/deer-flow-patches'

      - name: Run deploy-deerflow.sh (docker + compose + ufw)
        if: inputs.mode == 'deploy'
        run: |
          ssh vps "sudo OPENROUTER_API_KEY='$OPENROUTER_API_KEY' bash /opt/deer-flow-patches/deploy-deerflow.sh"

      - name: Run setup-ssl.sh (certbot + renewal cron)
        if: inputs.mode == 'deploy'
        run: |
          ssh vps 'sudo bash /opt/deer-flow-patches/setup-ssl.sh'

      - name: Verify deployment
        if: inputs.mode == 'deploy'
        run: |
          set -euo pipefail
          echo '--- docker ps on VPS ---'
          ssh vps 'docker ps --format "{{.Names}}: {{.Status}} {{.Ports}}"'
          echo '--- https check ---'
          sleep 5
          curl -sI --max-time 20 https://deerflow.esggo.co | head -1 || echo 'https not yet reachable'
          curl -sI --max-time 20 http://161.118.248.180:2026 | head -1 || true
