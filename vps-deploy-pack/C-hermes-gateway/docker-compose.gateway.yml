version: '3.8'

services:
  hermes-gateway:
    image: node:22-bookworm
    container_name: esggo-hermes-gateway
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm i -g hermes-agent && hermes gateway --host 0.0.0.0 --port 8786"
    environment:
      - HERMES_HOME=/app/.hermes
      - TZ=Asia/Taipei
    ports:
      - "8786:8786"
      - "8420:8420"
    volumes:
      - hermes-home:/app/.hermes
    networks:
      - esggo-net

volumes:
  hermes-home:

networks:
  esggo-net:
    external: true
    name: esggo-net
