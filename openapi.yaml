openapi: 3.0.3
info:
  title: ESGGO API
  version: 1.0.0
  description: |
    ESGGO 善向永續 API — 覆蓋環境數據、治理稽核、AI 協作、證據金庫與 5T 誠信協議。
    主要架構：Next.js App Router REST + tRPC type-safe layer；對外以 REST/OpenAPI 為Facade。

servers:
  - url: /api
    description: ESGGO Internal Next.js API (Serverless Functions)

securitySchemes:
  BearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT
  ApiKeyAuth:
    type: apiKey
    in: header
    name: X-API-Key

paths:
  /status:
    get:
      tags: [System]
      summary: 系統健康狀態
      description: 探針 Supabase、DataConnect 與 OmniCore 狀態
      operationId: getStatus
      responses:
        '200':
          description: 正常回應
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'

  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: 儀表板摘要統計
      description: 讀取 ESG 五大面向摘要；部署在 edge runtime
      operationId: getDashboardStats
      responses:
        '200':
          description: 儀表板統計
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DashboardStats'

  /environmental/insights:
    get:
      tags: [Environmental]
      summary: 環境指標摘要
      operationId: getEnvironmentalInsights
      responses:
        '200':
          description: 環境洞察結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentalInsights'
    post:
      tags: [Environmental]
      summary: 新增/更新環境數據
      description: 寫入環境指標並觸發 T1 溯源流程
      operationId: upsertEnvironmentalData
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentalDataInput'
      responses:
        '201':
          description: 已建立並具備初步溯源
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EnvironmentalData'

  /social/insights:
    get:
      tags: [Social]
      summary: 社會指標摘要
      operationId: getSocialInsights
      responses:
        '200':
          description: 社會洞察結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialInsights'

  /governance/insights:
    get:
      tags: [Governance]
      summary: 治理指標摘要
      operationId: getGovernanceInsights
      responses:
        '200':
          description: 治理洞察結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceInsights'

  /vault:
    get:
      tags: [Vault]
      summary: 列舉證據金庫
      description: 列出公司層級的證據金庫記錄
      operationId: listVaultEvidence
      responses:
        '200':
          description: 證據清單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultEvidenceList'
    post:
      tags: [Vault]
      summary: 寫入證據金庫
      operationId: writeVaultEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultEvidenceInput'
      responses:
        '201':
          description: 已寫入證據
    get:
      tags: [Vault]
      summary: 證據統計
      operationId: getVaultStats
      responses:
        '200':
          description: 統計結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultStats'

  /vault/seal:
    post:
      tags: [Vault]
      summary: 數位封印證據
      description: 對證據進行 T5 封印
      operationId: sealVaultRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultSealRequest'
      responses:
        '200':
          description: 封印完成
    get:
      tags: [Vault]
      summary: 查詢封印狀態
      operationId: getVaultSealStatus
      responses:
        '200':
          description: 密封狀態查詢

  /vault/verify:
    post:
      tags: [Vault]
      summary: 驗證證據完整性
      description: 驗證给定 evidence 的 hash_lock 是否有效
      operationId: verifyVaultEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEvidenceRequest'
      responses:
        '200':
          description: 驗證結果

  /vault-omni/verify:
    get:
      tags: [Vault]
      summary: OmniVault 驗證
      operationId: verifyOmniVault
      parameters:
        - name: uuid
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OmniVault 驗證結果

  /vault-omni/engrave:
    post:
      tags: [Vault]
      summary: OmniVault 雕刻/封印
      operationId: engraveOmniVault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultOmniEngraveRequest'
      responses:
        '200':
          description: OmniVault engrave 成功

  /audit/logs:
    get:
      tags: [Audit]
      summary: 稽核軌跡查詢
      operationId: getAuditLogs
      parameters:
        - name: resource
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 稽核紀錄清單
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'

  /notes:
    get:
      tags: [Notes]
      summary: 取得筆記列表
      operationId: listNotes
      responses:
        '200':
          description: 筆記清單
    post:
      tags: [Notes]
      summary: 新增筆記
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '201':
          description: 筆記已建立

  /tasks:
    get:
      tags: [Tasks]
      summary: 取得任務列表
      operationId: listTasks
      responses:
        '200':
          description: 任務清單
    post:
      tags: [Tasks]
      summary: 建立任務
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: 任務已建立

  /metrics/esg:
    get:
      tags: [Metrics]
      summary: ESG 指標摘要
      operationId: getEsgMetricsSummary
      responses:
        '200':
          description: ESG 統計結果

  /metrics/[module]:
    get:
      tags: [Metrics]
      summary: 動態模組指標
      description: 依據 module 路由分派指標來源，無效時回傳 mock data
      operationId: getModuleMetrics
      parameters:
        - name: module
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 指定模組的指標結果
        '404':
          description: 模組不存在或無資料

  /ai/generate:
    post:
      tags: [AI]
      summary: AI 生成內容
      description: 以 Omni-Agent 進行資源撰寫或諮詢任務
      operationId: generateWithAI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIGenerateRequest'
      responses:
        '200':
          description: AI 生成結果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AIGenerateResult'

  /compliance/gap-analysis:
    post:
      tags: [Compliance]
      summary: AI 合規差距分析
      operationId: analyzeComplianceGaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplianceGapAnalysisRequest'
      responses:
        '200':
          description: AI 差距分析結果

  /digital-twin/simulate:
    post:
      tags: [DigitalTwin]
      summary: 數位分身模擬
      operationId: simulateDigitalTwin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DigitalTwinSimulationRequest'
      responses:
        '200':
          description: 模擬結果

  /system/health:
    get:
      tags: [System]
      summary: 系統健康檢查
      operationId: systemHealth
      responses:
        '200':
          description: 系統健康度

  /system/heal:
    post:
      tags: [System]
      summary: 觸發自我修復
      operationId: triggerSystemHeal
      responses:
        '200':
          description: 修復任務已啟動

components:
  schemas:
    SystemStatus:
      type: object
      properties:
        status:
          type: string
        supa:
          type: string
        dataconnect:
          type: string
        omnicore:
          type: string
    DashboardStats:
      type: object
      properties:
        totalEnvironment:
          type: number
        totalGovernance:
          type: number
        totalSocial:
          type: number
        lastUpdated:
          type: string
        integrityScore:
          type: number
    EnvironmentalInsights:
      type: object
      properties:
        windows:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentalData'
        summary:
          type: object
    EnvironmentalData:
      type: object
      properties:
        category:
          type: string
          example: GHG
        metric_name:
          type: string
        metric_value:
          type: number
        unit:
          type: string
        year:
          type: integer
        verified:
          type: boolean
        created_at:
          type: string
        hash_lock:
          type: string
    EnvironmentalDataInput:
      type: object
      required: [metric_name, metric_value, unit]
      properties:
        category:
          type: string
        metric_name:
          type: string
        metric_value:
          type: number
        unit:
          type: string
        year:
          type: integer
    SocialInsights:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
          summary:
            type: object
    GovernanceInsights:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
          summary:
            type: object
    VaultEvidenceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VaultEvidence'
        total:
          type: integer
    VaultEvidence:
      type: object
      properties:
        id:
          type: string
        company_id:
          type: string
        file_name:
          type: string
        storage_path:
          type: string
        hash_lock:
          type: string
        is_sealed:
          type: boolean
        zkp_proof:
          type: string
        t5_bundle:
          type: object
        created_at:
          type: string
    VaultStats:
      type: object
      properties:
        total:
          type: integer
        sealed:
          type: integer
        verified:
          type: integer
    VaultEvidenceInput:
      type: object
      required: [companyId, fileName, fileUrl]
      properties:
        companyId:
          type: string
        fileName:
          type: string
        fileUrl:
          type: string
        module:
          type: string
        hashLock:
          type: string
    VaultSealRequest:
      type: object
      required: [evidenceId]
      properties:
        evidenceId:
          type: string
    VerifyEvidenceRequest:
      type: object
      required: [evidenceId]
      properties:
        evidenceId:
          type: string
    VaultOmniEngraveRequest:
      type: object
      required: [formula, impactMetric, sourceOrigin, evidenceData]
      properties:
        formula:
          type: string
        impactMetric:
          type: string
        sourceOrigin:
          type: string
        source:
          type: string
        evidenceData:
          type: object
    AuditLog:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        event_type:
          type: string
        actor:
          type: string
        data_hash:
          type: string
        hash_lock:
          type: string
        t5_tag:
          type: string
        txn_id:
          type: string
        timestamp:
          type: string
    NoteInput:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
    Note:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        updatedAt:
          type: integer
    TaskCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        companyId:
          type: string
        status:
          type: string
        priority:
          type: string
        assignee:
          type: string
    AIGenerateRequest:
      type: object
      required: [prompt, persona]
      properties:
        prompt:
          type: string
        persona:
          type: string
    AIGenerateResult:
      type: object
      properties:
        output:
          type: string
        citations:
          type: array
          items:
            type: string
        model:
          type: string
    ComplianceGapAnalysisRequest:
      type: object
      properties:
        framework:
          type: string
        targetScore:
          type: number
    DigitalTwinSimulationRequest:
      type: object
      required: [twinId]
      properties:
        twinId:
          type: string
        scenarios:
          type: array
          items:
            type: string
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
    ErrorResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          default: false
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: string
