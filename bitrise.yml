format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other

workflows:
  universal-translator-verify:
    description: |-
      驗證 universal-translator 雙語字幕撥放器（player.html + server.mjs）
      不依賴 pnpm；直接用 node 跑語法檢查 + 內建 health 探針
    steps:
      - git-clone@8: {}
      - script@1:
          title: "Node 語法檢查 + health 探針"
          inputs:
            - content: |-
                set -e
                cd apps/universal-translator
                echo "=== node version ==="
                node --version
                echo "=== server.mjs syntax ==="
                node --check server.mjs && echo "SERVER_OK"
                echo "=== player.html inline JS syntax ==="
                node -e "const fs=require('fs');const h=fs.readFileSync('public/player.html','utf8');const m=h.match(/<script type=\"module\">([\s\S]*?)<\/script>/);fs.writeFileSync('/tmp/_p.mjs',m[1]);"
                node --check /tmp/_p.mjs && echo "PLAYER_JS_OK" && rm -f /tmp/_p.mjs
                echo "=== 啟 server + health 探針 ==="
                PORT=8799 node server.mjs > /tmp/ut.log 2>&1 &
                UT_PID=$!
                sleep 3
                curl -sf http://localhost:8799/health && echo " HEALTH_OK" || { echo "HEALTH_FAIL"; cat /tmp/ut.log; kill $UT_PID; exit 1; }
                echo "=== /player 路由 200? ==="
                curl -sf http://localhost:8799/player -o /dev/null && echo "PLAYER_ROUTE_OK" || { echo "PLAYER_ROUTE_FAIL"; kill $UT_PID; exit 1; }
                echo "=== /player.html 靜態 ==="
                curl -sf http://localhost:8799/player.html -o /dev/null && echo "PLAYER_HTML_OK" || echo "PLAYER_HTML_FAIL"
                kill $UT_PID
                echo "=== 全部驗證通過 ==="
